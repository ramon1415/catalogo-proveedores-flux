<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso | Flux Operadora</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/favicon-512.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Paleta de marca Flux: verde oscuro #172d29 / #253f3a, verdes claros #cfe1cb / #b5ceaf, off-white #f7f7f5 / #e5e5da */
    :root { --bg:#172d29; --bg-card:#253f3a; --border:rgba(229,229,218,.14); --accent:#cfe1cb; --accent-hover:#b5ceaf; --text-1:#f7f7f5; --text-2:rgba(229,229,218,.68); --text-3:rgba(229,229,218,.42); --shadow-lg:0 16px 56px rgba(9,20,18,.55); }
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:radial-gradient(circle at top left,rgba(207,225,203,.14),transparent 38%),radial-gradient(circle at bottom right,rgba(37,63,58,.85),transparent 60%),var(--bg);color:var(--text-1);font-family:'Plus Jakarta Sans',sans-serif;display:grid;place-items:center;padding:28px}
    .login-card{width:min(100%,460px);background:rgba(37,63,58,.66);border:1px solid var(--border);border-radius:22px;padding:34px;box-shadow:var(--shadow-lg);backdrop-filter:blur(18px);text-align:center}
    .brand-logo{width:230px;max-width:82%;height:auto;display:block;margin:0 auto 24px}
    h1{font-size:23px;letter-spacing:-.4px;margin-bottom:8px} p{color:var(--text-2);font-size:13px;line-height:1.6}
    button{width:100%;height:42px;border:0;border-radius:9px;background:var(--accent);color:#172d29;font-weight:700;margin-top:26px;cursor:pointer;font-family:inherit}
    button:hover{background:var(--accent-hover)} .note{font-size:11px;color:var(--text-3);margin-top:18px;text-align:center}
    .powered{font-size:11px;color:var(--text-3);text-align:center;margin-top:22px;letter-spacing:.3px}
    .powered span{color:var(--text-2);font-weight:600}
  </style>
</head>
<body>
  <main class="login-card">
    <img class="brand-logo" src="./assets/logo-flux-verde.webp" alt="Flux Operadora">
    <p>Plataforma de gestión</p>
    <button id="googleLoginBtn">Continuar con Google</button>
    <p class="powered">Powered by <span>Quantta</span></p>
  </main>
  <script src="./config.js?v=20260617-shell-skeleton"></script>
  <script src="./auth.js"></script>
</body>
</html>
