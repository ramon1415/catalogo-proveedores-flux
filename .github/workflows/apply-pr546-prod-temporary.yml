name: Apply PR546 PROD temporary

'on':
  push:
    branches:
      - ops/apply-pr546-prod-20260904
    paths:
      - '.github/workflows/apply-pr546-prod-temporary.yml'

permissions:
  contents: write
  actions: read

env:
  EXPECTED_MAIN_SHA: a440a4f7e4bffd7604f79a2afb21a2beb8918685
  EXPECTED_PROD_REF: ucantptjhwttexzmslvm
  MIGRATION_VERSION: '20260904192129'
  MIGRATION_FILE: supabase/migrations/20260904192129_payment_request_exception_quick_approve_prod.sql

jobs:
  apply:
    name: Authorized PR546 PROD apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: supabase-production
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF_PROD: ${{ vars.SUPABASE_PROJECT_REF_PROD }}
      SUPABASE_PROD_SESSION_POOLER_DB_URL: ${{ secrets.SUPABASE_PROD_SESSION_POOLER_DB_URL }}
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fail closed on release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF_PROD" = "$EXPECTED_PROD_REF"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROD_SESSION_POOLER_DB_URL"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git cat-file -e "$EXPECTED_MAIN_SHA:$MIGRATION_FILE"
          test "$(git diff --name-only "$EXPECTED_MAIN_SHA"..."$GITHUB_SHA" | sort | tr '\n' '|')" = ".github/workflows/apply-pr546-prod-temporary.yml|"

      - name: Verify backup availability
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PROD_REF/database/backups" > "$RUNNER_TEMP/backups.json"
          python3 - <<'PY'
          import json, os, pathlib
          p = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'] + '/backups.json').read_text())
          backups = p.get('backups', []) if isinstance(p, dict) else p
          pitr = bool(p.get('pitr_enabled', False)) if isinstance(p, dict) else False
          good = [b for b in backups if str(b.get('status','')).lower() in ('completed','success')]
          if not (pitr or good):
              raise SystemExit('PROD_BACKUP_UNAVAILABLE')
          print('PROD_BACKUP_AVAILABLE=pass')
          PY

      - name: Install clients
        shell: bash
        run: |
          set -euo pipefail
          psql --version
          npx --yes supabase@2.116.0 --version
          npx --yes supabase@2.116.0 migration repair --help >/dev/null

      - name: Apply exact merged migration and ledger marker
        shell: bash
        run: |
          set -euo pipefail
          git show "$EXPECTED_MAIN_SHA:$MIGRATION_FILE" > "$RUNNER_TEMP/pr546.sql"
          BEFORE=$(psql "$SUPABASE_PROD_SESSION_POOLER_DB_URL" --no-psqlrc -qAtX -v ON_ERROR_STOP=1 -c "select count(*) from supabase_migrations.schema_migrations where version='$MIGRATION_VERSION';")
          test "$BEFORE" = "0"
          psql "$SUPABASE_PROD_SESSION_POOLER_DB_URL" --no-psqlrc -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/pr546.sql"
          npx --yes supabase@2.116.0 migration repair "$MIGRATION_VERSION" --status applied --db-url "$SUPABASE_PROD_SESSION_POOLER_DB_URL"
          AFTER=$(psql "$SUPABASE_PROD_SESSION_POOLER_DB_URL" --no-psqlrc -qAtX -v ON_ERROR_STOP=1 -c "select count(*) from supabase_migrations.schema_migrations where version='$MIGRATION_VERSION';")
          test "$AFTER" = "1"

      - name: Deploy notification dispatcher with existing public auth boundary
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$EXPECTED_MAIN_SHA" -- supabase/functions/notification-dispatcher supabase/config.toml
          npx --yes supabase@2.116.0 functions deploy notification-dispatcher --project-ref "$EXPECTED_PROD_REF" --no-verify-jwt

      - name: Deploy exception quick approve edge OFF-by-config
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$EXPECTED_MAIN_SHA" -- supabase/functions/payment-request-exception-quick-approve supabase/config.toml
          npx --yes supabase@2.116.0 functions deploy payment-request-exception-quick-approve --project-ref "$EXPECTED_PROD_REF" --no-verify-jwt

      - name: Database postcheck
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_PROD_SESSION_POOLER_DB_URL" --no-psqlrc -qAtX -v ON_ERROR_STOP=1 <<'SQL'
          select case when exists(select 1 from supabase_migrations.schema_migrations where version='20260904192129') then 'ledger=pass' else 'ledger=fail' end;
          select case when to_regclass('public.payment_request_exception_quick_approval_uses') is not null then 'ledger_table=pass' else 'ledger_table=fail' end;
          select case when to_regprocedure('public.decide_payment_request_internal(uuid,uuid,text,text)') is not null then 'internal_rpc=pass' else 'internal_rpc=fail' end;
          select 'quick_runtime_values=' || count(*) from vault.decrypted_secrets where name in (
            'PAYMENT_REQUEST_EXCEPTION_QUICK_APPROVE_SECRET',
            'PAYMENT_REQUEST_EXCEPTION_QUICK_APPROVE_ENABLED',
            'PAYMENT_REQUEST_EXCEPTION_QUICK_APPROVE_BASE_URL',
            'PAYMENT_REQUEST_EXCEPTION_QUICK_APPROVE_ALLOWED_ORIGIN',
            'PAYMENT_REQUEST_EXCEPTION_QUICK_APPROVE_TTL_HOURS'
          );
          SQL

      - name: Delete temporary branch
        if: always()
        shell: bash
        run: |
          set +e
          git push origin --delete ops/apply-pr546-prod-20260904
