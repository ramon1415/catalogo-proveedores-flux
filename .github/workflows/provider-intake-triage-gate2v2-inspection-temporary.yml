name: Provider intake triage DEV Gate 2 v2 inspection (temporary)

on:
  push:
    branches:
      - feature/ramon-provider-intake-triage-ui
    paths:
      - .github/workflows/provider-intake-triage-gate2v2-inspection-temporary.yml
      - ops/provider-intake/gate-2-v2-inspection.authorization.json
      - scripts/qa/provider-intake-triage-gate2v2-inspection.sql
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-intake-triage-dev-gate-2-v2
  cancel-in-progress: false

jobs:
  inspect:
    name: Read-only contract inspection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: DEV
    env:
      AUTHORIZED_ROOT_HEAD: 31655bc66b38ea94159c35c6c79bed053af00ba3
      AUTHORIZED_BASELINE: 05986aca63f2d98635cbb9b928cd0cebac29315a
      AUTHORIZED_BACKEND_TREE: 379f65801609e40143d948b3de702e391636c512
      AUTHORIZED_BRANCH: feature/ramon-provider-intake-triage-ui
      AUTHORIZED_PROJECT_REF: scsirgbuqjcwoaxfacth
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}

    steps:
      - name: Checkout inspection authorization
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate immutable scope
        shell: bash
        run: |
          set -euo pipefail
          marker="ops/provider-intake/gate-2-v2-inspection.authorization.json"
          script="scripts/qa/provider-intake-triage-gate2v2-inspection.sql"

          test "$GITHUB_REF_NAME" = "$AUTHORIZED_BRANCH"
          test "$SUPABASE_DEV_PROJECT_REF" = "$AUTHORIZED_PROJECT_REF"
          test -n "$SUPABASE_DEV_DB_URL"
          git merge-base --is-ancestor "$AUTHORIZED_BASELINE" HEAD
          git merge-base --is-ancestor "$AUTHORIZED_ROOT_HEAD" HEAD
          test "$(git rev-parse "HEAD:supabase/functions/provider-intake")" = "$AUTHORIZED_BACKEND_TREE"

          expected_files="$(
            printf '%s\n' \
              '.github/workflows/provider-intake-triage-gate2v2-inspection-temporary.yml' \
              'ops/provider-intake/gate-2-v2-inspection.authorization.json' \
              'scripts/qa/provider-intake-triage-gate2v2-inspection.sql' |
              sort
          )"
          actual_files="$(git diff --name-only "$AUTHORIZED_ROOT_HEAD..HEAD" | sort)"
          test "$actual_files" = "$expected_files"

          test "$(jq -r '.gate' "$marker")" = "phase-1d-gate-2-v2-read-only-inspection"
          test "$(jq -r '.authorized_root_head' "$marker")" = "$AUTHORIZED_ROOT_HEAD"
          test "$(jq -r '.supabase_project_ref' "$marker")" = "$AUTHORIZED_PROJECT_REF"
          test "$(jq -r '.allow_database_writes' "$marker")" = "false"
          test "$(jq -r '.emit_record_identifiers' "$marker")" = "false"
          test "$(sha256sum "$script" | cut -d' ' -f1)" = "$(jq -r '.inspection_sha256' "$marker")"

      - name: Execute read-only inspection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate2v2-inspection-evidence
          psql -X -qAt -v ON_ERROR_STOP=1 "$SUPABASE_DEV_DB_URL" \
            -f scripts/qa/provider-intake-triage-gate2v2-inspection.sql \
            > gate2v2-inspection-evidence/inspection_sanitized.json
          jq -e '.gate == "phase-1d-gate-2-v2-read-only-inspection"' \
            gate2v2-inspection-evidence/inspection_sanitized.json >/dev/null
          jq -e '.database_writes == false and .record_identifiers_emitted == false' \
            gate2v2-inspection-evidence/inspection_sanitized.json >/dev/null
          jq -e '.migration_029.applied == true and .migration_030.applied == false' \
            gate2v2-inspection-evidence/inspection_sanitized.json >/dev/null
          jq -e '.crypto.digest_schema != null' \
            gate2v2-inspection-evidence/inspection_sanitized.json >/dev/null

      - name: Upload sanitized inspection
        uses: actions/upload-artifact@v4
        with:
          name: provider-intake-triage-gate2v2-inspection-${{ github.run_id }}
          path: gate2v2-inspection-evidence/
          if-no-files-found: error
          retention-days: 7
