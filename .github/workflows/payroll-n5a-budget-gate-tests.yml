name: Payroll N5A budget gate tests

on:
  pull_request:
    paths:
      - 'supabase/migrations/*payroll_n5a_budget_gate.sql'
      - 'payroll_budget_gate.js'
      - 'nomina_presupuesto.html'
      - 'scripts/qa/payroll-n5a-budget-gate-contract.test.mjs'
      - 'docs/ops/payroll-n5a-budget-gate.md'
      - '.github/workflows/payroll-n5a-budget-gate-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: UI syntax
        run: node --check payroll_budget_gate.js
      - name: N5A contract
        run: node --test scripts/qa/payroll-n5a-budget-gate-contract.test.mjs
      - name: Preserve N4A contract
        run: node --test scripts/qa/payroll-n4a-manual-dispersion-contract.test.mjs
      - name: Preserve N4B contract
        run: node --test scripts/qa/payroll-n4b-channel-reconciliation-contract.test.mjs
