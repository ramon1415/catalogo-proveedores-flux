name: Receipt single confirmation release

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/features/comprobantes/**'
      - 'app/src/features/nomina/receiptUpload.ts'
      - 'app/src/lib/pdfText.ts'
      - 'app/src/App.tsx'
      - 'supabase/migrations/*receipt_preview_production_compatibility.sql'
      - 'scripts/qa/receipt-single-confirmation-*.test.mjs'
      - 'scripts/qa/react-comprobantes-visual-parity-contract.test.mjs'
      - '.github/workflows/receipt-single-confirmation.yml'
  push:
    branches: [main]
    paths:
      - 'app/src/features/comprobantes/**'
      - 'app/src/features/nomina/receiptUpload.ts'
      - 'app/src/lib/pdfText.ts'
      - 'app/src/App.tsx'
      - 'supabase/migrations/*receipt_preview_production_compatibility.sql'
      - 'scripts/qa/receipt-single-confirmation-*.test.mjs'
      - 'scripts/qa/react-comprobantes-visual-parity-contract.test.mjs'
      - '.github/workflows/receipt-single-confirmation.yml'

permissions:
  contents: read

jobs:
  receipts-and-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm run qa:setup
      - run: node --test scripts/qa/receipt-single-confirmation-*.test.mjs scripts/qa/react-comprobantes-visual-parity-contract.test.mjs scripts/qa/payment-batch-company-scope.test.mjs scripts/qa/payment-batch-step-transition-hotfix.test.mjs scripts/qa/pwa-*.test.mjs scripts/qa/payroll-receipt-autofill.test.mjs
      - run: npm --prefix app run build
      - run: node scripts/build-vercel-static.mjs
