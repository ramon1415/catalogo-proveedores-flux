name: Apply layout date window guard

on:
  push:
    branches:
      - codex/layout-date-window-guard-prod

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply focused UX guard
        run: python .github/scripts/apply_layout_date_window_guard.py

      - name: Install React dependencies
        run: npm --prefix app ci

      - name: Run focused and layout regression contracts
        run: >-
          node --test
          scripts/qa/layout-scheduled-date-window-guard.test.mjs
          scripts/qa/layout-client-uat-hotfix-contract.test.mjs
          scripts/qa/layout-concept-no-reauth-contract.test.mjs
          scripts/qa/prod-reimbursement-permissions.test.mjs

      - name: Revalidate the approved-exception layout path
        run: >-
          node --test
          --test-name-pattern="approved budget exception|budget exception changes only|approved exception completes"
          scripts/qa/layout-budget-exception-reference-contract.test.mjs

      - name: Build production React artifact
        run: npm --prefix app run build

      - name: Commit validated hotfix
        run: |
          git config user.name "ramon1415"
          git config user.email "ramon@quantta.mx"
          git rm \
            .github/workflows/apply-layout-date-window-guard.yml \
            .github/scripts/apply_layout_date_window_guard.py
          git add \
            app/src/features/layouts/NewLayoutModal.tsx \
            app/src/features/layouts/LayoutCompletionModal.tsx \
            scripts/qa/layout-scheduled-date-window-guard.test.mjs
          git commit -m "fix(layouts): impedir fechas programadas fuera del periodo"
          git push origin HEAD:codex/layout-date-window-guard-prod
