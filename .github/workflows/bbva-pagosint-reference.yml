name: BBVA bank reference contracts

on:
  pull_request:
    branches: [main, dev]
    paths:
      - layouts.js
      - app/src/features/layouts/**
      - app/src/features/solicitudes/**
      - scripts/qa/convenio-request-capture.test.mjs
      - scripts/qa/convenio-request-server.test.mjs
      - scripts/qa/fixtures/convenio-production-creators.json
      - supabase/migrations/*_convenio_request_*.sql
      - scripts/qa/bbva-*.test.mjs
      - docs/ops/layout-cxc-download-format.md
      - docs/ops/bbva-cie-layout-format.md
      - supabase/migrations/*_cie_capture_reference_validation.sql
      - supabase/migrations/*_cie_reference_eligibility.sql
      - .github/workflows/bbva-pagosint-reference.yml

permissions:
  contents: read

jobs:
  reference-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci
      - name: Verify bank references and routing
        run: >-
          node --test
          scripts/qa/bbva-pagosint-reference-contract.test.mjs
          scripts/qa/bbva-pagosint-bank-field-hotfix.test.mjs
          scripts/qa/bbva-clabe-012-routing-hotfix.test.mjs
          scripts/qa/bbva-mixed-clabe-macro-contract.test.mjs
          scripts/qa/bbva-cie-layout-contract.test.mjs
          scripts/qa/bbva-cie-reference-validation.test.mjs
          scripts/qa/convenio-request-capture.test.mjs
          scripts/qa/convenio-request-server.test.mjs
      - run: npm --prefix app run typecheck
