name: CONTPAQ DEV seed one-shot

on:
  push:
    branches:
      - codex/flux-slice-03-contpaq-mapper-clean
    paths:
      - .github/workflows/contpaq-dev-seed-one-shot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contpaq-dev-seed-one-shot
  cancel-in-progress: false

jobs:
  seed-operadora-dev:
    name: Verify and load Operadora CONTPAQ seed in DEV
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    if: github.repository == 'ramon1415/catalogo-proveedores-flux' && github.ref == 'refs/heads/codex/flux-slice-03-contpaq-mapper-clean'
    env:
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
      OPS_EVIDENCE_DIR: .ops-evidence/contpaq-dev-seed

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Mask and validate DEV secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_DEV_DB_URL:-}" ]] && echo "::add-mask::${SUPABASE_DEV_DB_URL}"
          [[ -n "${SUPABASE_DEV_PROJECT_REF:-}" ]] && echo "::add-mask::${SUPABASE_DEV_PROJECT_REF}"
          [[ -n "${SUPABASE_DEV_DB_URL:-}" ]] || { echo "::error::Missing SUPABASE_DEV_DB_URL"; exit 1; }
          [[ "${SUPABASE_DEV_PROJECT_REF:-}" == "scsirgbuqjcwoaxfacth" ]] || { echo "::error::Unexpected DEV project ref"; exit 1; }

      - name: Verify hashes, load twice and postcheck
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OPS_EVIDENCE_DIR}"
          bash ops/contpaq-mapper/apply-dev-seed.sh 2>&1 | tee "${OPS_EVIDENCE_DIR}/run.log"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contpaq-dev-seed-evidence
          path: .ops-evidence/contpaq-dev-seed/
          if-no-files-found: warn
          retention-days: 30
