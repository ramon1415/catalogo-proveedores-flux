name: Temporary deterministic submitted-batch PDF patch

'on':
  push:
    branches:
      - release/approval-batch-submitted-email-pdf-prod
    paths:
      - '.github/workflows/temp-fix-approval-batch-pdf-determinism.yml'

permissions:
  contents: write

concurrency:
  group: temp-fix-approval-batch-pdf-determinism
  cancel-in-progress: false

jobs:
  patch:
    if: github.ref == 'refs/heads/release/approval-batch-submitted-email-pdf-prod'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/approval-batch-submitted-email-pdf-prod
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact deterministic-retry patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          edge = Path('supabase/functions/approval-batch-submitted-dispatcher/index.ts')
          source = edge.read_text()
          old = 'out += rightAlignedTextCommand("F1", 8, right, top - 29, `Generado ${formatDateTime(new Date().toISOString())}`, "0.82 0.90 0.85");'
          new = 'out += rightAlignedTextCommand("F1", 8, right, top - 29, `Enviado ${formatDateTime(batch.submitted_at)}`, "0.82 0.90 0.85");'
          if source.count(old) != 1:
              raise SystemExit('edge_patch_anchor_mismatch')
          edge.write_text(source.replace(old, new))

          test_file = Path('scripts/qa/approval-batch-submitted-email-contract.test.mjs')
          tests = test_file.read_text()
          old_test = '  const { bytes, pageCount } = generateApprovalBatchPdfBytes(document);\n  const text = new TextDecoder().decode(bytes);'
          new_test = '  const { bytes, pageCount } = generateApprovalBatchPdfBytes(document);\n  const replay = generateApprovalBatchPdfBytes(document);\n  const text = new TextDecoder().decode(bytes);\n  assert.deepEqual(replay.bytes, bytes, "the same event snapshot must produce identical PDF bytes on retry");'
          if tests.count(old_test) != 1:
              raise SystemExit('test_patch_anchor_mismatch')
          test_file.write_text(tests.replace(old_test, new_test))
          PY

          node --experimental-strip-types --test scripts/qa/approval-batch-submitted-email-contract.test.mjs
          git diff --check
          git rm .github/workflows/temp-fix-approval-batch-pdf-determinism.yml

      - name: Commit exact patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'quantta-release-bot'
          git config user.email 'ramon@quantta.mx'
          git add supabase/functions/approval-batch-submitted-dispatcher/index.ts \
            scripts/qa/approval-batch-submitted-email-contract.test.mjs
          git commit -m 'Harden submitted-batch PDF retry determinism'
          git push origin HEAD:release/approval-batch-submitted-email-pdf-prod
