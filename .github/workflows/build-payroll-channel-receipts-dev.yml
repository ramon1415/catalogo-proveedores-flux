name: Build payroll channel receipts DEV

on:
  push:
    branches: [feature/payroll-channel-receipts-dev]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[payroll-channel-receipts-built]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Wire channel operations into payroll modal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/features/nomina/CaptureModal.tsx')
          text = p.read_text(encoding='utf-8')
          marker = "import { classifyPayrollFile } from './physicalParsers'\n"
          if marker not in text:
              raise SystemExit('physicalParsers import not found')
          text = text.replace(marker, marker + "import { ChannelOperations } from './ChannelOperations'\n", 1)
          marker = "        <p className={s.piiNote}>\n"
          if marker not in text:
              raise SystemExit('piiNote marker not found')
          block = "        {summary?.status === 'approved' && materializedRequestId && (\n          <ChannelOperations paymentRequestId={materializedRequestId} />\n        )}\n\n"
          text = text.replace(marker, block + marker, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate React and existing backend contract
        run: |
          grep -q "record_payroll_channel_dispersion" app/src/features/nomina/ChannelOperations.tsx
          grep -q "reserve_payroll_channel_receipt" app/src/features/nomina/ChannelOperations.tsx
          grep -q "payroll-receipt-verify" app/src/features/nomina/ChannelOperations.tsx
          grep -q "reconcile_payroll_channel" app/src/features/nomina/ChannelOperations.tsx
          grep -q "Flux NO ejecutará ningún pago" app/src/features/nomina/ChannelOperations.tsx
          grep -q "submitForApproval" app/src/features/nomina/CaptureModal.tsx
          npm --prefix app ci
          npm --prefix app run typecheck
          npm --prefix app run build
          git diff --check

      - name: Commit validated candidate
        shell: bash
        run: |
          git config user.name 'ramon1415'
          git config user.email 'ramon@quantta.mx'
          git rm .github/workflows/build-payroll-channel-receipts-dev.yml
          git add app/src/features/nomina/CaptureModal.tsx app/src/features/nomina/ChannelOperations.tsx
          git commit -m 'feat(payroll): exponer comprobantes por canal en DEV [payroll-channel-receipts-built]'
          git push origin HEAD:feature/payroll-channel-receipts-dev
