name: Provider intake triage DEV Migration 030 (temporary)

on:
  push:
    branches:
      - feature/ramon-provider-intake-triage-ui
    paths:
      - .github/workflows/provider-intake-triage-migration030-temporary.yml
      - ops/provider-intake/apply-030-action-fingerprint-dev.authorization.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-intake-triage-dev-migration-030
  cancel-in-progress: false

jobs:
  apply:
    name: Precheck, rollback dry-run, one-time LOAD, and postcheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: DEV
    env:
      AUTHORIZED_ROOT_HEAD: 4d99951c442a6e73016f54686dd1b7bfe936d623
      AUTHORIZED_BASELINE: 05986aca63f2d98635cbb9b928cd0cebac29315a
      AUTHORIZED_BACKEND_TREE: 379f65801609e40143d948b3de702e391636c512
      AUTHORIZED_BRANCH: feature/ramon-provider-intake-triage-ui
      AUTHORIZED_PROJECT_REF: scsirgbuqjcwoaxfacth
      AUTHORIZED_MIGRATION_SHA256: effc70e602c55ba6b291ad5e904848bd9190389b08c6dbc9186ee28eeab87aeb
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}

    steps:
      - name: Checkout one-time authorization
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate immutable scope and authorization
        shell: bash
        run: |
          set -euo pipefail
          marker="ops/provider-intake/apply-030-action-fingerprint-dev.authorization.json"
          migration="supabase/migrations/030_provider_intake_action_fingerprint.sql"
          package="ops/provider-intake/apply-030-action-fingerprint"
          load="$package/03_LOAD_030_EXACT.sql"

          test "$GITHUB_REF_NAME" = "$AUTHORIZED_BRANCH"
          test "$SUPABASE_DEV_PROJECT_REF" = "$AUTHORIZED_PROJECT_REF"
          test -n "$SUPABASE_DEV_DB_URL"
          git merge-base --is-ancestor "$AUTHORIZED_BASELINE" HEAD
          git merge-base --is-ancestor "$AUTHORIZED_ROOT_HEAD" HEAD
          test "$(git rev-parse "HEAD:supabase/functions/provider-intake")" = "$AUTHORIZED_BACKEND_TREE"

          expected_files="$(
            printf '%s\n' \
              '.github/workflows/provider-intake-triage-migration030-temporary.yml' \
              'ops/provider-intake/apply-030-action-fingerprint-dev.authorization.json' |
              sort
          )"
          actual_files="$(git diff --name-only "$AUTHORIZED_ROOT_HEAD..HEAD" | sort)"
          test "$actual_files" = "$expected_files"

          test "$(jq -r '.gate' "$marker")" = "phase-1d-migration-030-one-time-dev"
          test "$(jq -r '.authorized_root_head' "$marker")" = "$AUTHORIZED_ROOT_HEAD"
          test "$(jq -r '.branch' "$marker")" = "$AUTHORIZED_BRANCH"
          test "$(jq -r '.supabase_project_ref' "$marker")" = "$AUTHORIZED_PROJECT_REF"
          test "$(jq -r '.require_rollback_dry_run' "$marker")" = "true"
          test "$(jq -r '.allow_load_once' "$marker")" = "true"
          test "$(jq -r '.allow_migration_029' "$marker")" = "false"
          test "$(jq -r '.allow_db_push_or_repair' "$marker")" = "false"
          test "$(jq -r '.allow_business_data_mutations' "$marker")" = "false"
          test "$(jq -r '.migration_sha256' "$marker")" = "$AUTHORIZED_MIGRATION_SHA256"

          test "$(sha256sum "$migration" | cut -d' ' -f1)" = "$AUTHORIZED_MIGRATION_SHA256"
          test "$(sha256sum "$load" | cut -d' ' -f1)" = "$AUTHORIZED_MIGRATION_SHA256"
          cmp --silent "$migration" "$load"
          test "$(sha256sum supabase/migrations/029_provider_intake_triage.sql | cut -d' ' -f1)" \
            = "57ab35263fa0a6dfa53aeef1fc1b1fa76fcede2f5d0413e05cea1642f42438eb"
          git diff --check "$AUTHORIZED_BASELINE..HEAD"

      - name: Run Node contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/qa/provider-intake-action-fingerprint.test.mjs
          node --test scripts/qa/*.test.mjs | tee node-tests.txt
          grep -q '# tests 87' node-tests.txt
          grep -q '# pass 87' node-tests.txt
          grep -q '# fail 0' node-tests.txt

      - name: Parse PostgreSQL files
        shell: bash
        run: |
          set -euo pipefail
          parser_dir="$RUNNER_TEMP/pglast"
          python3 -m pip install --quiet --disable-pip-version-check \
            --target "$parser_dir" pglast
          PYTHONPATH="$parser_dir" python3 - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          paths = [
              Path("supabase/migrations/030_provider_intake_action_fingerprint.sql"),
              Path("ops/provider-intake/apply-030-action-fingerprint/01_PRECHECK_READ_ONLY.sql"),
              Path("ops/provider-intake/apply-030-action-fingerprint/02_BACKUP_DEV.sql"),
              Path("ops/provider-intake/apply-030-action-fingerprint/03_LOAD_030_EXACT.sql"),
              Path("ops/provider-intake/apply-030-action-fingerprint/04_POSTCHECK_READ_ONLY.sql"),
          ]
          for path in paths:
              source = "\n".join(
                  line for line in path.read_text(encoding="utf-8").splitlines()
                  if not line.lstrip().startswith("\\")
              )
              parse_sql(source)
              print(f"parsed={path}")
          PY

      - name: Scan permanent and temporary scope
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only "$AUTHORIZED_BASELINE..HEAD")"
          test -n "$files"
          if printf '%s\n' "$files" | xargs grep -nE \
            '(eyJ[A-Za-z0-9_-]{20,}|sbp_[A-Za-z0-9]{16,}|-----BEGIN (RSA )?PRIVATE KEY-----|Bearer[[:space:]]+[A-Za-z0-9._-]{20,})'
          then
            echo "Sensitive-looking value found." >&2
            exit 1
          fi
          if grep -inE \
            '\b(drop[[:space:]]+table|truncate|delete[[:space:]]+from[[:space:]]+public\.(payment_intake|payment_intake_events|payment_requests|proveedores|providers|approval_batches)|on[[:space:]]+delete[[:space:]]+set[[:space:]]+null)\b' \
            supabase/migrations/030_provider_intake_action_fingerprint.sql
          then
            echo "Forbidden destructive SQL found." >&2
            exit 1
          fi

      - name: Run precheck and capture backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p migration030-evidence
          package="ops/provider-intake/apply-030-action-fingerprint"
          psql -X -qAt -v ON_ERROR_STOP=1 "$SUPABASE_DEV_DB_URL" \
            -f "$package/01_PRECHECK_READ_ONLY.sql" \
            > migration030-evidence/precheck_sanitized.json
          jq -e '.migration_029_applied == true and .migration_030_applied == false' \
            migration030-evidence/precheck_sanitized.json >/dev/null
          jq -e '.database_writes == false and .record_identifiers_emitted == false' \
            migration030-evidence/precheck_sanitized.json >/dev/null

          psql -X -qAt -v ON_ERROR_STOP=1 "$SUPABASE_DEV_DB_URL" \
            -f "$package/02_BACKUP_DEV.sql" \
            > migration030-evidence/backup_029_rpc_contract.json
          jq -e '.backup == "provider-intake-migration-030-pre-apply"' \
            migration030-evidence/backup_029_rpc_contract.json >/dev/null
          jq -e '.database_writes == false and .contains_record_data == false' \
            migration030-evidence/backup_029_rpc_contract.json >/dev/null

      - name: Compile PL/pgSQL and run full rollback dry-run
        shell: bash
        run: |
          set -euo pipefail
          package="ops/provider-intake/apply-030-action-fingerprint"
          load="$package/03_LOAD_030_EXACT.sql"
          postcheck="$package/04_POSTCHECK_READ_ONLY.sql"
          dryrun="$RUNNER_TEMP/030_dry_run_rollback.sql"

          python3 - "$load" "$postcheck" "$dryrun" <<'PY'
          from pathlib import Path
          import sys

          load_path, postcheck_path, output_path = map(Path, sys.argv[1:])
          load = load_path.read_text(encoding="utf-8")
          if not load.rstrip().endswith("commit;"):
              raise SystemExit("LOAD does not end in commit")
          load = load.rstrip()[:-len("commit;")]

          postcheck_lines = []
          for line in postcheck_path.read_text(encoding="utf-8").splitlines():
              normalized = line.strip().lower()
              if line.lstrip().startswith("\\"):
                  continue
              if normalized in {"begin transaction read only;", "commit;"}:
                  continue
              postcheck_lines.append(line)

          output = (
              load
              + "\n-- Versioned postcheck executed inside the dry-run transaction.\n"
              + "\n".join(postcheck_lines)
              + "\nrollback;\n"
          )
          output_path.write_text(output, encoding="utf-8", newline="\n")
          PY

          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_DEV_DB_URL" \
            -f "$dryrun" \
            > migration030-evidence/dry_run.log

          psql -X -qAt -v ON_ERROR_STOP=1 "$SUPABASE_DEV_DB_URL" \
            > migration030-evidence/dry_run_rollback_sanitized.json <<'SQL'
          begin transaction read only;
          select jsonb_pretty(jsonb_build_object(
            'helper_persisted', to_regprocedure(
              'public.provider_intake_action_fingerprint(integer,text,uuid,uuid,text,timestamptz,text,text)'
            ) is not null,
            'transition_v2_persisted', pg_get_functiondef(
              'public.transition_provider_intake(uuid,text,timestamptz,text,text,uuid)'::regprocedure
            ) like '%action_fingerprint%',
            'note_v2_persisted', pg_get_functiondef(
              'public.add_provider_intake_note(uuid,timestamptz,text,uuid)'::regprocedure
            ) like '%action_fingerprint%',
            'payment_intake', (select count(*) from public.payment_intake),
            'payment_intake_events', (select count(*) from public.payment_intake_events),
            'payment_intake_files', (select count(*) from public.payment_intake_files),
            'record_identifiers_emitted', false,
            'database_writes_persisted', false
          ));
          commit;
          SQL

          jq -e '
            .helper_persisted == false
            and .transition_v2_persisted == false
            and .note_v2_persisted == false
            and .payment_intake == 13
            and .payment_intake_events == 20
            and .payment_intake_files == 6
            and .database_writes_persisted == false
          ' migration030-evidence/dry_run_rollback_sanitized.json >/dev/null

      - name: Apply exact LOAD once
        shell: bash
        run: |
          set -euo pipefail
          package="ops/provider-intake/apply-030-action-fingerprint"
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_DEV_DB_URL" \
            -f "$package/01_PRECHECK_READ_ONLY.sql" \
            > migration030-evidence/precheck_immediately_before_load.log
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_DEV_DB_URL" \
            -f "$package/03_LOAD_030_EXACT.sql" \
            > migration030-evidence/load_once.log

      - name: Run postcheck and write receipt
        shell: bash
        run: |
          set -euo pipefail
          package="ops/provider-intake/apply-030-action-fingerprint"
          psql -X -qAt -v ON_ERROR_STOP=1 "$SUPABASE_DEV_DB_URL" \
            -f "$package/04_POSTCHECK_READ_ONLY.sql" \
            > migration030-evidence/postcheck_sanitized.json
          jq -e '
            .helper == "PASS"
            and .rpc_replacements == 2
            and .material_conflict == "PASS"
            and .pre_uat_business_delta == 0
            and .database_writes == false
          ' migration030-evidence/postcheck_sanitized.json >/dev/null

          jq -n \
            --arg gate "phase-1d-migration-030-one-time-dev" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg commit "$GITHUB_SHA" \
            --arg migration_sha256 "$AUTHORIZED_MIGRATION_SHA256" \
            '{
              gate: $gate,
              run_id: $run_id,
              commit: $commit,
              migration_sha256: $migration_sha256,
              precheck: "PASS",
              dry_run_rollback: "PASS",
              load_once: "PASS",
              postcheck: "PASS",
              business_data_delta_before_uat: 0,
              secrets_exposed: false,
              record_identifiers_emitted: false
            }' > migration030-evidence/receipt.json

      - name: Upload sanitized migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-intake-triage-migration030-${{ github.run_id }}
          path: migration030-evidence/
          if-no-files-found: error
          retention-days: 14
