name: Temporary submitted-batch cutoff precision patch

'on':
  push:
    branches:
      - hotfix/preserve-approval-batch-cutoff-microseconds
    paths:
      - '.github/workflows/temp-fix-approval-batch-cutoff-microseconds.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/hotfix/preserve-approval-batch-cutoff-microseconds'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: hotfix/preserve-approval-batch-cutoff-microseconds
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve exact microsecond cutoff and add regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          edge = Path('supabase/functions/approval-batch-submitted-dispatcher/index.ts')
          source = edge.read_text()
          old = '    createdAtAfter: cutoff.toISOString(),'
          new = '    createdAtAfter: cutoffValue,'
          if source.count(old) != 1:
              raise SystemExit('cutoff_patch_anchor_mismatch')
          edge.write_text(source.replace(old, new))

          test_file = Path('scripts/qa/approval-batch-submitted-email-contract.test.mjs')
          tests = test_file.read_text()
          old_assert = '      assert.equal(payload.p_limit, 1);\n      return Response.json([sampleEvent()]);'
          new_assert = '      assert.equal(payload.p_limit, 1);\n      assert.equal(payload.p_created_at_after, "2026-08-24T18:00:00.123456Z");\n      return Response.json([sampleEvent()]);'
          if tests.count(old_assert) != 1:
              raise SystemExit('cutoff_assert_anchor_mismatch')
          tests = tests.replace(old_assert, new_assert)
          old_body = '    body: JSON.stringify({ created_at_after: "2026-08-24T18:00:00.000Z", limit: 1 }),'
          new_body = '    body: JSON.stringify({ created_at_after: "2026-08-24T18:00:00.123456Z", limit: 1 }),'
          if tests.count(old_body) != 1:
              raise SystemExit('cutoff_body_anchor_mismatch')
          test_file.write_text(tests.replace(old_body, new_body))
          PY

          node --experimental-strip-types --test scripts/qa/approval-batch-submitted-email-contract.test.mjs
          git diff --check
          git rm .github/workflows/temp-fix-approval-batch-cutoff-microseconds.yml

      - name: Commit hotfix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'quantta-release-bot'
          git config user.email 'ramon@quantta.mx'
          git add supabase/functions/approval-batch-submitted-dispatcher/index.ts \
            scripts/qa/approval-batch-submitted-email-contract.test.mjs
          git commit -m 'Preserve submitted-batch activation cutoff microseconds'
          git push origin HEAD:hotfix/preserve-approval-batch-cutoff-microseconds
