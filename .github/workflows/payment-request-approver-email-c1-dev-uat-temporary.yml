name: Payment Request Approver Email C1 DEV UAT Temporary

'on':
  push:
    branches:
      - codex/payment-request-approver-email-c1
    paths:
      - .github/workflows/payment-request-approver-email-c1-dev-uat-temporary.yml

permissions:
  contents: read

concurrency:
  group: payment-request-approver-email-c1-dev-uat
  cancel-in-progress: false

jobs:
  uat:
    name: DEV post-commit created-event UAT
    if: github.repository == 'ramon1415/catalogo-proveedores-flux' && github.ref == 'refs/heads/codex/payment-request-approver-email-c1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: DEV

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      NOTIFICATION_DISPATCHER_SECRET: ${{ secrets.NOTIFICATION_DISPATCHER_SECRET }}
      PROJECT_REF: scsirgbuqjcwoaxfacth
      FUNCTION_URL: https://scsirgbuqjcwoaxfacth.supabase.co/functions/v1/notification-dispatcher
      ACTIVATION_CUTOFF: '2026-08-17T21:20:56.735024Z'
      UAT_MARKER: C1-UAT-PR365-20260817
      EVIDENCE_DIR: /tmp/payment-request-approver-email-c1-uat

    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate target and required secrets
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/codex/payment-request-approver-email-c1"
          test "${PROJECT_REF}" = "scsirgbuqjcwoaxfacth"
          test "${FUNCTION_URL}" = "https://scsirgbuqjcwoaxfacth.supabase.co/functions/v1/notification-dispatcher"
          test "${ACTIVATION_CUTOFF}" = "2026-08-17T21:20:56.735024Z"
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_DEV_DB_URL}"
          test -n "${NOTIFICATION_DISPATCHER_SECRET}"
          echo "::add-mask::${SUPABASE_ACCESS_TOKEN}"
          echo "::add-mask::${SUPABASE_DEV_DB_URL}"
          echo "::add-mask::${NOTIFICATION_DISPATCHER_SECRET}"
          mkdir -p "${EVIDENCE_DIR}"
          {
            echo "gate=PAYMENT-REQUEST-APPROVER-EMAIL-C1"
            echo "project=DEV"
            echo "activation_cutoff=${ACTIVATION_CUTOFF}"
            echo "cutoff_operator=exclusive_gt"
            echo "event_type=payment_request.created"
            echo "send_mode=test_only"
            echo "prod_mutations=0"
          } > "${EVIDENCE_DIR}/contract.txt"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.113.0

      - name: Force DEV dispatcher to test_only
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="${RUNNER_TEMP}/c1-dispatcher.env"
          umask 077
          {
            echo "NOTIFICATION_SEND_MODE=test_only"
            printf 'NOTIFICATION_DISPATCHER_SECRET=%s\n' "${NOTIFICATION_DISPATCHER_SECRET}"
          } > "${secrets_file}"
          supabase secrets set --project-ref "${PROJECT_REF}" --env-file "${secrets_file}" >/dev/null
          rm -f "${secrets_file}"

          secret_names="$(supabase secrets list --project-ref "${PROJECT_REF}" 2>/dev/null)"
          for name in NOTIFICATION_SEND_MODE NOTIFICATION_DISPATCHER_SECRET NOTIFICATION_TEST_EMAIL RESEND_API_KEY NOTIFICATION_FROM_EMAIL; do
            if ! printf '%s\n' "${secret_names}" | grep -Eq "(^|[[:space:]])${name}([[:space:]]|$)"; then
              echo "::error::Missing required DEV runtime secret name: ${name}"
              exit 1
            fi
          done
          echo "runtime_mode=test_only" > "${EVIDENCE_DIR}/runtime.txt"
          echo "required_runtime_secret_names=present" >> "${EVIDENCE_DIR}/runtime.txt"

      - name: Capture immutable historical baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(psql "${SUPABASE_DEV_DB_URL}" -v ON_ERROR_STOP=1 -AtX -F '|' -v cutoff="${ACTIVATION_CUTOFF}" <<'SQL'
          select
            count(*) filter (
              where e.event_type='payment_request.created'
                and e.created_at <= :'cutoff'::timestamptz
                and e.status in ('pending','failed')
            ),
            (
              select count(*)
              from public.notification_delivery_attempts a
              join public.notification_events historical
                on historical.id=a.notification_event_id
              where historical.event_type='payment_request.created'
                and historical.created_at <= :'cutoff'::timestamptz
            ),
            md5(coalesce(string_agg(
              e.id::text || ':' || e.status || ':' || e.attempt_count::text || ':' ||
              coalesce(e.locked_by,'') || ':' || coalesce(e.next_attempt_at::text,''),
              '|' order by e.id
            ) filter (
              where e.event_type='payment_request.created'
                and e.created_at <= :'cutoff'::timestamptz
            ), ''))
          from public.notification_events e;
          SQL
          )"
          IFS='|' read -r OLD_PENDING OLD_ATTEMPTS OLD_FINGERPRINT <<< "${baseline}"
          test "${OLD_PENDING}" -gt 0
          test -n "${OLD_FINGERPRINT}"
          {
            echo "OLD_PENDING=${OLD_PENDING}"
            echo "OLD_ATTEMPTS=${OLD_ATTEMPTS}"
            echo "OLD_FINGERPRINT=${OLD_FINGERPRINT}"
          } >> "${GITHUB_ENV}"
          {
            echo "old_pending=${OLD_PENDING}"
            echo "old_attempts_before=${OLD_ATTEMPTS}"
            echo "old_fingerprint_before=${OLD_FINGERPRINT}"
          } > "${EVIDENCE_DIR}/historical-baseline.txt"

      - name: Provision immutable created-event DEV activation
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_DEV_DB_URL}" -v ON_ERROR_STOP=1 -X             -v dispatcher_secret="${NOTIFICATION_DISPATCHER_SECRET}"             -v function_url="${FUNCTION_URL}"             -v cutoff="${ACTIVATION_CUTOFF}" <<'SQL' >/dev/null
          begin;

          select vault.create_secret(
            :'function_url',
            'notification_payment_request_created_dispatcher_url',
            'C1 DEV canonical dispatcher endpoint'
          )
          where not exists (
            select 1 from vault.secrets
            where name='notification_payment_request_created_dispatcher_url'
          );

          select vault.create_secret(
            :'dispatcher_secret',
            'notification_dispatcher_secret',
            'C1 DEV shared dispatcher authentication'
          )
          where not exists (
            select 1 from vault.secrets
            where name='notification_dispatcher_secret'
          );

          select vault.create_secret(
            :'cutoff',
            'notification_payment_request_created_cutoff_at',
            'C1 DEV immutable exclusive activation cutoff'
          )
          where not exists (
            select 1 from vault.secrets
            where name='notification_payment_request_created_cutoff_at'
          );

          select vault.create_secret(
            'true',
            'notification_payment_request_created_immediate_enabled',
            'C1 DEV immediate post-commit wake-up enabled'
          )
          where not exists (
            select 1 from vault.secrets
            where name='notification_payment_request_created_immediate_enabled'
          );

          select 1 / case when (
            select decrypted_secret = :'function_url'
            from vault.decrypted_secrets
            where name='notification_payment_request_created_dispatcher_url'
          ) then 1 else 0 end;

          select 1 / case when (
            select decrypted_secret = :'dispatcher_secret'
            from vault.decrypted_secrets
            where name='notification_dispatcher_secret'
          ) then 1 else 0 end;

          select 1 / case when (
            select decrypted_secret = :'cutoff'
            from vault.decrypted_secrets
            where name='notification_payment_request_created_cutoff_at'
          ) then 1 else 0 end;

          select 1 / case when (
            select lower(decrypted_secret) = 'true'
            from vault.decrypted_secrets
            where name='notification_payment_request_created_immediate_enabled'
          ) then 1 else 0 end;

          commit;
          SQL

          echo "vault_contract=4_of_4" > "${EVIDENCE_DIR}/activation.txt"
          echo "activation_cutoff=${ACTIVATION_CUTOFF}" >> "${EVIDENCE_DIR}/activation.txt"
          echo "cutoff_mutability=write_once" >> "${EVIDENCE_DIR}/activation.txt"

      - name: Prove test_only and empty post-cutoff queue before UAT
        shell: bash
        run: |
          set -euo pipefail
          new_before="$(psql "${SUPABASE_DEV_DB_URL}" -v ON_ERROR_STOP=1 -AtX \
            -v cutoff="${ACTIVATION_CUTOFF}" \
            -v marker="${UAT_MARKER}" <<'SQL'
          select count(*)
          from public.notification_events e
          left join public.payment_requests pr on pr.id=e.source_id
          where e.event_type='payment_request.created'
            and e.created_at > :'cutoff'::timestamptz
            and coalesce(pr.notes,'') <> :'marker';
          SQL
          )"
          test "${new_before}" = "0"

          response_file="${RUNNER_TEMP}/c1-preflight.json"
          request_body="$(python3 -c 'import json,os; print(json.dumps({
            "event_types":["payment_request.created"],
            "created_at_from":os.environ["ACTIVATION_CUTOFF"],
            "limit":1
          }))')"
          http_code="$(curl --silent --show-error             --output "${response_file}"             --write-out '%{http_code}'             --request POST "${FUNCTION_URL}"             --header 'Content-Type: application/json'             --header "x-notification-dispatcher-secret: ${NOTIFICATION_DISPATCHER_SECRET}"             --data "${request_body}")"
          test "${http_code}" -ge 200
          test "${http_code}" -lt 300
          RESPONSE_FILE="${response_file}" python3 - <<'PY'
          import json, os
          with open(os.environ["RESPONSE_FILE"], encoding="utf-8") as handle:
              data=json.load(handle)
          if data.get("mode") != "test_only" or data.get("processed") != 0:
              raise SystemExit("test_only_empty_queue_preflight_failed")
          os.remove(os.environ["RESPONSE_FILE"])
          PY

      - name: Create one canonical synthetic payment request
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_DEV_DB_URL}" -v ON_ERROR_STOP=1 -X -v marker="${UAT_MARKER}" <<'SQL' >/dev/null
          select set_config('c1.uat_marker', :'marker', false);
          do $uat$
          declare
            v_template record;
            v_result jsonb;
          begin
            if exists (
              select 1 from public.payment_requests
              where notes = current_setting('c1.uat_marker')
            ) then
              return;
            end if;

            select
              pr.proveedor_id,
              pr.company_id,
              pr.cost_center_id,
              pr.budget_category_id,
              requester.id as requester_id,
              requester.auth_user_id as requester_auth_user_id,
              pr.approver_id,
              pr.approver_assignment_id
              into v_template
            from public.payment_requests pr
            join public.profiles requester
              on requester.id=pr.requested_by
             and coalesce(requester.active,true)
             and requester.auth_user_id is not null
            join public.profiles approver
              on approver.id=pr.approver_id
             and coalesce(approver.active,true)
             and nullif(btrim(coalesce(approver.email,'')),'') is not null
            join public.approver_assignments assignment
              on assignment.id=pr.approver_assignment_id
             and assignment.company_id=pr.company_id
             and assignment.requester_id=pr.requested_by
             and assignment.approver_id=pr.approver_id
             and assignment.active
            where pr.proveedor_id is not null
              and pr.company_id is not null
              and pr.cost_center_id is not null
              and pr.budget_category_id is not null
              and pr.approver_id <> pr.requested_by
              and public.has_active_company_membership(pr.requested_by,pr.company_id)
              and public.is_payment_request_approver_for_company(pr.approver_id,pr.company_id)
            order by pr.created_at desc
            limit 1;

            if not found then
              raise exception 'c1_uat_template_not_found';
            end if;

            perform set_config(
              'request.jwt.claim.sub',
              v_template.requester_auth_user_id::text,
              true
            );

            v_result := public.create_payment_request_with_extraordinary_intent(
              v_template.proveedor_id,
              v_template.company_id,
              v_template.cost_center_id,
              v_template.budget_category_id,
              date_trunc('month', current_date)::date,
              1.17,
              'MXN',
              1,
              'QA PAYMENT REQUEST APPROVER EMAIL C1',
              current_setting('c1.uat_marker'),
              v_template.requester_id,
              false,
              v_template.approver_id,
              v_template.approver_assignment_id,
              false
            );

            if coalesce(v_result->>'status','') <> 'submitted' then
              raise exception 'c1_uat_request_not_submitted';
            end if;
          end
          $uat$;
          SQL

      - name: Reconcile automatic post-commit delivery
        shell: bash
        run: |
          set -euo pipefail
          event_status=""
          for attempt in $(seq 1 30); do
            event_status="$(psql "${SUPABASE_DEV_DB_URL}" -v ON_ERROR_STOP=1 -AtX -c "
              select coalesce(e.status,'missing')
              from public.payment_requests pr
              left join public.notification_events e
                on e.source_id=pr.id
               and e.event_type='payment_request.created'
               and e.idempotency_key='payment_request.created:' || pr.id::text || ':approver'
              where pr.notes='${UAT_MARKER}'
              order by pr.created_at desc
              limit 1;
            ")"
            if [ "${event_status}" = "sent" ]; then
              break
            fi
            if [ "${event_status}" = "failed" ] || [ "${event_status}" = "dead_letter" ]; then
              echo "::error::Automatic delivery reached ${event_status}."
              exit 1
            fi
            sleep 2
          done
          test "${event_status}" = "sent"

          psql "${SUPABASE_DEV_DB_URL}" -v ON_ERROR_STOP=1 -AtX             -v marker="${UAT_MARKER}"             -v cutoff="${ACTIVATION_CUTOFF}" <<'SQL' > "${EVIDENCE_DIR}/uat-result.json"
          with target as (
            select pr.*
            from public.payment_requests pr
            where pr.notes=:'marker'
          ), target_event as (
            select e.*
            from public.notification_events e
            join target pr on pr.id=e.source_id
            where e.event_type='payment_request.created'
          )
          select jsonb_build_object(
            'request_count', (select count(*) from target),
            'request_status', (select status::text from target limit 1),
            'event_count', (select count(*) from target_event),
            'event_status', (select status from target_event limit 1),
            'event_strictly_after_cutoff', (
              select bool_and(created_at > :'cutoff'::timestamptz) from target_event
            ),
            'recipient_profile_is_approver_snapshot', (
              select bool_and(e.recipient_profile_id=pr.approver_id)
              from target_event e join target pr on pr.id=e.source_id
            ),
            'recipient_email_is_approver_snapshot', (
              select bool_and(lower(btrim(e.recipient_email))=lower(btrim(p.email)))
              from target_event e
              join target pr on pr.id=e.source_id
              join public.profiles p on p.id=pr.approver_id
            ),
            'delivery_attempts', (
              select count(*)
              from public.notification_delivery_attempts a
              join target_event e on e.id=a.notification_event_id
            ),
            'provider_message_ids', (
              select count(*)
              from public.notification_delivery_attempts a
              join target_event e on e.id=a.notification_event_id
              where nullif(btrim(coalesce(a.provider_message_id,'')),'') is not null
            ),
            'duplicate_events', greatest((select count(*) from target_event)-1,0),
            'source_folio', (select request_number from target limit 1),
            'send_mode', 'test_only',
            'real_recipients', 0
          );
          SQL

          RESULT_FILE="${EVIDENCE_DIR}/uat-result.json" python3 - <<'PY'
          import json, os
          with open(os.environ["RESULT_FILE"], encoding="utf-8") as handle:
              data=json.load(handle)
          expected={
              "request_count":1,
              "request_status":"submitted",
              "event_count":1,
              "event_status":"sent",
              "event_strictly_after_cutoff":True,
              "recipient_profile_is_approver_snapshot":True,
              "recipient_email_is_approver_snapshot":True,
              "delivery_attempts":1,
              "provider_message_ids":1,
              "duplicate_events":0,
              "send_mode":"test_only",
              "real_recipients":0,
          }
          for key,value in expected.items():
              if data.get(key) != value:
                  raise SystemExit(f"uat_contract_failed:{key}:{data.get(key)!r}")
          print(json.dumps(data,sort_keys=True))
          PY

      - name: Prove recovery sends no duplicate and history stays untouched
        shell: bash
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/c1-recovery.json"
          request_body="$(python3 -c 'import json,os; print(json.dumps({
            "event_types":["payment_request.created"],
            "created_at_from":os.environ["ACTIVATION_CUTOFF"],
            "limit":5
          }))')"
          http_code="$(curl --silent --show-error             --output "${response_file}"             --write-out '%{http_code}'             --request POST "${FUNCTION_URL}"             --header 'Content-Type: application/json'             --header "x-notification-dispatcher-secret: ${NOTIFICATION_DISPATCHER_SECRET}"             --data "${request_body}")"
          test "${http_code}" -ge 200
          test "${http_code}" -lt 300

          RESPONSE_FILE="${response_file}" OUTPUT_FILE="${EVIDENCE_DIR}/recovery.json" python3 - <<'PY'
          import json, os
          with open(os.environ["RESPONSE_FILE"], encoding="utf-8") as handle:
              data=json.load(handle)
          if (
              data.get("mode") != "test_only"
              or data.get("processed") != 0
              or data.get("sent") != 0
              or data.get("failed") != 0
          ):
              raise SystemExit("recovery_duplicate_guard_failed")
          safe={
              "mode":"test_only",
              "processed":0,
              "sent":0,
              "failed":0,
              "duplicates":0,
          }
          with open(os.environ["OUTPUT_FILE"],"w",encoding="utf-8") as handle:
              json.dump(safe,handle,sort_keys=True)
          os.remove(os.environ["RESPONSE_FILE"])
          PY

          after="$(psql "${SUPABASE_DEV_DB_URL}" -v ON_ERROR_STOP=1 -AtX -F '|' -v cutoff="${ACTIVATION_CUTOFF}" <<'SQL'
          select
            (
              select count(*)
              from public.notification_delivery_attempts a
              join public.notification_events historical
                on historical.id=a.notification_event_id
              where historical.event_type='payment_request.created'
                and historical.created_at <= :'cutoff'::timestamptz
            ),
            md5(coalesce(string_agg(
              e.id::text || ':' || e.status || ':' || e.attempt_count::text || ':' ||
              coalesce(e.locked_by,'') || ':' || coalesce(e.next_attempt_at::text,''),
              '|' order by e.id
            ) filter (
              where e.event_type='payment_request.created'
                and e.created_at <= :'cutoff'::timestamptz
            ), ''))
          from public.notification_events e;
          SQL
          )"
          IFS='|' read -r OLD_ATTEMPTS_AFTER OLD_FINGERPRINT_AFTER <<< "${after}"
          test "${OLD_ATTEMPTS_AFTER}" = "${OLD_ATTEMPTS}"
          test "${OLD_FINGERPRINT_AFTER}" = "${OLD_FINGERPRINT}"
          {
            echo "old_attempts_after=${OLD_ATTEMPTS_AFTER}"
            echo "old_attempt_delta=0"
            echo "old_fingerprint_after=${OLD_FINGERPRINT_AFTER}"
            echo "historical_replay=0"
            echo "duplicates=0"
            echo "real_emails=0"
          } > "${EVIDENCE_DIR}/anti-replay.txt"

      - name: Upload sanitized UAT evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: payment-request-approver-email-c1-dev-uat
          path: /tmp/payment-request-approver-email-c1-uat
          if-no-files-found: warn
          retention-days: 14
