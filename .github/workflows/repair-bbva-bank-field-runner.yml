name: Repair BBVA bank-field hotfix runner

on:
  push:
    branches:
      - hotfix/bbva-pagosint-bank-field-prod

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[runner-repaired]') && !contains(github.event.head_commit.message, '[bbva-bank-field-hotfix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Repair exact Python literals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-bbva-pagosint-bank-field-hotfix.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          source_seen = False
          target_seen = False
          for index, line in enumerate(lines):
              if 'bbva-clabe-012-routing' in line and 'layouts' in line:
                  lines[index] = '              "layouts\\\\.js\\\\?v=20260903-bbva-clabe-012-routing",'
                  source_seen = True
              elif 'pagosint-bank-field' in line and 'layouts' in line:
                  lines[index] = '              "layouts\\\\.js\\\\?v=20260903-pagosint-bank-field",'
                  target_seen = True
          if not source_seen or not target_seen:
              raise SystemExit(f'cache-buster literals not found: source={source_seen} target={target_seen}')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit repaired runner
        shell: bash
        run: |
          git config user.name "ramon1415"
          git config user.email "ramon@quantta.mx"
          git rm .github/workflows/repair-bbva-bank-field-runner.yml
          git add .github/workflows/apply-bbva-pagosint-bank-field-hotfix.yml
          git commit -m "ci: reparar runner de campo banco [runner-repaired]"
          git push origin HEAD:hotfix/bbva-pagosint-bank-field-prod
