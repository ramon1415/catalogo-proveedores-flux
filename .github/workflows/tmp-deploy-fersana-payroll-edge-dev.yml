name: TEMP Deploy Fersana Payroll Edge DEV

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/tmp-deploy-fersana-payroll-edge-dev.yml

permissions:
  contents: write

concurrency:
  group: tmp-fersana-payroll-edge-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[fersana-edge-deployed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: DEV
    env:
      SUPABASE_PROJECT_ID: scsirgbuqjcwoaxfacth
      FUNCTION_NAME: payroll-materialize
      EXPECTED_INDEX_BLOB: 82e99bed6957b7ecf222d4a669bc4a83fb45e200
      EXPECTED_PARSER_BLOB: 26239f2a2f93c95011a93cdeb99e730e998b232e
      EXPECTED_FORMATS_BLOB: 483fa3e7e5ede3b3eab1b100b39e4e872560b188
      EXPECTED_RECONCILE_BLOB: 56552cc386c1da7130047cc06e65b29646431baa
      EXPECTED_PROVISION_BLOB: 229c2232410e6bb05393ea1ba8146e98df7efcae
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify DEV target and exact merged bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/dev" ]]
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]]
          live_dev="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq .object.sha)"
          [[ "$live_dev" == "$GITHUB_SHA" ]] || { echo "::error::dev drift"; exit 1; }
          [[ "$(git hash-object supabase/functions/payroll-materialize/index.ts)" == "$EXPECTED_INDEX_BLOB" ]]
          [[ "$(git hash-object payroll_parser.js)" == "$EXPECTED_PARSER_BLOB" ]]
          [[ "$(git hash-object payroll_real_formats.js)" == "$EXPECTED_FORMATS_BLOB" ]]
          [[ "$(git hash-object payroll_real_reconcile.js)" == "$EXPECTED_RECONCILE_BLOB" ]]
          [[ "$(git hash-object payroll_provision_base.js)" == "$EXPECTED_PROVISION_BLOB" ]]
          python3 - <<'PY'
          import pathlib, tomllib
          config=tomllib.loads(pathlib.Path('supabase/config.toml').read_text())
          item=config.get('functions',{}).get('payroll-materialize')
          if item is not None and item.get('verify_jwt') is False:
              raise SystemExit('verify_jwt may not be disabled')
          PY
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.113.0
      - name: Deploy payroll-materialize to DEV only
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live_dev="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq .object.sha)"
          [[ "$live_dev" == "$GITHUB_SHA" ]] || { echo "::error::dev drift before deploy"; exit 1; }
          supabase functions deploy "$FUNCTION_NAME" --project-ref "$SUPABASE_PROJECT_ID"
      - name: Remove temporary deploy workflow
        if: success()
        shell: bash
        run: |
          git config user.name 'ramon1415'
          git config user.email 'ramon@quantta.mx'
          git rm .github/workflows/tmp-deploy-fersana-payroll-edge-dev.yml
          git commit -m 'chore(dev): retirar deploy temporal Fersana [fersana-edge-deployed]'
          git push origin HEAD:dev
