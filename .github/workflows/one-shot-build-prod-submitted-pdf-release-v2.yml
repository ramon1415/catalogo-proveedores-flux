name: One-shot build PROD submitted-cut PDF release v2

'on':
  push:
    branches:
      - release/approval-batch-submitted-system-pdf-prod-20260824
    paths:
      - '.github/workflows/one-shot-build-prod-submitted-pdf-release-v2.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-build-prod-submitted-pdf-release-v2
  cancel-in-progress: false

jobs:
  build:
    name: Build exact DEV-approved slice for PROD v2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPROVED_DEV_SHA: 2155ca17641eb4f59e56524ab8a7f664975a21af
      EXPECTED_MAIN_SHA: 103add103d56805b146be67d0f2d224e79deefb8
      PROD_MIGRATION_VERSION: '20260824233945'
      RELEASE_BRANCH: release/approval-batch-submitted-system-pdf-prod-20260824
    steps:
      - name: Check out release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${RELEASE_BRANCH}"
          git fetch --no-tags origin main "${APPROVED_DEV_SHA}"
          test "$(git merge-base HEAD origin/main)" = "${EXPECTED_MAIN_SHA}"
          git cat-file -e "${APPROVED_DEV_SHA}^{commit}"
          mapfile -t preexisting < <(git diff --name-only origin/main...HEAD | sort)
          test "${#preexisting[@]}" -eq 2
          printf '%s\n' "${preexisting[@]}" | grep -qx '.github/workflows/one-shot-build-prod-submitted-pdf-release.yml'
          printf '%s\n' "${preexisting[@]}" | grep -qx '.github/workflows/one-shot-build-prod-submitted-pdf-release-v2.yml'

      - name: Copy exact approved function files
        shell: bash
        run: |
          set -euo pipefail
          base='supabase/functions/approval-batch-submitted-dispatcher'
          mkdir -p "${base}"
          for file in index.ts deno.json jspdf_edge.ts pdf_logo_embed.ts pdf_logo.ts; do
            git show "${APPROVED_DEV_SHA}:${base}/${file}" > "${base}/${file}"
          done

      - name: Adapt only runtime constants to PROD
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/approval-batch-submitted-dispatcher/index.ts')
          text = path.read_text()
          old_worker = 'edge-approval-batch-submitted-dev'
          old_url = 'https://catalogo-proveedores-flux-git-dev-quantta-team.vercel.app'
          assert text.count(old_worker) >= 1
          assert text.count(old_url) == 1
          text = text.replace(old_worker, 'edge-approval-batch-submitted-prod')
          text = text.replace(old_url, 'https://flux.quantta.mx')
          assert old_worker not in text
          assert old_url not in text
          path.write_text(text)
          PY

      - name: Materialize authoritative PROD migration file
        shell: bash
        run: |
          set -euo pipefail
          src='supabase/migrations/20260824224716_approval_batch_submitted_system_pdf_fields_dev.sql'
          dst="supabase/migrations/${PROD_MIGRATION_VERSION}_approval_batch_submitted_system_pdf_fields_prod.sql"
          git show "${APPROVED_DEV_SHA}:${src}" > "${dst}"
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260824233945_approval_batch_submitted_system_pdf_fields_prod.sql')
          text = path.read_text()
          text = text.replace('edge-approval-batch-submitted-dev', 'edge-approval-batch-submitted-prod')
          text = text.replace("is 'DEV submitted-batch email document", "is 'PROD submitted-batch email document")
          assert 'edge-approval-batch-submitted-dev' not in text
          assert "is 'DEV submitted-batch" not in text
          path.write_text(text)
          PY

      - name: Install exact PDF dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts \
            jspdf@2.5.2 jspdf-autotable@3.8.4

      - name: Run focused PROD PDF contract
        shell: bash
        run: |
          set -euo pipefail
          cat > .tmp-prod-pdf-contract.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { jsPDF } from 'jspdf';
          import {
            generateApprovalBatchPdfBytes,
            prepareApprovalBatchAttachment,
            renderApprovalBatchSubmittedEmail,
          } from './supabase/functions/approval-batch-submitted-dispatcher/index.ts';
          import { SYSTEM_PDF_LOGO_DATA_URL } from './supabase/functions/approval-batch-submitted-dispatcher/pdf_logo.ts';
          import { addEmbeddedSystemPdfLogo } from './supabase/functions/approval-batch-submitted-dispatcher/pdf_logo_embed.ts';

          const docData = {
            event_id: '00000000-0000-0000-0000-000000000001',
            recipient_email: 'director@example.invalid',
            recipient_profile_id: '00000000-0000-0000-0000-000000000002',
            batch: {
              id: '00000000-0000-0000-0000-000000000003',
              label: 'CORTE PROD CONTRACT',
              company: 'Operadora Tlacatecpan',
              company_name: 'Operadora Tlacatecpan',
              status: 'submitted',
              period_start: '2026-08-24',
              period_end: '2026-08-26',
              submitted_at: '2026-08-24T23:30:00Z',
              director_name: 'Director',
              director_email: 'director@example.invalid',
              item_count: 1,
              totals_by_currency: [{ currency: 'MXN', amount: 100 }],
            },
            items: [{
              item_id: '00000000-0000-0000-0000-000000000004',
              request_number: 'SOL-2026-0100',
              provider: 'Proveedor',
              provider_name: 'Proveedor',
              concept: 'Concepto',
              cost_center: 'Rancho San Juan Tlacatecpan',
              budget_category: 'AUTO-RSJT-2026-ROW-034 - Mantenimiento Corporativo (Legal)',
              payment_method: 'transfer',
              amount: 100,
              currency: 'MXN',
              requester_name: 'Ramón Hipo',
              director_status: 'pending',
              reject_reason: null,
              rebatch_release_note: null,
              scheduled_payment_date: '2026-08-26',
              payment_reference: null,
              finance_reviewed_at: '2026-08-24T23:29:00Z',
            }],
          };

          const rendered = renderApprovalBatchSubmittedEmail(docData, 'real', 'director');
          assert.doesNotMatch(rendered.subject, /^\[DEV TEST\]/);
          assert.match(rendered.html, /https:\/\/flux\.quantta\.mx\/approval_batches\.html\?batch_id=/);
          assert.doesNotMatch(rendered.html, /catalogo-proveedores-flux-git-dev/);

          const generated = generateApprovalBatchPdfBytes(docData);
          const binary = new TextDecoder('latin1').decode(generated.bytes);
          assert.equal(generated.pageCount, 1);
          assert.equal(binary.slice(0, 8), '%PDF-1.3');
          for (const token of ['CORTE PROD CONTRACT', 'Folio', 'Proveedor', 'Centro / partida', 'Solicitante', 'Decision', 'Motivo', 'Flux Operadora']) {
            assert.ok(binary.includes(token), `missing PDF token: ${token}`);
          }

          const attachment = await prepareApprovalBatchAttachment(docData, {
            fetch: async () => new Response('not found', { status: 404 }),
          });
          assert.equal(attachment.filename, 'corte-semanal-operadora-tlacatecpan-2026-08-26.pdf');
          assert.match(attachment.content, /^JVBERi0xLjM/);
          assert.match(attachment.sha256, /^[0-9a-f]{64}$/);

          const png = Buffer.from(SYSTEM_PDF_LOGO_DATA_URL.split(',')[1], 'base64');
          assert.equal(png.subarray(0, 8).toString('hex'), '89504e470d0a1a0a');
          assert.equal(png.readUInt32BE(16), 300);
          assert.equal(png.readUInt32BE(20), 120);
          assert.equal(png.indexOf(Buffer.from('tRNS')), -1);

          const logoDoc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'letter' });
          addEmbeddedSystemPdfLogo(logoDoc);
          const logoBinary = new TextDecoder('latin1').decode(new Uint8Array(logoDoc.output('arraybuffer')));
          assert.match(logoBinary, /\/Subtype \/Image/);
          assert.match(logoBinary, /\/Width 300/);
          assert.match(logoBinary, /\/Height 120/);
          NODE
          node --experimental-strip-types .tmp-prod-pdf-contract.mjs
          rm -f .tmp-prod-pdf-contract.mjs

      - name: Validate release source and exact scope
        shell: bash
        run: |
          set -euo pipefail
          base='supabase/functions/approval-batch-submitted-dispatcher'
          grep -q 'const FLUX_URL = "https://flux.quantta.mx"' "${base}/index.ts"
          ! grep -q 'catalogo-proveedores-flux-git-dev-quantta-team.vercel.app' "${base}/index.ts"
          grep -q 'edge-approval-batch-submitted-prod' "${base}/index.ts"
          grep -q '"jspdf": "./jspdf_edge.ts"' "${base}/deno.json"
          grep -q 'addEmbeddedSystemPdfLogo' "${base}/jspdf_edge.ts"
          grep -q 'SYSTEM_PDF_LOGO_DATA_URL' "${base}/pdf_logo.ts"
          grep -q 'PROD submitted-batch email document' "supabase/migrations/${PROD_MIGRATION_VERSION}_approval_batch_submitted_system_pdf_fields_prod.sql"
          grep -q 'edge-approval-batch-submitted-prod' "supabase/migrations/${PROD_MIGRATION_VERSION}_approval_batch_submitted_system_pdf_fields_prod.sql"
          git diff --check

      - name: Commit product release and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-build-prod-submitted-pdf-release.yml
          rm -f .github/workflows/one-shot-build-prod-submitted-pdf-release-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          mapfile -t final_changed < <(git diff --cached --name-only origin/main | sort)
          printf '%s\n' "${final_changed[@]}"
          test "${#final_changed[@]}" -eq 6
          printf '%s\n' "${final_changed[@]}" | grep -qx 'supabase/functions/approval-batch-submitted-dispatcher/deno.json'
          printf '%s\n' "${final_changed[@]}" | grep -qx 'supabase/functions/approval-batch-submitted-dispatcher/index.ts'
          printf '%s\n' "${final_changed[@]}" | grep -qx 'supabase/functions/approval-batch-submitted-dispatcher/jspdf_edge.ts'
          printf '%s\n' "${final_changed[@]}" | grep -qx 'supabase/functions/approval-batch-submitted-dispatcher/pdf_logo.ts'
          printf '%s\n' "${final_changed[@]}" | grep -qx 'supabase/functions/approval-batch-submitted-dispatcher/pdf_logo_embed.ts'
          printf '%s\n' "${final_changed[@]}" | grep -qx "supabase/migrations/${PROD_MIGRATION_VERSION}_approval_batch_submitted_system_pdf_fields_prod.sql"
          git commit -m 'Release approved submitted-cut system PDF to PROD'
          git push origin HEAD:"${RELEASE_BRANCH}"
