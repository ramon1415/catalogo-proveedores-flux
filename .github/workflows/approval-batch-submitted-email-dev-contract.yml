name: Approval batch submitted DEV email and PDF contract

'on':
  pull_request:
    branches:
      - dev
    paths:
      - 'supabase/functions/approval-batch-submitted-dispatcher/**'
      - 'supabase/functions/approval-batch-quick-approve/**'
      - 'supabase/config.toml'
      - 'approval_batch_quick_approve.html'
      - 'approval_batch_quick_approve.css'
      - 'approval_batch_quick_approve.js'
      - 'supabase/migrations/20260826201712_approval_batch_quick_approve_dev.sql'
      - 'supabase/migrations/20260824204217_approval_batch_submitted_email_pdf_dev.sql'
      - 'supabase/migrations/20260824224716_approval_batch_submitted_system_pdf_fields_dev.sql'
      - 'scripts/qa/approval-batch-submitted-email-dev-contract.test.mjs'
      - 'scripts/qa/approval-batch-quick-approve-contract.test.mjs'
      - 'docs/ops/approval-batch-submitted-email-dev.md'
      - '.github/workflows/approval-batch-submitted-email-dev-contract.yml'

permissions:
  contents: read

concurrency:
  group: approval-batch-submitted-email-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: DEV submitted Director email + system PDF
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.16.0'
          cache: ''

      - name: Install exact system PDF dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts \
            jspdf@2.5.2 jspdf-autotable@3.8.4
          npm ls jspdf jspdf-autotable

      - name: Run focused executable contract
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --experimental-strip-types --test \
            scripts/qa/approval-batch-submitted-email-dev-contract.test.mjs \
            scripts/qa/approval-batch-quick-approve-contract.test.mjs

          node --experimental-strip-types --input-type=module -e \
            "await import('./supabase/functions/approval-batch-quick-approve/index.ts')"
          node --check approval_batch_quick_approve.js

      - name: Validate DEV-only scope and scan for secrets
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/dev...HEAD

          mapfile -t changed < <(git diff --name-only origin/dev...HEAD | sort)
          printf '%s\n' "${changed[@]}"

          allowed='^((approval_batch_quick_approve\.(html|css|js))|(supabase/config\.toml)|(supabase/functions/approval-batch-quick-approve/index\.ts)|(supabase/functions/approval-batch-submitted-dispatcher/index\.ts)|(supabase/functions/approval-batch-submitted-dispatcher/deno\.json)|(supabase/functions/approval-batch-submitted-dispatcher/jspdf_edge\.ts)|(supabase/functions/approval-batch-submitted-dispatcher/pdf_logo\.ts)|(supabase/functions/approval-batch-submitted-dispatcher/pdf_logo_embed\.ts)|(supabase/migrations/20260824204217_approval_batch_submitted_email_pdf_dev\.sql)|(supabase/migrations/20260824224716_approval_batch_submitted_system_pdf_fields_dev\.sql)|(supabase/migrations/20260826201712_approval_batch_quick_approve_dev\.sql)|(scripts/qa/approval-batch-submitted-email-dev-contract\.test\.mjs)|(scripts/qa/approval-batch-quick-approve-contract\.test\.mjs)|(docs/ops/approval-batch-submitted-email-dev\.md)|(docs/ops/approval-batch-quick-approve-dev\.md)|(\.github/workflows/approval-batch-submitted-email-dev-contract\.yml))$'
          if printf '%s\n' "${changed[@]}" | grep -Ev "${allowed}" | grep -q .; then
            echo '::error::DEV submitted-batch change contains a non-authorized path.'
            exit 1
          fi

          mapfile -t scannable < <(printf '%s\n' "${changed[@]}" | grep -Ev '\.(png|jpg|jpeg|gif|webp|pdf)$' || true)
          if (( ${#scannable[@]} )); then
            ! grep -R -E \
              "re_[A-Za-z0-9]{20,}|sbp_[A-Za-z0-9]{20,}|service_role[^[:space:]]*eyJ|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@" \
              "${scannable[@]}"
            ! grep -R -E 'C:\\Users\\|/Users/|/home/' "${scannable[@]}"
          fi

          grep -q 'catalogo-proveedores-flux-git-dev-quantta-team.vercel.app' \
            supabase/functions/approval-batch-submitted-dispatcher/index.ts
          ! grep -q 'const FLUX_URL = "https://flux.quantta.mx"' \
            supabase/functions/approval-batch-submitted-dispatcher/index.ts
          grep -q '"jspdf": "./jspdf_edge.ts"' \
            supabase/functions/approval-batch-submitted-dispatcher/deno.json
          grep -q '"jspdf-core": "npm:jspdf@2.5.2"' \
            supabase/functions/approval-batch-submitted-dispatcher/deno.json
          grep -q 'npm:jspdf-autotable@3.8.4' \
            supabase/functions/approval-batch-submitted-dispatcher/deno.json
          grep -q 'SYSTEM_PDF_LOGO_DATA_URL' \
            supabase/functions/approval-batch-submitted-dispatcher/pdf_logo.ts
          grep -q 'addEmbeddedSystemPdfLogo' \
            supabase/functions/approval-batch-submitted-dispatcher/jspdf_edge.ts
          grep -q '"PNG"' \
            supabase/functions/approval-batch-submitted-dispatcher/pdf_logo_embed.ts
          grep -q 'event.created_at > p_created_at_after' \
            supabase/migrations/20260824204217_approval_batch_submitted_email_pdf_dev.sql
          grep -q "'requester_name', requester.full_name" \
            supabase/migrations/20260824224716_approval_batch_submitted_system_pdf_fields_dev.sql
          grep -q 'approval_batch_quick_approve.html#token=' \
            supabase/functions/approval-batch-submitted-dispatcher/index.ts
          ! grep -q 'approval_batch_quick_approve.html?token=' \
            supabase/functions/approval-batch-submitted-dispatcher/index.ts
          grep -q 'force row level security' \
            supabase/migrations/20260826201712_approval_batch_quick_approve_dev.sql
          ! grep -R -E 'localStorage|sessionStorage|document\.cookie' \
            approval_batch_quick_approve.{html,js}

          echo 'scope=DEV_only'
          echo 'pdf_contract=approval_batches.js_jsPDF_2.5.2_autoTable_3.8.4'
          echo 'pdf_logo=embedded_png_300x120'
          echo 'migration_ledger=20260824224716'
          echo 'send_mode_runtime=test_only'
          echo 'historical_replay=blocked'
          echo 'secret_scan=pass'
