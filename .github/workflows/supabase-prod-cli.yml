name: Supabase PROD CIE Apply

on:
  workflow_dispatch:
    inputs:
      confirm_prod:
        description: "Type the PROD Supabase project ref to confirm the target"
        required: true
        type: string
      confirm_mode:
        description: "Type apply-cie-exact-two to confirm the exclusive CIE migration apply"
        required: true
        default: "apply-cie-exact-two"
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-prod-cie-apply
  cancel-in-progress: false

jobs:
  apply_cie:
    name: Supabase PROD CIE migration apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_PROD_SESSION_POOLER_DB_URL }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_REF_PROD }}
      CONFIRM_PROD: ${{ inputs.confirm_prod }}
      CONFIRM_MODE: ${{ inputs.confirm_mode }}

    steps:
      - name: Validate release guardrails
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" != "release/ramon-bbva-cie-prod" ]; then
            echo "::error::This workflow is restricted to the authorized CIE release branch."
            exit 1
          fi

          if [ "${CONFIRM_MODE}" != "apply-cie-exact-two" ]; then
            echo "::error::confirm_mode must be exactly: apply-cie-exact-two"
            exit 1
          fi

          if [ -z "${SUPABASE_PROJECT_ID}" ]; then
            echo "::error::SUPABASE_PROJECT_REF_PROD environment variable is not configured."
            exit 1
          fi

          if [ "${CONFIRM_PROD}" != "${SUPABASE_PROJECT_ID}" ]; then
            echo "::error::confirm_prod does not match the configured PROD project ref."
            exit 1
          fi

          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not configured."
            exit 1
          fi

          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::SUPABASE_PROD_SESSION_POOLER_DB_URL secret is not configured."
            exit 1
          fi

          if [[ "${SUPABASE_DB_URL}" != *"${SUPABASE_PROJECT_ID}"* ]]; then
            echo "::error::The configured pooler URL does not match PROD project ref."
            exit 1
          fi

          echo "Guardrails passed. Running exclusive two-migration CIE apply."

      - name: Check out authorized CIE release
        uses: actions/checkout@v4
        with:
          ref: release/ramon-bbva-cie-prod

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2

      - name: Show migration files in release branch
        shell: bash
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name "*.sql" | sort

      - name: Align proven historical timestamp aliases in runner
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import pathlib
          import re

          root = pathlib.Path("supabase/migrations")
          pairs = {
              "20260809214308_reconcile_layout_operational_materiality_sol_2026_0006.sql": (
                  "20260809215709_reconcile_layout_operational_materiality_sol_2026_0006.sql",
                  "ba133d39fe1747f49603f47883a2510a",
              ),
              "20260810165344_layout_client_uat_preserve_approval_repair_sol_0008_0009.sql": (
                  "20260810172702_layout_client_uat_preserve_approval_repair_sol_0008_0009.sql",
                  "e47a8d0bc23ae4309375dce191630061",
              ),
              "20260810175316_layout_concept_no_reauth.sql": (
                  "20260810175919_layout_concept_no_reauth.sql",
                  "74787d8ca328cf54bc422cb76952d832",
              ),
              "20260810185817_paid_layout_receipt_match.sql": (
                  "20260810190637_paid_layout_receipt_match.sql",
                  "02b8dbe1cfb2af2bd1ae96d2f87ac197",
              ),
          }
          for source_name, (target_name, expected_compact_md5) in pairs.items():
              source = root / source_name
              target = root / target_name
              if not source.is_file() or target.exists():
                  raise SystemExit(f"historical alias state unexpected: {source_name}")
              compact = re.sub(rb"\s+", b"", source.read_bytes())
              actual = hashlib.md5(compact).hexdigest()
              if actual != expected_compact_md5:
                  raise SystemExit(f"historical SQL fingerprint drift: {source_name}")
              source.rename(target)
              print(f"aligned proven historical alias: {source_name} -> {target_name}")
          PY
      - name: Link Supabase PROD project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Review linked migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "${SUPABASE_DB_URL}"

      - name: Preflight and apply exactly two CIE migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "${SUPABASE_DB_URL}" --dry-run 2>&1 | tee "${RUNNER_TEMP}/cie-prod-dry-run.txt"
          python3 - "${RUNNER_TEMP}/cie-prod-dry-run.txt" <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          expected = {
              "20260813011425_049_snapshot_bbva_cie_convenio_number.sql",
              "20260814004000_provider_catalog_canonical_rpc_prod.sql",
          }
          found = set(re.findall(r"\b(20\d{12}_[A-Za-z0-9_.-]+\.sql)\b", text))
          if found != expected:
              raise SystemExit(f"PROD_MIGRATION_SET_NOT_EXCLUSIVE: {sorted(found)}")
          print("PASS / PROD_MIGRATION_SET_EXACTLY_TWO")
          PY
          echo "Applying the two preflight-approved migrations exactly once."
          supabase db push --db-url "${SUPABASE_DB_URL}" --yes 2>&1 | tee "${RUNNER_TEMP}/cie-prod-apply.txt"
          echo "PASS / PROD_CIE_MIGRATIONS_APPLY_COMMAND_COMPLETED"

      - name: Verify both release versions in remote ledger
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "${SUPABASE_DB_URL}" 2>&1 | tee "${RUNNER_TEMP}/cie-prod-post-list.txt"
          python3 - "${RUNNER_TEMP}/cie-prod-post-list.txt" <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          for version in ("20260813011425", "20260814004000"):
              if not re.search(rf"`{version}`\s*\|\s*`{version}`", text):
                  raise SystemExit(f"release version not confirmed in remote ledger: {version}")
          print("PASS / PROD_CIE_LEDGER_EXACT_TWO_CONFIRMED")
          PY

      - name: Summarize apply
        if: always()
        shell: bash
        run: |
          {
            echo "## Supabase PROD CIE apply"
            echo ""
            echo "- Environment: supabase-production"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Mode: apply exactly two preflight-approved migrations"
            echo "- Real db push: executed once after exclusive dry-run PASS"
            echo "- Migration repair: not executed by this workflow"
            echo "- n8n: not touched by this workflow"
          } >> "${GITHUB_STEP_SUMMARY}"
