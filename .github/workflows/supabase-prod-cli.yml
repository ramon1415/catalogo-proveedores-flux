name: Supabase PROD CLI Release Gate

on:
  workflow_dispatch:
    inputs:
      confirm_prod:
        description: "Type the PROD Supabase project ref to confirm the target"
        required: true
        type: string
      confirm_mode:
        description: "Type dry-run or audit-readonly"
        required: true
        default: "dry-run"
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: supabase-prod-cli-release-gate
  cancel-in-progress: false

jobs:
  release_gate:
    name: Supabase PROD release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_REF_PROD }}
      CONFIRM_PROD: ${{ inputs.confirm_prod }}
      CONFIRM_MODE: ${{ inputs.confirm_mode }}

    steps:
      - name: Validate release guardrails
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" != "dev" ]; then
            echo "::error::This workflow is restricted to the dev branch."
            exit 1
          fi

          case "${CONFIRM_MODE}" in
            dry-run|audit-readonly)
              ;;
            *)
              echo "::error::confirm_mode must be exactly one of: dry-run, audit-readonly"
              exit 1
              ;;
          esac

          if [ -z "${SUPABASE_PROJECT_ID}" ]; then
            echo "::error::SUPABASE_PROJECT_REF_PROD environment variable is not configured."
            exit 1
          fi

          if [ "${CONFIRM_PROD}" != "${SUPABASE_PROJECT_ID}" ]; then
            echo "::error::confirm_prod does not match the configured PROD project ref."
            exit 1
          fi

          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not configured."
            exit 1
          fi

          if [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD_PROD secret is not configured."
            exit 1
          fi

          echo "Guardrails passed. Mode: ${CONFIRM_MODE}."
          echo "No real db push and no migration repair are executed by this workflow."

      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2

      - name: Show migration files in release branch
        if: ${{ inputs.confirm_mode == 'dry-run' }}
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name "*.sql" | sort

      - name: Link Supabase PROD project
        run: |
          set -euo pipefail
          supabase link --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Review linked migration history
        run: |
          set -euo pipefail
          supabase migration list --linked

      - name: Dry-run Supabase PROD migrations
        if: ${{ inputs.confirm_mode == 'dry-run' }}
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run

      - name: Install PostgreSQL client for read-only audit
        if: ${{ inputs.confirm_mode == 'audit-readonly' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Audit PROD schema metadata read-only
        if: ${{ inputs.confirm_mode == 'audit-readonly' }}
        run: |
          set -euo pipefail

          audit_file="supabase-prod-readonly-audit.txt"
          db_host="db.${SUPABASE_PROJECT_ID}.supabase.co"
          export PGPASSWORD="${SUPABASE_DB_PASSWORD}"

          psql_args=(
            "host=${db_host} port=5432 dbname=postgres user=postgres sslmode=require"
            -v ON_ERROR_STOP=1
            -X
            -P pager=off
          )

          {
            echo "## Supabase PROD read-only schema audit"
            echo ""
            echo "Environment: supabase-production"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Mode: audit-readonly"
            echo "Real db push: not executed"
            echo "Migration repair: not executed"
            echo ""
          } > "${audit_file}"

          psql "${psql_args[@]}" <<'SQL' | tee -a "${audit_file}"
          BEGIN READ ONLY;
          SET LOCAL statement_timeout = '30s';

          \echo '## supabase_migrations.schema_migrations'
          select *
          from supabase_migrations.schema_migrations
          order by version;

          \echo '## public tables'
          select table_name
          from information_schema.tables
          where table_schema = 'public'
            and table_type = 'BASE TABLE'
          order by table_name;

          \echo '## public views'
          select table_name
          from information_schema.views
          where table_schema = 'public'
          order by table_name;

          \echo '## public functions'
          select p.oid::regprocedure::text as function_signature
          from pg_proc p
          join pg_namespace n on n.oid = p.pronamespace
          where n.nspname = 'public'
          order by function_signature;

          \echo '## public table RLS'
          select c.relname as table_name, c.relrowsecurity as rls_enabled
          from pg_class c
          join pg_namespace n on n.oid = c.relnamespace
          where n.nspname = 'public'
            and c.relkind = 'r'
          order by c.relname;

          \echo '## public policies'
          select schemaname, tablename, policyname
          from pg_policies
          where schemaname = 'public'
          order by tablename, policyname;

          \echo '## storage.buckets presence'
          select to_regclass('storage.buckets') as storage_buckets_regclass;

          COMMIT;
          SQL

          if [ "$(psql "${psql_args[@]}" -Atqc "select to_regclass('storage.buckets') is not null")" = "t" ]; then
            psql "${psql_args[@]}" <<'SQL' | tee -a "${audit_file}"
          BEGIN READ ONLY;
          SET LOCAL statement_timeout = '30s';

          \echo '## storage buckets'
          select id, name, public
          from storage.buckets
          order by name;

          COMMIT;
          SQL
          else
            {
              echo "## storage buckets"
              echo "storage.buckets does not exist."
            } | tee -a "${audit_file}"
          fi

      - name: Upload PROD read-only audit artifact
        if: ${{ inputs.confirm_mode == 'audit-readonly' }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-prod-readonly-audit
          path: supabase-prod-readonly-audit.txt
          if-no-files-found: error

      - name: Summarize release gate
        if: always()
        run: |
          {
            echo "## Supabase PROD CLI release gate"
            echo ""
            echo "- Environment: supabase-production"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Mode: ${CONFIRM_MODE}"
            echo "- Real db push: not executed by this workflow"
            echo "- Migration repair: not executed by this workflow"
            echo "- n8n: not touched by this workflow"
          } >> "${GITHUB_STEP_SUMMARY}"
