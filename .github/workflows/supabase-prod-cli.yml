name: Supabase PROD CLI

on:
  workflow_dispatch:
    inputs:
      confirm_prod:
        description: "Type the PROD Supabase project ref to confirm the target"
        required: true
        type: string
      confirm_mode:
        description: "Allowed: dry-run, repair_base_then_dry_run, or repair_legacy_then_dry_run"
        required: true
        default: "dry-run"
        type: string
      backup_confirmed:
        description: "Required true only for repair modes"
        required: false
        default: false
        type: boolean
      backup_reference:
        description: "Required for repair modes: date/time/responsible"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-prod-cli-${{ inputs.confirm_mode }}
  cancel-in-progress: false

jobs:
  prod_cli:
    name: Supabase PROD CLI guarded operation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_REF_PROD }}
      CONFIRM_PROD: ${{ inputs.confirm_prod }}
      CONFIRM_MODE: ${{ inputs.confirm_mode }}
      BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
      BACKUP_REFERENCE: ${{ inputs.backup_reference }}
      EVIDENCE_DIR: /tmp/supabase-prod-cli-evidence

    steps:
      - name: Validate release guardrails
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" != "dev" ]; then
            echo "::error::This workflow is restricted to the dev branch."
            exit 1
          fi

          if [ "${CONFIRM_MODE}" != "dry-run" ] && [ "${CONFIRM_MODE}" != "repair_base_then_dry_run" ] && [ "${CONFIRM_MODE}" != "repair_legacy_then_dry_run" ]; then
            echo "::error::confirm_mode must be exactly dry-run, repair_base_then_dry_run, or repair_legacy_then_dry_run."
            exit 1
          fi

          if [ -z "${SUPABASE_PROJECT_ID}" ]; then
            echo "::error::SUPABASE_PROJECT_REF_PROD environment variable is not configured."
            exit 1
          fi

          if [ "${CONFIRM_PROD}" != "${SUPABASE_PROJECT_ID}" ]; then
            echo "::error::confirm_prod does not match the configured PROD project ref."
            exit 1
          fi

          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not configured."
            exit 1
          fi

          if [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD_PROD secret is not configured."
            exit 1
          fi

          if [ "${CONFIRM_MODE}" = "repair_base_then_dry_run" ] || [ "${CONFIRM_MODE}" = "repair_legacy_then_dry_run" ]; then
            if [ "${BACKUP_CONFIRMED}" != "true" ]; then
              echo "::error::backup_confirmed must be true for repair modes."
              exit 1
            fi

            if [ -z "${BACKUP_REFERENCE}" ]; then
              echo "::error::backup_reference is required for repair modes."
              exit 1
            fi
          fi

          echo "Guardrails passed."

      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${EVIDENCE_DIR}"
          mkdir -p "${EVIDENCE_DIR}"
          {
            echo "# Supabase PROD CLI evidence"
            echo ""
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Mode: ${CONFIRM_MODE}"
            echo "- Project ref: ${SUPABASE_PROJECT_ID}"
            echo "- Backup confirmed: ${BACKUP_CONFIRMED}"
            echo "- Backup reference: ${BACKUP_REFERENCE}"
            echo "- Real db push: not executed by this workflow"
            echo "- n8n: not touched by this workflow"
            echo ""
          } > "${EVIDENCE_DIR}/summary.md"

          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain | tee "${EVIDENCE_DIR}/git-status.txt"
            echo "::error::Repository checkout is not clean."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2

      - name: Verify Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          supabase --version | tee "${EVIDENCE_DIR}/supabase-version.txt"
          supabase migration repair --help > "${EVIDENCE_DIR}/migration-repair-help.txt"
          grep -q -- "--status" "${EVIDENCE_DIR}/migration-repair-help.txt"
          grep -q -- "applied" "${EVIDENCE_DIR}/migration-repair-help.txt"

      - name: Show migration files in release branch
        shell: bash
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name "*.sql" | sort | tee "${EVIDENCE_DIR}/migration-files.txt"

      - name: Link Supabase PROD project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "${SUPABASE_PROJECT_ID}"

          LINKED_REF="$(cat supabase/.temp/project-ref 2>/dev/null || true)"
          if [ "${LINKED_REF}" != "${SUPABASE_PROJECT_ID}" ]; then
            echo "::error::Linked project ref does not match PROD project ref."
            exit 1
          fi

          echo "${LINKED_REF}" > "${EVIDENCE_DIR}/linked-project-ref.txt"

      - name: Migration list before
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked | tee "${EVIDENCE_DIR}/migration-list-before.txt"

      - name: Repair base migration history
        if: ${{ inputs.confirm_mode == 'repair_base_then_dry_run' }}
        shell: bash
        run: |
          set -euo pipefail
          repair_versions=(
            00101 00102 00103 00104 00105 00106 00107 00108 00109 00110
            00301 00302 00303 00304 00305 00306 00307
          )
          forbidden_versions=(00401 00402 00403 007 008)

          printf "%s\n" "${repair_versions[@]}" > "${EVIDENCE_DIR}/repair-versions.txt"
          printf "%s\n" "${forbidden_versions[@]}" > "${EVIDENCE_DIR}/not-repaired-versions.txt"

          for version in "${repair_versions[@]}"; do
            echo "Repairing migration history version ${version} as applied" | tee -a "${EVIDENCE_DIR}/repair-results.txt"
            supabase migration repair "${version}" --status applied --linked --yes 2>&1 | tee -a "${EVIDENCE_DIR}/repair-results.txt"
          done

      - name: Repair legacy migration history
        if: ${{ inputs.confirm_mode == 'repair_legacy_then_dry_run' }}
        shell: bash
        run: |
          set -euo pipefail
          repair_versions=(001 002 003)
          forbidden_versions=(004 005 006 00401 00402 00403 007 008)

          printf "%s\n" "${repair_versions[@]}" > "${EVIDENCE_DIR}/repair-versions.txt"
          printf "%s\n" "${forbidden_versions[@]}" > "${EVIDENCE_DIR}/not-repaired-versions.txt"

          for version in "${repair_versions[@]}"; do
            echo "Repairing migration history version ${version} as applied" | tee -a "${EVIDENCE_DIR}/repair-results.txt"
            supabase migration repair "${version}" --status applied --linked --yes 2>&1 | tee -a "${EVIDENCE_DIR}/repair-results.txt"
          done

      - name: Migration list after
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked | tee "${EVIDENCE_DIR}/migration-list-after.txt"

      - name: Validate repair scope
        if: ${{ inputs.confirm_mode == 'repair_base_then_dry_run' }}
        shell: bash
        run: |
          set -euo pipefail
          repaired_versions=(
            00101 00102 00103 00104 00105 00106 00107 00108 00109 00110
            00301 00302 00303 00304 00305 00306 00307
          )
          forbidden_versions=(00401 00402 00403 007 008)

          for version in "${repaired_versions[@]}"; do
            line="$(grep -E "^[[:space:]]*${version}([^0-9]|$)" "${EVIDENCE_DIR}/migration-list-after.txt" || true)"
            if ! printf "%s\n" "${line}" | grep -Eq "${version}[^0-9].*${version}([^0-9]|$)"; then
              echo "::error::Expected version ${version} to appear as applied in linked migration list."
              exit 1
            fi
          done

          for version in "${forbidden_versions[@]}"; do
            line="$(grep -E "^[[:space:]]*${version}([^0-9]|$)" "${EVIDENCE_DIR}/migration-list-after.txt" || true)"
            if printf "%s\n" "${line}" | grep -Eq "${version}[^0-9].*${version}([^0-9]|$)"; then
              echo "::error::Version ${version} appears as applied but must not be repaired by this workflow."
              exit 1
            fi
          done

          echo "Repair scope validation passed." | tee "${EVIDENCE_DIR}/repair-scope-validation.txt"

      - name: Validate legacy repair scope
        if: ${{ inputs.confirm_mode == 'repair_legacy_then_dry_run' }}
        shell: bash
        run: |
          set -euo pipefail
          repaired_versions=(001 002 003)
          forbidden_versions=(004 005 006 00401 00402 00403 007 008)

          remote_for_version() {
            local version="$1"
            local file_path="$2"
            awk -v version="${version}" '
              {
                parts_count = split($0, cols, /[|│]/)
                if (parts_count >= 2) {
                  local_version=cols[1]
                  remote_version=cols[2]
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", local_version)
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", remote_version)
                  if (local_version == version || remote_version == version) {
                    print remote_version
                    found=1
                    exit
                  }
                }
              }
              END { if (!found) exit 2 }
            ' "${file_path}"
          }

          for version in "${repaired_versions[@]}"; do
            remote_after="$(remote_for_version "${version}" "${EVIDENCE_DIR}/migration-list-after.txt" || true)"
            if [ "${remote_after}" != "${version}" ]; then
              echo "::error::Expected legacy version ${version} to appear as applied in linked migration list."
              exit 1
            fi
          done

          for version in "${forbidden_versions[@]}"; do
            remote_before="$(remote_for_version "${version}" "${EVIDENCE_DIR}/migration-list-before.txt" || true)"
            remote_after="$(remote_for_version "${version}" "${EVIDENCE_DIR}/migration-list-after.txt" || true)"
            if [ "${remote_before}" != "${remote_after}" ]; then
              echo "::error::Version ${version} changed during legacy repair but must not be repaired by this workflow."
              exit 1
            fi
          done

          echo "Legacy repair scope validation passed." | tee "${EVIDENCE_DIR}/repair-scope-validation.txt"

      - name: Dry-run Supabase PROD migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run 2>&1 | tee "${EVIDENCE_DIR}/db-push-dry-run.txt"

      - name: Sanitize evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "${EVIDENCE_DIR}" ]; then
            find "${EVIDENCE_DIR}" -type f -print0 | xargs -0 sed -i -E \
              -e 's#postgres(ql)?://[^[:space:]]+#postgresql://[REDACTED]#g' \
              -e 's#(password=)[^[:space:]]+#\1[REDACTED]#gi' \
              -e 's#(SUPABASE_ACCESS_TOKEN=)[^[:space:]]+#\1[REDACTED]#g' \
              -e 's#(SUPABASE_DB_PASSWORD=)[^[:space:]]+#\1[REDACTED]#g' \
              -e 's#sbp_[A-Za-z0-9_-]+#sbp_[REDACTED]#g' \
              -e 's#eyJ[A-Za-z0-9._-]+#jwt_[REDACTED]#g'
          fi

      - name: Upload legacy repair dry-run evidence artifact
        if: ${{ always() && inputs.confirm_mode == 'repair_legacy_then_dry_run' }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-prod-repair-legacy-dry-run-evidence
          path: /tmp/supabase-prod-cli-evidence/
          if-no-files-found: warn

      - name: Upload evidence artifact
        if: ${{ always() && inputs.confirm_mode != 'repair_legacy_then_dry_run' }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-prod-repair-base-dry-run-evidence
          path: /tmp/supabase-prod-cli-evidence/
          if-no-files-found: warn

      - name: Summarize operation
        if: always()
        shell: bash
        run: |
          {
            echo "## Supabase PROD CLI guarded operation"
            echo ""
            echo "- Environment: supabase-production"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Mode: ${CONFIRM_MODE}"
            echo "- Real db push: not executed by this workflow"
            echo "- Migration repair scope: only 00101-00110 and 00301-00307 when mode is repair_base_then_dry_run"
            echo "- Migration repair scope: only 001, 002, and 003 when mode is repair_legacy_then_dry_run"
            echo "- Forbidden repair versions for legacy mode: 004, 005, 006, 00401, 00402, 00403, 007, 008"
            echo "- n8n: not touched by this workflow"
            if [ "${CONFIRM_MODE}" = "repair_legacy_then_dry_run" ]; then
              echo "- Evidence artifact: supabase-prod-repair-legacy-dry-run-evidence"
            else
              echo "- Evidence artifact: supabase-prod-repair-base-dry-run-evidence"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
