name: Supabase DEV Notification Dispatcher Smoke Test

on:
  workflow_dispatch:
    inputs:
      confirm_dev:
        description: "Type the DEV project ref"
        required: true
        type: string
      confirm_mode:
        description: "Type configure_receipt_linked_primary_uat"
        required: true
        type: string
      confirm_folio:
        description: "Type SOL-2026-0103"
        required: true
        type: string
      confirm_cutoff:
        description: "Type the fixed UAT cutoff"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: receipt-linked-primary-uat-dev
  cancel-in-progress: false

jobs:
  configure_primary_uat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: DEV
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      NOTIFICATION_DISPATCHER_SECRET: ${{ secrets.NOTIFICATION_DISPATCHER_SECRET }}
      SUPABASE_PROJECT_ID: scsirgbuqjcwoaxfacth
      FUNCTION_URL: https://scsirgbuqjcwoaxfacth.functions.supabase.co/notification-dispatcher
      FIXED_CUTOFF: "2026-08-06T22:20:06.678661Z"
      EXPECTED_BRANCH: feature/ramon-notifications-receipt-linked
    steps:
      - name: Validate immutable DEV guardrails
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "${{ inputs.confirm_dev }}" = "${SUPABASE_PROJECT_ID}"
          test "${{ inputs.confirm_mode }}" = "configure_receipt_linked_primary_uat"
          test "${{ inputs.confirm_folio }}" = "SOL-2026-0103"
          test "${{ inputs.confirm_cutoff }}" = "${FIXED_CUTOFF}"
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_DEV_DB_URL}"
          test -n "${NOTIFICATION_DISPATCHER_SECRET}"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null

      - name: Force DEV dispatcher test-only mode
        shell: bash
        run: |
          set -euo pipefail
          secret_file="${RUNNER_TEMP}/receipt-linked-primary.env"
          umask 077
          {
            echo "NOTIFICATION_SEND_MODE=test_only"
            printf 'NOTIFICATION_DISPATCHER_SECRET=%s\n' "${NOTIFICATION_DISPATCHER_SECRET}"
          } > "${secret_file}"
          supabase secrets set             --project-ref "${SUPABASE_PROJECT_ID}"             --env-file "${secret_file}" >/dev/null
          rm -f "${secret_file}"
          echo "runtime_mode=test_only"
          echo "dispatcher_secret=present"

      - name: Provision enabled primary wake-up in DEV Vault
        shell: bash
        run: |
          set -euo pipefail
          export DISPATCHER_URL="${FUNCTION_URL}"
          export DISPATCHER_CUTOFF="${FIXED_CUTOFF}"
          psql "${SUPABASE_DEV_DB_URL}" -v ON_ERROR_STOP=1 -AtX >/dev/null <<'SQL'
          \getenv dispatcher_url DISPATCHER_URL
          \getenv dispatcher_secret NOTIFICATION_DISPATCHER_SECRET
          \getenv dispatcher_cutoff DISPATCHER_CUTOFF
          begin;
          do $guard$
          begin
            if (
              select count(*)
              from vault.secrets
              where name in (
                'notification_dispatcher_url',
                'notification_dispatcher_secret',
                'notification_dispatcher_cutoff_at',
                'notification_receipt_linked_immediate_enabled'
              )
            ) <> 0 then
              raise exception 'unexpected_existing_receipt_linked_vault_config';
            end if;
          end
          $guard$;
          select vault.create_secret(
            :'dispatcher_url',
            'notification_dispatcher_url',
            'DEV-only PR322 primary UAT'
          );
          select vault.create_secret(
            :'dispatcher_secret',
            'notification_dispatcher_secret',
            'DEV-only PR322 primary UAT'
          );
          select vault.create_secret(
            :'dispatcher_cutoff',
            'notification_dispatcher_cutoff_at',
            'DEV-only PR322 primary UAT'
          );
          select vault.create_secret(
            'true',
            'notification_receipt_linked_immediate_enabled',
            'DEV-only PR322 primary UAT'
          );
          commit;
          SQL

          postcheck="$(psql "${SUPABASE_DEV_DB_URL}" -v ON_ERROR_STOP=1 -AtX <<'SQL'
          select count(*)
          from vault.decrypted_secrets
          where (
            name='notification_dispatcher_url'
            and decrypted_secret='https://scsirgbuqjcwoaxfacth.functions.supabase.co/notification-dispatcher'
          ) or (
            name='notification_dispatcher_secret'
            and nullif(decrypted_secret,'') is not null
          ) or (
            name='notification_dispatcher_cutoff_at'
            and decrypted_secret='2026-08-06T22:20:06.678661Z'
          ) or (
            name='notification_receipt_linked_immediate_enabled'
            and lower(decrypted_secret)='true'
          );
          SQL
          )"
          test "${postcheck}" = "4"
          echo "vault_contract=4/4"
          echo "primary_wakeup=enabled"
          echo "target=DEV"
          echo "prod_mutations=0"
