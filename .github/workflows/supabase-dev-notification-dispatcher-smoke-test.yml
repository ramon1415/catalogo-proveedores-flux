name: TEMP - Receipt Linked DEV UAT

on:
  workflow_dispatch:
    inputs:
      confirm_dev:
        description: "Type the DEV Supabase project ref"
        required: true
        type: string
      confirm_mode:
        description: "Type receipt_linked_dev_uat_test_only"
        required: true
        type: string
      confirm_function:
        description: "Type notification-dispatcher"
        required: true
        type: string
      confirm_branch:
        description: "Type feature/ramon-notifications-receipt-linked"
        required: true
        type: string
      confirm_limit:
        description: "Type 2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: temp-receipt-linked-dev-uat
  cancel-in-progress: false

jobs:
  receipt_linked_dev_uat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: DEV
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      NOTIFICATION_DISPATCHER_SECRET: ${{ secrets.NOTIFICATION_DISPATCHER_SECRET }}
      PROJECT_REF: scsirgbuqjcwoaxfacth
      FUNCTION_URL: https://scsirgbuqjcwoaxfacth.functions.supabase.co/notification-dispatcher
      CUTOFF: "2026-08-06T19:21:53.377490Z"
      SOURCE_FOLIO: "SOL-2026-0102"
      EXPECTED_SHA256: "5c07ed950c4fc8c64b59e4f9a9d5c858a32a4aea5a0412deb920c6a71abe6a53"
      EXPECTED_SIZE: "6281"

    steps:
      - name: Validate immutable DEV guardrails
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feature/ramon-notifications-receipt-linked"
          test "${{ inputs.confirm_branch }}" = "feature/ramon-notifications-receipt-linked"
          test "${{ inputs.confirm_dev }}" = "${PROJECT_REF}"
          test "${{ inputs.confirm_mode }}" = "receipt_linked_dev_uat_test_only"
          test "${{ inputs.confirm_function }}" = "notification-dispatcher"
          test "${{ inputs.confirm_limit }}" = "2"
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_DEV_DB_URL}"
          test -n "${NOTIFICATION_DISPATCHER_SECRET}"
          echo "::add-mask::${SUPABASE_ACCESS_TOKEN}"
          echo "::add-mask::${SUPABASE_DEV_DB_URL}"
          echo "::add-mask::${NOTIFICATION_DISPATCHER_SECRET}"
          echo "guardrails=pass"
          echo "target=DEV"
          echo "production_touched=no"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -y >/dev/null
            sudo apt-get install -y postgresql-client >/dev/null
          fi
          psql --version

      - name: Force test-only mode without rotating other secrets
        shell: bash
        run: |
          set -euo pipefail
          secret_file="${RUNNER_TEMP}/receipt-linked-mode.env"
          umask 077
          printf '%s\n' 'NOTIFICATION_SEND_MODE=test_only' > "${secret_file}"
          supabase secrets set --project-ref "${PROJECT_REF}" --env-file "${secret_file}" >/dev/null
          rm -f "${secret_file}"
          echo "notification_send_mode=test_only"

      - name: Revalidate exact cutoff contract
        shell: bash
        run: |
          set -euo pipefail
          IFS='|' read -r total eligible pending folio_match attempts historical <<EOF
          $(psql "${SUPABASE_DEV_DB_URL}" -v ON_ERROR_STOP=1 -AtX -F '|' <<SQL
          select
            (select count(*) from public.notification_events
              where event_type = 'payment_receipt.linked'),
            (select count(*) from public.notification_events
              where event_type = 'payment_receipt.linked'
                and created_at >= '${CUTOFF}'::timestamptz),
            (select count(*) from public.notification_events
              where event_type = 'payment_receipt.linked'
                and created_at >= '${CUTOFF}'::timestamptz
                and status = 'pending'),
            (select count(*) from public.notification_events
              where event_type = 'payment_receipt.linked'
                and created_at >= '${CUTOFF}'::timestamptz
                and source_folio = '${SOURCE_FOLIO}'),
            (select count(*) from public.notification_delivery_attempts a
              join public.notification_events e on e.id = a.notification_event_id
              where e.event_type = 'payment_receipt.linked'
                and e.created_at >= '${CUTOFF}'::timestamptz),
            (select count(*) from public.notification_events
              where event_type = 'payment_receipt.linked'
                and created_at < '${CUTOFF}'::timestamptz);
          SQL
          )
          EOF
          printf 'total=%s eligible=%s pending=%s folio_match=%s attempts=%s historical=%s\n' \
            "${total}" "${eligible}" "${pending}" "${folio_match}" "${attempts}" "${historical}"
          test "${total}" = "2"
          test "${eligible}" = "2"
          test "${pending}" = "2"
          test "${folio_match}" = "2"
          test "${attempts}" = "0"
          test "${historical}" = "0"

      - name: Invoke dispatcher exactly once
        shell: bash
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/receipt-linked-dispatch.json"
          http_code="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --request POST "${FUNCTION_URL}" \
            --header 'Content-Type: application/json' \
            --header "x-notification-dispatcher-secret: ${NOTIFICATION_DISPATCHER_SECRET}" \
            --data '{"event_types":["payment_receipt.linked"],"created_at_from":"2026-08-06T19:21:53.377490Z","limit":2}')"
          test "${http_code}" -ge 200
          test "${http_code}" -lt 300
          RESPONSE_FILE="${response_file}" EXPECTED_SHA256="${EXPECTED_SHA256}" EXPECTED_SIZE="${EXPECTED_SIZE}" SOURCE_FOLIO="${SOURCE_FOLIO}" python3 - <<'PY'
          import json, os, sys
          with open(os.environ["RESPONSE_FILE"], encoding="utf-8") as fh:
              data = json.load(fh)
          events = data.get("events") if isinstance(data.get("events"), list) else []
          ok = (
              data.get("processed") == 2
              and data.get("sent") == 2
              and data.get("failed") == 0
              and data.get("mode") == "test_only"
              and len(events) == 2
          )
          finals = []
          safe_events = []
          for event in events:
              event_ok = (
                  event.get("event_type") == "payment_receipt.linked"
                  and event.get("source_folio") == os.environ["SOURCE_FOLIO"]
                  and event.get("status") == "sent"
                  and bool(event.get("provider_message_id"))
                  and event.get("attachment_sha256") == os.environ["EXPECTED_SHA256"]
                  and int(event.get("attachment_size_bytes") or -1) == int(os.environ["EXPECTED_SIZE"])
              )
              ok = ok and event_ok
              finals.append(event.get("final_recipient_email"))
              safe_events.append({
                  "event_type": event.get("event_type"),
                  "source_folio": event.get("source_folio"),
                  "status": event.get("status"),
                  "provider_message_id_present": bool(event.get("provider_message_id")),
                  "attachment_sha256": event.get("attachment_sha256"),
                  "attachment_size_bytes": event.get("attachment_size_bytes"),
                  "intended_recipient_masked": event.get("intended_recipient_email"),
                  "final_recipient_masked": event.get("final_recipient_email"),
              })
          ok = ok and len(finals) == 2 and bool(finals[0]) and finals[0] == finals[1]
          print(json.dumps({
              "processed": data.get("processed"),
              "sent": data.get("sent"),
              "failed": data.get("failed"),
              "mode": data.get("mode"),
              "single_test_sink": len(finals) == 2 and bool(finals[0]) and finals[0] == finals[1],
              "events": safe_events,
          }, sort_keys=True))
          try:
              os.remove(os.environ["RESPONSE_FILE"])
          except FileNotFoundError:
              pass
          sys.exit(0 if ok else 1)
          PY

      - name: Reconcile append-only database evidence
        shell: bash
        run: |
          set -euo pipefail
          IFS='|' read -r sent pending attempts provider_ids historical <<EOF
          $(psql "${SUPABASE_DEV_DB_URL}" -v ON_ERROR_STOP=1 -AtX -F '|' <<SQL
          select
            (select count(*) from public.notification_events
              where event_type = 'payment_receipt.linked'
                and created_at >= '${CUTOFF}'::timestamptz
                and source_folio = '${SOURCE_FOLIO}'
                and status = 'sent'),
            (select count(*) from public.notification_events
              where event_type = 'payment_receipt.linked'
                and created_at >= '${CUTOFF}'::timestamptz
                and status = 'pending'),
            (select count(*) from public.notification_delivery_attempts a
              join public.notification_events e on e.id = a.notification_event_id
              where e.event_type = 'payment_receipt.linked'
                and e.created_at >= '${CUTOFF}'::timestamptz
                and e.source_folio = '${SOURCE_FOLIO}'),
            (select count(*) from public.notification_delivery_attempts a
              join public.notification_events e on e.id = a.notification_event_id
              where e.event_type = 'payment_receipt.linked'
                and e.created_at >= '${CUTOFF}'::timestamptz
                and e.source_folio = '${SOURCE_FOLIO}'
                and a.status = 'sent'
                and nullif(trim(coalesce(a.provider_message_id, '')), '') is not null),
            (select count(*) from public.notification_events
              where event_type = 'payment_receipt.linked'
                and created_at < '${CUTOFF}'::timestamptz);
          SQL
          )
          EOF
          printf 'sent=%s pending=%s attempts=%s provider_message_ids=%s historical=%s\n' \
            "${sent}" "${pending}" "${attempts}" "${provider_ids}" "${historical}"
          test "${sent}" = "2"
          test "${pending}" = "0"
          test "${attempts}" = "2"
          test "${provider_ids}" = "2"
          test "${historical}" = "0"
          echo "historical_events_claimed=0"
          echo "real_emails=0"
          echo "production_touched=no"
