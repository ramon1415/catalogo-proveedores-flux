name: Supabase DEV Notification Dispatcher Smoke Test

on:
  workflow_dispatch:
    inputs:
      confirm_dev:
        description: "Type the DEV Supabase project ref to confirm the target"
        required: true
        type: string
      confirm_mode:
        description: "Type smoke_notification_dispatcher_dev_test_only"
        required: true
        default: "smoke_notification_dispatcher_dev_test_only"
        type: string
      confirm_function:
        description: "Type notification-dispatcher"
        required: true
        default: "notification-dispatcher"
        type: string
      confirm_branch:
        description: "Type dev"
        required: true
        default: "dev"
        type: string
      confirm_limit:
        description: "Type 1"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-dev-notification-dispatcher-smoke-test
  cancel-in-progress: false

jobs:
  smoke_notification_dispatcher:
    if: ${{ inputs.confirm_mode == 'smoke_notification_dispatcher_dev_test_only' }}
    name: Smoke test notification-dispatcher in Supabase DEV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: DEV

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      NOTIFICATION_DISPATCHER_SECRET: ${{ secrets.NOTIFICATION_DISPATCHER_SECRET }}
      SUPABASE_PROJECT_ID: scsirgbuqjcwoaxfacth
      FUNCTION_NAME: notification-dispatcher
      FUNCTION_URL: https://scsirgbuqjcwoaxfacth.functions.supabase.co/notification-dispatcher
      CONFIRM_DEV: ${{ inputs.confirm_dev }}
      CONFIRM_MODE: ${{ inputs.confirm_mode }}
      CONFIRM_FUNCTION: ${{ inputs.confirm_function }}
      CONFIRM_BRANCH: ${{ inputs.confirm_branch }}
      CONFIRM_LIMIT: ${{ inputs.confirm_limit }}
      EVIDENCE_DIR: /tmp/supabase-dev-notification-dispatcher-smoke-evidence

    steps:
      - name: Validate DEV smoke guardrails
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" != "dev" ]; then
            echo "::error::This smoke test is restricted to the dev branch."
            exit 1
          fi

          if [ "${CONFIRM_BRANCH}" != "dev" ]; then
            echo "::error::confirm_branch must be exactly dev."
            exit 1
          fi

          if [ "${CONFIRM_DEV}" != "${SUPABASE_PROJECT_ID}" ]; then
            echo "::error::confirm_dev does not match the configured DEV project ref."
            exit 1
          fi

          if [ "${CONFIRM_MODE}" != "smoke_notification_dispatcher_dev_test_only" ]; then
            echo "::error::confirm_mode must be exactly smoke_notification_dispatcher_dev_test_only."
            exit 1
          fi

          if [ "${CONFIRM_FUNCTION}" != "${FUNCTION_NAME}" ]; then
            echo "::error::confirm_function must be exactly ${FUNCTION_NAME}."
            exit 1
          fi

          if [ "${CONFIRM_LIMIT}" != "1" ]; then
            echo "::error::confirm_limit must be exactly 1."
            exit 1
          fi

          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured in environment DEV."
            exit 1
          fi

          if [ -z "${SUPABASE_DEV_DB_URL}" ]; then
            echo "::error::SUPABASE_DEV_DB_URL is not configured in environment DEV."
            exit 1
          fi

          if [ -z "${NOTIFICATION_DISPATCHER_SECRET}" ]; then
            echo "::error::NOTIFICATION_DISPATCHER_SECRET is not configured in environment DEV."
            exit 1
          fi

      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false

      - name: Initialize smoke evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${EVIDENCE_DIR}"
          mkdir -p "${EVIDENCE_DIR}"
          {
            echo "# Supabase DEV notification-dispatcher smoke evidence"
            echo ""
            echo "- Timestamp UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Mode: ${CONFIRM_MODE}"
            echo "- Function: ${FUNCTION_NAME}"
            echo "- Project ref: ${SUPABASE_PROJECT_ID}"
            echo "- Limit: ${CONFIRM_LIMIT}"
            echo "- Environment: DEV"
            echo "- PROD: not touched by this workflow"
            echo "- n8n: not touched by this workflow"
            echo "- Cron/webhook: not touched by this workflow"
            echo "- Secrets: values are not printed by this workflow"
            echo ""
          } > "${EVIDENCE_DIR}/summary.md"

          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain | tee "${EVIDENCE_DIR}/git-status.txt"
            echo "::error::Repository checkout is not clean."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          psql --version | tee "${EVIDENCE_DIR}/psql-version.txt"

      - name: Force DEV runtime smoke mode and validate secrets
        shell: bash
        run: |
          set -euo pipefail
          supabase --version | tee "${EVIDENCE_DIR}/supabase-version.txt"

          secrets_file="${RUNNER_TEMP}/notification-dispatcher-smoke.env"
          umask 077
          {
            echo "NOTIFICATION_SEND_MODE=test_only"
            printf 'NOTIFICATION_DISPATCHER_SECRET=%s\n' "${NOTIFICATION_DISPATCHER_SECRET}"
          } > "${secrets_file}"

          if ! supabase secrets set --project-ref "${SUPABASE_PROJECT_ID}" --env-file "${secrets_file}" >/dev/null 2>"${RUNNER_TEMP}/supabase-secrets-set.err"; then
            rm -f "${secrets_file}"
            echo "supabase_secrets_set=failed" > "${EVIDENCE_DIR}/runtime-secret-update.txt"
            echo "::error::Could not configure DEV runtime secrets for smoke test."
            exit 1
          fi
          rm -f "${secrets_file}"
          echo "supabase_secrets_set=ok" > "${EVIDENCE_DIR}/runtime-secret-update.txt"
          echo "NOTIFICATION_SEND_MODE=test_only" >> "${EVIDENCE_DIR}/runtime-secret-update.txt"
          echo "NOTIFICATION_DISPATCHER_SECRET=updated_from_github_environment_secret" >> "${EVIDENCE_DIR}/runtime-secret-update.txt"

          secret_list="$(supabase secrets list --project-ref "${SUPABASE_PROJECT_ID}" 2>/dev/null || true)"
          if [ -z "${secret_list}" ]; then
            echo "::error::Could not list Supabase DEV runtime secret names."
            exit 1
          fi

          : > "${EVIDENCE_DIR}/runtime-secrets-status.txt"
          require_secret() {
            local name="$1"
            if printf '%s\n' "${secret_list}" | grep -Eq "(^|[[:space:]])${name}([[:space:]]|$)"; then
              echo "${name}=present" >> "${EVIDENCE_DIR}/runtime-secrets-status.txt"
            else
              echo "${name}=missing" >> "${EVIDENCE_DIR}/runtime-secrets-status.txt"
              echo "::error::Missing Supabase DEV runtime secret: ${name}"
              exit 1
            fi
          }

          require_any_secret() {
            local label="$1"
            shift
            local found="missing"
            for name in "$@"; do
              if printf '%s\n' "${secret_list}" | grep -Eq "(^|[[:space:]])${name}([[:space:]]|$)"; then
                found="present:${name}"
                break
              fi
            done
            echo "${label}=${found}" >> "${EVIDENCE_DIR}/runtime-secrets-status.txt"
            if [ "${found}" = "missing" ]; then
              echo "::error::Missing Supabase DEV runtime secret group: ${label}"
              exit 1
            fi
          }

          require_secret "NOTIFICATION_DISPATCHER_SECRET"
          require_secret "NOTIFICATION_SEND_MODE"
          require_secret "NOTIFICATION_TEST_EMAIL"
          require_secret "RESEND_API_KEY"
          require_secret "NOTIFICATION_FROM_EMAIL"
          require_any_secret "SUPABASE_URL_OR_FALLBACK" "SUPABASE_URL" "SUPABASEURL"
          require_any_secret "SUPABASE_SERVICE_ROLE_KEY_OR_FALLBACK" "SUPABASE_SERVICE_ROLE_KEY" "SUPABASESERVICEROLEKEY"

          if printf '%s\n' "${secret_list}" | grep -Eq "(^|[[:space:]])NOTIFICATION_WORKER_ID([[:space:]]|$)"; then
            echo "NOTIFICATION_WORKER_ID=present" >> "${EVIDENCE_DIR}/runtime-secrets-status.txt"
          else
            echo "NOTIFICATION_WORKER_ID=missing_optional" >> "${EVIDENCE_DIR}/runtime-secrets-status.txt"
          fi

      - name: Validate function deployment and database primitives
        shell: bash
        run: |
          set -euo pipefail

          functions_list="$(supabase functions list --project-ref "${SUPABASE_PROJECT_ID}" 2>/dev/null || true)"
          if ! printf '%s\n' "${functions_list}" | grep -q "${FUNCTION_NAME}"; then
            echo "function.${FUNCTION_NAME}=missing" > "${EVIDENCE_DIR}/function-status.txt"
            echo "::error::Supabase DEV Edge Function ${FUNCTION_NAME} was not found."
            exit 1
          fi
          echo "function.${FUNCTION_NAME}=present" > "${EVIDENCE_DIR}/function-status.txt"

          psql "${SUPABASE_DEV_DB_URL}" -v ON_ERROR_STOP=1 -AtX <<'SQL' > "${EVIDENCE_DIR}/db-preflight.txt"
          select 'table.notification_events=' || case when to_regclass('public.notification_events') is not null then 'present' else 'missing' end;
          select 'table.notification_delivery_attempts=' || case when to_regclass('public.notification_delivery_attempts') is not null then 'present' else 'missing' end;
          select 'rpc.claim_notification_events_for_dispatcher=' || case when to_regprocedure('public.claim_notification_events_for_dispatcher(integer,text)') is not null then 'present' else 'missing' end;
          select 'rpc.mark_notification_processed_for_dispatcher=' || case when to_regprocedure('public.mark_notification_processed_for_dispatcher(uuid,text,text,text)') is not null then 'present' else 'missing' end;
          select 'rpc.mark_notification_failed_for_dispatcher=' || case when to_regprocedure('public.mark_notification_failed_for_dispatcher(uuid,text,text,text)') is not null then 'present' else 'missing' end;
          SQL

          if grep -q '=missing' "${EVIDENCE_DIR}/db-preflight.txt"; then
            echo "::error::Missing notification table or dispatcher RPC in Supabase DEV."
            exit 1
          fi

      - name: Create one controlled smoke event only if queue is empty
        shell: bash
        run: |
          set -euo pipefail

          pending_count="$(psql "${SUPABASE_DEV_DB_URL}" -v ON_ERROR_STOP=1 -AtX <<'SQL'
          select count(*)
          from public.notification_events e
          where e.status in ('pending', 'failed')
            and coalesce(e.next_attempt_at, now()) <= now()
            and e.attempt_count < e.max_attempts
            and nullif(trim(coalesce(e.recipient_email, '')), '') is not null
            and coalesce(e.channel, 'email') = 'email';
          SQL
          )"

          echo "processable_pending_before=${pending_count}" > "${EVIDENCE_DIR}/queue-preflight.txt"
          if [ "${pending_count}" != "0" ]; then
            echo "::error::Supabase DEV has processable pending notifications. Smoke test stopped before inserting or invoking."
            exit 1
          fi

          idempotency_key="smoke-notification-dispatcher-dev-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source_folio="SMOKE-DEV-${GITHUB_RUN_ID}"

          event_id="$(psql "${SUPABASE_DEV_DB_URL}" -v ON_ERROR_STOP=1 -AtX \
            -v idempotency_key="${idempotency_key}" \
            -v source_folio="${source_folio}" <<'SQL'
          insert into public.notification_events (
            event_type,
            source_table,
            source_id,
            source_folio,
            recipient_type,
            recipient_profile_id,
            recipient_email,
            recipient_role,
            channel,
            priority,
            subject,
            payload,
            idempotency_key,
            status,
            attempt_count,
            max_attempts,
            next_attempt_at
          )
          values (
            'payment_request.created',
            'smoke_test',
            null,
            :'source_folio',
            'administrador_sistema',
            null,
            'smoke-notification-dispatcher-dev@example.invalid',
            'smoke_test',
            'email',
            'low',
            'Smoke test DEV notification dispatcher',
            jsonb_build_object(
              'folio', :'source_folio',
              'provider', 'Smoke Test',
              'amount', 1,
              'currency', 'MXN',
              'company', 'DEV Smoke Test',
              'status', 'smoke_test',
              'path', '/solicitudes.html',
              'smoke_test', true
            ),
            :'idempotency_key',
            'pending',
            0,
            1,
            now()
          )
          returning id;
          SQL
          )"

          {
            echo "event_id=${event_id}"
            echo "idempotency_key=${idempotency_key}"
            echo "event_type=payment_request.created"
            echo "status_initial=pending"
            echo "payload=sanitized_smoke_payload"
          } > "${EVIDENCE_DIR}/smoke-event-created.txt"

          echo "EVENT_ID=${event_id}" >> "${GITHUB_ENV}"
          echo "IDEMPOTENCY_KEY=${idempotency_key}" >> "${GITHUB_ENV}"

      - name: Invoke notification-dispatcher once
        shell: bash
        run: |
          set -euo pipefail

          response_file="${RUNNER_TEMP}/notification-dispatcher-response.json"
          http_code="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out "%{http_code}" \
            --request POST "${FUNCTION_URL}" \
            --header "Content-Type: application/json" \
            --header "x-notification-dispatcher-secret: ${NOTIFICATION_DISPATCHER_SECRET}" \
            --data '{"limit":1}')"

          echo "http_status=${http_code}" > "${EVIDENCE_DIR}/dispatch-http-status.txt"

          RESPONSE_FILE="${response_file}" OUTPUT_FILE="${EVIDENCE_DIR}/dispatch-response-sanitized.json" python3 - <<'PY'
          import json
          import os

          response_file = os.environ["RESPONSE_FILE"]
          output_file = os.environ["OUTPUT_FILE"]
          try:
              with open(response_file, "r", encoding="utf-8") as fh:
                  data = json.load(fh)
          except Exception as exc:
              data = {"parse_error": str(exc)[:120]}

          sanitized = {
              "processed": data.get("processed"),
              "sent": data.get("sent"),
              "failed": data.get("failed"),
              "skipped": data.get("skipped"),
              "mode": data.get("mode"),
              "error": str(data.get("error", ""))[:200] if data.get("error") else None,
              "events": [],
          }
          for event in data.get("events", []) if isinstance(data.get("events"), list) else []:
              sanitized["events"].append({
                  "event_id": event.get("event_id"),
                  "event_type": event.get("event_type"),
                  "source_folio": event.get("source_folio"),
                  "status": event.get("status"),
                  "provider_message_id_present": bool(event.get("provider_message_id")),
                  "error": str(event.get("error", ""))[:200] if event.get("error") else None,
              })
          with open(output_file, "w", encoding="utf-8") as fh:
              json.dump(sanitized, fh, indent=2, sort_keys=True)
          PY

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::notification-dispatcher returned HTTP ${http_code}."
            exit 1
          fi

      - name: Validate smoke event result
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${EVENT_ID:-}" ]; then
            echo "event_id=not_created" > "${EVIDENCE_DIR}/smoke-event-final.txt"
            exit 0
          fi

          psql "${SUPABASE_DEV_DB_URL}" -v ON_ERROR_STOP=1 -AtX -v event_id="${EVENT_ID}" <<'SQL' > "${EVIDENCE_DIR}/smoke-event-final.txt"
          select 'event_id=' || e.id::text
          from public.notification_events e
          where e.id = :'event_id'::uuid;

          select 'event_type=' || e.event_type
          from public.notification_events e
          where e.id = :'event_id'::uuid;

          select 'status_final=' || e.status
          from public.notification_events e
          where e.id = :'event_id'::uuid;

          select 'attempt_count=' || e.attempt_count::text
          from public.notification_events e
          where e.id = :'event_id'::uuid;

          select 'delivery_attempt_count=' || count(*)::text
          from public.notification_delivery_attempts a
          where a.notification_event_id = :'event_id'::uuid;

          select 'provider=resend';

          select 'provider_message_id_present=' || case when exists (
            select 1
            from public.notification_delivery_attempts a
            where a.notification_event_id = :'event_id'::uuid
              and nullif(trim(coalesce(a.provider_message_id, '')), '') is not null
          ) then 'yes' else 'no' end;

          select 'last_error_present=' || case when exists (
            select 1
            from public.notification_events e
            where e.id = :'event_id'::uuid
              and nullif(trim(coalesce(e.last_error, '')), '') is not null
          ) then 'yes' else 'no' end;
          SQL

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-dev-notification-dispatcher-smoke-evidence
          path: /tmp/supabase-dev-notification-dispatcher-smoke-evidence
          if-no-files-found: warn
          retention-days: 14

  configure_receipt_linked_primary:
    if: ${{ inputs.confirm_mode == 'configure_receipt_linked_primary_dev_test_only' }}
    name: Configure receipt-linked primary dispatch in Supabase DEV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: DEV

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      NOTIFICATION_DISPATCHER_SECRET: ${{ secrets.NOTIFICATION_DISPATCHER_SECRET }}
      SUPABASE_PROJECT_ID: scsirgbuqjcwoaxfacth
      FUNCTION_NAME: notification-dispatcher
      FUNCTION_URL: https://scsirgbuqjcwoaxfacth.supabase.co/functions/v1/notification-dispatcher
      CONFIRM_DEV: ${{ inputs.confirm_dev }}
      CONFIRM_MODE: ${{ inputs.confirm_mode }}
      CONFIRM_FUNCTION: ${{ inputs.confirm_function }}
      CONFIRM_BRANCH: ${{ inputs.confirm_branch }}
      CONFIRM_LIMIT: ${{ inputs.confirm_limit }}

    steps:
      - name: Validate temporary primary-path guardrails
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" = "feature/ramon-notifications-receipt-linked" ]]
          [[ "${CONFIRM_BRANCH}" = "feature/ramon-notifications-receipt-linked" ]]
          [[ "${CONFIRM_DEV}" = "${SUPABASE_PROJECT_ID}" ]]
          [[ "${CONFIRM_MODE}" = "configure_receipt_linked_primary_dev_test_only" ]]
          [[ "${CONFIRM_FUNCTION}" = "${FUNCTION_NAME}" ]]
          [[ "${CONFIRM_LIMIT}" = "0" ]]
          [[ "${FUNCTION_URL}" = "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/${FUNCTION_NAME}" ]]
          [[ -n "${SUPABASE_ACCESS_TOKEN}" ]]
          [[ -n "${SUPABASE_DEV_DB_URL}" ]]
          [[ -n "${NOTIFICATION_DISPATCHER_SECRET}" ]]
          echo "::add-mask::${SUPABASE_ACCESS_TOKEN}"
          echo "::add-mask::${SUPABASE_DEV_DB_URL}"
          echo "::add-mask::${NOTIFICATION_DISPATCHER_SECRET}"
          echo "target=DEV"
          echo "send_mode=test_only"
          echo "manual_dispatch=false"
          echo "prod_mutations=0"

      - name: Check out exact feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -y >/dev/null
            sudo apt-get install -y postgresql-client >/dev/null
          fi

      - name: Force test-only runtime and provision primary Vault contract
        shell: bash
        env:
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '20'
        run: |
          set -euo pipefail
          runtime_file="${RUNNER_TEMP}/receipt-linked-primary-runtime.env"
          umask 077
          {
            echo 'NOTIFICATION_SEND_MODE=test_only'
            printf 'NOTIFICATION_DISPATCHER_SECRET=%s\n' "${NOTIFICATION_DISPATCHER_SECRET}"
          } > "${runtime_file}"
          supabase secrets set \
            --project-ref "${SUPABASE_PROJECT_ID}" \
            --env-file "${runtime_file}" >/dev/null
          rm -f "${runtime_file}"

          cutoff="$(psql "${SUPABASE_DEV_DB_URL}" -X -Atq -v ON_ERROR_STOP=1 \
            -c "select to_char(clock_timestamp() at time zone 'UTC','YYYY-MM-DD\"T\"HH24:MI:SS.US\"Z\"')")"
          [[ "${cutoff}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]

          psql "${SUPABASE_DEV_DB_URL}" -X -v ON_ERROR_STOP=1 \
            -v dispatcher_url="${FUNCTION_URL}" \
            -v dispatcher_secret="${NOTIFICATION_DISPATCHER_SECRET}" \
            -v cutoff="${cutoff}" <<'SQL' >/dev/null
          begin;
          select set_config('uat.dispatcher_url', :'dispatcher_url', true);
          select set_config('uat.dispatcher_secret', :'dispatcher_secret', true);
          select set_config('uat.dispatcher_cutoff', :'cutoff', true);
          do $$
          declare
            v_id uuid;
          begin
            select id into v_id from vault.secrets where name='notification_dispatcher_url';
            if v_id is null then
              perform vault.create_secret(current_setting('uat.dispatcher_url'), 'notification_dispatcher_url', 'DEV receipt-linked dispatcher URL');
            else
              perform vault.update_secret(v_id, current_setting('uat.dispatcher_url'), 'notification_dispatcher_url', 'DEV receipt-linked dispatcher URL');
            end if;

            select id into v_id from vault.secrets where name='notification_dispatcher_secret';
            if v_id is null then
              perform vault.create_secret(current_setting('uat.dispatcher_secret'), 'notification_dispatcher_secret', 'DEV receipt-linked dispatcher credential');
            else
              perform vault.update_secret(v_id, current_setting('uat.dispatcher_secret'), 'notification_dispatcher_secret', 'DEV receipt-linked dispatcher credential');
            end if;

            select id into v_id from vault.secrets where name='notification_dispatcher_cutoff_at';
            if v_id is null then
              perform vault.create_secret(current_setting('uat.dispatcher_cutoff'), 'notification_dispatcher_cutoff_at', 'DEV receipt-linked UAT cutoff');
            else
              perform vault.update_secret(v_id, current_setting('uat.dispatcher_cutoff'), 'notification_dispatcher_cutoff_at', 'DEV receipt-linked UAT cutoff');
            end if;

            select id into v_id from vault.secrets where name='notification_receipt_linked_immediate_enabled';
            if v_id is null then
              perform vault.create_secret('true', 'notification_receipt_linked_immediate_enabled', 'DEV receipt-linked primary switch');
            else
              perform vault.update_secret(v_id, 'true', 'notification_receipt_linked_immediate_enabled', 'DEV receipt-linked primary switch');
            end if;
          end
          $$;
          commit;
          SQL

          row="$(psql "${SUPABASE_DEV_DB_URL}" -X -Atq -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          select
            (select count(*) from vault.decrypted_secrets where name=any(array[
              'notification_dispatcher_url',
              'notification_dispatcher_secret',
              'notification_dispatcher_cutoff_at',
              'notification_receipt_linked_immediate_enabled'
            ]::text[])),
            (select decrypted_secret='https://scsirgbuqjcwoaxfacth.supabase.co/functions/v1/notification-dispatcher' from vault.decrypted_secrets where name='notification_dispatcher_url'),
            (select decrypted_secret='true' from vault.decrypted_secrets where name='notification_receipt_linked_immediate_enabled'),
            exists(select 1 from pg_extension where extname='pg_net'),
            to_regprocedure('net.http_post(text,jsonb,jsonb,jsonb,integer)') is not null,
            exists(
              select 1 from pg_trigger
              where tgrelid='public.notification_events'::regclass
                and tgname='notification_receipt_linked_immediate_dispatch_after_insert'
                and not tgisinternal
            );
          SQL
          )"
          [[ "${row}" = '4|t|t|t|t|t' ]]
          echo "vault_contract=4_of_4"
          echo "endpoint=canonical_functions_v1"
          echo "primary_enabled=true"
          echo "pg_net=active"
          echo "trigger=active"
          echo "cutoff=${cutoff}"
          echo "dispatcher_invoked=0"
