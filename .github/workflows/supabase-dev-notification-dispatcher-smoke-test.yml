name: Supabase DEV Notification Dispatcher Smoke Test

on:
  workflow_dispatch:
    inputs:
      confirm_dev:
        description: "Type the DEV project ref"
        required: true
        type: string
      confirm_mode:
        description: "Type recover_receipt_linked_primary_uat"
        required: true
        type: string
      confirm_folio:
        description: "Type SOL-2026-0103"
        required: true
        type: string
      confirm_cutoff:
        description: "Type the fixed UAT cutoff"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: receipt-linked-primary-uat-dev
  cancel-in-progress: false

jobs:
  recover_primary_uat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: DEV
    env:
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      SUPABASE_PROJECT_ID: scsirgbuqjcwoaxfacth
      FUNCTION_URL: https://scsirgbuqjcwoaxfacth.supabase.co/functions/v1/notification-dispatcher
      FIXED_CUTOFF: "2026-08-06T22:20:06.678661Z"
      EXPECTED_BRANCH: feature/ramon-notifications-receipt-linked
      TARGET_FOLIO: SOL-2026-0103
    steps:
      - name: Validate immutable DEV guardrails
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "${{ inputs.confirm_dev }}" = "${SUPABASE_PROJECT_ID}"
          test "${{ inputs.confirm_mode }}" = "recover_receipt_linked_primary_uat"
          test "${{ inputs.confirm_folio }}" = "${TARGET_FOLIO}"
          test "${{ inputs.confirm_cutoff }}" = "${FIXED_CUTOFF}"
          test -n "${SUPABASE_DEV_DB_URL}"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null

      - name: Prove the failed primary left an exact recoverable queue
        shell: bash
        run: |
          set -euo pipefail
          read -r case_total case_pending case_attempts historical_eligible vault_count <<< "$(psql "${SUPABASE_DEV_DB_URL}" -v ON_ERROR_STOP=1 -AtX -F ' ' <<'SQL'
          select
            count(*) filter (
              where e.event_type='payment_receipt.linked'
                and e.source_folio='SOL-2026-0103'
            ),
            count(*) filter (
              where e.event_type='payment_receipt.linked'
                and e.source_folio='SOL-2026-0103'
                and e.status='pending'
            ),
            (
              select count(*)
              from public.notification_delivery_attempts a
              join public.notification_events n on n.id=a.notification_event_id
              where n.event_type='payment_receipt.linked'
                and n.source_folio='SOL-2026-0103'
            ),
            count(*) filter (
              where e.event_type='payment_receipt.linked'
                and e.created_at < '2026-08-06T22:20:06.678661Z'::timestamptz
                and e.status in ('pending','failed')
            ),
            (
              select count(*)
              from vault.decrypted_secrets
              where name in (
                'notification_dispatcher_url',
                'notification_dispatcher_secret',
                'notification_dispatcher_cutoff_at',
                'notification_receipt_linked_immediate_enabled'
              )
            )
          from public.notification_events e;
          SQL
          )"
          test "${case_total}" = "2"
          test "${case_pending}" = "2"
          test "${case_attempts}" = "0"
          test "${historical_eligible}" = "0"
          test "${vault_count}" = "4"
          echo "case_events=2"
          echo "case_pending=2"
          echo "case_attempts=0"
          echo "historical_eligible=0"

      - name: Correct DEV URL and enqueue one bounded recovery wake-up
        shell: bash
        run: |
          set -euo pipefail
          export DISPATCHER_URL="${FUNCTION_URL}"
          psql "${SUPABASE_DEV_DB_URL}" -v ON_ERROR_STOP=1 -AtX >/dev/null <<'SQL'
          \getenv dispatcher_url DISPATCHER_URL
          begin;
          select vault.update_secret(
            id,
            :'dispatcher_url',
            'notification_dispatcher_url',
            'DEV-only PR322 primary UAT'
          )
          from vault.secrets
          where name='notification_dispatcher_url';
          commit;

          select net.http_post(
            url := max(decrypted_secret) filter (
              where name='notification_dispatcher_url'
            ),
            body := jsonb_build_object(
              'event_types',jsonb_build_array('payment_receipt.linked'),
              'created_at_from',max(decrypted_secret) filter (
                where name='notification_dispatcher_cutoff_at'
              ),
              'limit',5
            ),
            headers := jsonb_build_object(
              'Content-Type','application/json',
              'x-notification-dispatcher-secret',max(decrypted_secret) filter (
                where name='notification_dispatcher_secret'
              )
            ),
            timeout_milliseconds := 2000
          )
          from vault.decrypted_secrets
          where name in (
            'notification_dispatcher_url',
            'notification_dispatcher_secret',
            'notification_dispatcher_cutoff_at'
          );
          SQL
          echo "recovery_wakeup=queued_once"
          echo "target=DEV"
          echo "prod_mutations=0"

      - name: Reconcile without blind retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            read -r sent failed pending attempts messages <<< "$(psql "${SUPABASE_DEV_DB_URL}" -v ON_ERROR_STOP=1 -AtX -F ' ' <<'SQL'
            select
              count(*) filter (where e.status='sent'),
              count(*) filter (where e.status='failed'),
              count(*) filter (where e.status='pending'),
              (
                select count(*)
                from public.notification_delivery_attempts a
                join public.notification_events n on n.id=a.notification_event_id
                where n.event_type='payment_receipt.linked'
                  and n.source_folio='SOL-2026-0103'
              ),
              (
                select count(*)
                from public.notification_delivery_attempts a
                join public.notification_events n on n.id=a.notification_event_id
                where n.event_type='payment_receipt.linked'
                  and n.source_folio='SOL-2026-0103'
                  and nullif(btrim(coalesce(a.provider_message_id,'')),'') is not null
              )
            from public.notification_events e
            where e.event_type='payment_receipt.linked'
              and e.source_folio='SOL-2026-0103';
            SQL
            )"
            if [ "${sent}" = "2" ] && [ "${failed}" = "0" ] && [ "${pending}" = "0" ] && [ "${attempts}" = "2" ] && [ "${messages}" = "2" ]; then
              echo "sent=2"
              echo "failed=0"
              echo "pending=0"
              echo "delivery_attempts=2"
              echo "provider_message_ids_present=2"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Recovery did not reach the exact terminal state."
          exit 1
