name: Apply Fersana request detail and document hotfix

on:
  push:
    branches:
      - hotfix/fersana-detail-request-documents-prod

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[request-doc-hotfix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply focused patch
        run: |
          python -m py_compile .github/scripts/apply_fersana_request_document_hotfix.py
          python .github/scripts/apply_fersana_request_document_hotfix.py

      - name: Install React dependencies
        run: npm --prefix app ci

      - name: Run focused and regression contracts
        run: >-
          node --test
          scripts/qa/fersana-request-document-hotfix.test.mjs
          scripts/qa/prod-reimbursement-permissions.test.mjs
          scripts/qa/prod-reimbursement-ux-hotfix.test.mjs
          scripts/qa/reimbursement-inline-classification-ux.test.mjs
          scripts/qa/fonacot-no-presupuestal-prod-contract.test.mjs
          scripts/qa/approval-batches-company-scope-contract.test.mjs
          scripts/qa/uniform-primary-table-scroll-contract.test.mjs

      - name: Build production artifact
        run: npm --prefix app run build

      - name: Commit validated hotfix
        shell: bash
        run: |
          git config user.name "ramon1415"
          git config user.email "ramon@quantta.mx"
          git rm -f \
            .github/workflows/apply-fersana-request-document-hotfix.yml \
            .github/scripts/apply_fersana_request_document_hotfix.py
          git add \
            app/src/features/solicitudes/DetailModal.tsx \
            app/src/features/solicitudes/RequestModal.tsx \
            app/src/features/solicitudes/EditModal.tsx \
            app/src/features/solicitudes/api.ts
          git commit -m "fix(solicitudes): ocultar incidencias Fersana y asegurar documentos [request-doc-hotfix]"
          git push origin HEAD:hotfix/fersana-detail-request-documents-prod
