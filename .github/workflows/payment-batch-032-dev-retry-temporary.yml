name: Payment batch 032 DEV audit (temporary)

on:
  push:
    branches:
      - ops/ramon-payment-batch-032-dev-retry
    paths:
      - .github/workflows/payment-batch-032-dev-retry-temporary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-existing-state:
    name: Audit existing DEV state (read-only)
    runs-on: ubuntu-latest
    environment: DEV
    env:
      SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4

      - name: Validate runner scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "ops/ramon-payment-batch-032-dev-retry"
          test "${SUPABASE_DEV_PROJECT_REF:?Missing DEV project ref}" = "scsirgbuqjcwoaxfacth"
          test -n "${SUPABASE_DEV_DB_URL:?Missing DEV database URL}"
          echo "Runner scope validated for the approved DEV project."

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Audit migration 032 object inventory (read-only)
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          export PGOPTIONS='-c default_transaction_read_only=on'
          audit_file="${RUNNER_TEMP}/payment-batch-032-audit.tsv"
          psql "${SUPABASE_DEV_DB_URL}" -X -v ON_ERROR_STOP=1 -qAt > "${audit_file}" <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          WITH expected(name) AS (VALUES
            ('payment_matching_policy_versions'), ('payable_snapshots'), ('payment_ingestion_batches'), ('payment_documents'),
            ('payment_document_extractions'), ('bank_payment_operations'), ('payment_operation_documents'), ('payment_allocation_plans'),
            ('payment_allocation_items'), ('payment_allocation_reservations'), ('payment_allocation_movements'), ('financial_command_receipts'),
            ('financial_outbox_events'), ('financial_outbox_delivery_attempts'), ('financial_break_glass_audit'), ('legacy_payment_receipt_links')
          )
          SELECT 'table|' || e.name || '|' || CASE WHEN EXISTS (
            SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='public' AND c.relkind='r' AND c.relname=e.name
          ) THEN 'present' ELSE 'missing' END FROM expected e ORDER BY e.name;
          WITH expected(name) AS (VALUES
            ('payment_matching_policy_versions'), ('payable_snapshots'), ('payment_ingestion_batches'), ('payment_documents'),
            ('payment_document_extractions'), ('bank_payment_operations'), ('payment_operation_documents'), ('payment_allocation_plans'),
            ('payment_allocation_items'), ('payment_allocation_reservations'), ('payment_allocation_movements'), ('financial_command_receipts'),
            ('financial_outbox_events'), ('financial_outbox_delivery_attempts'), ('financial_break_glass_audit'), ('legacy_payment_receipt_links')
          )
          SELECT 'rls|' || e.name || '|' || CASE WHEN EXISTS (
            SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='public' AND c.relkind='r' AND c.relname=e.name AND c.relrowsecurity
          ) THEN 'present' ELSE 'drifted' END FROM expected e ORDER BY e.name;
          WITH expected(name) AS (VALUES
            ('payment_reconciliation_set_updated_at'), ('payment_reconciliation_normalize_currency'), ('payment_reconciliation_normalize_bank_name'),
            ('payment_amount_to_minor'), ('rotate_payment_matching_policy'), ('payment_reconciliation_hash_text'),
            ('payment_reconciliation_account_material'), ('payment_reconciliation_account_hash'), ('payment_reconciliation_account_last4'),
            ('payment_reconciliation_redact_free_text'), ('payment_reconciliation_payload_hash'), ('payment_reconciliation_require_finance'),
            ('payment_reconciliation_storage_path_allowed'), ('payment_reconciliation_command_replay'), ('payment_reconciliation_store_command'),
            ('append_financial_outbox_event_internal'), ('payment_reconciliation_protect_immutable'), ('payment_reconciliation_protect_policy_version'),
            ('create_payable_snapshot_internal'), ('materialize_closed_batch_payable_snapshots'), ('materialize_extraordinary_payable_snapshot'),
            ('payment_operation_confirmed_minor'), ('payable_snapshot_confirmed_minor'), ('payment_operation_reserved_minor'),
            ('payable_snapshot_reserved_minor'), ('payment_reconciliation_snapshot_is_payable'), ('payment_operation_fingerprint_v1'),
            ('get_payment_batch_context'), ('create_payment_ingestion_batch'), ('finalize_payment_ingestion_upload'),
            ('submit_payment_document_extractions'), ('list_payment_ingestion_batches'), ('get_payment_ingestion_batch_detail'),
            ('accept_payment_document_extraction'), ('reject_payment_document_extraction'), ('find_payment_allocation_candidates'),
            ('propose_payment_allocations'), ('reserve_payment_allocations'), ('expire_payment_reservation'),
            ('release_payment_reservation'), ('cancel_payment_allocation_plan'), ('payment_reconciliation_validate_document_scope'),
            ('payment_reconciliation_validate_extraction_scope'), ('payment_reconciliation_validate_operation_scope'),
            ('payment_reconciliation_protect_operation_fact'), ('payment_reconciliation_validate_plan_scope'),
            ('payment_reconciliation_validate_item_scope'), ('payment_reconciliation_validate_reservation_scope'),
            ('payment_reconciliation_validate_movement_scope')
          )
          SELECT 'function|' || e.name || '|' || CASE WHEN EXISTS (
            SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
            WHERE n.nspname='public' AND p.proname=e.name
          ) THEN 'present' ELSE 'missing' END FROM expected e ORDER BY e.name;
          WITH expected(name) AS (VALUES
            ('payment_ingestion_batches_set_updated_at'), ('payment_document_extractions_set_updated_at'),
            ('payment_allocation_plans_set_updated_at'), ('payable_snapshots_immutable'), ('payment_allocation_movements_immutable'),
            ('financial_command_receipts_immutable'), ('financial_outbox_events_immutable'), ('financial_break_glass_audit_immutable'),
            ('materialize_closed_batch_payable_snapshots'), ('materialize_extraordinary_payable_snapshot'),
            ('payment_documents_validate_scope'), ('payment_document_extractions_validate_scope'), ('bank_payment_operations_validate_scope'),
            ('bank_payment_operations_protect_fact'), ('payment_allocation_plans_validate_scope'), ('payment_allocation_items_validate_scope'),
            ('payment_allocation_items_immutable'), ('payment_allocation_reservations_validate_scope'),
            ('payment_allocation_movements_validate_scope'), ('payment_matching_policy_versions_immutable')
          )
          SELECT 'trigger|' || e.name || '|' || CASE WHEN EXISTS (
            SELECT 1 FROM pg_trigger t WHERE NOT t.tgisinternal AND t.tgname=e.name
          ) THEN 'present' ELSE 'missing' END FROM expected e ORDER BY e.name;
          WITH expected(name) AS (VALUES
            ('payment_matching_policy_active_uidx'), ('payable_snapshots_company_idx'), ('payable_snapshots_request_latest_idx'),
            ('payment_ingestion_batches_company_status_idx'), ('payment_document_extractions_batch_status_idx'),
            ('bank_payment_operations_company_status_idx'), ('payment_allocation_plans_open_operation_uidx'),
            ('payment_allocation_items_snapshot_idx'), ('payment_allocation_reservations_active_plan_uidx'),
            ('payment_allocation_reservations_operation_idx'), ('payment_allocation_movements_operation_idx'),
            ('payment_allocation_movements_snapshot_idx'), ('financial_outbox_events_aggregate_idx'), ('financial_outbox_events_occurred_idx')
          )
          SELECT 'index|' || e.name || '|' || CASE WHEN EXISTS (
            SELECT 1 FROM pg_indexes i WHERE i.schemaname='public' AND i.indexname=e.name
          ) THEN 'present' ELSE 'missing' END FROM expected e ORDER BY e.name;
          WITH expected(name) AS (VALUES
            ('get_payment_batch_context'), ('payment_reconciliation_storage_path_allowed'), ('rotate_payment_matching_policy'),
            ('create_payment_ingestion_batch'), ('finalize_payment_ingestion_upload'), ('submit_payment_document_extractions'),
            ('list_payment_ingestion_batches'), ('get_payment_ingestion_batch_detail'), ('accept_payment_document_extraction'),
            ('reject_payment_document_extraction'), ('find_payment_allocation_candidates'), ('propose_payment_allocations'),
            ('reserve_payment_allocations'), ('expire_payment_reservation'), ('release_payment_reservation'), ('cancel_payment_allocation_plan')
          )
          SELECT 'function_grant|' || e.name || '|' || CASE WHEN EXISTS (
            SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
            WHERE n.nspname='public' AND p.proname=e.name AND has_function_privilege('authenticated', p.oid, 'EXECUTE')
          ) THEN 'present' ELSE 'missing' END FROM expected e ORDER BY e.name;
          SELECT 'bucket|payment-batch-documents|' || CASE
            WHEN b.id IS NULL THEN 'missing'
            WHEN b.public=false AND b.file_size_limit=26214400 AND b.allowed_mime_types=ARRAY['application/pdf'] THEN 'present'
            ELSE 'drifted' END
          FROM (SELECT 1) x LEFT JOIN storage.buckets b ON b.id='payment-batch-documents';
          WITH expected(name) AS (VALUES
            ('Finance can upload payment batch documents'), ('Finance can read payment batch documents')
          )
          SELECT 'storage_policy|' || e.name || '|' || CASE WHEN EXISTS (
            SELECT 1 FROM pg_policies p WHERE p.schemaname='storage' AND p.tablename='objects' AND p.policyname=e.name
          ) THEN 'present' ELSE 'missing' END FROM expected e ORDER BY e.name;
          SELECT 'history|032|' || CASE
            WHEN to_regclass('supabase_migrations.schema_migrations') IS NULL THEN 'not_available'
            WHEN EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version::text='032') THEN 'present'
            ELSE 'absent' END;
          SELECT 'legacy|payment_receipts|present_rows=' || CASE WHEN to_regclass('public.payment_receipts') IS NULL THEN 'table_missing' ELSE (SELECT count(*)::text FROM public.payment_receipts) END;
          COMMIT;
          SQL
          sed -E 's/^/AUDIT: /' "${audit_file}"
          missing_or_drifted=$(grep -Ec '^(table|rls|function|trigger|index|function_grant|bucket|storage_policy)\|.*\|(missing|drifted)$' "${audit_file}" || true)
          present=$(grep -Ec '^(table|rls|function|trigger|index|function_grant|bucket|storage_policy)\|.*\|present$' "${audit_file}" || true)
          expected_total=133
          if [ "${present}" -eq 0 ]; then
            state='clean'
          elif [ "${present}" -eq "${expected_total}" ] && [ "${missing_or_drifted}" -eq 0 ]; then
            state='already_applied_exact'
          else
            state='partial_or_drifted'
          fi
          echo "state=${state}" >> "${GITHUB_OUTPUT}"
          echo "Audit state: ${state}" >> "${GITHUB_STEP_SUMMARY}"
          if [ "${state}" = 'partial_or_drifted' ]; then
            echo 'Fail closed: inventory does not match migration 032 contract.' >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if [ "${state}" = 'clean' ]; then
            echo 'Fail closed: a clean state requires separate authorization; this workflow never applies migration 032.' >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

      - name: Postcheck existing state (read-only)
        if: steps.audit.outputs.state == 'already_applied_exact'
        shell: bash
        run: |
          set -euo pipefail
          export PGOPTIONS='-c default_transaction_read_only=on'
          psql "${SUPABASE_DEV_DB_URL}" -X -v ON_ERROR_STOP=1 -qAt <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT 'POSTCHECK: payment_receipts_preserved=' || CASE WHEN to_regclass('public.payment_receipts') IS NULL THEN 'false' ELSE 'true' END;
          SELECT 'POSTCHECK: financial_outbox_table=' || CASE WHEN to_regclass('public.financial_outbox_events') IS NULL THEN 'false' ELSE 'true' END;
          SELECT 'POSTCHECK: private_document_bucket=' || CASE WHEN EXISTS (
            SELECT 1 FROM storage.buckets WHERE id='payment-batch-documents' AND public=false
          ) THEN 'true' ELSE 'false' END;
          SELECT 'POSTCHECK: authenticated_rpc_grants=' || count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
            WHERE n.nspname='public' AND has_function_privilege('authenticated', p.oid, 'EXECUTE')
              AND p.proname IN ('get_payment_batch_context','payment_reconciliation_storage_path_allowed','rotate_payment_matching_policy','create_payment_ingestion_batch','finalize_payment_ingestion_upload','submit_payment_document_extractions','list_payment_ingestion_batches','get_payment_ingestion_batch_detail','accept_payment_document_extraction','reject_payment_document_extraction','find_payment_allocation_candidates','propose_payment_allocations','reserve_payment_allocations','expire_payment_reservation','release_payment_reservation','cancel_payment_allocation_plan');
          COMMIT;
          SQL

      - name: Safe contract smoke (read-only)
        if: steps.audit.outputs.state == 'already_applied_exact'
        shell: bash
        run: |
          set -euo pipefail
          export PGOPTIONS='-c default_transaction_read_only=on'
          psql "${SUPABASE_DEV_DB_URL}" -X -v ON_ERROR_STOP=1 -qAt <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT 'SMOKE: storage_path_guard=' || CASE WHEN has_function_privilege('authenticated', 'public.payment_reconciliation_storage_path_allowed(text)'::regprocedure, 'EXECUTE') THEN 'available' ELSE 'missing' END;
          SELECT 'SMOKE: batch_context_rpc=' || CASE WHEN has_function_privilege('authenticated', 'public.get_payment_batch_context()'::regprocedure, 'EXECUTE') THEN 'available' ELSE 'missing' END;
          COMMIT;
          SQL