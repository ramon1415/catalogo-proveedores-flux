name: Provider intake triage DEV Gate 2 preflight (temporary)

on:
  push:
    branches:
      - feature/ramon-provider-intake-triage-ui
    paths:
      - .github/workflows/provider-intake-triage-gate2-temporary.yml
      - ops/provider-intake/gate-2.authorization.json
      - scripts/qa/provider-intake-triage-gate2-preflight.sql
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-intake-triage-dev-gate-2
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only Gate 2 safety preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: DEV
    env:
      AUTHORIZED_ROOT_HEAD: aa4ec71b5591708e04cd2c0469a49fbee55267b0
      AUTHORIZED_BASELINE: 05986aca63f2d98635cbb9b928cd0cebac29315a
      AUTHORIZED_BACKEND_TREE: 379f65801609e40143d948b3de702e391636c512
      AUTHORIZED_BRANCH: feature/ramon-provider-intake-triage-ui
      AUTHORIZED_PROJECT_REF: scsirgbuqjcwoaxfacth
      AUTHORIZED_MIGRATION_SHA256: 57ab35263fa0a6dfa53aeef1fc1b1fa76fcede2f5d0413e05cea1642f42438eb
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}

    steps:
      - name: Checkout Gate 2 preflight authorization
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate immutable scope and authorization
        shell: bash
        run: |
          set -euo pipefail
          marker="ops/provider-intake/gate-2.authorization.json"
          preflight="scripts/qa/provider-intake-triage-gate2-preflight.sql"

          test "$GITHUB_REF_NAME" = "$AUTHORIZED_BRANCH"
          test "$SUPABASE_DEV_PROJECT_REF" = "$AUTHORIZED_PROJECT_REF"
          test -n "$SUPABASE_DEV_DB_URL"
          git merge-base --is-ancestor "$AUTHORIZED_BASELINE" HEAD
          git merge-base --is-ancestor "$AUTHORIZED_ROOT_HEAD" HEAD
          test "$(git rev-parse "HEAD:supabase/functions/provider-intake")" = "$AUTHORIZED_BACKEND_TREE"

          expected_files="$(
            printf '%s\n' \
              '.github/workflows/provider-intake-triage-gate2-temporary.yml' \
              'ops/provider-intake/gate-2.authorization.json' \
              'scripts/qa/provider-intake-triage-gate2-preflight.sql' |
              sort
          )"
          actual_files="$(git diff --name-only "$AUTHORIZED_ROOT_HEAD..HEAD" | sort)"
          test "$actual_files" = "$expected_files"

          test "$(jq -r '.gate' "$marker")" = "phase-1d-gate-2-read-only-preflight"
          test "$(jq -r '.authorized_root_head' "$marker")" = "$AUTHORIZED_ROOT_HEAD"
          test "$(jq -r '.branch' "$marker")" = "$AUTHORIZED_BRANCH"
          test "$(jq -r '.supabase_project_ref' "$marker")" = "$AUTHORIZED_PROJECT_REF"
          test "$(jq -r '.allow_intake_mutations' "$marker")" = "false"
          test "$(jq -r '.allow_identity_creation' "$marker")" = "false"
          test "$(jq -r '.allow_sql_writes_or_migrations' "$marker")" = "false"
          test "$(jq -r '.stop_on_cleanup_infeasibility' "$marker")" = "true"
          test "$(sha256sum "$preflight" | cut -d' ' -f1)" = "$(jq -r '.preflight_sha256' "$marker")"

          migration="supabase/migrations/029_provider_intake_triage.sql"
          load="ops/provider-intake/apply-029-triage/03_LOAD_029_EXACT.sql"
          test "$(sha256sum "$migration" | cut -d' ' -f1)" = "$AUTHORIZED_MIGRATION_SHA256"
          test "$(sha256sum "$load" | cut -d' ' -f1)" = "$AUTHORIZED_MIGRATION_SHA256"
          cmp --silent "$migration" "$load"
          git diff --check "$AUTHORIZED_BASELINE..HEAD"

      - name: Run JavaScript checks
        shell: bash
        run: |
          set -euo pipefail
          node --check provider_intakes.js
          node --check api/provider-intake-file-url.js
          node --check scripts/qa/provider-intake-triage-contract.test.mjs
          node --check scripts/qa/provider-intake-triage-visual.mjs
          node --test scripts/qa/*.test.mjs | tee gate2-node-tests.txt
          grep -q '# pass 72' gate2-node-tests.txt
          grep -q '# fail 0' gate2-node-tests.txt

      - name: Parse migration, LOAD, and preflight SQL without execution
        shell: bash
        run: |
          set -euo pipefail
          parser_dir="$RUNNER_TEMP/pglast"
          python3 -m pip install --quiet --disable-pip-version-check --target "$parser_dir" pglast
          PYTHONPATH="$parser_dir" python3 - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          paths = [
              Path("supabase/migrations/029_provider_intake_triage.sql"),
              Path("ops/provider-intake/apply-029-triage/03_LOAD_029_EXACT.sql"),
              Path("scripts/qa/provider-intake-triage-gate2-preflight.sql"),
          ]
          for path in paths:
              source = "\n".join(
                  line for line in path.read_text(encoding="utf-8").splitlines()
                  if not line.lstrip().startswith("\\")
              )
              parse_sql(source)
              print(f"parsed={path}")
          PY

      - name: Scan changed scope for secret values
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$AUTHORIZED_ROOT_HEAD..HEAD")"
          test -n "$changed"
          if printf '%s\n' "$changed" | xargs grep -nE \
            '(eyJ[A-Za-z0-9_-]{20,}|sbp_[A-Za-z0-9]{16,}|-----BEGIN (RSA )?PRIVATE KEY-----|Bearer[[:space:]]+[A-Za-z0-9._-]{20,})'
          then
            echo "Sensitive-looking value found in temporary Gate 2 scope." >&2
            exit 1
          fi

      - name: Capture DEV baseline and structural blockers read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate2-preflight-evidence
          psql -X -qAt -v ON_ERROR_STOP=1 "$SUPABASE_DEV_DB_URL" \
            -f scripts/qa/provider-intake-triage-gate2-preflight.sql \
            > gate2-preflight-evidence/gate2_preflight_sanitized.json

          jq -e '.gate == "phase-1d-gate-2-read-only-preflight"' \
            gate2-preflight-evidence/gate2_preflight_sanitized.json >/dev/null
          jq -e '.reference_baseline_matches == true' \
            gate2-preflight-evidence/gate2_preflight_sanitized.json >/dev/null
          jq -e '.migration_029_live_contract.functions == 7' \
            gate2-preflight-evidence/gate2_preflight_sanitized.json >/dev/null
          jq -e '.migration_029_live_contract.security_definer == 6' \
            gate2-preflight-evidence/gate2_preflight_sanitized.json >/dev/null
          jq -e '.migration_029_live_contract.pure_mask_invoker == 1' \
            gate2-preflight-evidence/gate2_preflight_sanitized.json >/dev/null
          jq -e '.migration_029_live_contract.public_execute == 0' \
            gate2-preflight-evidence/gate2_preflight_sanitized.json >/dev/null
          jq -e '.migration_029_live_contract.anon_execute == 0' \
            gate2-preflight-evidence/gate2_preflight_sanitized.json >/dev/null
          jq -e '.migration_029_live_contract.authenticated_execute == 4' \
            gate2-preflight-evidence/gate2_preflight_sanitized.json >/dev/null
          jq -e '.migration_029_live_contract.internal_helper_direct_execute == 0' \
            gate2-preflight-evidence/gate2_preflight_sanitized.json >/dev/null
          jq -e '.mutations_executed == false and .identities_created == 0' \
            gate2-preflight-evidence/gate2_preflight_sanitized.json >/dev/null

          {
            echo "# Gate 2 — preflight de seguridad read-only"
            echo
            echo "- Decisión: **$(jq -r '.decision' gate2-preflight-evidence/gate2_preflight_sanitized.json)**"
            echo "- Baseline conocido: **PASS**"
            echo "- Migration 029 y grants: **PASS**"
            echo "- Identidades creadas: **0**"
            echo "- Mutaciones ejecutadas: **0**"
            echo "- Fixture IDs incluidos: **0**"
            echo
            echo "El preflight detuvo Gate 2 antes de mutar DEV porque el cleanup de perfiles"
            echo "temporales no es compatible con las referencias restrictivas del ledger/triaged_by,"
            echo "y el replay con action_id no conserva una huella material para detectar cambios."
          } > gate2-preflight-evidence/GATE2_PREFLIGHT_REPORT.md

      - name: Upload sanitized preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-intake-triage-gate2-preflight-${{ github.run_id }}
          path: gate2-preflight-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce safe stop before Gate 2 mutations
        shell: bash
        run: |
          set -euo pipefail
          result="gate2-preflight-evidence/gate2_preflight_sanitized.json"
          test "$(jq -r '.decision' "$result")" = "FAIL_PRECHECK"
          test "$(jq -r '.structural_checks.temporary_finance_profile_cleanup_after_events_possible' "$result")" = "false"
          test "$(jq -r '.structural_checks.action_replay_checks_material_request' "$result")" = "false"
          test "$(jq -r '.mutations_executed' "$result")" = "false"
          test "$(jq -r '.identities_created' "$result")" = "0"
