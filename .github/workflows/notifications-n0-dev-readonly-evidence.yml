name: Notifications N0 DEV Read-only Evidence — Edge and Resend

on:
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/notifications-n0-dev-readonly-evidence.yml
      - ops/notifications/n0-readonly-evidence/audit.sql
      - ops/notifications/n0-readonly-evidence/validate_artifact.py
      - ops/notifications/n0-readonly-evidence/README.md
  push:
    branches:
      - dev
    paths:
      - .github/workflows/notifications-n0-dev-readonly-evidence.yml
      - ops/notifications/n0-readonly-evidence/audit.sql
      - ops/notifications/n0-readonly-evidence/validate_artifact.py
      - ops/notifications/n0-readonly-evidence/README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notifications-n0-dev-readonly-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static_checks:
    name: Static safety contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Parse workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.safe_load_file(ARGV.fetch(0), aliases: true)" \
            .github/workflows/notifications-n0-dev-readonly-evidence.yml

      - name: Establish the reviewed change set
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          changed_file="${RUNNER_TEMP}/notifications-n0-r2a-r3-changed-files.txt"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > "${changed_file}"
          elif [[ "${EVENT_NAME}" == "push" && "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > "${changed_file}"
          else
            : > "${changed_file}"
          fi
          echo "file=${changed_file}" >> "${GITHUB_OUTPUT}"

      - name: Enforce read-only and privacy invariants
        shell: bash
        run: |
          set -euo pipefail
          python ops/notifications/n0-readonly-evidence/validate_artifact.py static \
            --root . \
            --changed-files "${{ steps.changes.outputs.file }}"

      - name: Exercise diagnostic taxonomy, live shapes, artifact v4, and privacy
        shell: bash
        run: |
          set -euo pipefail
          python ops/notifications/n0-readonly-evidence/validate_artifact.py self-test

      - name: Publish static-only summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Notifications N0 R2B-R1"
            echo "- Architecture: Supabase Edge Function and Resend"
            echo "- Artifact schema: notifications-n0-evidence/v4"
            echo "- Diagnostic schema: notifications-n0-diagnostic/v1"
            echo "- Scope: static-only fail-closed remediation"
            echo "- Live DEV access: not executed for pull requests"
            echo "- Diagnostic scenarios: 26"
            echo "- Live-shape scenarios: 44"
            echo "- Identity fixtures: 17"
            echo "- Multipart and manifest fixtures: 20"
            echo "- Receipt security fixtures: 13"
            echo "- Official multipart path fixtures: 16"
            echo "- Provider API calls: 0"
            echo "- Dispatcher invocations: 0"
            echo "- Emails sent: 0"
            echo "- Artifact upload: not performed by this job"
          } >> "${GITHUB_STEP_SUMMARY}"

  collect_dev_evidence:
    name: Collect sanitized DEV evidence
    needs: static_checks
    if: >-
      ${{
        github.repository == 'ramon1415/catalogo-proveedores-flux' &&
        github.ref == 'refs/heads/dev' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      }}
    environment: DEV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
    steps:
      - name: Reassert immutable execution guards and required secrets
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "${REPOSITORY}" == "ramon1415/catalogo-proveedores-flux" ]]
          [[ "${REF_NAME}" == "refs/heads/dev" ]]
          [[ "${EVENT_NAME}" == "push" || "${EVENT_NAME}" == "workflow_dispatch" ]]
          if [[ -z "${SUPABASE_DEV_DB_URL:-}" || -z "${SUPABASE_ACCESS_TOKEN:-}" || -z "${SUPABASE_DEV_PROJECT_REF:-}" ]]; then
            echo "DEV_IDENTITY_PRECHECK_FAILED"
            exit 1
          fi

      - name: Check out the exact DEV revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare private working storage
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          private_dir="${RUNNER_TEMP}/notifications-n0-private"
          output_dir="${GITHUB_WORKSPACE}/.audit-output"
          mkdir -p "${private_dir}" "${output_dir}"
          chmod 700 "${private_dir}" "${output_dir}"
          echo "private_dir=${private_dir}" >> "${GITHUB_OUTPUT}"
          echo "output_dir=${output_dir}" >> "${GITHUB_OUTPUT}"

      - name: Validate project ref hash and database URL locally
        shell: bash
        run: |
          set -euo pipefail
          python ops/notifications/n0-readonly-evidence/validate_artifact.py identity-local

      - name: Read and bind exact DEV project metadata
        shell: bash
        env:
          PRIVATE_DIR: ${{ steps.storage.outputs.private_dir }}
        run: |
          set -euo pipefail
          set +e
          curl --fail --silent --show-error --max-time 30 -X GET \
            -D "${PRIVATE_DIR}/project-headers.txt" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_DEV_PROJECT_REF}" \
            > "${PRIVATE_DIR}/project-metadata.json" \
            2> "${PRIVATE_DIR}/project-request.stderr"
          metadata_rc=$?
          set -e
          rm -f "${PRIVATE_DIR}/project-request.stderr"
          if [[ ${metadata_rc} -ne 0 ]]; then
            rm -f "${PRIVATE_DIR}/project-metadata.json" "${PRIVATE_DIR}/project-headers.txt"
            echo "DEV_IDENTITY_PRECHECK_FAILED"
            exit 1
          fi
          python ops/notifications/n0-readonly-evidence/validate_artifact.py identity-metadata \
            --project-metadata "${PRIVATE_DIR}/project-metadata.json" \
            --project-headers "${PRIVATE_DIR}/project-headers.txt" \
            --identity-marker "${PRIVATE_DIR}/environment-identity.json"

      - name: Install the PostgreSQL read-only client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Read database catalog and aggregates
        shell: bash
        env:
          PRIVATE_DIR: ${{ steps.storage.outputs.private_dir }}
        run: |
          set -euo pipefail
          export PGOPTIONS="-c default_transaction_read_only=on -c statement_timeout=30000 -c lock_timeout=5000 -c idle_in_transaction_session_timeout=45000"
          set +e
          psql "${SUPABASE_DEV_DB_URL}" \
            --quiet \
            --no-align \
            --tuples-only \
            --set ON_ERROR_STOP=1 \
            --file ops/notifications/n0-readonly-evidence/audit.sql \
            > "${PRIVATE_DIR}/database.jsonl" \
            2> "${PRIVATE_DIR}/database.stderr"
          database_rc=$?
          set -e
          rm -f "${PRIVATE_DIR}/database.stderr"
          if [[ ${database_rc} -ne 0 ]]; then
            rm -f "${PRIVATE_DIR}/database.jsonl"
            echo "Read-only database collection failed."
            exit 1
          fi

      - name: Read exact dispatcher metadata and multipart body
        id: dispatcher
        shell: bash
        env:
          PRIVATE_DIR: ${{ steps.storage.outputs.private_dir }}
        run: |
          set -euo pipefail
          metadata_status="unavailable"
          body_status="not_collected"
          set +e
          curl --fail --silent --show-error --max-time 30 -X GET \
            -D "${PRIVATE_DIR}/dispatcher-metadata-headers.txt" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_DEV_PROJECT_REF}/functions/notification-dispatcher" \
            > "${PRIVATE_DIR}/dispatcher-metadata.json" \
            2> "${PRIVATE_DIR}/dispatcher-request.stderr"
          metadata_rc=$?
          set -e
          if [[ ${metadata_rc} -eq 0 ]]; then
            metadata_status="available"
            set +e
            curl --fail --silent --show-error --max-time 30 -X GET \
              -D "${PRIVATE_DIR}/dispatcher-body-headers.txt" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Accept: multipart/form-data" \
              "https://api.supabase.com/v1/projects/${SUPABASE_DEV_PROJECT_REF}/functions/notification-dispatcher/body" \
              > "${PRIVATE_DIR}/dispatcher-body.bin" \
              2>> "${PRIVATE_DIR}/dispatcher-request.stderr"
            body_rc=$?
            set -e
            if [[ ${body_rc} -eq 0 ]]; then
              body_status="available"
            else
              body_status="unavailable"
              rm -f "${PRIVATE_DIR}/dispatcher-body.bin" "${PRIVATE_DIR}/dispatcher-body-headers.txt"
            fi
          else
            rm -f "${PRIVATE_DIR}/dispatcher-metadata.json" "${PRIVATE_DIR}/dispatcher-metadata-headers.txt"
          fi
          rm -f "${PRIVATE_DIR}/dispatcher-request.stderr"
          echo "metadata_status=${metadata_status}" >> "${GITHUB_OUTPUT}"
          echo "body_status=${body_status}" >> "${GITHUB_OUTPUT}"

      - name: Build the allowlisted artifact with safe diagnostics
        shell: bash
        env:
          PRIVATE_DIR: ${{ steps.storage.outputs.private_dir }}
          OUTPUT_DIR: ${{ steps.storage.outputs.output_dir }}
          METADATA_STATUS: ${{ steps.dispatcher.outputs.metadata_status }}
          BODY_STATUS: ${{ steps.dispatcher.outputs.body_status }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "${PRIVATE_DIR}" == "${RUNNER_TEMP}/notifications-n0-private" ]]
          [[ "${OUTPUT_DIR}" == "${GITHUB_WORKSPACE}/.audit-output" ]]
          diagnostic_path="${RUNNER_TEMP}/notifications-n0-diagnostic.json"
          diagnostic_temporary="${diagnostic_path}.tmp"
          build_stdout="${RUNNER_TEMP}/notifications-n0-build.stdout"
          build_stderr="${RUNNER_TEMP}/notifications-n0-build.stderr"
          rm -f -- "${diagnostic_path}" "${diagnostic_temporary}" "${build_stdout}" "${build_stderr}"
          arguments=(
            build
            --db-jsonl "${PRIVATE_DIR}/database.jsonl"
            --identity-marker "${PRIVATE_DIR}/environment-identity.json"
            --dispatcher-metadata-status "${METADATA_STATUS}"
            --dispatcher-body-status "${BODY_STATUS}"
            --source-dir "${GITHUB_WORKSPACE}/supabase/functions/notification-dispatcher"
            --github-head-sha "${HEAD_SHA}"
            --output "${OUTPUT_DIR}/artifact.json"
            --diagnostic-output "${diagnostic_path}"
          )
          if [[ "${METADATA_STATUS}" == "available" ]]; then
            arguments+=(
              --dispatcher-metadata "${PRIVATE_DIR}/dispatcher-metadata.json"
              --dispatcher-metadata-headers "${PRIVATE_DIR}/dispatcher-metadata-headers.txt"
            )
          fi
          if [[ "${BODY_STATUS}" == "available" ]]; then
            arguments+=(
              --dispatcher-body "${PRIVATE_DIR}/dispatcher-body.bin"
              --dispatcher-body-headers "${PRIVATE_DIR}/dispatcher-body-headers.txt"
            )
          fi

          set +e
          python ops/notifications/n0-readonly-evidence/validate_artifact.py "${arguments[@]}" > "${build_stdout}" 2> "${build_stderr}"
          build_rc=$?
          set -e
          rm -f -- "${build_stdout}" "${build_stderr}"

          if [[ ${build_rc} -ne 0 ]]; then
            set +e
            safe_report="$(python ops/notifications/n0-readonly-evidence/validate_artifact.py diagnostic-emit --diagnostic "${diagnostic_path}" 2> /dev/null)"
            report_rc=$?
            set -e

            cleanup_status="PASS"
            cleanup_files=(
              "${PRIVATE_DIR}/database.jsonl"
              "${PRIVATE_DIR}/environment-identity.json"
              "${PRIVATE_DIR}/project-metadata.json"
              "${PRIVATE_DIR}/project-headers.txt"
              "${PRIVATE_DIR}/dispatcher-metadata.json"
              "${PRIVATE_DIR}/dispatcher-metadata-headers.txt"
              "${PRIVATE_DIR}/dispatcher-body.bin"
              "${PRIVATE_DIR}/dispatcher-body-headers.txt"
              "${OUTPUT_DIR}/artifact.json"
              "${OUTPUT_DIR}/artifact.tmp"
              "${OUTPUT_DIR}/artifact.validated.tmp"
              "${OUTPUT_DIR}/artifact.json.tmp"
              "${OUTPUT_DIR}/artifact.json.validated.tmp"
              "${diagnostic_path}"
              "${diagnostic_temporary}"
            )
            rm -f -- "${cleanup_files[@]}" || cleanup_status="FAIL"
            rm -rf -- "${PRIVATE_DIR}" "${OUTPUT_DIR}" || cleanup_status="FAIL"
            if [[ -e "${PRIVATE_DIR}" || -e "${OUTPUT_DIR}" || -e "${diagnostic_path}" || -e "${diagnostic_temporary}" ]]; then
              cleanup_status="FAIL"
            fi

            if [[ ${report_rc} -ne 0 ]]; then
              fallback_report=(
                "AUDIT_FAILURE_PHASE=UNEXPECTED_INTERNAL_CONTRACT"
                "AUDIT_FAILURE_CODE=UNEXPECTED_EXCEPTION"
                "AUDIT_FAILURE_RULE=DIAGNOSTIC_ENVELOPE_MISSING"
                "AUDIT_RAW_CLEANUP=${cleanup_status}"
              )
              safe_report="$(printf '%s\n' "${fallback_report[@]}")"
            fi
            printf '%s\n' "${safe_report}"
            printf '%s\n' "${safe_report}" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          rm -f -- "${diagnostic_path}" "${diagnostic_temporary}" "${build_stdout}" "${build_stderr}"
          rm -rf -- "${PRIVATE_DIR}"

      - name: Fail-closed privacy validation
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.storage.outputs.output_dir }}
        run: |
          set -euo pipefail
          set +e
          validation_output="$(python ops/notifications/n0-readonly-evidence/validate_artifact.py validate --artifact "${OUTPUT_DIR}/artifact.json" 2>&1)"
          validation_rc=$?
          set -e
          if [[ ${validation_rc} -ne 0 ]]; then
            rm -rf -- "${OUTPUT_DIR}"
            echo "PRIVACY_VALIDATION_FAILED"
            exit 1
          fi
          mapfile -t artifact_files < <(find "${OUTPUT_DIR}" -maxdepth 1 -type f -printf '%f\n')
          if [[ ${#artifact_files[@]} -ne 1 || "${artifact_files[0]}" != "artifact.json" ]]; then
            rm -rf -- "${OUTPUT_DIR}"
            echo "PRIVACY_VALIDATION_FAILED"
            exit 1
          fi

      - name: Compute safe artifact metadata
        id: artifact
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.storage.outputs.output_dir }}
        run: |
          set -euo pipefail
          digest="$(sha256sum "${OUTPUT_DIR}/artifact.json" | awk '{print $1}')"
          size="$(stat --format='%s' "${OUTPUT_DIR}/artifact.json")"
          echo "sha256=${digest}" >> "${GITHUB_OUTPUT}"
          echo "bytes=${size}" >> "${GITHUB_OUTPUT}"

      - name: Upload the single sanitized artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notifications-n0-dev-readonly-evidence
          path: .audit-output/artifact.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish safe execution summary
        shell: bash
        env:
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
          ARTIFACT_BYTES: ${{ steps.artifact.outputs.bytes }}
          METADATA_STATUS: ${{ steps.dispatcher.outputs.metadata_status }}
          BODY_STATUS: ${{ steps.dispatcher.outputs.body_status }}
        run: |
          set -euo pipefail
          {
            echo "### Notifications N0 sanitized evidence"
            echo "- Environment identity: verified before database read"
            echo "- Database mode: repeatable-read, read-only"
            echo "- Architecture: Supabase Edge Function and Resend"
            echo "- Dispatcher metadata: ${METADATA_STATUS}"
            echo "- Dispatcher body: ${BODY_STATUS}"
            echo "- Provider API called by audit: false"
            echo "- Emails sent by audit: false"
            echo "- SEND_MODE: UNKNOWN_BY_DESIGN"
            echo "- Privacy validation: PASS"
            echo "- Artifact bytes: ${ARTIFACT_BYTES}"
            echo "- Artifact SHA-256: ${ARTIFACT_SHA256}"
            echo "- Retention days: 7"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove private and failed-output material
        if: always()
        shell: bash
        env:
          PRIVATE_DIR: ${{ steps.storage.outputs.private_dir }}
          OUTPUT_DIR: ${{ steps.storage.outputs.output_dir }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          diagnostic_path="${RUNNER_TEMP}/notifications-n0-diagnostic.json"
          cleanup_runtime_files=(
            "${diagnostic_path}"
            "${diagnostic_path}.tmp"
            "${RUNNER_TEMP}/notifications-n0-build.stdout"
            "${RUNNER_TEMP}/notifications-n0-build.stderr"
          )
          rm -f -- "${cleanup_runtime_files[@]}"
          if [[ -n "${PRIVATE_DIR:-}" && "${PRIVATE_DIR}" == "${RUNNER_TEMP}/notifications-n0-private" ]]; then
            cleanup_private_files=(
              "${PRIVATE_DIR}/database.jsonl"
              "${PRIVATE_DIR}/environment-identity.json"
              "${PRIVATE_DIR}/project-metadata.json"
              "${PRIVATE_DIR}/project-headers.txt"
              "${PRIVATE_DIR}/dispatcher-metadata.json"
              "${PRIVATE_DIR}/dispatcher-metadata-headers.txt"
              "${PRIVATE_DIR}/dispatcher-body.bin"
              "${PRIVATE_DIR}/dispatcher-body-headers.txt"
            )
            rm -f -- "${cleanup_private_files[@]}"
            rm -rf -- "${PRIVATE_DIR}"
          fi
          if [[ "${JOB_STATUS}" != "success" && -n "${OUTPUT_DIR:-}" && "${OUTPUT_DIR}" == "${GITHUB_WORKSPACE}/.audit-output" ]]; then
            cleanup_output_files=(
              "${OUTPUT_DIR}/artifact.json"
              "${OUTPUT_DIR}/artifact.tmp"
              "${OUTPUT_DIR}/artifact.validated.tmp"
              "${OUTPUT_DIR}/artifact.json.tmp"
              "${OUTPUT_DIR}/artifact.json.validated.tmp"
            )
            rm -f -- "${cleanup_output_files[@]}"
            rm -rf -- "${OUTPUT_DIR}"
          fi
