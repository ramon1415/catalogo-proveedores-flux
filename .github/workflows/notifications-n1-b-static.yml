name: Notifications N1-B release candidate

on:
  pull_request:
    branches: [dev]
    paths:
      - "supabase/migrations/042_notifications_n1_b_external_runtime.sql"
      - "ops/notifications/n1-b/**"
      - "supabase/config.toml"
      - "supabase/functions/notification-dispatcher-external/**"
      - "supabase/functions/provider-intake/handler.ts"
      - "supabase/functions/provider-intake/repository.ts"
      - "supabase/functions/provider-intake/types.ts"
      - "supabase/functions/provider-intake/provider-intake_test.ts"
      - "provider_intakes.html"
      - "provider_intakes.js"
      - ".github/workflows/notifications-n1-b-static.yml"

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  MIGRATION_SLOT: "042"

jobs:
  source-tests:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.evidence.outputs.source_commit }}
      migration_slot: ${{ steps.evidence.outputs.migration_slot }}
      product_ratio: ${{ steps.evidence.outputs.product_ratio }}
      ratio_exception: ${{ steps.evidence.outputs.ratio_exception }}
      triage_tests: ${{ steps.triage.outputs.triage_tests }}
      deno_tests: ${{ steps.deno.outputs.deno_tests }}
      preview_status: ${{ steps.evidence.outputs.preview_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate migration-slot inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.number }}" -eq 286
          git fetch --no-tags origin \
            +refs/heads/dev:refs/remotes/origin/dev \
            +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/dev)" = "8aab86b85255957b899556327b0f93eb2c093df0"
          test "$(git rev-parse origin/main)" = "85ec304ba45b9e0531e2cbd1437ba620c7e2ea24"
          ! git cat-file -e origin/dev:supabase/migrations/042_notifications_n1_b_external_runtime.sql 2>/dev/null

          mapfile -t slot_owners < <(
            gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number \
              --jq '.[].number' |
            while read -r pr; do
              gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json files \
                --jq '.files[].path' |
              grep -Eq '^supabase/migrations/042_[^/]+\.sql$' && printf '%s\n' "$pr" || true
            done
          )
          test "${#slot_owners[@]}" -eq 1
          test "${slot_owners[0]}" -eq 286

      - name: Validate scope, static safety and product ratio
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only origin/dev...HEAD)
          test "${#changed[@]}" -gt 0
          allowed='^(supabase/migrations/042_notifications_n1_b_external_runtime\.sql|ops/notifications/n1-b/(precheck|postcheck|contract-tests)\.sql|ops/notifications/n1-b/README\.md|supabase/config\.toml|supabase/functions/notification-dispatcher-external/(index|auth|renderer|notification-dispatcher-external_test)\.ts|supabase/functions/provider-intake/(handler|repository|types|provider-intake_test)\.ts|provider_intakes\.(html|js)|\.github/workflows/notifications-n1-b-static\.yml)$'
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "scope_violation:$path"; exit 1; }
          done
          git diff --check origin/dev...HEAD

          git diff --exit-code origin/dev -- supabase/migrations/041_notifications_external_isolation.sql
          git diff --exit-code origin/dev -- supabase/functions/notification-dispatcher
          test "$(git hash-object supabase/migrations/041_notifications_external_isolation.sql)" = "aaf9c2561365e1c99744bd487668961dbf8a6444"
          grep -A 18 -F "'provider-intake-v1'," supabase/migrations/041_notifications_external_isolation.sql | grep -Fq "'disabled',"
          grep -Fq "p_event_type <> 'provider_intake.correction_requested'" supabase/migrations/041_notifications_external_isolation.sql
          grep -Fq "or p_mode = 'test_only'" supabase/migrations/041_notifications_external_isolation.sql

          migration=supabase/migrations/042_notifications_n1_b_external_runtime.sql
          test "$(grep -Eic '^[[:space:]]*begin;' "$migration")" -eq 1
          test "$(grep -Eic '^[[:space:]]*commit;' "$migration")" -eq 1
          tail -n 8 "$migration" | grep -Eiq '^[[:space:]]*commit;[[:space:]]*$'
          ! grep -Eiq '^[[:space:]]*create[[:space:]]+trigger' "$migration"
          ! grep -Eiq '^[[:space:]]*(select|call)[[:space:]]+public\.enqueue_provider_intake_external_notification_v1' "$migration"
          for token in \
            enqueue_provider_intake_external_notification_v1 \
            finalize_provider_intake_submission_v1 \
            transition_provider_intake_external_v1 \
            notification_external_dispatch_invocations \
            reserve_external_notification_attempt \
            mark_external_notification_sent \
            mark_external_notification_failed \
            expire_stale_external_notification_events_v1; do
            grep -Fq "$token" "$migration"
          done

          python3 - <<'PY'
          from pathlib import Path
          import re

          contract = Path("ops/notifications/n1-b/contract-tests.sql").read_text(encoding="utf-8")
          cases = [int(value) for value in re.findall(r"^\s*\((\d+),\s*'[^']+',\s*'PASS'\)", contract, re.M)]
          assert cases == list(range(1, 61))
          assert contract.lower().rstrip().endswith("rollback;")

          config = Path("supabase/config.toml").read_text(encoding="utf-8")
          assert config.count("[functions.notification-dispatcher-external]") == 1
          section = config.split("[functions.notification-dispatcher-external]", 1)[1].split("[", 1)[0]
          assert "verify_jwt = false" in section

          dispatcher = Path("supabase/functions/notification-dispatcher-external/index.ts").read_text(encoding="utf-8")
          auth = Path("supabase/functions/notification-dispatcher-external/auth.ts").read_text(encoding="utf-8")
          renderer = Path("supabase/functions/notification-dispatcher-external/renderer.ts").read_text(encoding="utf-8")
          repository = Path("supabase/functions/provider-intake/repository.ts").read_text(encoding="utf-8")
          assert "claim_external_notification_events_for_dispatcher" in dispatcher
          assert "Idempotency-Key" in dispatcher
          assert "NOTIFICATION_EXTERNAL_DISPATCHER_HMAC_KEY" in dispatcher + auth
          assert "registerInvocation" in dispatcher
          assert 'request.method !== "POST"' in dispatcher
          assert "Access-Control-Allow" not in dispatcher
          assert '"real"' not in dispatcher and '"general"' not in dispatcher
          assert "safeResponseText" not in dispatcher
          assert "attachments" not in dispatcher + renderer
          assert "provider_matched" not in renderer
          assert "OFFICIAL_SUPABASE_HOST" in repository
          assert 'url.protocol !== "https:"' in repository

          executable = re.sub(r"--[^\n]*", "", Path("supabase/migrations/042_notifications_n1_b_external_runtime.sql").read_text(encoding="utf-8").lower())
          assert "backfill" not in executable and "reminder" not in executable
          for token in (
              "no_recipient", "external_dispatch_window_expired", "interval '24 hours'",
              "manual_follow_up_required", "provider_intake.correction_requested",
          ):
              assert token in executable
          PY

          product_added=0
          total_added=0
          while IFS=$'\t' read -r added _ path; do
            [[ "$added" =~ ^[0-9]+$ ]] || continue
            total_added=$((total_added + added))
            case "$path" in
              provider_intakes.html|provider_intakes.js|supabase/config.toml|supabase/migrations/042_notifications_n1_b_external_runtime.sql|supabase/functions/notification-dispatcher-external/auth.ts|supabase/functions/notification-dispatcher-external/index.ts|supabase/functions/notification-dispatcher-external/renderer.ts|supabase/functions/provider-intake/handler.ts|supabase/functions/provider-intake/repository.ts|supabase/functions/provider-intake/types.ts)
                product_added=$((product_added + added)) ;;
            esac
          done < <(git diff --numstat origin/dev...HEAD)
          test "$total_added" -gt 0
          ratio=$(awk -v p="$product_added" -v t="$total_added" 'BEGIN { printf "%.1f", (100*p/t) }')
          awk -v r="$ratio" 'BEGIN { exit !(r >= 50) }'
          exception=$(awk -v r="$ratio" 'BEGIN { print (r < 60 ? "DOCUMENTED" : "NOT_REQUIRED") }')
          if [[ "$exception" = DOCUMENTED ]]; then
            grep -Fq "PRODUCT_RATIO_EXCEPTION: DOCUMENTED" ops/notifications/n1-b/README.md
          fi

          test "$(rg -c '^Deno\.test\(' supabase/functions/notification-dispatcher-external/notification-dispatcher-external_test.ts supabase/functions/provider-intake/provider-intake_test.ts | awk -F: '{sum += $2} END {print sum}')" -ge 55
          test "$(rg -c '^test\(' scripts/qa/provider-intake-triage-contract.test.mjs scripts/qa/provider-intake-action-fingerprint.test.mjs | awk -F: '{sum += $2} END {print sum}')" -eq 34
          printf 'source_commit=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'migration_slot=%s\n' "$MIGRATION_SLOT" >> "$GITHUB_OUTPUT"
          printf 'product_ratio=%s%%\n' "$ratio" >> "$GITHUB_OUTPUT"
          printf 'ratio_exception=%s\n' "$exception" >> "$GITHUB_OUTPUT"
          printf 'preview_status=TECHNICALLY_AVAILABLE_NOT_AUTHORIZED\n' >> "$GITHUB_OUTPUT"

      - name: Run triage QA (34 tests)
        id: triage
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/qa/provider-intake-triage-contract.test.mjs \
            scripts/qa/provider-intake-action-fingerprint.test.mjs \
            | tee "$RUNNER_TEMP/n1b-triage.log"
          printf 'triage_tests=34/34 PASS\n' >> "$GITHUB_OUTPUT"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check and run 55+ deterministic tests
        id: deno
        shell: bash
        run: |
          set -euo pipefail
          deno check \
            supabase/functions/notification-dispatcher-external/index.ts \
            supabase/functions/provider-intake/handler.ts
          deno test \
            supabase/functions/notification-dispatcher-external/notification-dispatcher-external_test.ts \
            supabase/functions/provider-intake/provider-intake_test.ts \
            | tee "$RUNNER_TEMP/n1b-deno.log"
          printf 'deno_tests=55/55 PASS\n' >> "$GITHUB_OUTPUT"

  disposable-integration:
    needs: source-tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      postgres: ${{ steps.start.outputs.postgres }}
      baseline_count: ${{ steps.baseline.outputs.baseline_count }}
      baseline_apply: ${{ steps.baseline.outputs.baseline_apply }}
      precheck: ${{ steps.precheck.outputs.precheck }}
      migration_apply: ${{ steps.migration.outputs.migration_apply }}
      postcheck: ${{ steps.postcheck.outputs.postcheck }}
      contract_tests: ${{ steps.contract.outputs.contract_tests }}
      rollback: ${{ steps.contract.outputs.rollback }}
      cleanup: ${{ steps.cleanup.outputs.cleanup }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch canonical dev baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          test "$(git rev-parse origin/dev)" = "8aab86b85255957b899556327b0f93eb2c093df0"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: 2.101.0

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Start isolated PostgreSQL 17 sandbox
        id: start
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$RUNNER_TEMP/n1b-sandbox"
          supabase init --workdir "$sandbox" --yes
          sed -i -E 's/^major_version = [0-9]+/major_version = 17/' "$sandbox/supabase/config.toml"
          grep -Eq '^major_version = 17$' "$sandbox/supabase/config.toml"
          supabase db start --workdir "$sandbox"
          supabase status --workdir "$sandbox" -o json > "$RUNNER_TEMP/n1b-status.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("n1b-status.json").read_text())
          value = data.get("DB_URL") or data.get("db_url")
          if not value:
              raise SystemExit("local_db_url_missing")
          Path(os.environ["RUNNER_TEMP"]).joinpath("n1b-db-url").write_text(value)
          PY
          db_url=$(<"$RUNNER_TEMP/n1b-db-url")
          test "$(psql "$db_url" -X -qAtc 'show server_version_num')" -ge 170000
          for role in postgres anon authenticated service_role; do
            test "$(psql "$db_url" -X -qAtc "select count(*) from pg_roles where rolname='$role'")" -eq 1
          done
          for schema in auth storage extensions public; do
            test "$(psql "$db_url" -X -qAtc "select count(*) from pg_namespace where nspname='$schema'")" -eq 1
          done
          test "$(psql "$db_url" -X -qAtc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='storage' and c.relname='objects'")" -eq 1
          test "$(psql "$db_url" -X -qAtc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='extensions' and p.proname='digest'")" -ge 1
          printf 'postgres=17 / Supabase local\n' >> "$GITHUB_OUTPUT"

      - name: Apply exact canonical dev allowlist
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          db_url=$(<"$RUNNER_TEMP/n1b-db-url")
          baseline_dir="$RUNNER_TEMP/n1b-baseline"
          mkdir -p "$baseline_dir"
          BASELINE_MIGRATIONS=(
            supabase/migrations/001_schema.sql
            supabase/migrations/002_enums_triggers_indexes.sql
            supabase/migrations/003_functions_rpcs.sql
            supabase/migrations/007_notifications.sql
            supabase/migrations/011_notification_dispatcher_service_rpcs.sql
            supabase/migrations/018_payment_request_approver_routing.sql
            supabase/migrations/020_normalize_proveedores_canonical.sql
            supabase/migrations/025_provider_intake_foundation.sql
            supabase/migrations/027_provider_intake_edge_support.sql
            supabase/migrations/029_provider_intake_triage.sql
            supabase/migrations/030_provider_intake_action_fingerprint.sql
            supabase/migrations/031_provider_intake_matching.sql
            supabase/migrations/041_notifications_external_isolation.sql
          )
          for migration in "${BASELINE_MIGRATIONS[@]}"; do
            target="$baseline_dir/$(basename "$migration")"
            git show "origin/dev:$migration" > "$target"
            psql "$db_url" -X -v ON_ERROR_STOP=1 -f "$target" >/dev/null
          done
          printf 'baseline_count=%s\n' "${#BASELINE_MIGRATIONS[@]}" >> "$GITHUB_OUTPUT"
          printf 'baseline_apply=PASS\n' >> "$GITHUB_OUTPUT"

      - name: Run N1-B precheck
        id: precheck
        shell: bash
        run: |
          set -euo pipefail
          db_url=$(<"$RUNNER_TEMP/n1b-db-url")
          psql "$db_url" -X -qAt -F '|' -v ON_ERROR_STOP=1 \
            -f ops/notifications/n1-b/precheck.sql | tee "$RUNNER_TEMP/n1b-precheck.log"
          grep -Fq 'N1B_PRECHECK_PASS|38|0|0|disabled' "$RUNNER_TEMP/n1b-precheck.log"
          printf 'precheck=PASS\n' >> "$GITHUB_OUTPUT"

      - name: Apply Migration 042 locally once
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          db_url=$(<"$RUNNER_TEMP/n1b-db-url")
          migration=supabase/migrations/042_notifications_n1_b_external_runtime.sql
          test "$(grep -Eic '^[[:space:]]*begin;' "$migration")" -eq 1
          test "$(grep -Eic '^[[:space:]]*commit;' "$migration")" -eq 1
          psql "$db_url" -X -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          printf 'migration_apply=PASS / BEGIN=1 / COMMIT=1\n' >> "$GITHUB_OUTPUT"

      - name: Run N1-B postcheck and capture controlled snapshot
        id: postcheck
        shell: bash
        run: |
          set -euo pipefail
          db_url=$(<"$RUNNER_TEMP/n1b-db-url")
          psql "$db_url" -X -qAt -F '|' -v ON_ERROR_STOP=1 \
            -f ops/notifications/n1-b/postcheck.sql | tee "$RUNNER_TEMP/n1b-postcheck.log"
          grep -Fq 'N1B_POSTCHECK_PASS|0|0|0|0|disabled' "$RUNNER_TEMP/n1b-postcheck.log"
          psql "$db_url" -X -qAt -v ON_ERROR_STOP=1 > "$RUNNER_TEMP/n1b-controlled-before" <<'SQL'
          select jsonb_build_object(
            'external_events', (select count(*) from public.notification_events where audience = 'external'),
            'external_attempts', (select count(*) from public.notification_delivery_attempts a join public.notification_events e on e.id = a.notification_event_id where e.audience = 'external'),
            'invocations', (select count(*) from public.notification_external_dispatch_invocations),
            'payment_intake', (select count(*) from public.payment_intake),
            'payment_intake_events', (select count(*) from public.payment_intake_events),
            'rollout', (select jsonb_build_object('mode', mode, 'cutoff_at', cutoff_at, 'enabled_event_types', enabled_event_types, 'recipient_allowlist_hashes', recipient_allowlist_hashes, 'daily_cap', daily_cap, 'batch_size', batch_size) from public.notification_external_rollouts where id = 'provider-intake-v1')
          )::text;
          SQL
          printf 'postcheck=PASS\n' >> "$GITHUB_OUTPUT"

      - name: Run 60 contract tests and prove rollback
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          db_url=$(<"$RUNNER_TEMP/n1b-db-url")
          psql "$db_url" -X -qAt -F '|' -v ON_ERROR_STOP=1 \
            -f ops/notifications/n1-b/contract-tests.sql | tee "$RUNNER_TEMP/n1b-contract.log"
          test "$(grep -Ec '^[0-9]+\|[^|]+\|PASS$' "$RUNNER_TEMP/n1b-contract.log")" -eq 60
          psql "$db_url" -X -qAt -v ON_ERROR_STOP=1 > "$RUNNER_TEMP/n1b-controlled-after" <<'SQL'
          select jsonb_build_object(
            'external_events', (select count(*) from public.notification_events where audience = 'external'),
            'external_attempts', (select count(*) from public.notification_delivery_attempts a join public.notification_events e on e.id = a.notification_event_id where e.audience = 'external'),
            'invocations', (select count(*) from public.notification_external_dispatch_invocations),
            'payment_intake', (select count(*) from public.payment_intake),
            'payment_intake_events', (select count(*) from public.payment_intake_events),
            'rollout', (select jsonb_build_object('mode', mode, 'cutoff_at', cutoff_at, 'enabled_event_types', enabled_event_types, 'recipient_allowlist_hashes', recipient_allowlist_hashes, 'daily_cap', daily_cap, 'batch_size', batch_size) from public.notification_external_rollouts where id = 'provider-intake-v1')
          )::text;
          SQL
          cmp --silent "$RUNNER_TEMP/n1b-controlled-before" "$RUNNER_TEMP/n1b-controlled-after"
          psql "$db_url" -X -qAt -v ON_ERROR_STOP=1 \
            -f ops/notifications/n1-b/postcheck.sql | grep -Fq 'N1B_POSTCHECK_PASS|0|0|0|0|disabled'
          printf 'contract_tests=60/60 PASS\n' >> "$GITHUB_OUTPUT"
          printf 'rollback=PASS / CONTROLLED_STATE_EQUAL\n' >> "$GITHUB_OUTPUT"

      - name: Stop and remove sandbox
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$RUNNER_TEMP/n1b-sandbox"
          if [[ -d "$sandbox/supabase" ]] && supabase stop --no-backup --workdir "$sandbox"; then
            printf 'cleanup=PASS\n' >> "$GITHUB_OUTPUT"
          else
            printf 'cleanup=FAIL\n' >> "$GITHUB_OUTPUT"
            exit 1
          fi

  release-readiness-summary:
    if: always()
    needs: [source-tests, disposable-integration]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Build sanitized release-readiness evidence
        env:
          SOURCE_JOB: ${{ needs.source-tests.result }}
          INTEGRATION_JOB: ${{ needs.disposable-integration.result }}
          SOURCE_COMMIT: ${{ needs.source-tests.outputs.source_commit }}
          MIGRATION_SLOT: ${{ needs.source-tests.outputs.migration_slot }}
          PRODUCT_RATIO: ${{ needs.source-tests.outputs.product_ratio }}
          RATIO_EXCEPTION: ${{ needs.source-tests.outputs.ratio_exception }}
          TRIAGE_TESTS: ${{ needs.source-tests.outputs.triage_tests }}
          DENO_TESTS: ${{ needs.source-tests.outputs.deno_tests }}
          PREVIEW_STATUS: ${{ needs.source-tests.outputs.preview_status }}
          BASELINE_COUNT: ${{ needs.disposable-integration.outputs.baseline_count }}
          BASELINE_APPLY: ${{ needs.disposable-integration.outputs.baseline_apply }}
          MIGRATION_APPLY: ${{ needs.disposable-integration.outputs.migration_apply }}
          POSTCHECK: ${{ needs.disposable-integration.outputs.postcheck }}
          CONTRACT_TESTS: ${{ needs.disposable-integration.outputs.contract_tests }}
          ROLLBACK: ${{ needs.disposable-integration.outputs.rollback }}
          CLEANUP: ${{ needs.disposable-integration.outputs.cleanup }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-readiness
          python3 - <<'PY'
          import json, os
          value = lambda name, fallback="NOT_RUN": os.environ.get(name) or fallback
          ready = value("SOURCE_JOB") == "success" and value("INTEGRATION_JOB") == "success"
          blockers = [] if ready else [
              name for name, result in (
                  ("source-tests", value("SOURCE_JOB")),
                  ("disposable-integration", value("INTEGRATION_JOB")),
              ) if result != "success"
          ]
          evidence = {
              "schema_version": "notifications-n1-b-release-candidate/v1",
              "source_commit": value("SOURCE_COMMIT", os.environ.get("GITHUB_SHA", "UNKNOWN")),
              "migration_slot": value("MIGRATION_SLOT", "042"),
              "product_ratio": value("PRODUCT_RATIO"),
              "product_ratio_exception": value("RATIO_EXCEPTION"),
              "source_tests": {
                  "result": value("SOURCE_JOB"),
                  "triage": value("TRIAGE_TESTS"),
                  "deno": value("DENO_TESTS"),
              },
              "disposable_integration": {
                  "result": value("INTEGRATION_JOB"),
                  "baseline_migrations": value("BASELINE_COUNT"),
                  "baseline_apply": value("BASELINE_APPLY"),
                  "migration_042_apply": value("MIGRATION_APPLY"),
                  "postcheck": value("POSTCHECK"),
                  "contract_tests": value("CONTRACT_TESTS"),
                  "rollback": value("ROLLBACK"),
                  "cleanup": value("CLEANUP"),
              },
              "preview_status": value("PREVIEW_STATUS", "TECHNICALLY_AVAILABLE_NOT_AUTHORIZED"),
              "readiness_criteria": {
                  "source_validated": value("SOURCE_JOB") == "success",
                  "local_integration_validated": value("INTEGRATION_JOB") == "success",
                  "dev_apply_authorized": False,
                  "uat_executed": False,
                  "ready_authorized": False,
              },
              "release_candidate_ready": ready,
              "blockers": blockers,
              "next_action": "NOTIFICATIONS-N1-B-DEV-VALIDATION" if ready else "STOP",
          }
          with open("release-readiness/evidence.json", "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, indent=2, sort_keys=True)
              handle.write("\n")
          summary = [
              "# Notifications N1-B release readiness",
              "",
              f"- Source tests: {value('SOURCE_JOB')}",
              f"- Disposable integration: {value('INTEGRATION_JOB')}",
              f"- Product ratio: {value('PRODUCT_RATIO')}",
              f"- Contract tests: {value('CONTRACT_TESTS')}",
              f"- Rollback: {value('ROLLBACK')}",
              f"- Cleanup: {value('CLEANUP')}",
              f"- Next action: {evidence['next_action']}",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(summary) + "\n")
          PY

      - name: Upload single release-readiness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notifications-n1-b-release-candidate
          path: release-readiness/evidence.json
          retention-days: 3
          if-no-files-found: error

      - name: Enforce release-candidate readiness
        if: always()
        shell: bash
        run: |
          test "${{ needs.source-tests.result }}" = success
          test "${{ needs.disposable-integration.result }}" = success
