name: One-shot update DEV notification test recipient

'on':
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/one-shot-update-dev-notification-test-recipient.yml'

permissions:
  contents: read

concurrency:
  group: one-shot-update-dev-notification-test-recipient
  cancel-in-progress: false

jobs:
  update_dev_test_recipient:
    name: Point DEV test-only notifications to Ramon Gmail
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/update-dev-test-recipient-ramon-20260824' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: DEV

    env:
      PROJECT_REF: scsirgbuqjcwoaxfacth
      TARGET_PROFILE_ID: 5c203bf6-9040-47c3-b89f-cd25f72f14dd
      SUPABASE_CLI_VERSION: 2.114.0

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable one-shot scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "pull_request"
          test "${GITHUB_BASE_REF}" = "main"
          test "${GITHUB_HEAD_REF}" = "ops/update-dev-test-recipient-ramon-20260824"
          test "${PROJECT_REF}" = "scsirgbuqjcwoaxfacth"
          test "${TARGET_PROFILE_ID}" = "5c203bf6-9040-47c3-b89f-cd25f72f14dd"
          git cat-file -e "${{ github.event.pull_request.base.sha }}^{commit}"
          mapfile -t changed < <(git diff --name-only "${{ github.event.pull_request.base.sha }}"..HEAD | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/one-shot-update-dev-notification-test-recipient.yml"

      - name: Resolve Ramon email from DEV and update Edge Function secret
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          echo "::add-mask::${SUPABASE_ACCESS_TOKEN}"

          keys_file="${RUNNER_TEMP}/dev-api-keys.json"
          curl --silent --show-error --fail \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys?reveal=true" \
            > "${keys_file}"

          elevated_key="$(KEYS_FILE="${keys_file}" python3 - <<'PY'
          import json, os
          rows = json.load(open(os.environ['KEYS_FILE'], encoding='utf-8'))
          preferred = [row for row in rows if row.get('name') == 'service_role' and row.get('api_key')]
          fallback = [row for row in rows if row.get('type') == 'secret' and row.get('api_key')]
          candidates = preferred or fallback
          if not candidates:
              raise SystemExit('DEV_ELEVATED_API_KEY_NOT_FOUND')
          print(candidates[0]['api_key'])
          PY
          )"
          test -n "${elevated_key}"
          echo "::add-mask::${elevated_key}"

          profile_file="${RUNNER_TEMP}/dev-target-profile.json"
          curl --silent --show-error --fail \
            -H "apikey: ${elevated_key}" \
            -H "Authorization: Bearer ${elevated_key}" \
            -H 'Accept: application/json' \
            "https://${PROJECT_REF}.supabase.co/rest/v1/profiles?id=eq.${TARGET_PROFILE_ID}&select=id,email,active&limit=1" \
            > "${profile_file}"

          target_email="$(PROFILE_FILE="${profile_file}" TARGET_PROFILE_ID="${TARGET_PROFILE_ID}" python3 - <<'PY'
          import json, os, re
          rows = json.load(open(os.environ['PROFILE_FILE'], encoding='utf-8'))
          if len(rows) != 1 or rows[0].get('id') != os.environ['TARGET_PROFILE_ID']:
              raise SystemExit('DEV_TARGET_PROFILE_NOT_UNIQUE')
          if rows[0].get('active') is False:
              raise SystemExit('DEV_TARGET_PROFILE_INACTIVE')
          email = str(rows[0].get('email') or '').strip().lower()
          if not re.fullmatch(r'[^@\s]+@[^@\s]+\.[^@\s]+', email):
              raise SystemExit('DEV_TARGET_EMAIL_INVALID')
          print(email)
          PY
          )"
          test -n "${target_email}"
          echo "::add-mask::${target_email}"

          npx --yes "supabase@${SUPABASE_CLI_VERSION}" secrets set \
            "NOTIFICATION_TEST_EMAIL=${target_email}" \
            --project-ref "${PROJECT_REF}" \
            > "${RUNNER_TEMP}/secret-set.txt"

          npx --yes "supabase@${SUPABASE_CLI_VERSION}" secrets list \
            --project-ref "${PROJECT_REF}" \
            > "${RUNNER_TEMP}/secret-list.txt"
          grep -q 'NOTIFICATION_TEST_EMAIL' "${RUNNER_TEMP}/secret-list.txt"

          printf '%s\n' 'PASS / DEV_NOTIFICATION_TEST_RECIPIENT_UPDATED'
          printf '%s\n' 'recipient_source=active_DEV_profile'
          printf '%s\n' 'recipient_value=masked'
          printf '%s\n' 'product_code_changed=NO'
          printf '%s\n' 'prod_changed=NO'

      - name: Remove transient sensitive files
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/dev-api-keys.json" \
            "${RUNNER_TEMP}/dev-target-profile.json" \
            "${RUNNER_TEMP}/secret-set.txt" \
            "${RUNNER_TEMP}/secret-list.txt"
