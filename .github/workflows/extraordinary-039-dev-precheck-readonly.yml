name: Extraordinary 039 DEV read-only precheck

on:
  push:
    branches:
      - feature/ramon-post-yanin-bugs-extraordinary
    paths:
      - .github/workflows/extraordinary-039-dev-precheck-readonly.yml
      - scripts/qa/extraordinary-039-dev-precheck-readonly.sql

permissions:
  contents: read
  deployments: read
  pull-requests: read
  statuses: read

concurrency:
  group: extraordinary-039-dev-read-only-precheck
  cancel-in-progress: false

env:
  DEV_PROJECT_REF: scsirgbuqjcwoaxfacth
  EXPECTED_PARENT: fe4a62de0f55139d5d07f66eb6bda07b3e0f3996
  EXPECTED_BASE: eccb7adb37e64782146c0907513f6667d8765d51
  EXPECTED_MIGRATION_SHA256: 4b87e078916c663c9238c8d7cf842212bf59b680a7c7de53ad2554ed498789ec
  FEATURE_BRANCH: feature/ramon-post-yanin-bugs-extraordinary
  PR_NUMBER: "277"
  EVIDENCE_DIR: /tmp/extraordinary-039-dev-precheck
  MIGRATION_FILE: supabase/migrations/039_enable_extraordinary_evidence_storage_policy_helper.sql

jobs:
  precheck:
    name: MEJ-05 039 read-only precheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: DEV

    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Guard repository, branch, commit scope and PR identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = \
            "ramon1415/catalogo-proveedores-flux"
          test "$GITHUB_REF_NAME" = "$FEATURE_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD

          mapfile -t changed_files < <(
            git diff --name-only HEAD^ HEAD | sort
          )
          expected_files=(
            ".github/workflows/extraordinary-039-dev-precheck-readonly.yml"
            "scripts/qa/extraordinary-039-dev-precheck-readonly.sql"
            "scripts/qa/extraordinary-039-dev-postcheck-readonly.sql"
            "scripts/qa/extraordinary-039-private-logical-backup.sql"
            "scripts/qa/extraordinary-storage-policy-helper-039-contract.test.mjs"
            "scripts/qa/shadow/039_postgrant_storage_policy_contracts.sql"
            "supabase/migrations/039_enable_extraordinary_evidence_storage_policy_helper.sql"
          )
          mapfile -t expected_files < <(
            printf '%s\n' "${expected_files[@]}" | sort
          )
          test "${#changed_files[@]}" -eq "${#expected_files[@]}"
          for index in "${!expected_files[@]}"; do
            test "${changed_files[$index]}" = "${expected_files[$index]}"
          done

          mapfile -t cumulative_files < <(
            git diff --name-only "$EXPECTED_BASE" HEAD | sort
          )
          expected_cumulative_files=(
            ".github/workflows/extraordinary-039-dev-precheck-readonly.yml"
            "scripts/qa/extraordinary-039-dev-precheck-readonly.sql"
            "scripts/qa/extraordinary-039-dev-postcheck-readonly.sql"
            "scripts/qa/extraordinary-039-dev-uat.mjs"
            "scripts/qa/extraordinary-039-private-logical-backup.sql"
            "scripts/qa/extraordinary-storage-policy-helper-039-contract.test.mjs"
            "scripts/qa/shadow/039_postgrant_storage_policy_contracts.sql"
            "scripts/qa/shadow/039_pregrant_storage_policy_contracts.sql"
            "scripts/qa/shadow/run-extraordinary-migrations.ps1"
            "supabase/migrations/039_enable_extraordinary_evidence_storage_policy_helper.sql"
          )
          mapfile -t expected_cumulative_files < <(
            printf '%s\n' "${expected_cumulative_files[@]}" | sort
          )
          test "${#cumulative_files[@]}" -eq \
            "${#expected_cumulative_files[@]}"
          for index in "${!expected_cumulative_files[@]}"; do
            test "${cumulative_files[$index]}" = \
              "${expected_cumulative_files[$index]}"
          done

          pr_json="$(
            gh api \
              "repos/ramon1415/catalogo-proveedores-flux/pulls/$PR_NUMBER"
          )"
          test "$(jq -r '.state' <<<"$pr_json")" = "open"
          test "$(jq -r '.draft' <<<"$pr_json")" = "true"
          test "$(jq -r '.base.ref' <<<"$pr_json")" = "dev"
          test "$(jq -r '.head.ref' <<<"$pr_json")" = "$FEATURE_BRANCH"
          test "$(jq -r '.head.sha' <<<"$pr_json")" = "$GITHUB_SHA"
          test "$(jq -r '.merged' <<<"$pr_json")" = "false"

      - name: Confirm DEV secret and install psql
        shell: bash
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DEV_DB_URL"
          echo "::add-mask::$SUPABASE_DEV_DB_URL"
          test "$DEV_PROJECT_REF" = "scsirgbuqjcwoaxfacth"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get -qq update >/dev/null
            sudo apt-get -qq install -y postgresql-client >/dev/null
          fi
          psql --version

      - name: Execute exact read-only precheck
        shell: bash
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_DEV_DB_URL"
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"

          export PGOPTIONS="\
          -c default_transaction_read_only=on \
          -c statement_timeout=30000 \
          -c lock_timeout=5000"

          psql "$SUPABASE_DEV_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --set VERBOSITY=terse \
            --file scripts/qa/extraordinary-039-dev-precheck-readonly.sql \
            | tee "$EVIDENCE_DIR/precheck-result.txt"

          grep -F '"result": "MEJ05_039_PRECHECK_PASS"' \
            "$EVIDENCE_DIR/precheck-result.txt"
          grep -F '"transaction_read_only": "on"' \
            "$EVIDENCE_DIR/precheck-result.txt"
          grep -F 'ROLLBACK' "$EVIDENCE_DIR/precheck-result.txt"

      - name: Upload sanitized precheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraordinary-039-dev-precheck-${{ github.run_id }}
          path: /tmp/extraordinary-039-dev-precheck/
          if-no-files-found: warn
          retention-days: 7

  migrate:
    name: Apply exact migration 039 once
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: DEV
    env:
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MIGRATION_EVIDENCE_DIR: /tmp/extraordinary-039-migration

    steps:
      - name: Checkout exact prechecked commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Reconfirm immutable migration identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$FEATURE_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(
            sha256sum "$MIGRATION_FILE" | cut -d' ' -f1
          )" = "$EXPECTED_MIGRATION_SHA256"
          test "$(
            git diff --name-only "$EXPECTED_BASE" "$GITHUB_SHA" \
              -- supabase/migrations/036_quarantine_legacy_extraordinary_authorizations.sql \
                 supabase/migrations/037_secure_extraordinary_external_authorization.sql \
                 supabase/migrations/038_materialize_only_released_batch_items.sql
          )" = ""

          pr_json="$(
            gh api \
              "repos/ramon1415/catalogo-proveedores-flux/pulls/$PR_NUMBER"
          )"
          test "$(jq -r '.state' <<<"$pr_json")" = "open"
          test "$(jq -r '.draft' <<<"$pr_json")" = "true"
          test "$(jq -r '.head.sha' <<<"$pr_json")" = "$GITHUB_SHA"
          test "$(jq -r '.merged' <<<"$pr_json")" = "false"

      - name: Wait for Vercel Preview and verify public pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          preview_url=""
          for _ in $(seq 1 60); do
            status_json="$(
              gh api \
                "repos/ramon1415/catalogo-proveedores-flux/commits/$GITHUB_SHA/status"
            )"
            vercel_state="$(
              jq -r '
                [.statuses[] | select(.context == "Vercel")][0].state // ""
              ' <<<"$status_json"
            )"
            if [ "$vercel_state" = "failure" ] || \
               [ "$vercel_state" = "error" ]; then
              echo "::error::Vercel Preview failed"
              exit 1
            fi
            if [ "$vercel_state" = "success" ]; then
              deployments="$(
                gh api \
                  "repos/ramon1415/catalogo-proveedores-flux/deployments?sha=$GITHUB_SHA&per_page=30"
              )"
              deployment_id="$(
                jq -r '
                  map(select(
                    (.environment // "") |
                    test("preview"; "i")
                  ))[0].id // empty
                ' <<<"$deployments"
              )"
              if [ -n "$deployment_id" ]; then
                preview_url="$(
                  gh api \
                    "repos/ramon1415/catalogo-proveedores-flux/deployments/$deployment_id/statuses" \
                    --jq '.[0].environment_url // empty'
                )"
              fi
              if [ -n "$preview_url" ]; then
                break
              fi
            fi
            sleep 10
          done
          test -n "$preview_url"
          case "$preview_url" in
            https://*.vercel.app*) ;;
            *)
              echo "::error::Unexpected Preview URL"
              exit 1
              ;;
          esac
          for page in "" "solicitudes.html" "layouts.html" \
            "approval_batches.html"; do
            target="${preview_url%/}/${page}"
            curl --fail --silent --show-error --head "$target" \
              >/dev/null
            curl --fail --silent --show-error "$target" \
              --output /dev/null
          done

      - name: Verify real-session UAT credentials before migration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          curl --silent --show-error --fail \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$DEV_PROJECT_REF/api-keys?reveal=true" \
            > "$response"
          anon_key="$(
            jq -er '.[] | select(.name == "anon") | .api_key' "$response"
          )"
          service_key="$(
            jq -er \
              '.[] | select(.name == "service_role") | .api_key' \
              "$response"
          )"
          test -n "$anon_key"
          test -n "$service_key"
          echo "::add-mask::$anon_key"
          echo "::add-mask::$service_key"
          curl --silent --show-error --fail \
            -H "apikey: $anon_key" \
            "https://$DEV_PROJECT_REF.supabase.co/auth/v1/health" \
            --output /dev/null
          curl --silent --show-error --fail \
            -H "apikey: $service_key" \
            -H "Authorization: Bearer $service_key" \
            "https://$DEV_PROJECT_REF.supabase.co/auth/v1/admin/users?page=1&per_page=1" \
            --output /dev/null

      - name: Install psql and create private logical backup
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DEV_DB_URL"
          echo "::add-mask::$SUPABASE_DEV_DB_URL"
          case "$SUPABASE_DEV_DB_URL" in
            *"$DEV_PROJECT_REF"*) ;;
            *)
              echo "::error::Non-DEV database URL"
              exit 1
              ;;
          esac
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get -qq update >/dev/null
            sudo apt-get -qq install -y postgresql-client >/dev/null
          fi
          rm -rf "$MIGRATION_EVIDENCE_DIR"
          mkdir -p "$MIGRATION_EVIDENCE_DIR"
          umask 077
          export PGOPTIONS="\
          -c default_transaction_read_only=on \
          -c statement_timeout=30000 \
          -c lock_timeout=5000"
          psql "$SUPABASE_DEV_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --set VERBOSITY=terse \
            --file scripts/qa/extraordinary-039-private-logical-backup.sql \
            > "$MIGRATION_EVIDENCE_DIR/private-backup.raw"
          grep '^{' "$MIGRATION_EVIDENCE_DIR/private-backup.raw" \
            | tail -n 1 \
            > "$MIGRATION_EVIDENCE_DIR/private-backup.json"
          jq -e '
            .backup_kind == "EXTRAORDINARY_039_PRIVATE_LOGICAL_BACKUP"
            and .transaction_read_only == "on"
            and .bucket.object_count == 0
            and .extraordinary_policy_counts.operadora_enabled == 0
          ' "$MIGRATION_EVIDENCE_DIR/private-backup.json" >/dev/null

      - name: Apply exact migration 039 once
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_DEV_DB_URL"
          unset PGOPTIONS
          set +e
          psql "$SUPABASE_DEV_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --set VERBOSITY=terse \
            --file "$MIGRATION_FILE" \
            > "$MIGRATION_EVIDENCE_DIR/migration-result.log" 2>&1
          migration_exit=$?
          set -e
          if [ "$migration_exit" -ne 0 ]; then
            echo "::error::BLOCKED_MIGRATION_039_FIRST_ATTEMPT_FAILED"
            exit "$migration_exit"
          fi
          grep -F "MIGRATION_039_POSTCHECK_PASS" \
            "$MIGRATION_EVIDENCE_DIR/migration-result.log"

      - name: Run remote read-only postcheck and compare immutable baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_DEV_DB_URL"
          export PGOPTIONS="\
          -c default_transaction_read_only=on \
          -c statement_timeout=30000 \
          -c lock_timeout=5000"
          psql "$SUPABASE_DEV_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --set VERBOSITY=terse \
            --file scripts/qa/extraordinary-039-dev-postcheck-readonly.sql \
            > "$MIGRATION_EVIDENCE_DIR/postcheck.raw"
          grep '^{' "$MIGRATION_EVIDENCE_DIR/postcheck.raw" \
            | tail -n 1 \
            > "$MIGRATION_EVIDENCE_DIR/postcheck-sanitized.json"
          jq -e '
            .result == "MIGRATION_039_POSTCHECK_PASS"
            and .transaction_read_only == "on"
            and .authenticated_execute == true
            and .anon_execute == false
            and .public_execute == false
            and .bucket_private == true
            and .bucket_object_count == 0
          ' "$MIGRATION_EVIDENCE_DIR/postcheck-sanitized.json" >/dev/null
          jq -e -n \
            --slurpfile before \
              "$MIGRATION_EVIDENCE_DIR/private-backup.json" \
            --slurpfile after \
              "$MIGRATION_EVIDENCE_DIR/postcheck-sanitized.json" '
              $before[0].helper.body_sha256 ==
                $after[0].helper_body_sha256
              and $before[0].business_counts ==
                $after[0].business_counts
              and $before[0].allocation_integrity ==
                $after[0].allocation_integrity
            ' >/dev/null
          grep -F "ROLLBACK" "$MIGRATION_EVIDENCE_DIR/postcheck.raw"

      - name: Upload sanitized migration evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraordinary-039-migration-${{ github.run_id }}
          path: |
            /tmp/extraordinary-039-migration/migration-result.log
            /tmp/extraordinary-039-migration/postcheck-sanitized.json
          if-no-files-found: warn
          retention-days: 7

  uat:
    name: MEJ-05 secure end-to-end UAT
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: DEV
    env:
      SUPABASE_URL: https://scsirgbuqjcwoaxfacth.supabase.co
      SUPABASE_DEV_PROJECT_REF: scsirgbuqjcwoaxfacth
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DEV_ANON_KEY: ${{ secrets.SUPABASE_DEV_ANON_KEY }}
      SUPABASE_DEV_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_DEV_SERVICE_ROLE_KEY }}
      UAT_EVIDENCE_DIR: /tmp/extraordinary-039-uat

    steps:
      - name: Checkout exact migrated commit
        uses: actions/checkout@v4

      - name: Re-run focused contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/qa/extraordinary-039-dev-uat.mjs
          node --test \
            scripts/qa/extraordinary-migration-catalog-contract.test.mjs \
            scripts/qa/legacy-extraordinary-direct-lineage-contract.test.mjs \
            scripts/qa/mixed-close-038-contract.test.mjs \
            scripts/qa/post-yanin-regressions-contract.test.mjs \
            scripts/qa/secure-extraordinary-external-authorization-contract.test.mjs \
            scripts/qa/extraordinary-storage-policy-helper-039-contract.test.mjs

      - name: Install ephemeral DEV API keys
        shell: bash
        run: |
          set -euo pipefail
          anon_key="${SUPABASE_DEV_ANON_KEY:-}"
          service_key="${SUPABASE_DEV_SERVICE_ROLE_KEY:-}"

          if [ -z "$anon_key" ] || [ -z "$service_key" ]; then
            test -n "${SUPABASE_ACCESS_TOKEN:-}"
            echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
            response="$(mktemp)"
            trap 'rm -f "$response"' EXIT
            curl --silent --show-error --fail \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$DEV_PROJECT_REF/api-keys?reveal=true" \
              > "$response"
            anon_key="$(
              jq -er '.[] | select(.name == "anon") | .api_key' "$response"
            )"
            service_key="$(
              jq -er \
                '.[] | select(.name == "service_role") | .api_key' \
                "$response"
            )"
          fi

          test -n "$anon_key"
          test -n "$service_key"
          echo "::add-mask::$anon_key"
          echo "::add-mask::$service_key"
          {
            echo "SUPABASE_DEV_ANON_KEY=$anon_key"
            echo "SUPABASE_DEV_SERVICE_ROLE_KEY=$service_key"
          } >> "$GITHUB_ENV"

      - name: Install isolated UAT dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install \
            --no-save \
            --no-package-lock \
            --ignore-scripts \
            @supabase/supabase-js@2 \
            pg@8

      - name: Execute real-session Storage and MEJ-05 UAT
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DEV_DB_URL"
          test -n "$SUPABASE_DEV_ANON_KEY"
          test -n "$SUPABASE_DEV_SERVICE_ROLE_KEY"
          echo "::add-mask::$SUPABASE_DEV_DB_URL"
          echo "::add-mask::$SUPABASE_DEV_ANON_KEY"
          echo "::add-mask::$SUPABASE_DEV_SERVICE_ROLE_KEY"
          rm -rf "$UAT_EVIDENCE_DIR"
          mkdir -p "$UAT_EVIDENCE_DIR"
          node scripts/qa/extraordinary-039-dev-uat.mjs
          jq -e '
            .result == "READY_FOR_RAMON_REVIEW"
            and .evidence_upload == "MEJ05_EVIDENCE_UPLOAD_PASS"
            and .storage_negative == "MEJ05_STORAGE_NEGATIVE_PASS"
            and .evidence_read == "MEJ05_EVIDENCE_READ_PASS"
            and .secure_extraordinary_uat ==
              "SECURE_EXTRAORDINARY_UAT_PASS"
            and .secure_extraordinary_negative ==
              "SECURE_EXTRAORDINARY_NEGATIVE_PASS"
            and .payment_receipts_delta == 0
            and .paid_delta == 0
            and .notifications_delta == 0
            and .delivery_attempts_delta == 0
            and .alloc_001_intact == true
            and .operadora_policy_enabled == false
            and .qa_cleanup == "PASS"
            and .prod_writes == 0
          ' "$UAT_EVIDENCE_DIR/uat-result-sanitized.json" >/dev/null

      - name: Upload sanitized UAT evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraordinary-039-uat-${{ github.run_id }}
          path: /tmp/extraordinary-039-uat/uat-result-sanitized.json
          if-no-files-found: warn
          retention-days: 7
