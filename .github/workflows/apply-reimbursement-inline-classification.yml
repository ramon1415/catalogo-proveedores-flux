name: Apply reimbursement inline classification

on:
  push:
    branches:
      - codex/reimbursement-inline-classification-prod

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply focused UX fix
        run: python .github/scripts/apply_reimbursement_inline_classification.py

      - name: Preserve reimbursement editor compatibility
        run: python .github/scripts/preserve_reimbursement_editor_compatibility.py

      - name: Install React dependencies
        run: npm --prefix app ci

      - name: Run focused and regression contracts
        run: >-
          node --test
          scripts/qa/reimbursement-inline-classification-ux.test.mjs
          scripts/qa/prod-reimbursement-ux-hotfix.test.mjs
          scripts/qa/prod-reimbursement-permissions.test.mjs
          scripts/qa/solicitudes-scroll-contract.test.mjs
          scripts/qa/fonacot-no-presupuestal-prod-contract.test.mjs

      - name: Build production React artifact
        run: npm --prefix app run build

      - name: Commit validated hotfix
        run: |
          git config user.name "ramon1415"
          git config user.email "ramon@quantta.mx"
          git rm \
            .github/workflows/apply-reimbursement-inline-classification.yml \
            .github/scripts/apply_reimbursement_inline_classification.py \
            .github/scripts/preserve_reimbursement_editor_compatibility.py
          git add \
            app/src/features/solicitudes/RequestModal.tsx \
            app/src/features/solicitudes/ReimbursementSection.tsx \
            app/src/features/solicitudes/Solicitudes.module.css \
            scripts/qa/reimbursement-inline-classification-ux.test.mjs
          git commit -m "fix(solicitudes): integrar clasificación en desglose de reembolsos"
          git push origin HEAD:codex/reimbursement-inline-classification-prod
