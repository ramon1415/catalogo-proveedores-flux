name: Apply reimbursement inline classification

on:
  push:
    branches:
      - codex/reimbursement-inline-classification-prod

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply focused UX fix
        run: python .github/scripts/apply_reimbursement_inline_classification.py

      - name: Preserve reimbursement editor compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/features/solicitudes/ReimbursementSection.tsx')
          text = path.read_text(encoding='utf-8')

          old_types = """  companies: Company[]
  costCenters: CostCenter[]
  companyId: string
  costCenterId: string
  budgetMonth: string
  companyLocked: boolean
  onCompanyChange: (id: string) => void
  onCostCenterChange: (id: string) => void
  onBudgetMonthChange: (month: string) => void
  categoryHelp: { text: string; state: string }"""
          new_types = """  companies?: Company[]
  costCenters?: CostCenter[]
  companyId: string
  costCenterId?: string
  budgetMonth?: string
  companyLocked?: boolean
  onCompanyChange?: (id: string) => void
  onCostCenterChange?: (id: string) => void
  onBudgetMonthChange?: (month: string) => void
  categoryHelp?: { text: string; state: string }"""
          if text.count(old_types) != 1:
              raise SystemExit('optional scope prop block not found exactly once')
          text = text.replace(old_types, new_types, 1)

          start = """        <div className={s.reimbursementScope}>
          <div className={s.reimbursementScopeIntro}>"""
          wrapped_start = """        {companies && costCenters && costCenterId !== undefined && budgetMonth !== undefined
          && onCompanyChange && onCostCenterChange && onBudgetMonthChange && categoryHelp ? (
          <div className={s.reimbursementScope}>
            <div className={s.reimbursementScopeIntro}>"""
          if text.count(start) != 1:
              raise SystemExit('scope start not found exactly once')
          text = text.replace(start, wrapped_start, 1)

          end = """        </div>

        <div className={`${s.fieldHint} ${s.fullRow}`}>"""
          wrapped_end = """          </div>
        ) : null}

        <div className={`${s.fieldHint} ${s.fullRow}`}>"""
          if text.count(end) != 1:
              raise SystemExit('scope end not found exactly once')
          text = text.replace(end, wrapped_end, 1)
          text = text.replace('disabled={companyLocked}', 'disabled={companyLocked === true}', 1)
          text = text.replace('{!companyLocked && <option', '{companyLocked !== true && <option', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install React dependencies
        run: npm --prefix app ci

      - name: Run focused and regression contracts
        run: >-
          node --test
          scripts/qa/reimbursement-inline-classification-ux.test.mjs
          scripts/qa/prod-reimbursement-ux-hotfix.test.mjs
          scripts/qa/prod-reimbursement-permissions.test.mjs
          scripts/qa/solicitudes-scroll-contract.test.mjs
          scripts/qa/fonacot-no-presupuestal-prod-contract.test.mjs

      - name: Build production React artifact
        run: npm --prefix app run build

      - name: Commit validated hotfix
        run: |
          git config user.name "ramon1415"
          git config user.email "ramon@quantta.mx"
          git rm \
            .github/workflows/apply-reimbursement-inline-classification.yml \
            .github/scripts/apply_reimbursement_inline_classification.py
          git add \
            app/src/features/solicitudes/RequestModal.tsx \
            app/src/features/solicitudes/ReimbursementSection.tsx \
            app/src/features/solicitudes/Solicitudes.module.css \
            scripts/qa/reimbursement-inline-classification-ux.test.mjs
          git commit -m "fix(solicitudes): integrar clasificación en desglose de reembolsos"
          git push origin HEAD:codex/reimbursement-inline-classification-prod
