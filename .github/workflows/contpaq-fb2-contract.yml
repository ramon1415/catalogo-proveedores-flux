name: CONTPAQ FB-2 / FB-3 contract

on:
  pull_request:
    paths:
      - "lib/parsers/**"
      - "lib/contpaq/**"
      - "upload_helper.js"
      - "contpaq_mapping_candidates.js"
      - "supabase/migrations/20260826153000_payment_request_cfdi_facts.sql"
      - "scripts/qa/contpaq-fb2-*.test.mjs"
      - "scripts/qa/contpaq-fb2-browser-harness.html"
      - "scripts/qa/contpaq-fb3-mapping-candidates.test.mjs"
      - "docs/architecture/contpaq-fb2-fb3-dev-contract.md"
      - ".github/workflows/contpaq-fb2-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check upload_helper.js
          node --check contpaq_mapping_candidates.js
          node --input-type=module --check < lib/parsers/cfdiCore.js
          node --input-type=module --check < lib/parsers/cfdiBrowser.js
          node --input-type=module --check < lib/contpaq/cfdiValidation.js
          node --input-type=module --check < lib/contpaq/cfdiIngestion.js
      - name: FB-2 parser contract
        run: node --test scripts/qa/contpaq-fb2-parser-contract.test.mjs
      - name: FB-2 validation contract
        run: node --test scripts/qa/contpaq-fb2-cfdi-validation.test.mjs
      - name: FB-2 ingestion and RLS contract
        run: node --test scripts/qa/contpaq-fb2-ingestion-contract.test.mjs
      - name: FB-2 browser runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/fb2-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          browser=""
          for candidate in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              browser="$candidate"
              break
            fi
          done
          if [ -z "$browser" ]; then
            echo "No Chrome/Chromium binary found on runner" >&2
            exit 1
          fi

          for _ in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/scripts/qa/contpaq-fb2-browser-harness.html >/dev/null; then break; fi
            sleep 0.25
          done

          output="$($browser --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8765/scripts/qa/contpaq-fb2-browser-harness.html 2>/tmp/fb2-browser.err)"
          printf '%s\n' "$output"
          grep -q 'data-status="pass"' <<<"$output"
      - name: FB-3 candidate contract
        run: node --test scripts/qa/contpaq-fb3-mapping-candidates.test.mjs
