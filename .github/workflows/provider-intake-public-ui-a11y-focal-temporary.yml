name: Temporary DEV provider portal post-fix Axe focal

on:
  push:
    branches:
      - feature/ramon-provider-public-portal-ui
    paths:
      - ops/provider-intake/public-ui-a11y-focal.authorization.json

permissions:
  contents: read

concurrency:
  group: provider-intake-public-ui-dev-a11y-focal
  cancel-in-progress: false

jobs:
  focal:
    name: Playwright DEV post-fix Axe focal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: DEV
    env:
      AUTHORIZATION_FILE: ops/provider-intake/public-ui-a11y-focal.authorization.json
      PRODUCT_HEAD: d701e0071cf0a93d3055b981c5daf91b300c68fe
      EXPECTED_BACKEND_TREE: 379f65801609e40143d948b3de702e391636c512
      PREVIEW_URL: https://catalogo-proveedores-flux-git-feature-ramon-69af24-quantta-team.vercel.app/solicitar.html
      PREVIEW_ORIGIN: https://catalogo-proveedores-flux-git-feature-ramon-69af24-quantta-team.vercel.app
      FUNCTION_BASE_URL: https://scsirgbuqjcwoaxfacth.functions.supabase.co/provider-intake
      QA_LINK_ID: 9f9ffd31-926a-4d43-be53-f5090d401c9c
      PROVIDER_INTAKE_QA_TOKEN: ${{ secrets.PROVIDER_INTAKE_QA_TOKEN }}
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}

    steps:
      - name: Checkout authorized commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize runner-only paths
        shell: bash
        run: |
          set -euo pipefail
          echo "FOCAL_WORK_DIR=$RUNNER_TEMP/provider-intake-public-ui-a11y-focal" >> "$GITHUB_ENV"
          echo "FOCAL_OUTPUT_DIR=$RUNNER_TEMP/provider-intake-public-ui-a11y-focal/evidence" >> "$GITHUB_ENV"

      - name: Validate authorization and immutable scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feature/ramon-provider-public-portal-ui"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$PRODUCT_HEAD" HEAD

          node <<'NODE'
          const fs = require("fs");
          const marker = JSON.parse(fs.readFileSync(process.env.AUTHORIZATION_FILE, "utf8"));
          const expected = {
            confirm: "RUN_PROVIDER_PUBLIC_UI_A11Y_FOCAL_DEV_ONLY",
            project_ref: "scsirgbuqjcwoaxfacth",
            pr: 256,
            expected_head: "d701e0071cf0a93d3055b981c5daf91b300c68fe",
            expected_backend_tree: "379f65801609e40143d948b3de702e391636c512",
            preview_origin: "https://catalogo-proveedores-flux-git-feature-ramon-69af24-quantta-team.vercel.app",
            submit_allowed: false,
          };
          if (JSON.stringify(marker) !== JSON.stringify(expected)) {
            throw new Error("authorization_marker_mismatch");
          }
          NODE

          mapfile -t changed < <(git diff --name-only "$PRODUCT_HEAD"..HEAD | sort)
          expected_changed=(
            ".github/workflows/provider-intake-public-ui-a11y-focal-temporary.yml"
            "ops/provider-intake/public-ui-a11y-focal.authorization.json"
            "scripts/qa/provider-intake-public-ui-a11y-focal.playwright.mjs"
          )
          test "${changed[*]}" = "${expected_changed[*]}"
          test "$(git ls-tree HEAD supabase/functions/provider-intake | awk '{print $3}')" = "$EXPECTED_BACKEND_TREE"
          test -n "$PROVIDER_INTAKE_QA_TOKEN"
          test -n "$SUPABASE_DEV_DB_URL"

      - name: Run contractual checks
        shell: bash
        run: |
          set -euo pipefail
          node --check solicitar-config.js
          node --check solicitar-core.js
          node --check solicitar.js
          node --check scripts/qa/provider-intake-public-ui-contract.test.mjs
          node --check scripts/qa/provider-intake-public-ui-a11y-focal.playwright.mjs
          node --test scripts/qa/provider-intake-public-ui-contract.test.mjs
          git diff --check "$PRODUCT_HEAD"..HEAD

      - name: Install pinned cloud-only focal dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FOCAL_WORK_DIR"
          npm install --prefix "$FOCAL_WORK_DIR" --no-audit --no-fund \
            playwright@1.55.0 \
            @axe-core/playwright@4.10.2 \
            pg@8.16.3
          cp scripts/qa/provider-intake-public-ui-a11y-focal.playwright.mjs "$FOCAL_WORK_DIR/focal.mjs"
          "$FOCAL_WORK_DIR/node_modules/.bin/playwright" install --with-deps chromium

      - name: Prepare protected link and baseline
        shell: bash
        run: |
          set -euo pipefail
          node "$FOCAL_WORK_DIR/focal.mjs" prepare

      - name: Run post-fix Axe focal
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node "$FOCAL_WORK_DIR/focal.mjs" focal

      - name: Restore temporary link values when applicable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node "$FOCAL_WORK_DIR/focal.mjs" restore

      - name: Upload sanitized focal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-intake-public-ui-a11y-focal
          path: ${{ runner.temp }}/provider-intake-public-ui-a11y-focal/evidence
          if-no-files-found: error
          retention-days: 3
