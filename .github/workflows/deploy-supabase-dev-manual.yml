name: Deploy Supabase DEV Manual

on:
  workflow_dispatch:
    inputs:
      script_path:
        description: "Repo path to a SQL deployment folder or load SQL file. Folder must include precheck.sql, load.sql, postcheck.sql."
        required: true
        type: string
      confirm_dev:
        description: "Type the DEV Supabase project ref to confirm: scsirgbuqjcwoaxfacth"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-dev-manual
  cancel-in-progress: false

jobs:
  deploy-supabase-dev:
    name: Execute controlled SQL in Supabase DEV
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    if: github.ref != 'refs/heads/main'
    env:
      CONFIRM_DEV: ${{ inputs.confirm_dev }}
      EXPECTED_SUPABASE_DEV_PROJECT_REF: scsirgbuqjcwoaxfacth
      OPS_EVIDENCE_DIR: .ops-evidence/supabase-dev
      SCRIPT_PATH: ${{ inputs.script_path }}
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}

    steps:
      - name: Guard DEV confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm_dev }}" != "scsirgbuqjcwoaxfacth" ]]; then
            echo "::error::DEV confirmation does not match the expected Supabase DEV project ref."
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "::error::This manual DEV workflow is not allowed to run from main."
            exit 1
          fi
          echo "DEV confirmation accepted for project ref scsirgbuqjcwoaxfacth."

      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Mask sensitive values
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_DEV_DB_URL:-}" ]] && echo "::add-mask::${SUPABASE_DEV_DB_URL}"
          [[ -n "${SUPABASE_DEV_PROJECT_REF:-}" ]] && echo "::add-mask::${SUPABASE_DEV_PROJECT_REF}"

      - name: Validate required DEV secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_DEV_DB_URL:-}" ]]; then
            echo "::error::Missing GitHub Secret SUPABASE_DEV_DB_URL."
            exit 1
          fi
          if [[ -z "${SUPABASE_DEV_PROJECT_REF:-}" ]]; then
            echo "::error::Missing GitHub Secret SUPABASE_DEV_PROJECT_REF."
            exit 1
          fi
          if [[ "${SUPABASE_DEV_PROJECT_REF}" != "scsirgbuqjcwoaxfacth" ]]; then
            echo "::error::SUPABASE_DEV_PROJECT_REF does not match the approved DEV project ref."
            exit 1
          fi
          echo "Required DEV secrets are present and project ref is approved."

      - name: Run precheck, load and postcheck SQL
        shell: bash
        run: |
          set -euo pipefail
          node scripts/supabase/run_sql_file.js --script-path "${SCRIPT_PATH}"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-dev-deployment-evidence
          path: .ops-evidence/supabase-dev/
          if-no-files-found: warn
          retention-days: 14
