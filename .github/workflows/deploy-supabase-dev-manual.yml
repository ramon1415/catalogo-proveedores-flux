name: Deploy Supabase DEV Manual

on:
  workflow_dispatch:
    inputs:
      script_path:
        description: "Exact migration path: supabase/migrations/20260812231500_048_snapshot_bbva_cie_convenio_number.sql"
        required: true
        type: string
      confirm_dev:
        description: "Type the DEV Supabase project ref to confirm: scsirgbuqjcwoaxfacth"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-dev-manual
  cancel-in-progress: false

jobs:
  apply-cie-048:
    name: Apply versioned CIE migration 048 to Supabase DEV
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    if: github.ref == 'refs/heads/feature/ramon-bbva-cie-layout'
    env:
      EXPECTED_BRANCH: feature/ramon-bbva-cie-layout
      EXPECTED_MIGRATION: supabase/migrations/20260812231500_048_snapshot_bbva_cie_convenio_number.sql
      EXPECTED_SUPABASE_DEV_PROJECT_REF: scsirgbuqjcwoaxfacth
      FORBIDDEN_SUPABASE_PROD_PROJECT_REF: ucantptjhwttexzmslvm
      SCRIPT_PATH: ${{ inputs.script_path }}
      CONFIRM_DEV: ${{ inputs.confirm_dev }}
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Guard branch, project and exact migration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_BRANCH}" ]]; then
            echo "::error::Workflow must run from the approved CIE feature branch."
            exit 1
          fi
          if [[ "${CONFIRM_DEV}" != "${EXPECTED_SUPABASE_DEV_PROJECT_REF}" ]]; then
            echo "::error::DEV confirmation does not match the approved project ref."
            exit 1
          fi
          if [[ "${SUPABASE_DEV_PROJECT_REF:-}" != "${EXPECTED_SUPABASE_DEV_PROJECT_REF}" ]]; then
            echo "::error::DEV secret project ref does not match the approved project."
            exit 1
          fi
          if [[ "${SUPABASE_DEV_PROJECT_REF}" == "${FORBIDDEN_SUPABASE_PROD_PROJECT_REF}" ]]; then
            echo "::error::PROD project ref detected."
            exit 1
          fi
          if [[ "${SCRIPT_PATH}" != "${EXPECTED_MIGRATION}" ]]; then
            echo "::error::Only the exact versioned CIE migration 048 is authorized."
            exit 1
          fi
          if [[ ! -f "${EXPECTED_MIGRATION}" ]]; then
            echo "::error::Versioned CIE migration 048 is missing."
            exit 1
          fi
          if [[ -z "${SUPABASE_DEV_DB_URL:-}" ]]; then
            echo "::error::Missing DEV database URL secret."
            exit 1
          fi
          node <<'NODE'
          const expected = process.env.EXPECTED_SUPABASE_DEV_PROJECT_REF
          const forbidden = process.env.FORBIDDEN_SUPABASE_PROD_PROJECT_REF
          const target = new URL(process.env.SUPABASE_DEV_DB_URL)
          const directHost = target.hostname === `db.${expected}.supabase.co`
          const poolerUser = decodeURIComponent(target.username) === `postgres.${expected}`
          if (!directHost && !poolerUser) {
            throw new Error("Database URL identity does not prove the approved DEV project ref")
          }
          if (
            target.hostname.includes(forbidden) ||
            decodeURIComponent(target.username).includes(forbidden)
          ) {
            throw new Error("PROD project identity detected")
          }
          NODE
          echo "DEV identity, branch and exact migration guards passed."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Inspect CLI and migration state
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest --version
          npx --yes supabase@latest db push --help >/dev/null
          npx --yes supabase@latest migration list --db-url "${SUPABASE_DEV_DB_URL}"

      - name: Dry-run exact pending migration
        shell: bash
        run: |
          set -euo pipefail
          dry_run_output="$(npx --yes supabase@latest db push --db-url "${SUPABASE_DEV_DB_URL}" --dry-run)"
          printf '%s\n' "${dry_run_output}"
          if ! grep -q '20260812231500' <<<"${dry_run_output}"; then
            echo "::error::Dry-run did not identify the exact pending migration 048."
            exit 1
          fi
          for forbidden_version in 20260811035345 20260811035346 20260811215129 20260811230137 20260812001555 20260812210013; do
            if grep -q "Would push.*${forbidden_version}\|Applying migration ${forbidden_version}" <<<"${dry_run_output}"; then
              echo "::error::Dry-run attempted a migration other than 048."
              exit 1
            fi
          done

      - name: Apply migration 048 once through canonical migration push
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest db push --db-url "${SUPABASE_DEV_DB_URL}" --yes

      - name: Verify exact ledger result
        shell: bash
        run: |
          set -euo pipefail
          result="$(psql "${SUPABASE_DEV_DB_URL}" -X -v ON_ERROR_STOP=1 -Atc "
            select count(*) || '|' || min(name)
            from supabase_migrations.schema_migrations
            where version = '20260812231500';
          ")"
          if [[ "${result}" != "1|048_snapshot_bbva_cie_convenio_number" ]]; then
            echo "::error::Migration 048 ledger verification failed."
            exit 1
          fi
          npx --yes supabase@latest migration list --db-url "${SUPABASE_DEV_DB_URL}"
          echo "CIE migration 048 applied exactly once and ledger verified."
