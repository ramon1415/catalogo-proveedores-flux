name: Temporary DEV submitted-email Director routing hotfix

'on':
  push:
    branches:
      - hotfix/dev-submitted-email-selected-director
    paths:
      - '.github/workflows/temp-hotfix-dev-submitted-email-selected-director.yml'

permissions:
  contents: write

concurrency:
  group: temp-dev-submitted-email-selected-director
  cancel-in-progress: false

jobs:
  patch_test_deploy:
    name: Patch, test, commit and deploy DEV-only routing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: DEV
    env:
      EXPECTED_PROJECT_REF: scsirgbuqjcwoaxfacth
      FUNCTION_NAME: approval-batch-submitted-dispatcher
      SUPABASE_CLI_VERSION: 2.114.0

    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: hotfix/dev-submitted-email-selected-director
          fetch-depth: 5
          persist-credentials: true

      - name: Set up pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.16.0'
          cache: ''

      - name: Apply fail-closed source, contract and runbook patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          function_path = Path('supabase/functions/approval-batch-submitted-dispatcher/index.ts')
          test_path = Path('scripts/qa/approval-batch-submitted-email-dev-contract.test.mjs')
          docs_path = Path('docs/ops/approval-batch-submitted-email-dev.md')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          source = function_path.read_text(encoding='utf-8')
          source = replace_once(
              source,
              'export function renderApprovalBatchSubmittedEmail(document, sendMode) {',
              'export function renderApprovalBatchSubmittedEmail(document, sendMode, deliveryMode = "test_recipient") {',
              'render signature',
          )
          source = replace_once(
              source,
              '  const text = [\n',
              '  const devNotice = sendMode === "test_only"\n'
              '    ? deliveryMode === "director"\n'
              '      ? "Entorno DEV: este correo se envió al Director seleccionado para validar el flujo."\n'
              '      : "Modo DEV TEST: este correo fue redirigido al destinatario de prueba."\n'
              '    : "";\n'
              '  const text = [\n',
              'dev notice insertion',
          )
          source = replace_once(
              source,
              '    ...(sendMode === "test_only" ? ["", "Modo DEV TEST: este correo fue redirigido al destinatario de prueba."] : []),',
              '    ...(devNotice ? ["", devNotice] : []),',
              'plain-text notice',
          )
          source = replace_once(
              source,
              '  const banner = sendMode === "test_only" ? `<div style="margin-top:20px;padding:12px 14px;border-left:4px solid #d97706;background:#fff7ed;color:#7c2d12;font-size:13px;line-height:1.4;">Modo DEV TEST: este correo fue redirigido al destinatario de prueba.</div>` : "";',
              '  const banner = devNotice ? `<div style="margin-top:20px;padding:12px 14px;border-left:4px solid #d97706;background:#fff7ed;color:#7c2d12;font-size:13px;line-height:1.4;">${escapeHtml(devNotice)}</div>` : "";',
              'html notice',
          )
          source = replace_once(
              source,
              '    if (!["disabled", "test_only", "real"].includes(sendMode)) return jsonResponse({ error: "invalid_notification_send_mode" }, 500);\n',
              '    if (!["disabled", "test_only", "real"].includes(sendMode)) return jsonResponse({ error: "invalid_notification_send_mode" }, 500);\n'
              '    const deliveryMode = optionalEnv(runtime, "APPROVAL_BATCH_SUBMITTED_DELIVERY_MODE", "director");\n'
              '    if (!["director", "test_recipient"].includes(deliveryMode)) return jsonResponse({ error: "invalid_approval_batch_submitted_delivery_mode" }, 500);\n',
              'delivery mode gate',
          )
          source = replace_once(
              source,
              '    const testEmail = sendMode === "test_only" ? requiredEnv(runtime, "NOTIFICATION_TEST_EMAIL") : "";',
              '    const testEmail = deliveryMode === "test_recipient" ? requiredEnv(runtime, "NOTIFICATION_TEST_EMAIL") : "";',
              'test email requirement',
          )
          source = replace_once(
              source,
              '      const finalRecipient = sendMode === "test_only" ? testEmail : intendedRecipient;',
              '      const finalRecipient = deliveryMode === "test_recipient" ? testEmail : intendedRecipient;',
              'final recipient routing',
          )
          source = replace_once(
              source,
              '        const rendered = renderApprovalBatchSubmittedEmail(document, sendMode);',
              '        const rendered = renderApprovalBatchSubmittedEmail(document, sendMode, deliveryMode);',
              'render delivery mode',
          )
          source = replace_once(
              source,
              '    return jsonResponse({ processed: events.length, sent, failed, cancelled, mode: sendMode, event_type: EVENT_TYPE, events: results });',
              '    return jsonResponse({ processed: events.length, sent, failed, cancelled, mode: sendMode, delivery_mode: deliveryMode, event_type: EVENT_TYPE, events: results });',
              'response delivery evidence',
          )
          function_path.write_text(source, encoding='utf-8')

          tests = test_path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              '  generateApprovalBatchPdfBytes,\n',
              '  generateApprovalBatchPdfBytes,\n  handleRequest,\n',
              'handleRequest import',
          )
          tests = replace_once(
              tests,
              '  const rendered = renderApprovalBatchSubmittedEmail(documentFixture(2), "test_only");',
              '  const rendered = renderApprovalBatchSubmittedEmail(documentFixture(2), "test_only", "director");',
              'render test delivery mode',
          )
          tests = replace_once(
              tests,
              '  assert.match(rendered.html, /Modo DEV TEST/);',
              '  assert.match(rendered.html, /Entorno DEV/);\n  assert.doesNotMatch(rendered.html, /redirigido al destinatario de prueba/);',
              'render notice assertion',
          )

          dispatcher_test = r'''

test("DEV dispatcher preserves the DEV label but sends to the selected Director", async () => {
  const event = {
    id: "00000000-0000-0000-0000-000000000010",
    event_type: "approval_batch.submitted",
    source_table: "approval_batches",
    source_id: "00000000-0000-0000-0000-000000000003",
    source_folio: "Corte DEV QA 2026-W35",
    recipient_type: "administrador_sistema",
    recipient_profile_id: "00000000-0000-0000-0000-000000000002",
    recipient_email: "director@gmail.example",
    subject: "Corte semanal por autorizar",
    payload: {},
    attempt_count: 0,
    priority: "high",
  };
  const calls = [];
  const fetchMock = async (url, options = {}) => {
    const target = String(url);
    calls.push({ target, options });
    if (target.endsWith("/rest/v1/rpc/claim_approval_batch_submitted_events_for_dispatcher")) {
      return Response.json([event]);
    }
    if (target.endsWith("/rest/v1/rpc/get_approval_batch_submitted_notification_document")) {
      const document = documentFixture(2);
      document.recipient_email = event.recipient_email;
      document.batch.director_email = event.recipient_email;
      return Response.json(document);
    }
    if (target === "https://api.resend.com/emails") {
      const payload = JSON.parse(options.body);
      assert.deepEqual(payload.to, [event.recipient_email]);
      assert.notDeepEqual(payload.to, ["ramon@quantta.mx"]);
      assert.match(payload.subject, /^\[DEV TEST\] Corte semanal por autorizar:/);
      assert.match(payload.html, /Entorno DEV/);
      assert.equal(payload.attachments.length, 1);
      assert.match(payload.attachments[0].content, /^JVBERi0xLjQ/);
      return Response.json({ id: "resend-dev-director-1" });
    }
    if (target.endsWith("/rest/v1/rpc/mark_notification_processed_for_dispatcher")) {
      return Response.json({ status: "sent" });
    }
    throw new Error(`unexpected_fetch:${target}`);
  };

  const env = new Map([
    ["NOTIFICATION_DISPATCHER_SECRET", "test-secret"],
    ["NOTIFICATION_SEND_MODE", "test_only"],
    ["NOTIFICATION_TEST_EMAIL", "ramon@quantta.mx"],
    ["SUPABASE_URL", "https://scsirgbuqjcwoaxfacth.supabase.co"],
    ["SUPABASE_SERVICE_ROLE_KEY", "service-role-test"],
    ["RESEND_API_KEY", "resend-test"],
    ["NOTIFICATION_FROM_EMAIL", "Flux <notificaciones@example.invalid>"],
  ]);
  const request = new Request("https://example.invalid/functions/v1/approval-batch-submitted-dispatcher", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-notification-dispatcher-secret": "test-secret",
    },
    body: JSON.stringify({ created_at_after: "2026-08-24T20:43:14.805243Z", limit: 1 }),
  });
  const response = await handleRequest(request, {
    env: (name) => env.get(name),
    fetch: fetchMock,
  });
  const result = await response.json();
  assert.equal(response.status, 200);
  assert.equal(result.mode, "test_only");
  assert.equal(result.delivery_mode, "director");
  assert.equal(result.processed, 1);
  assert.equal(result.sent, 1);
  assert.equal(result.failed, 0);
  assert.equal(result.events[0].final_recipient_email, "di******@gmail.example");
  assert.equal(calls.filter((call) => call.target === "https://api.resend.com/emails").length, 1);
});
'''
          marker = '\ntest("DEV migration is exclusive, service-only, and replay-safe", async () => {'
          if tests.count(marker) != 1:
              raise SystemExit('dispatcher test insertion marker mismatch')
          tests = tests.replace(marker, dispatcher_test + marker, 1)
          test_path.write_text(tests, encoding='utf-8')

          docs = docs_path.read_text(encoding='utf-8')
          docs = replace_once(
              docs,
              'El evento conserva al Director seleccionado como destinatario funcional, pero el modo `test_only` sustituye el destinatario final por el correo configurado para pruebas. El asunto incluye `[DEV TEST]` y el cuerpo muestra el banner de prueba. DEV no envía este correo al Director real.',
              'El evento conserva al Director seleccionado como destinatario funcional y la ruta dedicada entrega al correo vigente de ese Director. El asunto conserva `[DEV TEST]` y el cuerpo muestra un aviso de entorno DEV. La variable global `NOTIFICATION_TEST_EMAIL` continúa aplicando a otras notificaciones DEV, pero ya no redirige esta ruta exclusiva. Para restablecer el desvío controlado puede configurarse `APPROVAL_BATCH_SUBMITTED_DELIVERY_MODE=test_recipient`.',
              'runbook recipient policy',
          )
          docs = replace_once(
              docs,
              '- Solo procesa `approval_batch.submitted`.\n',
              '- Solo procesa `approval_batch.submitted`.\n- Delivery mode por defecto: `director`; conserva etiqueta visual `[DEV TEST]`.\n',
              'runbook delivery control',
          )
          docs_path.write_text(docs, encoding='utf-8')
          PY

          node --experimental-strip-types --test scripts/qa/approval-batch-submitted-email-dev-contract.test.mjs
          git diff --check
          test "$(git diff --name-only | sort | paste -sd ',')" = "docs/ops/approval-batch-submitted-email-dev.md,scripts/qa/approval-batch-submitted-email-dev-contract.test.mjs,supabase/functions/approval-batch-submitted-dispatcher/index.ts"

      - name: Commit the reviewed hotfix to the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'quantta-dev-release-bot'
          git config user.email 'ramon@quantta.mx'
          git add \
            supabase/functions/approval-batch-submitted-dispatcher/index.ts \
            scripts/qa/approval-batch-submitted-email-dev-contract.test.mjs \
            docs/ops/approval-batch-submitted-email-dev.md
          git commit -m 'Fix DEV submitted email routing to selected Director'
          git push origin HEAD:hotfix/dev-submitted-email-selected-director

      - name: Deploy only the dedicated DEV Edge Function
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          npx --yes "supabase@$SUPABASE_CLI_VERSION" functions deploy "$FUNCTION_NAME" \
            --project-ref "$EXPECTED_PROJECT_REF" \
            --no-verify-jwt \
            --use-api
