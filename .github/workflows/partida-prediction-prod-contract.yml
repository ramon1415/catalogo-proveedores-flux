name: Partida prediction requester-only PROD contract

'on':
  pull_request:
    branches:
      - main
      - release/payment-request-exception-quick-approve-prod-r1
    paths:
      - 'app/src/features/solicitudes/**'
      - 'supabase/migrations/*_partida_predictions_prod.sql'
      - 'supabase/migrations/*_partida_unsure_prod.sql'
      - 'supabase/migrations/*_partida_predictions_seed_prod.sql'
      - 'supabase/seed/partida_predictions_seed.sql'
      - 'scripts/qa/partida-prediction-prod-contract.test.mjs'
      - '.github/workflows/partida-prediction-prod-contract.yml'

permissions:
  contents: read

concurrency:
  group: partida-prediction-prod-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Requester prediction, PROD wrappers and 160-row seed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.16.0'
          cache: ''

      - name: Validate requester-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='${{ github.event.pull_request.base.sha }}'
          git diff --check "$BASE_SHA"...HEAD
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          printf '%s\n' "${changed[@]}"

          if printf '%s\n' "${changed[@]}" | grep -E '^app/src/features/configuracion/|confirm_provider_account|cuentaReview|ContpaqTab|ExportarSection|exportarPolizas'; then
            echo 'PR543-B / CONTPAQ scope leaked into requester-only PROD release' >&2
            exit 1
          fi

          test "$(printf '%s\n' "${changed[@]}" | grep -cE '^supabase/migrations/[0-9]+_partida_predictions_prod\.sql$')" -eq 1
          test "$(printf '%s\n' "${changed[@]}" | grep -cE '^supabase/migrations/[0-9]+_partida_unsure_prod\.sql$')" -eq 1
          test "$(printf '%s\n' "${changed[@]}" | grep -cE '^supabase/migrations/[0-9]+_partida_predictions_seed_prod\.sql$')" -eq 1

      - name: Run focused executable contract
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/qa/partida-prediction-prod-contract.test.mjs

      - name: Compile current PROD React tree
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix app ci
          npm --prefix app run typecheck
          npm --prefix app run build

      - name: Guard current PROD reimbursement and mandatory-document paths
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'createReimbursementRequestWithDocuments' app/src/features/solicitudes/RequestModal.tsx
          grep -Fq 'createPaymentRequestWithDocument(payload, stagedDocumentPath)' app/src/features/solicitudes/RequestModal.tsx
          ! grep -Fq 'data = await createPaymentRequest(payload)' app/src/features/solicitudes/RequestModal.tsx
          test "$(grep -c 'p_partida_unsure: payload.partida_unsure' app/src/features/solicitudes/api.ts)" -eq 2
          grep -Fq 'partida_unsure: isReembolso ? false : partidaUnsure' app/src/features/solicitudes/RequestModal.tsx

      - name: Validate migrations, tenant fail-closed seed and secret hygiene
        shell: bash
        run: |
          set -euo pipefail
          PRED="$(find supabase/migrations -maxdepth 1 -type f -name '*_partida_predictions_prod.sql' | sort | tail -1)"
          UNSURE="$(find supabase/migrations -maxdepth 1 -type f -name '*_partida_unsure_prod.sql' | sort | tail -1)"
          SEED="$(find supabase/migrations -maxdepth 1 -type f -name '*_partida_predictions_seed_prod.sql' | sort | tail -1)"
          test -n "$PRED" && test -n "$UNSURE" && test -n "$SEED"

          grep -Fq 'force row level security' "$PRED"
          grep -Fq 'grant select on table public.partida_predictions to authenticated, service_role' "$PRED"
          grep -Fq 'p_partida_unsure boolean default false' "$UNSURE"
          grep -Fq 'invoice_uuid_duplicate' "$UNSURE"
          grep -Fq 'payment_request_has_active_approver_pool' "$UNSURE"
          grep -Fq 'request_document_not_found_or_not_owned' "$UNSURE"
          grep -Fq 'p_partida_unsure => p_partida_unsure' "$UNSURE"
          grep -Fq 'atomic_reimbursement_wrapper_regressed' "$UNSURE"

          grep -Fq 'partida_prediction_company_identity_mismatch' "$SEED"
          grep -Fq "'144042c1-e493-4256-a86c-cd088a8898ce'" "$SEED"
          grep -Fq "'20cd72aa-f281-4985-931b-a83422404b66'" "$SEED"
          ! grep -Fq "'9680353c-9b86-4730-82e1-fce664f048a2'" "$SEED"
          ! grep -Fq "'68b61801-74c0-44ea-a33b-f20e4bf53aa7'" "$SEED"
          grep -Fq 'partida_prediction_category_resolution_failed' "$SEED"
          grep -Fq 'partida_prediction_resolved_candidate_invalid' "$SEED"
          grep -Fq 'partida_prediction_empty_candidate_still_confident' "$SEED"
          grep -Fq 'partida_prediction_stale_candidate_survived' "$SEED"
          grep -Fq "when 'Adquisiciòn de herramientas' then 'Adquisición de herramientas'" "$SEED"
          grep -Fq "v.category_name in ('Gastos extraordinarios', 'Servicios y suministros')" "$SEED"
          grep -Fq 'v_operadora <> 98 or v_fersana <> 62' "$SEED"
          grep -Fq 'on conflict (company_id, rfc_emisor) do update set' "$SEED"
          test "$(grep -c "^  ('" supabase/seed/partida_predictions_seed.sql)" -eq 160

          ! grep -R -E 're_[A-Za-z0-9]{20,}|sbp_[A-Za-z0-9]{20,}|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@' \
            "$PRED" "$UNSURE" "$SEED" \
            app/src/features/solicitudes/RequestModal.tsx \
            app/src/features/solicitudes/api.ts

          echo 'scope=requester_only'
          echo 'seed=98_operadora+62_fersana'
          echo 'prod_category_resolution=87_unique+2_retired_dropped'
          echo 'pr543b_contpaq=blocked_by_pr498'
          echo 'prod_db_apply=not_part_of_this_contract'
