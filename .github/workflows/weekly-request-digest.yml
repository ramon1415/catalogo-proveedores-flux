name: Weekly request digest

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'supabase/functions/weekly-request-digest/**'
      - 'supabase/migrations/*weekly_request_digest*.sql'
      - 'scripts/qa/weekly-request-digest.test.mjs'
      - '.github/workflows/weekly-request-digest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify PDF, authorization, recipients, periods and retries without sending
        run: node --test scripts/qa/weekly-request-digest.test.mjs
