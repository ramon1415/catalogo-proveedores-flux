name: Provider intake triage DEV Gate 1B (temporary)

on:
  push:
    branches:
      - feature/ramon-provider-intake-triage-ui
    paths:
      - .github/workflows/provider-intake-triage-dev-apply-temporary.yml
      - ops/provider-intake/apply-029-triage-dev.authorization.json
      - ops/provider-intake/gate-1b-service-key-public.pem
      - scripts/qa/provider-intake-triage-authenticated-uat.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-intake-triage-dev-gate-1b
  cancel-in-progress: false

jobs:
  gate1b:
    name: Encrypted bootstrap or authenticated UAT in DEV
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: DEV
    env:
      AUTHORIZED_ROOT_HEAD: af12ee67fb823c737598d4f551cfb44a4b26c6c4
      AUTHORIZED_BASELINE: 05986aca63f2d98635cbb9b928cd0cebac29315a
      AUTHORIZED_BACKEND_TREE: 379f65801609e40143d948b3de702e391636c512
      AUTHORIZED_BRANCH: feature/ramon-provider-intake-triage-ui
      AUTHORIZED_PROJECT_REF: scsirgbuqjcwoaxfacth
      PREVIEW_URL: https://catalogo-proveedores-flux-jpg38ay89-quantta-team.vercel.app
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
      SUPABASE_DEV_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_DEV_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout temporary Gate 1B authorization
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate immutable scope and select mode
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          marker="ops/provider-intake/apply-029-triage-dev.authorization.json"
          public_key="ops/provider-intake/gate-1b-service-key-public.pem"
          uat_script="scripts/qa/provider-intake-triage-authenticated-uat.mjs"

          test "$GITHUB_REF_NAME" = "$AUTHORIZED_BRANCH"
          git merge-base --is-ancestor "$AUTHORIZED_BASELINE" HEAD
          git merge-base --is-ancestor "$AUTHORIZED_ROOT_HEAD" HEAD
          test "$(git rev-parse "HEAD:supabase/functions/provider-intake")" = "$AUTHORIZED_BACKEND_TREE"
          test "$SUPABASE_DEV_PROJECT_REF" = "$AUTHORIZED_PROJECT_REF"
          test -n "$SUPABASE_ACCESS_TOKEN"

          expected_files="$(
            printf '%s\n' \
              '.github/workflows/provider-intake-triage-dev-apply-temporary.yml' \
              'ops/provider-intake/apply-029-triage-dev.authorization.json' \
              'ops/provider-intake/gate-1b-service-key-public.pem' \
              'scripts/qa/provider-intake-triage-authenticated-uat.mjs' |
              sort
          )"
          actual_files="$(git diff --name-only "$AUTHORIZED_ROOT_HEAD..HEAD" | sort)"
          test "$actual_files" = "$expected_files"

          test "$(jq -r '.gate' "$marker")" = "phase-1d-gate-1b-authenticated-uat"
          test "$(jq -r '.authorized_root_head' "$marker")" = "$AUTHORIZED_ROOT_HEAD"
          test "$(jq -r '.branch' "$marker")" = "$AUTHORIZED_BRANCH"
          test "$(jq -r '.supabase_project_ref' "$marker")" = "$AUTHORIZED_PROJECT_REF"
          test "$(jq -r '.preview_url' "$marker")" = "$PREVIEW_URL"
          test "$(jq -r '.allow_intake_mutations' "$marker")" = "false"
          test "$(jq -r '.allow_sql_or_migrations' "$marker")" = "false"
          test "$(jq -r '.require_total_iam_cleanup' "$marker")" = "true"
          test "$(jq -r '.require_secret_cleanup' "$marker")" = "true"
          test "$(jq -r '.max_temporary_identities' "$marker")" = "3"
          test "$(sha256sum "$public_key" | cut -d' ' -f1)" = "$(jq -r '.public_key_sha256' "$marker")"
          test "$(sha256sum "$uat_script" | cut -d' ' -f1)" = "$(jq -r '.uat_script_sha256' "$marker")"

          mode="$(jq -r '.mode' "$marker")"
          test "$mode" = "bootstrap" || test "$mode" = "authenticated-uat"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Bootstrap service key as one-time ciphertext
        if: steps.identity.outputs.mode == 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate1b-bootstrap
          keys_file="$RUNNER_TEMP/supabase-api-keys.json"
          secret_file="$RUNNER_TEMP/service-role-key.txt"
          trap 'rm -f "$keys_file" "$secret_file"' EXIT

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$AUTHORIZED_PROJECT_REF/api-keys?reveal=true" \
            > "$keys_file"
          service_role_key="$(jq -er '.[] | select(.name == "service_role") | .api_key' "$keys_file")"
          test -n "$service_role_key"
          echo "::add-mask::$service_role_key"
          printf '%s' "$service_role_key" > "$secret_file"
          chmod 600 "$secret_file"
          unset service_role_key
          rm -f "$keys_file"

          PUBLIC_KEY_FILE="ops/provider-intake/gate-1b-service-key-public.pem" \
          SECRET_FILE="$secret_file" \
          CIPHERTEXT_FILE="gate1b-bootstrap/service-role-key.oaep-sha256.b64" \
          node <<'NODE'
          const crypto = require("node:crypto")
          const fs = require("node:fs")
          const secret = fs.readFileSync(process.env.SECRET_FILE)
          const publicKey = fs.readFileSync(process.env.PUBLIC_KEY_FILE, "utf8")
          const encrypted = crypto.publicEncrypt({
            key: publicKey,
            padding: crypto.constants.RSA_PKCS1_OAEP_PADDING,
            oaepHash: "sha256",
          }, secret)
          fs.writeFileSync(process.env.CIPHERTEXT_FILE, encrypted.toString("base64"), { mode: 0o600 })
          NODE

          jq -n \
            --arg gate "phase-1d-gate-1b-encrypted-bootstrap" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg commit "$GITHUB_SHA" \
            --arg cipher_sha256 "$(sha256sum gate1b-bootstrap/service-role-key.oaep-sha256.b64 | cut -d' ' -f1)" \
            --arg public_key_sha256 "$(sha256sum ops/provider-intake/gate-1b-service-key-public.pem | cut -d' ' -f1)" \
            '{
              gate: $gate,
              run_id: $run_id,
              commit: $commit,
              algorithm: "RSA-OAEP-SHA256",
              cipher_sha256: $cipher_sha256,
              public_key_sha256: $public_key_sha256,
              plaintext_exposed: false
            }' > gate1b-bootstrap/receipt.json

      - name: Upload one-time encrypted bootstrap
        if: steps.identity.outputs.mode == 'bootstrap'
        uses: actions/upload-artifact@v4
        with:
          name: gate1b-encrypted-secret-${{ github.run_id }}
          path: gate1b-bootstrap/
          if-no-files-found: error
          retention-days: 1

      - name: Validate temporary DEV secret and obtain public anon key
        if: steps.identity.outputs.mode == 'authenticated-uat'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DEV_SERVICE_ROLE_KEY"
          echo "::add-mask::$SUPABASE_DEV_SERVICE_ROLE_KEY"
          keys_file="$RUNNER_TEMP/supabase-api-keys.json"
          trap 'rm -f "$keys_file"' EXIT
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$AUTHORIZED_PROJECT_REF/api-keys?reveal=true" \
            > "$keys_file"
          source_service_key="$(jq -er '.[] | select(.name == "service_role") | .api_key' "$keys_file")"
          anon_key="$(jq -er '.[] | select(.name == "anon") | .api_key' "$keys_file")"
          test "$source_service_key" = "$SUPABASE_DEV_SERVICE_ROLE_KEY"
          test -n "$anon_key"
          echo "::add-mask::$source_service_key"
          echo "::add-mask::$anon_key"
          {
            echo "SUPABASE_URL=https://${AUTHORIZED_PROJECT_REF}.supabase.co"
            echo "SUPABASE_DEV_ANON_KEY=$anon_key"
          } >> "$GITHUB_ENV"
          unset source_service_key anon_key
          rm -f "$keys_file"

      - name: Install isolated browser runtime
        if: steps.identity.outputs.mode == 'authenticated-uat'
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/gate1b-node"
          mkdir -p "$runtime"
          cd "$runtime"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.61.1 axe-core@4.10.3 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          echo "NODE_PATH=$runtime/node_modules" >> "$GITHUB_ENV"

      - name: Run authenticated read-only UAT
        id: uat
        if: steps.identity.outputs.mode == 'authenticated-uat'
        continue-on-error: true
        shell: bash
        env:
          UAT_OUTPUT_DIR: gate1b-evidence
          UAT_MANIFEST: ${{ runner.temp }}/gate1b-fixtures.json
        run: |
          set -uo pipefail
          node scripts/qa/provider-intake-triage-authenticated-uat.mjs

      - name: Enforce independent IAM cleanup
        id: cleanup
        if: always() && steps.identity.outputs.mode == 'authenticated-uat'
        continue-on-error: true
        shell: bash
        env:
          UAT_OUTPUT_DIR: gate1b-evidence
          UAT_MANIFEST: ${{ runner.temp }}/gate1b-fixtures.json
        run: |
          set -uo pipefail
          node scripts/qa/provider-intake-triage-authenticated-uat.mjs --cleanup-only

      - name: Upload sanitized UAT evidence
        if: always() && steps.identity.outputs.mode == 'authenticated-uat'
        uses: actions/upload-artifact@v4
        with:
          name: gate1b-authenticated-uat-${{ github.run_id }}
          path: gate1b-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce UAT, cleanup, and zero-delta result
        if: always() && steps.identity.outputs.mode == 'authenticated-uat'
        shell: bash
        run: |
          set -euo pipefail
          result="gate1b-evidence/gate-1b-authenticated-uat.json"
          test -f "$result"
          status="$(jq -r '.status' "$result")"
          test "$status" = "PASS" || test "$status" = "BLOCKED"
          test "$(jq -r '.cleanup.complete' "$result")" = "true"
          test "$(jq -r '.cleanup.sessions_invalidated' "$result")" = "true"
          test "$(jq -r '.deltas.all_equal' "$result")" = "true"
          test "$(jq -r '.privacy.sanitized_artifacts' "$result")" = "true"
          test "$(jq -r '.privacy.contains_names_rfc_emails_record_ids_storage_paths_tokens_passwords_signed_urls' "$result")" = "false"
          test "${{ steps.cleanup.outcome }}" = "success"
