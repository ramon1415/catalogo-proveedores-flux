name: Payroll N0 contract tests

on:
  pull_request:
    branches:
      - dev
    paths:
      - payroll_parser.js
      - payroll_capture.js
      - payroll_capture.css
      - solicitudes.html
      - solicitudes.js
      - fase2_request_payment_method_extension.js
      - docs/ops/payroll-n0-contract.md
      - docs/ops/payroll-source-recovery-report.md
      - docs/ops/payroll-n3a-materialization-report.md
      - docs/ops/payroll-n3b-approval-report.md
      - scripts/qa/fixtures/payroll/**
      - scripts/qa/payroll-n0-*.test.mjs
      - scripts/qa/payroll-n1-trigger-forward-fix-contract.test.mjs
      - scripts/qa/payroll-n2a-*.test.mjs
      - scripts/qa/payroll-n2b-*.test.mjs
      - scripts/qa/payroll-n3a-*.test.mjs
      - scripts/qa/payroll-n3b-*.test.mjs
      - supabase/migrations/20260814170907_payroll_n0_foundation_contract.sql
      - supabase/migrations/20260814183429_fix_payroll_request_total_trigger.sql
      - supabase/migrations/20260817162934_payroll_n2b_capture_sessions.sql
      - supabase/migrations/20260818110000_payroll_n3a_server_materialization.sql
      - supabase/migrations/20260819150000_payroll_n3b_individual_approval.sql
      - supabase/functions/payroll-materialize/**
      - .github/workflows/payroll-n0-contract-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: node --check payroll_parser.js && node --check payroll_capture.js && node --check solicitudes.js && node --check fase2_request_payment_method_extension.js

      - name: Payroll N0, N1, and N2A contracts
        run: node --test scripts/qa/payroll-n0-parser-contract.test.mjs scripts/qa/payroll-n0-migration-contract.test.mjs scripts/qa/payroll-n1-trigger-forward-fix-contract.test.mjs scripts/qa/payroll-n2a-source-recovery-contract.test.mjs scripts/qa/payroll-n2a-spei-physical-adapter-contract.test.mjs

      - name: Payroll N2B staged capture contracts
        run: node --test scripts/qa/payroll-n2b-capture-model.test.mjs scripts/qa/payroll-n2b-capture-contract.test.mjs

      - name: Payroll N3A server materialization contracts
        run: node --test scripts/qa/payroll-n3a-materialization-contract.test.mjs

      - name: Payroll N3B individual approval contracts
        run: node --test scripts/qa/payroll-n3b-approval-contract.test.mjs

      - name: Existing bank and receipt parser regressions
        run: node --test scripts/qa/bbva-cie-layout-contract.test.mjs scripts/qa/payment-batch-parser-core.test.mjs
