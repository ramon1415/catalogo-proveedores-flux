name: Payroll N0 contract tests

on:
  pull_request:
    branches:
      - dev
    paths:
      - payroll_parser.js
      - payroll_cover_qa_parser.js
      - payroll_same_bank_qa_parser.js
      - payroll_toka_qa_parser.js
      - payroll_real_formats.js
      - payroll_real_reconcile.js
      - payroll_capture.js
      - payroll_capture.css
      - solicitudes.html
      - solicitudes.js
      - fase2_request_payment_method_extension.js
      - docs/ops/payroll-n0-contract.md
      - docs/ops/payroll-source-recovery-report.md
      - docs/ops/payroll-n3a-materialization-report.md
      - docs/ops/payroll-n3b-approval-report.md
      - docs/ops/payroll-n3c-synthetic-cover-report.md
      - docs/ops/payroll-n3d-synthetic-package-report.md
      - docs/ops/payroll-n3f-real-format-certification.md
      - docs/ops/payroll-n3g-real-capture-ui.md
      - scripts/qa/fixtures/payroll/**
      - scripts/qa/payroll-n0-*.test.mjs
      - scripts/qa/payroll-n1-trigger-forward-fix-contract.test.mjs
      - scripts/qa/payroll-n2a-*.test.mjs
      - scripts/qa/payroll-n2b-*.test.mjs
      - scripts/qa/payroll-n3a-*.test.mjs
      - scripts/qa/payroll-n3b-*.test.mjs
      - scripts/qa/payroll-n3c-*.test.mjs
      - scripts/qa/payroll-n3d-*.test.mjs
      - scripts/qa/payroll-n3f-*.test.mjs
      - scripts/qa/payroll-n3g-*.test.mjs
      - supabase/migrations/20260814170907_payroll_n0_foundation_contract.sql
      - supabase/migrations/20260814183429_fix_payroll_request_total_trigger.sql
      - supabase/migrations/20260817162934_payroll_n2b_capture_sessions.sql
      - supabase/migrations/20260818110000_payroll_n3a_server_materialization.sql
      - supabase/migrations/20260819213907_payroll_n3b_individual_approval.sql
      - supabase/migrations/20260819213919_payroll_n3b_approval_write_hardening.sql
      - supabase/migrations/20260819214917_payroll_n3b_post_decision_freeze.sql
      - supabase/migrations/20260820002513_payroll_n3f_real_formats_toka_funding.sql
      - supabase/migrations/20260820004857_payroll_n3f_server_verification_staging.sql
      - supabase/migrations/20260820022000_payroll_n3g_real_capture_ui_contract.sql
      - supabase/functions/payroll-materialize/**
      - .github/workflows/payroll-n0-contract-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: node --check payroll_parser.js && node --check payroll_cover_qa_parser.js && node --check payroll_same_bank_qa_parser.js && node --check payroll_toka_qa_parser.js && node --check payroll_real_formats.js && node --check payroll_real_reconcile.js && node --check payroll_capture.js && node --check solicitudes.js && node --check fase2_request_payment_method_extension.js

      - name: Payroll N0, N1, and N2A contracts
        run: node --test scripts/qa/payroll-n0-parser-contract.test.mjs scripts/qa/payroll-n0-migration-contract.test.mjs scripts/qa/payroll-n1-trigger-forward-fix-contract.test.mjs scripts/qa/payroll-n2a-source-recovery-contract.test.mjs scripts/qa/payroll-n2a-spei-physical-adapter-contract.test.mjs

      - name: Payroll N2B staged capture contracts
        run: node --test scripts/qa/payroll-n2b-capture-model.test.mjs scripts/qa/payroll-n2b-capture-contract.test.mjs

      - name: Payroll N3A server materialization contracts
        run: node --test scripts/qa/payroll-n3a-materialization-contract.test.mjs

      - name: Payroll N3B individual approval contracts
        run: node --test scripts/qa/payroll-n3b-approval-contract.test.mjs scripts/qa/payroll-n3b-approval-write-hardening-contract.test.mjs scripts/qa/payroll-n3b-post-decision-freeze-contract.test.mjs

      - name: Payroll N3C synthetic cover QA contracts
        run: node --test scripts/qa/payroll-n3c-cover-qa-contract.test.mjs

      - name: Payroll N3D synthetic full-package QA contracts
        run: node --test scripts/qa/payroll-n3d-full-package-qa-contract.test.mjs

      - name: Payroll N3F real physical format contracts
        run: node --test scripts/qa/payroll-n3f-real-formats-contract.test.mjs scripts/qa/payroll-n3f-staging-compat-contract.test.mjs

      - name: Payroll N3G real capture UI contracts
        run: node --test scripts/qa/payroll-n3g-real-capture-ui-contract.test.mjs

      - name: Existing bank and receipt parser regressions
        run: node --test scripts/qa/bbva-cie-layout-contract.test.mjs scripts/qa/payment-batch-parser-core.test.mjs
