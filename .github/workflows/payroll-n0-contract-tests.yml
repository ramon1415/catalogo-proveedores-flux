name: Payroll N0 contract tests

on:
  pull_request:
    branches:
      - dev
    paths:
      - payroll_parser.js
      - docs/ops/payroll-n0-contract.md
      - scripts/qa/fixtures/payroll/**
      - scripts/qa/payroll-n0-*.test.mjs
      - supabase/migrations/20260814170907_payroll_n0_foundation_contract.sql
      - .github/workflows/payroll-n0-contract-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: node --check payroll_parser.js

      - name: Payroll N0 contracts
        run: node --test scripts/qa/payroll-n0-parser-contract.test.mjs scripts/qa/payroll-n0-migration-contract.test.mjs

      - name: Existing bank and receipt parser regressions
        run: node --test scripts/qa/bbva-cie-layout-contract.test.mjs scripts/qa/payment-batch-parser-core.test.mjs
