name: Payroll PROD release checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/features/nomina/**'
      - 'supabase/**/payroll*'
      - 'supabase/migrations/*payroll_prod*.sql'
      - 'scripts/qa/payroll-prod*'
      - '.github/workflows/payroll-prod-release-checks.yml'
  push:
    branches: [main]
    paths:
      - 'app/src/features/nomina/**'
      - 'supabase/migrations/*payroll_prod*.sql'
      - '.github/workflows/payroll-prod-release-checks.yml'

permissions:
  contents: read

jobs:
  payroll-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm run qa:setup
      - run: npm --prefix app run build
      - run: npm run test:payroll
      - name: Verify reproducible migration
        run: |
          node scripts/qa/build-payroll-prod-release.mjs
          git diff --exit-code -- supabase/migrations docs/qa/payroll-prod-release-manifest.json

  backup-readiness:
    # Production credentials are available only to the integrated main workflow.
    # Keep the existing Environment branch restrictions and approval gates.
    # The payroll module stays disabled until this check and backend deployment finish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: supabase-production
    steps:
      - name: Read Supabase backup metadata
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_REF: ${{ vars.SUPABASE_PROJECT_REF_PROD }}
        shell: python
        run: |
          import json, os, subprocess, datetime
          ref = 'ucantptjhwttexzmslvm'
          if os.environ['PROD_REF'] != ref:
              raise SystemExit('PROD_PROJECT_IDENTITY_MISMATCH')
          token = os.environ.get('SUPABASE_ACCESS_TOKEN')
          if not token or any(char in token for char in '\r\n'):
              raise SystemExit('PROD_BACKUP_ACCESS_UNAVAILABLE')
          probes = []
          def read(path):
              # Use the same HTTP client as the existing production release workflows.
              # Credentials stay on stdin, never in argv, logs, or artifacts.
              result = subprocess.run(
                  ['curl', '-q', '--config', '-', '--silent', '--show-error',
                   '--max-time', '30', '--write-out', '\n%{http_code}',
                   '--url', 'https://api.supabase.com/v1/projects/' + ref + path],
                  input='header = ' + json.dumps('Authorization: Bearer ' + token) + '\n',
                  text=True, capture_output=True, timeout=35)
              body, _, status = result.stdout.rpartition('\n')
              probe = {'resource': 'backups' if path else 'project', 'http_status': status,
                       'transport_exit_code': result.returncode}
              try:
                  payload = json.loads(body)
              except ValueError:
                  payload = None
              if result.returncode or status != '200' or not isinstance(payload, dict):
                  # Only classifications are logged; never raw error text or response headers.
                  normalized = body.lower()
                  probe.update({'json_response': isinstance(payload, dict),
                      'authorization_error': any(term in normalized for term in
                          ('permission', 'forbidden', 'unauthorized', 'invalid token')),
                      'security_challenge': any(term in normalized for term in
                          ('cloudflare', 'verify you are human', 'challenge-platform'))})
                  probes.append(probe)
                  return None
              probes.append(probe)
              return payload
          project = read('')
          payload = read('/database/backups')
          # Both reads are independent: a project-info 403 must not hide the backup response.
          if project is None or payload is None:
              evidence = {'project_ref': ref, 'probes': probes, 'mutations': 0,
                  'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}
              print(json.dumps(evidence))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('```json\n' + json.dumps(evidence, indent=2) + '\n```\n')
              raise SystemExit('PROD_BACKUP_ACCESS_UNAVAILABLE')
          rows = payload.get('backups', [])
          good = [row for row in rows if str(row.get('status', '')).lower() in ('completed', 'success')]
          def timestamp(row):
              return row.get('inserted_at') or row.get('created_at') or row.get('started_at') or ''
          good.sort(key=timestamp, reverse=True)
          latest = good[0] if good else None
          pitr = bool(payload.get('pitr_enabled', False))
          evidence = {'project_ref': project.get('id') or project.get('ref'), 'pitr_enabled': pitr,
              'probes': probes,
              'latest_backup_status': latest.get('status') if latest else None,
              'latest_backup_at': timestamp(latest) if latest else None,
              'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'mutations': 0}
          print(json.dumps(evidence))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('```json\n' + json.dumps(evidence, indent=2) + '\n```\n')
          if evidence['project_ref'] != ref or not (pitr or good):
              raise SystemExit('PROD_BACKUP_UNAVAILABLE')
