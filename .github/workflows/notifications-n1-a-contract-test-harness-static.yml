{
  "name": "Notifications N1-A contract harness static safety",
  "on": {
    "pull_request": {
      "branches": ["dev"],
      "paths": [
        "ops/notifications/n1-a/contract-tests.sql",
        "ops/notifications/n1-a/README.md",
        ".github/workflows/notifications-n1-a-contract-test-harness-static.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "static-contract": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout pull request",
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Validate safe deterministic harness",
          "shell": "bash",
          "run": "python3 - <<'PY'\nfrom pathlib import Path\nimport json\nimport os\nimport re\nimport subprocess\n\nSQL_PATH = 'ops/notifications/n1-a/contract-tests.sql'\nREADME_PATH = 'ops/notifications/n1-a/README.md'\nWORKFLOW_PATH = '.github/workflows/notifications-n1-a-contract-test-harness-static.yml'\nALLOWED_PATHS = {SQL_PATH, README_PATH, WORKFLOW_PATH}\n\ndef require(condition, message):\n    if not condition:\n        raise SystemExit(message)\n\ndef git_output(*args):\n    return subprocess.check_output(['git', *args], text=True, encoding='utf-8')\n\nworkflow_text = Path(WORKFLOW_PATH).read_text(encoding='utf-8')\nworkflow = json.loads(workflow_text)\nexpected_trigger = {\n    'pull_request': {\n        'branches': ['dev'],\n        'paths': [SQL_PATH, README_PATH, WORKFLOW_PATH],\n    }\n}\nrequire(set(workflow) == {'name', 'on', 'permissions', 'jobs'}, 'workflow root contract changed')\nrequire(workflow['on'] == expected_trigger, 'workflow trigger or paths changed')\nrequire(workflow['permissions'] == {'contents': 'read'}, 'workflow permissions are not read-only')\nrequire(set(workflow['jobs']) == {'static-contract'}, 'unexpected workflow job')\njob = workflow['jobs']['static-contract']\nrequire(set(job) == {'runs-on', 'steps'}, 'unexpected workflow job capability')\nrequire(job['runs-on'] == 'ubuntu-latest', 'unexpected runner')\nrequire(len(job['steps']) == 2, 'unexpected workflow step')\ncheckout, validator = job['steps']\nrequire(checkout.get('uses') == 'actions/checkout@v4', 'checkout action changed')\nrequire(checkout.get('with') == {'fetch-depth': 0, 'persist-credentials': False}, 'checkout safety changed')\nrequire(set(checkout) == {'name', 'uses', 'with'}, 'unexpected checkout capability')\nrequire(set(validator) == {'name', 'shell', 'run'}, 'unexpected validator capability')\nrequire(validator['shell'] == 'bash', 'unexpected validator shell')\nrequire(validator['run'].startswith(\"python3 - <<'PY'\\n\"), 'validator is not Python stdlib')\n\nbase_ref = os.environ.get('GITHUB_BASE_REF', 'dev')\nrequire(base_ref == 'dev', 'unexpected base branch')\nchanged = {line for line in git_output('diff', '--name-only', '--diff-filter=ACMR', f'origin/{base_ref}...HEAD').splitlines() if line}\nrequire(changed == ALLOWED_PATHS, f'changed paths violate contract: {sorted(changed)}')\n\nsql = Path(SQL_PATH).read_text(encoding='utf-8')\nbase_sql = git_output('show', f'origin/{base_ref}:{SQL_PATH}')\n\n# Every original line must survive byte-for-byte and in order. Only allowlisted\n# instrumentation may be inserted, so test expressions and expected values cannot drift.\nbase_lines = base_sql.splitlines()\ncurrent_lines = sql.splitlines()\nbase_index = 0\nfor line in current_lines:\n    if base_index < len(base_lines) and line == base_lines[base_index]:\n        base_index += 1\nrequire(base_index == len(base_lines), 'original SQL semantics were removed or changed')\n\nadded_diff = git_output('diff', '--unified=0', f'origin/{base_ref}...HEAD', '--', SQL_PATH)\nadded_lines = [\n    line[1:] for line in added_diff.splitlines()\n    if line.startswith('+') and not line.startswith('+++')\n]\nallowed_added = [\n    re.compile(r'^$'),\n    re.compile(r'^\\\\set VERBOSITY terse$'),\n    re.compile(r'^\\\\echo N1A_SAFE_STAGE=(?:TRANSACTION_STARTED|TEMP_SETUP_STARTED|TEMP_SETUP_COMPLETED|DO_BLOCK_STARTED|DO_BLOCK_COMPLETED|FINAL_OUTPUT_STARTED|FINAL_OUTPUT_COMPLETED|ROLLBACK_STARTED|ROLLBACK_COMPLETED)$'),\n    re.compile(r'^  v_current_phase text;$'),\n    re.compile(r'^  v_current_test integer;$'),\n    re.compile(r\"^  v_current_phase := '(?:CATALOG_BINDING|TEST_EXECUTION|PAYLOAD_BASELINE|FINAL_ASSERTIONS)';$\"),\n    re.compile(r'^  v_current_test := (?:0|[1-9]|[1-4][0-9]|5[0-5]);$'),\n    re.compile(r'^exception$'),\n    re.compile(r'^  when others then$'),\n    re.compile(r'^    if sqlerrm = any \\(array\\[$'),\n    re.compile(r\"^      'N1A_TEST_(?:0[1-9]|[1-4][0-9]|5[0-5])_FAILED',?$\"),\n    re.compile(r\"^      'N1A_TEST_PAYLOAD_BASELINE_FAILED'$\"),\n    re.compile(r'^    \\]\\) then$'),\n    re.compile(r'^      raise;$'),\n    re.compile(r'^    end if;$'),\n    re.compile(r\"^    if v_current_phase = 'CATALOG_BINDING' then$\"),\n    re.compile(r\"^    elsif v_current_phase = '(?:PAYLOAD_BASELINE|TEST_EXECUTION)' then$\"),\n    re.compile(r'^      case v_current_test$'),\n    re.compile(r'^        when (?:[1-9]|[1-4][0-9]|5[0-5]) then$'),\n    re.compile(r\"^          raise exception 'N1A_NATIVE_TEST_(?:0[1-9]|[1-4][0-9]|5[0-5])_FAILED';$\"),\n    re.compile(r'^        else$'),\n    re.compile(r\"^          raise exception 'N1A_NATIVE_DO_BLOCK_FAILED';$\"),\n    re.compile(r'^      end case;$'),\n    re.compile(r'^    else$'),\n    re.compile(r\"^      raise exception 'N1A_NATIVE_(?:CATALOG_BINDING|PAYLOAD_BASELINE|DO_BLOCK)_FAILED';$\"),\n]\nfor line in added_lines:\n    require(any(pattern.fullmatch(line) for pattern in allowed_added), f'unapproved SQL addition: {line!r}')\n\nexpected_numbers = list(range(1, 56))\nexpected_two_digits = [f'{number:02d}' for number in expected_numbers]\ncomments = re.findall(r'^  -- (\\d{2})\\.', sql, flags=re.MULTILINE)\nrequire(comments == expected_two_digits, 'numbered test comments changed')\n\nassignments = [int(value) for value in re.findall(r'^  v_current_test := ([1-9]\\d*);$', sql, flags=re.MULTILINE)]\nrequire(assignments == expected_numbers, 'current-test assignments are incomplete, duplicated, or unordered')\nrequire(sql.count(\"v_current_phase := 'TEST_EXECUTION';\") == 55, 'test phase assignments changed')\nrequire(sql.count(\"v_current_phase := 'CATALOG_BINDING';\") == 1, 'catalog phase assignment changed')\nrequire(sql.count(\"v_current_phase := 'PAYLOAD_BASELINE';\") == 1, 'payload phase assignment changed')\nrequire(sql.count(\"v_current_phase := 'FINAL_ASSERTIONS';\") == 1, 'final phase assignment changed')\nfor number, digits in zip(expected_numbers, expected_two_digits):\n    prefix = f\"  v_current_phase := 'TEST_EXECUTION';\\n  v_current_test := {number};\\n\\n  -- {digits}.\"\n    require(sql.count(prefix) == 1, f'test {digits} tracking is not adjacent')\nrequire(\"v_current_phase := 'CATALOG_BINDING';\\n  v_current_test := 0;\\n\\n  select pg_get_functiondef\" in sql, 'catalog tracking is misplaced')\nrequire(\"v_current_phase := 'PAYLOAD_BASELINE';\\n  v_current_test := 0;\\n\\n  -- Positive payload baseline\" in sql, 'payload tracking is misplaced')\n\nassertion_ids = {f'N1A_TEST_{digits}_FAILED' for digits in expected_two_digits}\npayload_id = 'N1A_TEST_PAYLOAD_BASELINE_FAILED'\nnative_test_ids = {f'N1A_NATIVE_TEST_{digits}_FAILED' for digits in expected_two_digits}\nnative_fixed_ids = {\n    'N1A_NATIVE_CATALOG_BINDING_FAILED',\n    'N1A_NATIVE_PAYLOAD_BASELINE_FAILED',\n    'N1A_NATIVE_DO_BLOCK_FAILED',\n}\nfuture_stage_ids = {\n    'N1A_NATIVE_TEMP_SETUP_FAILED',\n    'N1A_NATIVE_FINAL_OUTPUT_FAILED',\n    'N1A_NATIVE_ROLLBACK_FAILED',\n}\nassertion_raises = re.findall(r\"raise exception '(N1A_TEST_\\d{2}_FAILED)';\", sql)\nrequire(assertion_raises == [f'N1A_TEST_{digits}_FAILED' for digits in expected_two_digits], 'assertion raises changed')\nrequire(sql.count(f\"raise exception '{payload_id}';\") == 1, 'payload baseline assertion changed')\nallowlist_match = re.search(r'if sqlerrm = any \\(array\\[(.*?)\\n    \\]\\) then', sql, flags=re.DOTALL)\nrequire(allowlist_match is not None, 'controlled assertion allowlist missing')\ncontrolled_allowlist = re.findall(r\"'(N1A_TEST_(?:\\d{2}|PAYLOAD_BASELINE)_FAILED)'\", allowlist_match.group(1))\nrequire(set(controlled_allowlist) == assertion_ids | {payload_id}, 'controlled assertion allowlist changed')\nrequire(len(controlled_allowlist) == 56, 'controlled assertion allowlist has duplicates')\nrequire(sql.count('      raise;') == 1, 'controlled assertion rethrow changed')\n\nnative_pairs = re.findall(r\"when (\\d+) then\\n          raise exception '(N1A_NATIVE_TEST_\\d{2}_FAILED)';\", sql)\nrequire(native_pairs == [(str(number), f'N1A_NATIVE_TEST_{number:02d}_FAILED') for number in expected_numbers], 'native test mapping changed')\nall_diagnostic_ids = set(re.findall(r'\\bN1A_(?:TEST|NATIVE)_[A-Z0-9_]+\\b', sql))\nrequire(all_diagnostic_ids == assertion_ids | {payload_id} | native_test_ids | native_fixed_ids, 'unexpected diagnostic ID')\nrequire(all(stage_id not in sql for stage_id in future_stage_ids), 'runner-only stage ID leaked into SQL')\nrequire(all(stage_id in workflow_text for stage_id in future_stage_ids), 'future runner stage mapping is undocumented')\n\nmarkers = [\n    'N1A_SAFE_STAGE=TRANSACTION_STARTED',\n    'N1A_SAFE_STAGE=TEMP_SETUP_STARTED',\n    'N1A_SAFE_STAGE=TEMP_SETUP_COMPLETED',\n    'N1A_SAFE_STAGE=DO_BLOCK_STARTED',\n    'N1A_SAFE_STAGE=DO_BLOCK_COMPLETED',\n    'N1A_SAFE_STAGE=FINAL_OUTPUT_STARTED',\n    'N1A_SAFE_STAGE=FINAL_OUTPUT_COMPLETED',\n    'N1A_SAFE_STAGE=ROLLBACK_STARTED',\n    'N1A_SAFE_STAGE=ROLLBACK_COMPLETED',\n]\nobserved_markers = re.findall(r'^\\\\echo (N1A_SAFE_STAGE=[A-Z_]+)$', sql, flags=re.MULTILINE)\nrequire(observed_markers == markers, 'safe stage markers are incomplete, duplicated, or unordered')\nrequire(sql.count('when others then') == 1, 'outer exception handler changed')\nrequire(sql.lower().count('sqlerrm') == 1, 'SQLERRM may only be used by the exact allowlist comparison')\nrequire('sqlstate' not in sql.lower(), 'SQLSTATE is forbidden')\nrequire('get stacked diagnostics' not in sql.lower(), 'stacked diagnostics are forbidden')\nrequire(not re.search(r\"raise exception\\s+(?!'(?:N1A_TEST_|N1A_NATIVE_))[^^;]+\", sql, flags=re.IGNORECASE), 'dynamic exception output is forbidden')\nrequire(not re.search(r'raise exception[^\\n]*(?:%|\\|\\||using)', sql, flags=re.IGNORECASE), 'formatted exception output is forbidden')\nrequire('v_current_phase' not in '\\n'.join(observed_markers), 'phase variable leaked')\nrequire('v_current_test' not in '\\n'.join(observed_markers), 'test variable leaked')\n\nprivacy_additions = '\\n'.join(line for line in added_lines if 'sqlerrm' not in line.lower())\nprivacy_patterns = [\n    r'https?://',\n    r'\\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}\\b',\n    r'\\b[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\\b',\n    r'get stacked diagnostics',\n    r'\\b(?:query|detail|hint|context)\\b',\n    r'\\b(?:token|secret|payload|clabe|bank_account)\\b',\n]\nfor pattern in privacy_patterns:\n    require(re.search(pattern, privacy_additions, flags=re.IGNORECASE) is None, f'private diagnostic surface detected: {pattern}')\nrequire(not re.search(r'^\\\\echo.*[:$\\{]', sql, flags=re.MULTILINE), 'dynamic echo detected')\n\nrequire(len(re.findall(r'^begin;$', sql, flags=re.MULTILINE | re.IGNORECASE)) == 1, 'transaction BEGIN changed')\nrequire(len(re.findall(r'^commit;$', sql, flags=re.MULTILINE | re.IGNORECASE)) == 0, 'COMMIT is forbidden')\nrequire(len(re.findall(r'^rollback;$', sql, flags=re.MULTILINE | re.IGNORECASE)) == 1, 'ROLLBACK count changed')\nrequire(re.search(r'rollback;\\n\\\\echo N1A_SAFE_STAGE=ROLLBACK_COMPLETED\\s*$', sql, flags=re.IGNORECASE) is not None, 'ROLLBACK is not the terminal SQL statement')\n\ntemp_tables = set(re.findall(r'create temporary table ([a-z0-9_]+)', sql, flags=re.IGNORECASE))\nexpected_temp_tables = {\n    'n1a_external_event_model',\n    'n1a_attempt_model',\n    'n1a_submission_model',\n    'n1a_policy_model',\n}\nrequire(temp_tables == expected_temp_tables, 'temporary table contract changed')\n\ndef scrub_sql(text):\n    text = re.sub(r\"'(?:''|[^'])*'\", \"''\", text, flags=re.DOTALL)\n    text = re.sub(r'--[^\\n]*', '', text)\n    return text\n\nscrubbed = scrub_sql(sql)\ndml_targets = re.findall(r'\\b(?:insert\\s+into|update|delete\\s+from|merge\\s+into)\\s+([a-z0-9_.]+)', scrubbed, flags=re.IGNORECASE)\nrequire(dml_targets, 'expected temporary DML is missing')\nrequire(set(target.lower() for target in dml_targets) <= expected_temp_tables, f'permanent DML detected: {dml_targets}')\nclaim_calls = re.findall(r'\\bclaim_(?:notification_events_for_dispatcher|pending_notification_events|external_notification_events_for_dispatcher)\\s*\\(', scrubbed, flags=re.IGNORECASE)\nrequire(not claim_calls, 'claims must be inspected, never invoked')\n\npass_rows = re.findall(r\"\\(\\s*(\\d+),\\s*'[^']+',\\s*'PASS'\\s*\\)\", sql)\nrequire([int(value) for value in pass_rows] == expected_numbers, 'PASS rows changed')\nrequire(not any(path.startswith('supabase/migrations/') for path in changed), 'migration change detected')\nrequire('supabase/migrations/' not in added_diff, 'migration path detected in SQL diff')\n\nprint('PASS / N1_A_CONTRACT_TEST_HARNESS_STATIC_SAFE')\nPY"
        }
      ]
    }
  }
}
