name: PR 543 temporary chip availability fix

'on':
  push:
    branches:
      - ops/pr543-chip-availability-fix
    paths:
      - '.github/workflows/pr543-chip-availability-fix-temporary.yml'

permissions:
  contents: write

concurrency:
  group: pr543-chip-availability-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out target PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/carlos-prediccion-partida-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Patch prediction chips defensively
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/features/solicitudes/RequestModal.tsx')
          text = path.read_text(encoding='utf-8')

          anchor = '  // Pre-selección: si la sugerencia es confiable (1 candidata, share≥80%), el\n'
          if text.count(anchor) != 1:
            raise SystemExit('prediction preselection anchor drifted')
          availability = '''  // Sólo ofrecemos candidatas históricas que también estén disponibles en el
          // presupuesto vigente. Esto evita que una chip deje seleccionado un id que
          // el usuario no podría elegir desde el selector normal.
          const availablePredictionCandidates = useMemo(
            () => prediction?.partida_candidates.filter((candidate) =>
              budgetRows.some((row) => row.budget_category_id === candidate.budget_category_id),
            ) ?? [],
            [prediction, budgetRows],
          )

          '''
          text = text.replace(anchor, availability + anchor, 1)

          apply_pattern = re.compile(
              r"  function applyPredictionCandidate\(id: string\) \{\n"
              r"    categoryTouched\.current = true\n"
              r"    setBudgetCategoryId\(id\)\n"
              r"  \}\n"
          )
          if len(apply_pattern.findall(text)) != 1:
            raise SystemExit('applyPredictionCandidate source drifted')
          apply_replacement = '''  function applyPredictionCandidate(id: string) {
            if (!budgetRows.some((row) => row.budget_category_id === id)) {
              showToast(
                'Partida no disponible',
                'La partida sugerida por historial no está disponible para la combinación seleccionada.',
                'warning',
              )
              return
            }
            categoryTouched.current = true
            setBudgetCategoryId(id)
          }
          '''
          text = apply_pattern.sub(apply_replacement, text, count=1)

          old_gate = 'prediction.partida_candidates.length > 0 && (\n                        <div className={s.predictionChips}>'
          new_gate = 'availablePredictionCandidates.length > 0 && (\n                        <div className={s.predictionChips}>'
          if text.count(old_gate) != 1:
            raise SystemExit('prediction chip condition drifted')
          text = text.replace(old_gate, new_gate, 1)

          old_map = '{prediction.partida_candidates.map((c) => ('
          if text.count(old_map) != 1:
            raise SystemExit('prediction chip map drifted')
          text = text.replace(old_map, '{availablePredictionCandidates.map((c) => (', 1)

          chip_start = text.index('Partidas frecuentes de este proveedor:')
          chip_close = '                        </div>\n                      )}\n'
          close_pos = text.index(chip_close, chip_start)
          hint = chip_close + '''                      {!isReembolso && prediction && prediction.partida_candidates.length > 0 && availablePredictionCandidates.length === 0 && (
                        <div className={s.fieldHint}>El historial de este proveedor tiene partidas que no están disponibles para la combinación seleccionada.</div>
                      )}
          '''
          text = text[:close_pos] + hint + text[close_pos + len(chip_close):]

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'app/src/features/solicitudes/RequestModal.tsx'
          grep -Fq 'availablePredictionCandidates' app/src/features/solicitudes/RequestModal.tsx
          git diff -- app/src/features/solicitudes/RequestModal.tsx

      - name: Commit fix to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ramon1415'
          git config user.email 'ramon@quantta.mx'
          git add app/src/features/solicitudes/RequestModal.tsx
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'fix: filter predicted partidas by current availability'
          git push origin HEAD:feature/carlos-prediccion-partida-v2
