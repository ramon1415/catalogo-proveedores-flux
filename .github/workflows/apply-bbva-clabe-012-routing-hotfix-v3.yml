name: Apply BBVA CLABE 012 routing hotfix v3

on:
  push:
    branches:
      - hotfix/bbva-clabe-012-routing-prod

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[bbva-clabe-routing-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply validated base patch
        shell: bash
        run: |
          python - <<'EXTRACT'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-bbva-clabe-012-routing-hotfix-v2.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Install React dependencies"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not extract the v2 patch script')
          script = textwrap.dedent(source[start:end + len("          PY\n")])
          Path('/tmp/apply-bbva-routing-hotfix.sh').write_text(script, encoding='utf-8')
          EXTRACT
          bash /tmp/apply-bbva-routing-hotfix.sh

      - name: Refresh browser cache contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          layouts_html = Path('layouts.html')
          replace_once(
              layouts_html,
              'layouts.js?v=20260817-budget-exception-layout',
              'layouts.js?v=20260903-bbva-clabe-012-routing',
          )

          regression = Path('scripts/qa/layout-budget-exception-reference-contract.test.mjs')
          replace_once(
              regression,
              r'layouts\.js\?v=20260817-budget-exception-layout',
              r'layouts\.js\?v=20260903-bbva-clabe-012-routing',
          )
          replace_once(
              regression,
              r'fase2_request_payment_method_extension\.js\?v=20260817-layout-method-parity',
              r'fase2_request_payment_method_extension\.js\?v=20260821-detalle-fix',
          )
          PY

      - name: Install React dependencies
        run: npm --prefix app ci

      - name: Run focused and regression contracts
        run: |
          node --check layouts.js
          node --test \
            scripts/qa/bbva-clabe-012-routing-hotfix.test.mjs \
            scripts/qa/bbva-cie-layout-contract.test.mjs \
            scripts/qa/layout-budget-exception-reference-contract.test.mjs \
            scripts/qa/prod-reimbursement-permissions.test.mjs \
            scripts/qa/approval-batches-company-scope-contract.test.mjs \
            scripts/qa/layout-scheduled-date-window-guard.test.mjs

      - name: Build production artifact
        run: npm --prefix app run build

      - name: Commit validated hotfix
        shell: bash
        run: |
          git config user.name "ramon1415"
          git config user.email "ramon@quantta.mx"
          git rm \
            .github/workflows/apply-bbva-clabe-012-routing-hotfix.yml \
            .github/workflows/apply-bbva-clabe-012-routing-hotfix-v2.yml \
            .github/workflows/apply-bbva-clabe-012-routing-hotfix-v3.yml
          git add \
            layouts.js \
            layouts.html \
            app/src/features/layouts/logic.ts \
            docs/ops/layout-cxc-download-format.md \
            scripts/qa/bbva-cie-layout-contract.test.mjs \
            scripts/qa/bbva-clabe-012-routing-hotfix.test.mjs \
            scripts/qa/layout-budget-exception-reference-contract.test.mjs
          git commit -m "fix(layouts): separar CLABE BBVA 012 de Pagos Inter [bbva-clabe-routing-fixed]"
          git push origin HEAD:hotfix/bbva-clabe-012-routing-prod
