name: Temporary DEV provider-intake focal retest

on:
  push:
    branches:
      - feature/ramon-provider-intake-edge-function
    paths:
      - ops/provider-intake/retest-dev.authorization.json

permissions:
  contents: read

concurrency:
  group: provider-intake-dev-focal-retest
  cancel-in-progress: false

jobs:
  provider_intake_focal_retest:
    name: Run provider-intake focal retest in Supabase DEV
    if: ${{ github.event_name == 'push' && github.ref_name == 'feature/ramon-provider-intake-edge-function' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: DEV

    env:
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      PROVIDER_INTAKE_QA_TOKEN: ${{ secrets.PROVIDER_INTAKE_QA_TOKEN }}
      PROVIDER_INTAKE_CAPTCHA_TEST_TOKEN: ${{ secrets.PROVIDER_INTAKE_CAPTCHA_TEST_TOKEN }}
      SUPABASE_PROJECT_REF: scsirgbuqjcwoaxfacth
      FUNCTION_NAME: provider-intake
      EXPECTED_FUNCTION_TREE: 379f65801609e40143d948b3de702e391636c512
      EXPECTED_MAX_TOTAL_MB: "12"
      BASE_COMMIT: e7821efebcd9a102ef8eb40eb80497dc72c6625d
      RETEST_SCRIPT: ops/provider-intake/retest-dev/provider-intake-focal-retest.ts
      EXPECTED_SCRIPT_BLOB: 0be061dd1fb49874fba150a27440029db7f6bbdc
      AUTH_FILE: ops/provider-intake/retest-dev.authorization.json

    steps:
      - name: Guard branch and temporary secret names
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "feature/ramon-provider-intake-edge-function" ]]; then
            echo "::error::This retest is restricted to the provider-intake PR branch."
            exit 1
          fi

          for name in \
            SUPABASE_DEV_DB_URL \
            PROVIDER_INTAKE_QA_TOKEN \
            PROVIDER_INTAKE_CAPTCHA_TEST_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required DEV Environment secret by name: ${name}."
              exit 1
            fi
          done

          echo "DEV retest guardrails passed; secret values were not printed."

      - name: Check out exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate focal retest authorization marker
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "${AUTH_FILE}" ]]; then
            echo "::error::Focal retest authorization marker is absent."
            exit 1
          fi

          jq -e \
            --arg expected_tree "${EXPECTED_FUNCTION_TREE}" \
            --arg expected_script "${EXPECTED_SCRIPT_BLOB}" '
            (keys | sort) == [
              "confirm",
              "expected_function_tree",
              "expected_max_total_mb",
              "expected_script_blob",
              "function_name",
              "project_ref"
            ]
            and .confirm == "RUN_PROVIDER_INTAKE_DEV_FOCAL_RETEST_ONLY"
            and .project_ref == "scsirgbuqjcwoaxfacth"
            and .function_name == "provider-intake"
            and .expected_function_tree == $expected_tree
            and .expected_script_blob == $expected_script
            and .expected_max_total_mb == 12
          ' "${AUTH_FILE}" >/dev/null

          echo "Focal retest authorization marker accepted."

      - name: Validate exact code and allowed post-base changes
        shell: bash
        run: |
          set -euo pipefail

          if ! git merge-base --is-ancestor "${BASE_COMMIT}" "${GITHUB_SHA}"; then
            echo "::error::The triggering commit is not based on the approved retest script commit."
            exit 1
          fi

          actual_function_tree="$(git rev-parse "HEAD:supabase/functions/${FUNCTION_NAME}")"
          if [[ "${actual_function_tree}" != "${EXPECTED_FUNCTION_TREE}" ]]; then
            echo "::error::The provider-intake function tree changed after the approved deployment."
            exit 1
          fi

          actual_script_blob="$(git rev-parse "HEAD:${RETEST_SCRIPT}")"
          if [[ "${actual_script_blob}" != "${EXPECTED_SCRIPT_BLOB}" ]]; then
            echo "::error::The focal retest script does not match the approved blob."
            exit 1
          fi

          changed_files="$(git diff --name-only "${BASE_COMMIT}" "${GITHUB_SHA}" | sort)"
          changed_count="$(printf '%s\n' "${changed_files}" | sed '/^$/d' | wc -l)"

          if [[ "${changed_count}" -ne 2 ]]; then
            echo "::error::Only the temporary workflow and authorization marker may change after the approved script."
            exit 1
          fi

          while IFS= read -r file; do
            case "${file}" in
              .github/workflows/provider-intake-dev-focal-retest-temporary.yml|ops/provider-intake/retest-dev.authorization.json)
                ;;
              *)
                echo "::error::Unexpected post-base file: ${file}"
                exit 1
                ;;
            esac
          done <<< "${changed_files}"

          if git diff --name-only "${BASE_COMMIT}" "${GITHUB_SHA}" |
            grep -Eq '^supabase/migrations/|^supabase/functions/|^supabase/config.toml$'; then
            echo "::error::Post-base changes include protected Supabase source."
            exit 1
          fi

          git diff --check "${BASE_COMMIT}" "${GITHUB_SHA}"
          echo "Code identity and allowed-change gate passed."

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate focal retest script
        shell: bash
        run: |
          set -euo pipefail

          command -v psql >/dev/null
          deno fmt --check "${RETEST_SCRIPT}"
          deno check "${RETEST_SCRIPT}"
          deno lint "${RETEST_SCRIPT}"

          echo "Focal retest script checks passed."

      - name: Run focal retest once
        shell: bash
        run: |
          set -euo pipefail

          evidence_dir="${RUNNER_TEMP}/provider-intake-dev-focal-retest-evidence"
          mkdir -p "${evidence_dir}"
          export EVIDENCE_FILE="${evidence_dir}/qa_results_focal_sanitized.json"

          deno run \
            --allow-env=SUPABASE_DEV_DB_URL,PROVIDER_INTAKE_QA_TOKEN,PROVIDER_INTAKE_CAPTCHA_TEST_TOKEN,EVIDENCE_FILE,GITHUB_RUN_ID,GITHUB_SHA \
            --allow-net=scsirgbuqjcwoaxfacth.functions.supabase.co:443 \
            --allow-run=psql \
            --allow-write="${EVIDENCE_FILE}" \
            "${RETEST_SCRIPT}"

      - name: Upload sanitized focal retest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-intake-dev-focal-retest-evidence
          path: ${{ runner.temp }}/provider-intake-dev-focal-retest-evidence
          if-no-files-found: warn
          retention-days: 14
