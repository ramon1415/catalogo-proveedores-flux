name: Supabase PROD Approval Batch Submitted Recovery

'on':
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-prod-approval-batch-submitted-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Recover new submitted-cut Director emails only
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: supabase-production
    env:
      EXPECTED_PROJECT_REF: ucantptjhwttexzmslvm
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF_PROD }}
      SUPABASE_PROD_SESSION_POOLER_DB_URL: ${{ secrets.SUPABASE_PROD_SESSION_POOLER_DB_URL }}
      NOTIFICATION_DISPATCHER_SECRET: ${{ secrets.NOTIFICATION_DISPATCHER_SECRET }}
      EVENT_TYPE: approval_batch.submitted
      DISPATCH_LIMIT: '5'

    steps:
      - name: Read protected runtime and invoke one exclusive recovery pass
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${PROJECT_REF}" = "${EXPECTED_PROJECT_REF}"
          test -n "${SUPABASE_PROD_SESSION_POOLER_DB_URL}"
          test -n "${NOTIFICATION_DISPATCHER_SECRET}"
          test "${EVENT_TYPE}" = "approval_batch.submitted"
          test "${DISPATCH_LIMIT}" = "5"
          echo "::add-mask::${SUPABASE_PROD_SESSION_POOLER_DB_URL}"
          echo "::add-mask::${NOTIFICATION_DISPATCHER_SECRET}"

          runtime_row="$(psql "${SUPABASE_PROD_SESSION_POOLER_DB_URL}" \
            -X -Atq -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          begin transaction read only;
          select
            coalesce(max(decrypted_secret) filter (
              where name = 'notification_approval_batch_submitted_dispatcher_url'
            ), ''),
            coalesce(max(decrypted_secret) filter (
              where name = 'notification_approval_batch_submitted_cutoff_at'
            ), ''),
            coalesce(max(decrypted_secret) filter (
              where name = 'notification_approval_batch_submitted_immediate_enabled'
            ), 'false'),
            coalesce(max(decrypted_secret) filter (
              where name = 'notification_approval_batch_submitted_recovery_enabled'
            ), 'false')
          from vault.decrypted_secrets
          where name = any(array[
            'notification_approval_batch_submitted_dispatcher_url',
            'notification_approval_batch_submitted_cutoff_at',
            'notification_approval_batch_submitted_immediate_enabled',
            'notification_approval_batch_submitted_recovery_enabled'
          ]::text[]);
          commit;
          SQL
          )"

          IFS='|' read -r function_url activation_cutoff immediate_enabled recovery_enabled <<< "${runtime_row}"
          if [[ "${recovery_enabled,,}" != "true" ]]; then
            echo "PASS / APPROVAL_BATCH_SUBMITTED_RECOVERY_DISABLED"
            exit 0
          fi

          test "${function_url}" = \
            "https://${EXPECTED_PROJECT_REF}.supabase.co/functions/v1/approval-batch-submitted-dispatcher"
          test -n "${activation_cutoff}"
          test "${immediate_enabled,,}" = "true"
          echo "::add-mask::${activation_cutoff}"

          request_body="$(ACTIVATION_CUTOFF="${activation_cutoff}" python3 - <<'PY'
          import datetime
          import json
          import os

          cutoff = os.environ['ACTIVATION_CUTOFF']
          parsed = datetime.datetime.fromisoformat(cutoff.replace('Z', '+00:00'))
          if parsed.tzinfo is None:
              raise SystemExit('activation_cutoff_timezone_required')
          print(json.dumps({
              'created_at_after': cutoff,
              'limit': 5,
          }, separators=(',', ':')))
          PY
          )"

          response_file="${RUNNER_TEMP}/approval-batch-submitted-recovery.json"
          trap 'rm -f "${response_file}"' EXIT
          http_code="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --request POST "${function_url}" \
            --header 'Content-Type: application/json' \
            --header "x-notification-dispatcher-secret: ${NOTIFICATION_DISPATCHER_SECRET}" \
            --data "${request_body}")"
          test "${http_code}" -ge 200
          test "${http_code}" -lt 300

          RESPONSE_FILE="${response_file}" python3 - <<'PY'
          import json
          import os

          with open(os.environ['RESPONSE_FILE'], encoding='utf-8') as handle:
              data = json.load(handle)

          processed = data.get('processed')
          sent = data.get('sent')
          failed = data.get('failed')
          cancelled = data.get('cancelled')
          events = data.get('events') if isinstance(data.get('events'), list) else []
          assert data.get('mode') == 'real'
          assert data.get('event_type') == 'approval_batch.submitted'
          assert isinstance(processed, int) and 0 <= processed <= 5
          assert isinstance(sent, int) and isinstance(failed, int) and isinstance(cancelled, int)
          assert sent + failed + cancelled == processed
          assert len(events) == processed
          assert all(
              event.get('event_type') == 'approval_batch.submitted'
              and event.get('status') in ('sent', 'failed', 'cancelled')
              for event in events
          )
          print(json.dumps({
              'processed': processed,
              'sent': sent,
              'failed': failed,
              'cancelled': cancelled,
              'approval_batch_submitted_only': True,
          }, sort_keys=True))
          PY
