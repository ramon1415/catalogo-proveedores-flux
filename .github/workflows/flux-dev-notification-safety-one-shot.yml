name: FLUX DEV Notification Safety One-shot

on:
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/flux-dev-notification-safety-one-shot.yml
  push:
    branches:
      - dev
    paths:
      - .github/workflows/flux-dev-notification-safety-one-shot.yml

permissions:
  contents: read

concurrency:
  group: flux-dev-notification-safety-one-shot
  cancel-in-progress: false

jobs:
  static_guardrails:
    name: Validate one-shot safety workflow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate scope and YAML
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PATH: .github/workflows/flux-dev-notification-safety-one-shot.yml
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.safe_load_file(ARGV.fetch(0), aliases: true)" "${EXPECTED_PATH}"
          mapfile -t changed < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "${EXPECTED_PATH}" ]]; then
            printf 'Unexpected PR scope:\n%s\n' "${changed[*]}"
            exit 1
          fi
          grep -Fq 'SUPABASE_PROJECT_ID: scsirgbuqjcwoaxfacth' "${EXPECTED_PATH}"
          grep -Fq 'NOTIFICATION_SEND_MODE=disabled' "${EXPECTED_PATH}"
          grep -Fq 'cron.alter_job' "${EXPECTED_PATH}"
          grep -Fq 'weekly-request-digest --no-verify-jwt' "${EXPECTED_PATH}"
          echo 'Static guardrails passed.'

  apply_dev_safety:
    name: Disable notifications in FLUX DEV
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: DEV
    env:
      SUPABASE_PROJECT_ID: scsirgbuqjcwoaxfacth
      EXPECTED_WEEKLY_INDEX_BLOB: 883689e1a48c0156c911e79d9604293290291472
      EVIDENCE_DIR: /tmp/flux-dev-notification-safety
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}

    steps:
      - name: Validate immutable DEV target and credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == 'ramon1415/catalogo-proveedores-flux' ]]
          [[ "${GITHUB_REF}" == 'refs/heads/dev' ]]
          [[ "${SUPABASE_PROJECT_ID}" == 'scsirgbuqjcwoaxfacth' ]]
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]]
          [[ -n "${SUPABASE_DEV_DB_URL:-}" ]]
          [[ -n "${SUPABASE_DEV_PROJECT_REF:-}" ]]
          [[ "${SUPABASE_DEV_PROJECT_REF}" == "${SUPABASE_PROJECT_ID}" ]]
          echo "::add-mask::${SUPABASE_ACCESS_TOKEN}"
          echo "::add-mask::${SUPABASE_DEV_DB_URL}"
          mkdir -p "${EVIDENCE_DIR}"
          chmod 700 "${EVIDENCE_DIR}"

      - name: Checkout exact DEV SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify weekly digest bundle identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ "$(git hash-object supabase/functions/weekly-request-digest/index.ts)" == "${EXPECTED_WEEKLY_INDEX_BLOB}" ]]
          node --test scripts/qa/weekly-request-digest-send-mode.test.mjs | tee "${EVIDENCE_DIR}/weekly-send-mode-tests.txt"

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.113.0

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          supabase --version | tee "${EVIDENCE_DIR}/supabase-version.txt"
          psql --version | tee "${EVIDENCE_DIR}/psql-version.txt"

      - name: Capture exact notification cron baseline
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_DEV_DB_URL}" --no-align --tuples-only --set ON_ERROR_STOP=1 <<'SQL' > "${EVIDENCE_DIR}/cron-before.json"
          select coalesce(jsonb_agg(jsonb_build_object(
            'jobid',jobid,'jobname',jobname,'schedule',schedule,'active',active
          ) order by jobid),'[]'::jsonb)
          from cron.job
          where jobname = any(array[
            'notification-payment-outcome-recovery-dev',
            'payroll-notification-recovery',
            'payroll-obligation-notification-recovery',
            'weekly-request-digest'
          ]::text[]);
          SQL
          python3 - "${EVIDENCE_DIR}/cron-before.json" <<'PY'
          import json, pathlib, sys
          rows=json.loads(pathlib.Path(sys.argv[1]).read_text().strip())
          expected={
            'notification-payment-outcome-recovery-dev',
            'payroll-notification-recovery',
            'payroll-obligation-notification-recovery',
            'weekly-request-digest',
          }
          names={row['jobname'] for row in rows}
          if names != expected or len(rows) != 4:
            raise SystemExit(f'cron inventory mismatch: {sorted(names)}')
          if not all(row['active'] is True for row in rows):
            raise SystemExit('expected all four notification cron jobs active before one-shot')
          print('Baseline inventory: 4 expected jobs, all active.')
          PY

      - name: Pause only the four DEV notification cron jobs
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_DEV_DB_URL}" --set ON_ERROR_STOP=1 <<'SQL'
          begin;
          do $block$
          declare
            expected_names constant text[] := array[
              'notification-payment-outcome-recovery-dev',
              'payroll-notification-recovery',
              'payroll-obligation-notification-recovery',
              'weekly-request-digest'
            ];
            found_count integer;
            item record;
          begin
            select count(*) into found_count
            from cron.job
            where jobname = any(expected_names);
            if found_count <> 4 then
              raise exception 'DEV_NOTIFICATION_CRON_INVENTORY_MISMATCH:%', found_count;
            end if;
            for item in
              select jobid from cron.job where jobname = any(expected_names) order by jobid
            loop
              perform cron.alter_job(item.jobid, active => false);
            end loop;
          end
          $block$;
          commit;
          SQL

      - name: Set global Edge Function notification mode to disabled
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set NOTIFICATION_SEND_MODE=disabled --project-ref "${SUPABASE_PROJECT_ID}" \
            > "${EVIDENCE_DIR}/secret-set.stdout" 2> "${EVIDENCE_DIR}/secret-set.stderr"
          echo 'NOTIFICATION_SEND_MODE updated for FLUX DEV; value intentionally not printed.'

      - name: Deploy weekly-request-digest safety lock to DEV
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy weekly-request-digest --no-verify-jwt --project-ref "${SUPABASE_PROJECT_ID}" \
            > "${EVIDENCE_DIR}/weekly-deploy.stdout" 2> "${EVIDENCE_DIR}/weekly-deploy.stderr"
          echo 'weekly-request-digest deployed to FLUX DEV with custom-auth mode preserved.'

      - name: Verify cron jobs are paused
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_DEV_DB_URL}" --no-align --tuples-only --set ON_ERROR_STOP=1 <<'SQL' > "${EVIDENCE_DIR}/cron-after.json"
          select coalesce(jsonb_agg(jsonb_build_object(
            'jobid',jobid,'jobname',jobname,'schedule',schedule,'active',active
          ) order by jobid),'[]'::jsonb)
          from cron.job
          where jobname = any(array[
            'notification-payment-outcome-recovery-dev',
            'payroll-notification-recovery',
            'payroll-obligation-notification-recovery',
            'weekly-request-digest'
          ]::text[]);
          SQL
          python3 - "${EVIDENCE_DIR}/cron-after.json" <<'PY'
          import json, pathlib, sys
          rows=json.loads(pathlib.Path(sys.argv[1]).read_text().strip())
          if len(rows) != 4 or any(row['active'] is not False for row in rows):
            raise SystemExit(f'cron pause postcheck failed: {rows!r}')
          print('Postcheck: 4 expected jobs are inactive.')
          PY

      - name: Prove weekly digest is fail-closed while disabled
        shell: bash
        run: |
          set -euo pipefail
          request_id="$(psql "${SUPABASE_DEV_DB_URL}" --no-align --tuples-only --set ON_ERROR_STOP=1 \
            --command "select private.wake_weekly_request_digest(true);")"
          [[ "${request_id}" =~ ^[0-9]+$ ]]
          printf '%s\n' "${request_id}" > "${EVIDENCE_DIR}/weekly-disabled-request-id.txt"

          response=''
          status_code=''
          for _ in $(seq 1 15); do
            row="$(psql "${SUPABASE_DEV_DB_URL}" --no-align --tuples-only --field-separator=$'\t' --set ON_ERROR_STOP=1 \
              --command "select status_code, content::text from net._http_response where id=${request_id};")"
            if [[ -n "${row}" ]]; then
              status_code="${row%%$'\t'*}"
              response="${row#*$'\t'}"
              break
            fi
            sleep 2
          done
          [[ "${status_code}" == '200' ]]
          [[ -n "${response}" ]]
          printf '%s\n' "${response}" > "${EVIDENCE_DIR}/weekly-disabled-response.json"
          RESPONSE="${response}" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['RESPONSE'])
          expected={
            'sent': 0,
            'mode': 'disabled',
            'reason': 'notification_send_disabled',
          }
          for key,value in expected.items():
            if data.get(key) != value:
              raise SystemExit(f'weekly disabled postcheck mismatch: {key}={data.get(key)!r}')
          print('Weekly digest fail-closed postcheck passed.')
          PY

      - name: Write sanitized summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# FLUX DEV notification safety one-shot'
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Git SHA: ${GITHUB_SHA}"
            echo "- Project ref: ${SUPABASE_PROJECT_ID}"
            echo '- Target: DEV only'
            echo '- Intended mode: disabled'
            echo '- Cron target count: 4 exact names'
            echo '- Weekly worker: deployed from merged DEV source'
            echo '- PROD: not touched'
            echo '- Business data: not modified by this workflow'
            echo '- Secret values: not included in evidence'
          } > "${EVIDENCE_DIR}/summary.md"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flux-dev-notification-safety-one-shot-evidence
          path: |
            /tmp/flux-dev-notification-safety/summary.md
            /tmp/flux-dev-notification-safety/cron-before.json
            /tmp/flux-dev-notification-safety/cron-after.json
            /tmp/flux-dev-notification-safety/weekly-disabled-request-id.txt
            /tmp/flux-dev-notification-safety/weekly-disabled-response.json
            /tmp/flux-dev-notification-safety/weekly-send-mode-tests.txt
            /tmp/flux-dev-notification-safety/supabase-version.txt
            /tmp/flux-dev-notification-safety/psql-version.txt
          if-no-files-found: warn
          retention-days: 14
