name: Provider save errors
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'app/src/features/proveedores/**'
      - 'proveedores.js'
      - 'scripts/qa/provider-save-errors.test.mjs'
      - '.github/workflows/provider-save-errors.yml'
permissions:
  contents: read
jobs:
  provider-save-errors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm --prefix app ci
      - run: node --test scripts/qa/provider-save-errors.test.mjs scripts/qa/provider-catalog-rpc-persistence-contract.test.mjs
      - run: npm --prefix app run build
