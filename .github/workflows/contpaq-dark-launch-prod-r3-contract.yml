name: CONTPAQ dark launch PROD R3 contract
on:
  pull_request:
    branches: [main]
    paths:
      - app/src/features/configuracion/**
      - app/src/lib/contpaq/**
      - supabase/migrations/20260921231129_contpaq_dark_launch_schema_prod_r3.sql
      - supabase/migrations/20260921231130_contpaq_dark_launch_seed_prod_r3.sql
      - scripts/qa/contpaq-dark-launch-prod-r3-contract.test.mjs
      - .github/workflows/contpaq-dark-launch-prod-r3-contract.yml
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci
      - run: node --test scripts/qa/contpaq-dark-launch-prod-r3-contract.test.mjs
      - run: npm --prefix app run typecheck
      - run: npm --prefix app run build
      - run: git diff --check
