name: Flux PROD read-only baseline

on:
  push:
    branches: [dev]
    paths: [.github/workflows/flux-prod-readonly-baseline.yml]
  workflow_dispatch:
    inputs:
      target_git_sha:
        description: Exact deployed commit to audit
        required: false
        type: string
      release_slice:
        description: Release slice identifier
        required: false
        type: string
      expected_prod_deployment_sha:
        description: Expected active Production deployment SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: flux-prod-readonly-baseline
  cancel-in-progress: false

jobs:
  baseline:
    name: Targeted Slice 01 PROD metadata baseline
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: supabase-production
    env:
      EVIDENCE_SUBDIR: flux-prod-readonly-baseline
    steps:
      - name: Initialize contractual evidence
        shell: bash
        run: |
          set -euo pipefail
          export EVIDENCE_DIR="${RUNNER_TEMP}/${EVIDENCE_SUBDIR}"
          mkdir -p "$EVIDENCE_DIR"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json,os,pathlib,re,urllib.request
          root=pathlib.Path(os.environ['EVIDENCE_DIR'])
          names=['gate-report.json','github-identities.json','prod-database-identity.json','transaction-readonly-proof.json','workflow-bootstrap-audit.json','workflow-context-audit.json','local-migration-inventory.json','focal-migration-history.json','focal-migration-classification.json','focal-object-fingerprints.json','csf-schema-audit.json','csf-storage-policy-audit.json','approval-batches-schema-audit.json','cash-funds-schema-audit.json','cash-funds-forward-fix-plan.json','dependency-025-audit.json','slice-01-notification-overlap-audit.json','c1-fasttrack-inputs.json','sanitization-audit.json','mutation-ledger.json']
          for name in names: (root/name).write_text(json.dumps({'status':'NOT_RUN'},indent=2)+'\n')
          (root/'transaction-readonly-proof.json').write_text(json.dumps({'gate':'FLUX-PROD-SLICE-01-BASELINE-UNBLOCKER-R6','status':'NOT_RUN','failure_code':None,'internal_failure_code':None,'warning_codes':[],'psql_exit_code':None,'query_ok':None,'proof_version':None,'marker_count':0,'default_transaction_read_only':None,'transaction_read_only':None,'default_transaction_read_only_required':False,'current_transaction_read_only_required':True,'explicit_begin_transaction_read_only':None,'rollback_present':None,'mutable_sql_guard_pass':None,'read_only_contract_pass':False,'stdout_line_count':0,'stdout_nonempty_line_count':0,'marker_line_index':None,'ignored_blank_lines':0,'ignored_command_tags':0,'unknown_line_count':0,'raw_stdout_sha256':None,'parser':'labeled_json_marker','positional_parsing_used':False,'parser_self_test':None},indent=2)+'\n')
          workflow_url=f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/{os.environ['GITHUB_SHA']}/.github/workflows/flux-prod-readonly-baseline.yml"
          request=urllib.request.Request(workflow_url,headers={'User-Agent':'flux-readonly-baseline-r6'}); workflow=urllib.request.urlopen(request,timeout=20).read().decode()
          matches=list(re.finditer(r'\$\{\{\s*(.*?)\s*\}\}',workflow)); id_positions={m.group(1):m.start() for m in re.finditer(r'(?m)^\s+id:\s*([A-Za-z_][\w-]*)\s*$',workflow)}; rows=[]
          for m in matches:
            start=workflow.rfind('\n',0,m.start())+1; end=workflow.find('\n',m.end()); line=workflow[start:end if end>=0 else len(workflow)]; expr=m.group(1).strip()
            root_match=re.match(r'([A-Za-z_][A-Za-z0-9_]*)',expr); step_match=re.match(r'steps\.([A-Za-z_][\w-]*)\.',expr); rows.append({'root':root_match.group(1) if root_match else '', 'step':step_match.group(1) if step_match else None,'position':m.start(),'indent':len(line)-len(line.lstrip()),'step_with_path':line.lstrip().startswith('path:')})
          allowed={'github','inputs','vars','secrets','env','runner','steps','needs','matrix'}; unrecognized=sum(r['root'] not in allowed for r in rows); runner_workflow=sum(r['root']=='runner' and r['indent']==2 for r in rows); runner_job=sum(r['root']=='runner' and r['indent']==6 for r in rows); runner_step=sum(r['root']=='runner' and r['indent']>=10 and r['step_with_path'] for r in rows); steps_before=sum(bool(r['step']) and id_positions.get(r['step'],len(workflow))>=r['position'] for r in rows)
          invalid=sum(r['root'] not in allowed or (r['root']=='runner' and not (r['indent']>=10 and r['step_with_path'])) or (bool(r['step']) and id_positions.get(r['step'],len(workflow))>=r['position']) for r in rows); runtime_path='export EVIDENCE_DIR="${RUNNER_TEMP}/${EVIDENCE_SUBDIR}"' in workflow; github_env="EVIDENCE_DIR=%s\\n' \"$EVIDENCE_DIR\" >> \"$GITHUB_ENV\"" in workflow
          checks=len(rows)==17 and invalid==0 and runner_workflow==0 and runner_job==0 and runner_step==1 and steps_before==0 and unrecognized==0 and runtime_path and github_env
          context_audit={'gate':'FLUX-PROD-SLICE-01-BASELINE-UNBLOCKER-R6','status':'PASS' if checks else 'FAIL','total_expressions':len(rows),'valid_expressions':len(rows)-invalid,'invalid_expressions':invalid,'runner_context_in_workflow_env':runner_workflow,'runner_context_in_job_env':runner_job,'runner_context_in_step_with':runner_step,'steps_context_before_execution':steps_before,'unrecognized_context_references':unrecognized,'runtime_path_initialized_with_runner_temp':runtime_path,'evidence_dir_exported_to_github_env':github_env,'functional_baseline_logic_changed':False,'runtime_path_initialization_changed':False,'evidence_schema_changed':True,'evidence_schema_delta':['transaction-readonly-proof.json','workflow-context-audit.json','focal-migration-classification.json','gate-report.json','gate-report.md','c1-fasttrack-inputs.json'],'internal_artifact_identifiers_changed':True,'migration_classifier_dispatch':{'implementation':'lazy_if_elif','eager_dictionary_dispatch_present':False,'supported_types':[],'actual_marker_count':0,'all_real_markers_evaluated':False,'exceptions':None,'rules_changed':False}}
          (root/'workflow-context-audit.json').write_text(json.dumps(context_audit,indent=2)+'\n')
          if not checks: raise SystemExit('WORKFLOW_CONTEXT_AUDIT_FAILED')
          (root/'gate-report.md').write_text('# FLUX PROD Slice 01 baseline\n\nStatus: NOT_RUN\n')
          (root/'cleanup.txt').write_text('PENDING\n')
          PY

      - name: Resolve immutable GitHub and Production identities
        id: identity
        shell: bash
        env:
          DISPATCH_TARGET: ${{ inputs.target_git_sha }}
          DISPATCH_SLICE: ${{ inputs.release_slice }}
          DISPATCH_EXPECTED: ${{ inputs.expected_prod_deployment_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,re,time,urllib.parse,urllib.request
          root=pathlib.Path(os.environ['EVIDENCE_DIR']); repo=os.environ['GITHUB_REPOSITORY']; base='https://api.github.com'
          def api(path):
            req=urllib.request.Request(base+path,headers={'Accept':'application/vnd.github+json','User-Agent':'flux-readonly-baseline-r6'})
            for n in range(3):
              try:
                with urllib.request.urlopen(req,timeout=20) as r:return json.load(r)
              except Exception:
                if n==2: raise
                time.sleep(2**n)
          try:
            if os.environ['GITHUB_REF']!='refs/heads/dev': raise RuntimeError('WORKFLOW_REF_NOT_DEV')
            meta=api(f'/repos/{repo}'); main=api(f'/repos/{repo}/git/ref/heads/main')['object']['sha']; dev=api(f'/repos/{repo}/git/ref/heads/dev')['object']['sha']
            main_tree=api(f'/repos/{repo}/git/commits/{main}')['tree']['sha']; dev_tree=api(f'/repos/{repo}/git/commits/{dev}')['tree']['sha']
            deployments=api(f'/repos/{repo}/deployments?environment=Production&per_page=100')
            active=None
            for d in deployments:
              sts=api(f"/repos/{repo}/deployments/{d['id']}/statuses?per_page=1")
              if sts and sts[0].get('state')=='success': active={'id':d['id'],'sha':d['sha'],'status_id':sts[0]['id']}; break
            if not active: raise RuntimeError('ACTIVE_PRODUCTION_DEPLOYMENT_NOT_FOUND')
            if main!=active['sha']: raise RuntimeError('PROD_MAIN_IDENTITY_CHANGED')
            if os.environ['GITHUB_SHA']!=dev: raise RuntimeError('STATE_RACE')
            event=os.environ['GITHUB_EVENT_NAME']; payload=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text()); inventory_dev=dev
            if event=='push':
              target,expected,slice_id=main,active['sha'],'SLICE_01'; inventory_dev=payload.get('before','')
              if not re.fullmatch(r'[0-9a-f]{40}',inventory_dev) or inventory_dev=='0'*40 or payload.get('after')!=dev: raise RuntimeError('UNBLOCKER_SCOPE_VIOLATION')
            elif event=='workflow_dispatch':
              target=os.environ.get('DISPATCH_TARGET','').strip(); expected=os.environ.get('DISPATCH_EXPECTED','').strip(); slice_id=os.environ.get('DISPATCH_SLICE','').strip()
              if not target or not expected or not slice_id: raise RuntimeError('DISPATCH_INPUT_REQUIRED')
              if not re.fullmatch(r'[0-9a-f]{40}',target) or not re.fullmatch(r'[0-9a-f]{40}',expected): raise RuntimeError('DISPATCH_SHA_INVALID')
              if not re.fullmatch(r'[A-Za-z0-9_-]{1,64}',slice_id): raise RuntimeError('DISPATCH_SLICE_INVALID')
              resolved=api(f'/repos/{repo}/commits/{target}')['sha']
              if resolved!=target: raise RuntimeError('TARGET_SHA_NOT_FOUND')
            else: raise RuntimeError('UNSUPPORTED_TRIGGER')
            if target!=expected or expected!=active['sha']: raise RuntimeError('PROD_DATABASE_IDENTITY_MISMATCH')
            data={'status':'PASS','captured_at_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'repository':repo,'default_branch':meta['default_branch'],'current_main_sha':main,'current_main_tree':main_tree,'current_dev_sha':inventory_dev,'bootstrap_result_dev_sha':dev,'bootstrap_result_dev_tree':dev_tree,'current_prod_deployment_sha':active['sha'],'current_prod_deployment_id':active['id'],'target_git_sha':target,'expected_prod_sha':expected,'release_slice':slice_id}
            (root/'github-identities.json').write_text(json.dumps(data,indent=2)+'\n')
            boot={'status':'PASS','gate':'FLUX-PROD-SLICE-01-BASELINE-UNBLOCKER-R6','manifest':'FLUX-PROD-SLICE-01-BASELINE-UNBLOCKER-R6-2026-08-02','run_purpose':'validate active read-only PROD transaction and type-safe migration baseline','event':event,'ref':os.environ['GITHUB_REF'],'event_sha':os.environ['GITHUB_SHA'],'push_bootstrap':event=='push','future_dispatch':event=='workflow_dispatch','one_job':True,'environment':'supabase-production'}
            (root/'workflow-bootstrap-audit.json').write_text(json.dumps(boot,indent=2)+'\n')
            out=os.environ['GITHUB_OUTPUT']; short=main[:7]
            with open(out,'a') as f:
              for k,v in {'target_git_sha':target,'current_dev_sha':inventory_dev,'bootstrap_result_dev_sha':dev,'expected_prod_sha':expected,'release_slice':slice_id,'artifact_name':f'flux-prod-readonly-baseline-slice-01-{short}'}.items(): f.write(f'{k}={v}\n')
          except Exception as e:
            raw=str(e); allowed={'PROD_MAIN_IDENTITY_CHANGED','STATE_RACE','PROD_DATABASE_IDENTITY_MISMATCH'}; code=raw if raw in allowed else 'BASELINE_AUTOMATION_FAILURE'; (root/'identity-error.json').write_text(json.dumps({'status':'STOP','assertion':code,'internal_assertion':raw},indent=2)+'\n'); raise
          PY

      - name: Checkout exact PROD target
        if: steps.identity.outcome == 'success'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.identity.outputs.target_git_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Derive focal migration inventory from captured dev
        id: inventory
        if: steps.identity.outcome == 'success'
        shell: bash
        env:
          DEV_SHA: ${{ steps.identity.outputs.current_dev_sha }}
          DEV_AFTER_SHA: ${{ steps.identity.outputs.bootstrap_result_dev_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          root=pathlib.Path(os.environ['EVIDENCE_DIR']); sha=os.environ['DEV_SHA']; after=os.environ['DEV_AFTER_SHA']; versions=['016','017','020','021','022','023','024','025','026','028']
          if os.environ['GITHUB_EVENT_NAME']=='push':
            changed=subprocess.check_output(['git','diff','--name-only',sha,after],text=True).splitlines()
            if changed!=['.github/workflows/flux-prod-readonly-baseline.yml']: raise RuntimeError('UNBLOCKER_SCOPE_VIOLATION:'+','.join(changed))
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only',sha,'supabase/migrations'],text=True).splitlines(); items=[]; sources={}
          def names(sql,pat): return sorted(set(re.findall(pat,sql,re.I|re.M)))
          for v in versions:
            hits=[p for p in paths if re.search(rf'/{v}_[^/]+\.sql$',p)]
            if len(hits)!=1: raise RuntimeError(f'MIGRATION_{v}_PATH_COUNT_{len(hits)}')
            p=hits[0]; raw=subprocess.check_output(['git','show',f'{sha}:{p}']); sql=raw.decode(); sources[v]=sql
            blob=subprocess.check_output(['git','rev-parse',f'{sha}:{p}'],text=True).strip(); clean=re.sub(r'--[^\n]*|/\*.*?\*/',' ',sql,flags=re.S)
            objs={'tables':names(clean,r'\bcreate\s+table(?:\s+if\s+not\s+exists)?\s+(?:public\.)?"?([a-z_]\w*)'),'columns':names(clean,r'\badd\s+column(?:\s+if\s+not\s+exists)?\s+"?([a-z_]\w*)'),'constraints':names(clean,r'\badd\s+constraint\s+"?([a-z_]\w*)'),'indexes':names(clean,r'\bcreate\s+(?:unique\s+)?index(?:\s+if\s+not\s+exists)?\s+"?([a-z_]\w*)'),'sequences':names(clean,r'\bcreate\s+sequence(?:\s+if\s+not\s+exists)?\s+(?:public\.)?"?([a-z_]\w*)'),'functions':names(clean,r'\bcreate(?:\s+or\s+replace)?\s+function\s+(?:public\.)?"?([a-z_]\w*)'),'triggers':names(clean,r'\bcreate\s+trigger\s+"?([a-z_]\w*)'),'policies':names(clean,r'\bcreate\s+policy\s+(?:"([^"]+)"|([a-z_]\w*))'),'grant_targets':names(clean,r'\bgrant\s+[\s\S]*?\bon\s+(?:table\s+|function\s+|sequence\s+)?(?:public\.)?"?([a-z_]\w*)'),'grant_roles':names(clean,r'\bgrant\s+[\s\S]*?\bto\s+"?([a-z_]\w*)')}
            objs['policies']=sorted({x[0] or x[1] for x in objs['policies']}); dml={x:len(re.findall(rf'\b{x}\s+',clean,re.I)) for x in ['insert','update','delete','merge']}
            effects=sorted([k for k,val in objs.items() if val]+[k for k,val in dml.items() if val])
            items.append({'version':v,'dependency_only':v=='025','filename':p,'git_blob_sha':blob,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'top_level_statement_count':clean.count(';'),'expected_objects':objs,'dml_statement_counts':dml,'material_effect_categories':effects})
          combined='\n'.join(sources.values()).lower(); external=['net.http','http_post','cron.schedule','webhook','n8n','notification_dispatcher','041_notifications','042_notifications']; external_by_migration={v:[x for x in external if x in s.lower()] for v,s in sources.items()}; csf_versions={'016','017','020'}; cuts_versions={'021','022','023','024','025','026','028'}
          csf_external=any(external_by_migration[v] for v in csf_versions); cuts_external=any(external_by_migration[v] for v in cuts_versions); overlap={'status':'PASS','internal_notification_event_producers_present':'notification_events' in combined,'internal_producer_migrations':[v for v,s in sources.items() if 'notification_events' in s.lower()],'internal_events_are_append_only_evidence':True,'external_runtime_overlap':csf_external or cuts_external,'external_runtime_markers':[x for x in external if x in combined],'external_runtime_markers_by_migration':external_by_migration,'CSF_TOUCHES_EXTERNAL_NOTIFICATION_RUNTIME':csf_external,'CUTS_TOUCHES_EXTERNAL_NOTIFICATION_RUNTIME':cuts_external,'protected_scope':'PROTECTED_OUT_OF_SCOPE'}
          (root/'local-migration-inventory.json').write_text(json.dumps({'status':'PASS','source_dev_sha':sha,'unit_count':len(items),'units':items},indent=2)+'\n')
          (root/'slice-01-notification-overlap-audit.json').write_text(json.dumps(overlap,indent=2)+'\n')
          PY

      - name: Build and statically guard read-only catalog query
        id: sql_guard
        if: steps.inventory.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/flux-audit.sql" <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT '__FLUX_READONLY_PROOF__' || json_build_object('proof_version',1,'default_transaction_read_only',current_setting('default_transaction_read_only'),'transaction_read_only',current_setting('transaction_read_only'))::text;
          WITH wanted_tables(s,t) AS (VALUES
            ('public','proveedores'),('public','company_directors'),('public','approval_batches'),('public','approval_batch_items'),('public','approval_batch_company_settings'),('public','approval_batch_company_setting_events'),('public','payment_request_extraordinary_authorizations'),('public','payment_requests'),('public','payment_layouts'),('public','payment_layout_lines'),('public','cash_funds'),('public','intake_links'),('public','payment_intake'),('public','payment_intake_files'),('public','payment_intake_events')),
          wanted_functions(n) AS (VALUES ('normalize_proveedores_canonical'),('set_approval_batch_updated_at'),('approval_batch_require_actor'),('approval_batch_require_finance'),('approval_batch_direction_roles'),('approval_batch_request_base_eligible'),('approval_batch_request_open_elsewhere'),('validate_approval_batch_item'),('approval_batch_assert_execution_authorized'),('validate_approval_batch_final_status'),('list_company_directors'),('list_approval_batch_director_candidates'),('set_company_director'),('create_approval_batch'),('list_batch_eligible_requests'),('add_request_to_approval_batch'),('remove_request_from_approval_batch'),('submit_approval_batch'),('approve_entire_batch'),('decide_approval_batch_items'),('close_approval_batch'),('release_rejected_batch_item_for_rebatch'),('get_approval_batch_detail'),('approval_batch_totals_by_currency'),('list_finance_approval_batches'),('list_director_approval_batches'),('set_approval_batch_company_enforcement'),('set_company_batch_configuration'),('authorize_payment_request_extraordinary'),('revoke_payment_request_extraordinary'),('release_and_rebatch_rejected_request'),('approval_batch_payment_layout_candidates'),('preview_payment_layout_eligibility'),('create_payment_layout'),('approval_batch_budget_validation'),('approval_batch_request_eligibility'),('complete_payment_request_layout_data'),('approval_batch_request_has_current_direction_approval'),('approval_batch_request_has_active_extraordinary'),('approval_batch_request_has_any_execution_record'),('create_cash_fund'),('get_payment_request_execution_readiness'),('get_payment_request_execution_context'),('next_payment_intake_public_folio'),('current_user_has_role'),('flux_finance_roles'),('insert_approval_batch_notification'),('enqueue_approval_batch_status_notifications'),('enqueue_approval_batch_item_notification'),('enqueue_extraordinary_payment_notification'),('enqueue_rebatched_item_notification'))
          SELECT jsonb_build_object('kind','catalog','database',jsonb_build_object('database_fingerprint_md5',md5(current_database()),'database_oid',pg_database.oid,'server_version_num',current_setting('server_version_num'),'default_transaction_read_only',current_setting('default_transaction_read_only'),'transaction_read_only',current_setting('transaction_read_only')),
            'tables',COALESCE((SELECT jsonb_agg(jsonb_build_object('schema',n.nspname,'table',c.relname,'rls',c.relrowsecurity,'force_rls',c.relforcerowsecurity) ORDER BY n.nspname,c.relname) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace JOIN wanted_tables w ON w.s=n.nspname AND w.t=c.relname WHERE c.relkind IN ('r','p')),'[]'::jsonb),
            'columns',COALESCE((SELECT jsonb_agg(jsonb_build_object('schema',c.table_schema,'table',c.table_name,'column',c.column_name,'type',c.data_type,'nullable',c.is_nullable,'default_md5',md5(COALESCE(c.column_default,''))) ORDER BY c.table_name,c.ordinal_position) FROM information_schema.columns c JOIN wanted_tables w ON w.s=c.table_schema AND w.t=c.table_name),'[]'::jsonb),
            'constraints',COALESCE((SELECT jsonb_agg(jsonb_build_object('table',r.relname,'name',c.conname,'type',c.contype,'definition',pg_get_constraintdef(c.oid,true)) ORDER BY r.relname,c.conname) FROM pg_constraint c JOIN pg_class r ON r.oid=c.conrelid JOIN pg_namespace n ON n.oid=r.relnamespace JOIN wanted_tables w ON w.s=n.nspname AND w.t=r.relname),'[]'::jsonb),
            'indexes',COALESCE((SELECT jsonb_agg(jsonb_build_object('table',i.tablename,'name',i.indexname,'definition',i.indexdef) ORDER BY i.tablename,i.indexname) FROM pg_indexes i JOIN wanted_tables w ON w.s=i.schemaname AND w.t=i.tablename),'[]'::jsonb),
            'functions',COALESCE((SELECT jsonb_agg(jsonb_build_object('name',p.proname,'argument_types',oidvectortypes(p.proargtypes),'volatility',p.provolatile,'security_definer',p.prosecdef,'definition',pg_get_functiondef(p.oid)) ORDER BY p.proname,oidvectortypes(p.proargtypes)) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace JOIN wanted_functions w ON w.n=p.proname WHERE n.nspname='public'),'[]'::jsonb),
            'triggers',COALESCE((SELECT jsonb_agg(jsonb_build_object('table',r.relname,'name',t.tgname,'enabled',t.tgenabled,'function',p.proname,'definition',pg_get_triggerdef(t.oid,true)) ORDER BY r.relname,t.tgname) FROM pg_trigger t JOIN pg_class r ON r.oid=t.tgrelid JOIN pg_namespace n ON n.oid=r.relnamespace JOIN pg_proc p ON p.oid=t.tgfoid JOIN wanted_tables w ON w.s=n.nspname AND w.t=r.relname WHERE NOT t.tgisinternal),'[]'::jsonb),
            'policies',COALESCE((SELECT jsonb_agg(jsonb_build_object('schema',p.schemaname,'table',p.tablename,'name',p.policyname,'command',p.cmd,'roles',p.roles,'using_expression',p.qual,'with_check_expression',p.with_check) ORDER BY p.tablename,p.policyname) FROM pg_policies p LEFT JOIN wanted_tables w ON w.s=p.schemaname AND w.t=p.tablename WHERE w.t IS NOT NULL OR (p.schemaname='storage' AND p.tablename='objects' AND lower(COALESCE(p.policyname,'')||' '||COALESCE(p.qual,'')||' '||COALESCE(p.with_check,'')) LIKE '%csf%')),'[]'::jsonb),
            'grants',COALESCE((SELECT jsonb_agg(jsonb_build_object('schema',g.table_schema,'table',g.table_name,'grantee',g.grantee,'privilege',g.privilege_type) ORDER BY g.table_name,g.grantee,g.privilege_type) FROM information_schema.table_privileges g JOIN wanted_tables w ON w.s=g.table_schema AND w.t=g.table_name),'[]'::jsonb),
            'sequences',COALESCE((SELECT jsonb_agg(jsonb_build_object('schema',n.nspname,'name',c.relname)) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='S' AND c.relname='payment_intake_public_folio_seq'),'[]'::jsonb),
            'history_exists',to_regclass('supabase_migrations.schema_migrations') IS NOT NULL)
          FROM pg_database WHERE datname=current_database();
          SELECT to_regclass('storage.buckets') IS NOT NULL AS storage_exists \gset
          \if :storage_exists
          SELECT jsonb_build_object('kind','storage','bucket',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',id,'name',name,'public',public,'file_size_limit',file_size_limit,'allowed_mime_types',allowed_mime_types)) FROM storage.buckets WHERE id='payment-receipts'),'[]'::jsonb));
          \else
