          DB_OK: ${{ steps.db.outputs.query_ok }}
          CLASSIFY_OUTCOME: ${{ steps.classify.outcome }}
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/flux-audit.sql" "$RUNNER_TEMP/flux-db.raw" "$RUNNER_TEMP/flux-db.err" "$RUNNER_TEMP/flux-readonly-proof.py" "$RUNNER_TEMP/flux-parser-self-test.json"
          echo PASS > "$EVIDENCE_DIR/cleanup.txt"
          python3 - <<'PY'
          import json,os,pathlib,re,time
          root=pathlib.Path(os.environ['EVIDENCE_DIR']); code=None; proof_path=root/'transaction-readonly-proof.json'; proof=json.loads(proof_path.read_text()) if proof_path.exists() else {}
          if proof.get('status')=='FAIL' and proof.get('failure_code'): code=proof['failure_code']
          if code is None and os.environ.get('IDENTITY_OUTCOME')!='success':
            p=root/'identity-error.json'; code=json.loads(p.read_text()).get('assertion','BASELINE_AUTOMATION_FAILURE') if p.exists() else 'BASELINE_AUTOMATION_FAILURE'
          elif code is None and (os.environ.get('INVENTORY_OUTCOME')!='success' or os.environ.get('STATIC_OUTCOME')!='success'): code='BASELINE_AUTOMATION_FAILURE'
          elif code is None and os.environ.get('DB_OK')!='true': code='PROD_READONLY_QUERY_FAILED'
          elif code is None and os.environ.get('CLASSIFY_OUTCOME')!='success': code='BASELINE_AUTOMATION_FAILURE'
          elif code is None:
            cls=json.loads((root/'focal-migration-classification.json').read_text()); units=cls['units']
            focal=[x for x in units if x['version']!='025']
            if any(x['classification']=='PARTIAL' for x in focal): code='FOCAL_MIGRATION_PARTIAL_STATE'
            elif any(x['classification']=='CONFLICTING' for x in focal): code='FOCAL_MIGRATION_CONFLICT'
            elif any(x['classification']=='UNKNOWN' for x in focal): code='FOCAL_MIGRATION_UNKNOWN'
            elif json.loads((root/'dependency-025-audit.json').read_text())['classification'] not in ['SATISFIED','NOT_REQUIRED']: code='DEPENDENCY_025_UNRESOLVED'
            elif json.loads((root/'slice-01-notification-overlap-audit.json').read_text())['external_runtime_overlap']: code='SLICE_01_NOTIFICATION_OVERLAP_DETECTED'
          findings=[]; patterns=[('database_url',r'postgres(?:ql)?://'),('token',r'github_pat_|gh[pousr]_[A-Za-z0-9_]'),('email',r'\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'),('uuid_value',r'\b[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\b'),('clabe_value',r'(?<!\d)\d{18}(?!\d)'),('supabase_host',r'[a-z0-9-]+\.supabase\.(?:co|com)')]
          for p in root.iterdir():
            if p.name=='sanitization-audit.json': continue
            s=p.read_text(errors='replace')
            for label,rx in patterns:
              if re.search(rx,s,re.I): findings.append({'file':p.name,'category':label})
          sanit={'status':'PASS' if not findings else 'FAIL','files_scanned':len(list(root.iterdir())),'findings':findings,'prohibited_operational_rows':0,'documents_read':0,'host_disclosed':False}
          (root/'sanitization-audit.json').write_text(json.dumps(sanit,indent=2)+'\n')
          if findings and code in [None,'BASELINE_AUTOMATION_FAILURE']: code='EVIDENCE_ARTIFACT_INVALID'
          ctx=json.loads((root/'workflow-context-audit.json').read_text()); code='EVIDENCE_ARTIFACT_INVALID' if (ctx.get('status')!='PASS' or ctx.get('invalid_expressions')!=0) and code in [None,'BASELINE_AUTOMATION_FAILURE'] else code; identities=json.loads((root/'github-identities.json').read_text()); c1=json.loads((root/'c1-fasttrack-inputs.json').read_text())
          proof_codes={'PROD_READONLY_QUERY_FAILED','PROD_READONLY_PROOF_MARKER_MISSING','PROD_READONLY_PROOF_MARKER_DUPLICATED','PROD_READONLY_PROOF_JSON_INVALID','PROD_DEFAULT_TRANSACTION_NOT_READONLY','PROD_TRANSACTION_NOT_READONLY','PROD_READONLY_PROOF_SCHEMA_INVALID'}; phase=('read_only_proof' if code in proof_codes else 'migration_classification' if code and code.startswith('FOCAL_MIGRATION_') else 'dependency_025' if code=='DEPENDENCY_025_UNRESOLVED' else 'artifact_validation' if code=='EVIDENCE_ARTIFACT_INVALID' else 'notification_overlap' if code=='SLICE_01_NOTIFICATION_OVERLAP_DETECTED' else 'identity' if code and 'IDENTITY' in code else 'automation' if code else None); source=('transaction-readonly-proof.json' if phase=='read_only_proof' else 'focal-migration-classification.json' if phase=='migration_classification' else 'dependency-025-audit.json' if phase=='dependency_025' else ('sanitization-audit.json' if findings else 'workflow-context-audit.json') if phase=='artifact_validation' else 'slice-01-notification-overlap-audit.json' if phase=='notification_overlap' else 'identity-error.json' if phase=='identity' else 'workflow-step-outcomes' if phase else None); expected=({'psql_exit_code':0,'marker_count':1,'default_transaction_read_only':'on','transaction_read_only':'on'} if phase=='read_only_proof' else 'accepted gate state' if code else None); actual=({k:proof.get(k) for k in ['psql_exit_code','marker_count','default_transaction_read_only','transaction_read_only']} if phase=='read_only_proof' else code)
          result='STOP / '+code if code else 'PASS / SHARED_PROD_READONLY_PROOF_HARDENED / CORRECTIVE_PR_MERGED_TO_DEV / PUSH_BOOTSTRAP_RUN_SUCCESS / SLICE_01_TARGETED_PROD_BASELINE_CAPTURED / SLICE_01_MIGRATIONS_CLASSIFIED / NO_PROD_CHANGES / SLICE_01_C1_FASTTRACK_READY'
          report={'status':'STOP' if code else 'PASS','result':result,'gate':'FLUX-PROD-SLICE-01-BASELINE-UNBLOCKER-R5','manifest':'FLUX-PROD-SLICE-01-BASELINE-UNBLOCKER-R5-2026-08-01','run_purpose':'hardened reusable read-only PROD proof','workflow_context_audit':ctx.get('status'),'evidence_schema_changed':True,'evidence_schema_delta':['transaction-readonly-proof.json','gate-report.json','gate-report.md'],'internal_artifact_identifiers_changed':True,'exact_failure_code':code,'exact_failure_phase':phase,'expected':expected,'actual':actual,'source_evidence_file':source,'target_git_sha':identities.get('target_git_sha'),'c1_fasttrack_ready':False if code else c1.get('SLICE_01_C1_FASTTRACK_READY'),'prod_mutations':{'schema':0,'data':0,'migration_history':0,'storage':0,'runtime':0,'http':0},'completed_at_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          (root/'gate-report.json').write_text(json.dumps(report,indent=2)+'\n'); (root/'gate-report.md').write_text(f"# FLUX-PROD-SLICE-01-BASELINE-UNBLOCKER-R5\n\n{result}\n\nExact failure code: {code or 'none'}\nExact failure phase: {phase or 'none'}\nExpected: {json.dumps(expected,sort_keys=True)}\nActual: {json.dumps(actual,sort_keys=True)}\nSource evidence: {source or 'none'}\n\nPROD schema/data/history/storage/runtime/HTTP writes: 0.\n")
          ledger={'status':'PASS','workflow_runs_created_by_workflow':0,'reruns':0,'dispatches_created_by_workflow':0,'git_writes':0,'prod_schema_writes':0,'prod_data_writes':0,'prod_history_writes':0,'prod_storage_writes':0,'prod_runtime_mutations':0,'http_writes':0}
          (root/'mutation-ledger.json').write_text(json.dumps(ledger,indent=2)+'\n')
          required=['gate-report.json','github-identities.json','prod-database-identity.json','transaction-readonly-proof.json','workflow-bootstrap-audit.json','workflow-context-audit.json','local-migration-inventory.json','focal-migration-history.json','focal-migration-classification.json','focal-object-fingerprints.json','csf-schema-audit.json','csf-storage-policy-audit.json','approval-batches-schema-audit.json','cash-funds-schema-audit.json','cash-funds-forward-fix-plan.json','dependency-025-audit.json','slice-01-notification-overlap-audit.json','c1-fasttrack-inputs.json','sanitization-audit.json','mutation-ledger.json']
          for n in required:
            p=root/n
            if not p.exists() or not p.stat().st_size: raise SystemExit('EVIDENCE_ARTIFACT_INVALID:'+n)
            json.loads(p.read_text())
          if not (root/'gate-report.md').stat().st_size or (root/'cleanup.txt').read_text().strip()!='PASS': raise SystemExit('EVIDENCE_ARTIFACT_INVALID:non_json_evidence')
          if code: raise SystemExit(result)
          PY

      - name: Upload sanitized baseline artifact
        if: always()
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.identity.outputs.artifact_name || 'flux-prod-readonly-baseline-slice-01-diagnostic' }}
          path: ${{ runner.temp }}/flux-prod-readonly-baseline
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
