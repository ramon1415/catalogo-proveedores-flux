name: CONTPAQ seed artifact verification

on:
  pull_request:
    types: [synchronize]
    branches:
      - codex/flux-slice-02-dashboard-anual-clean
    paths:
      - .github/workflows/contpaq-seed-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    name: Verify hashes and package versioned CONTPAQ seeds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.repository == 'ramon1415/catalogo-proveedores-flux' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/flux-slice-03-contpaq-mapper-clean') ||
       (github.event_name == 'pull_request' && github.head_ref == 'codex/flux-slice-03-contpaq-mapper-clean'))

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Verify copied artifact hashes and counts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected.sha256 <<'HASHES'
          8a461f10752b4eed82df2d336934b21056de5684b22e573fee492654bf5707c6  supabase/seed/contpaq/catalogo_operadora.csv
          3c68d1579e68b694975d460325d156226d93a46986036c35afbce1d7e77ba4a8  supabase/seed/contpaq/catalogo_operadora.sql
          827ee2cab2e42f4f7c37fab715c2dc3750bbb621a176909fc79be9a72d63e55a  supabase/seed/contpaq/mapeos_operadora.csv
          713241dfa5e64f0599b82e86655b64930cbdae9abcc1def887982b921a8486bc  supabase/seed/contpaq/mapeos_operadora.sql
          HASHES
          sha256sum -c /tmp/expected.sha256
          test "$(( $(wc -l < supabase/seed/contpaq/catalogo_operadora.csv) - 1 ))" -eq 1646
          test "$(( $(wc -l < supabase/seed/contpaq/mapeos_operadora.csv) - 1 ))" -eq 87

      - name: Upload verified seed package
        uses: actions/upload-artifact@v4
        with:
          name: contpaq-versioned-seeds
          path: supabase/seed/contpaq/
          if-no-files-found: error
          retention-days: 30
