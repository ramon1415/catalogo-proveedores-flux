name: Dashboard historical blend v2 DEV deploy one-shot

on:
  push:
    branches:
      - ops/dashboard-historical-blend-v2-dev-deploy
    paths:
      - .github/workflows/dashboard-historical-blend-v2-dev-deploy.yml

permissions:
  contents: read

concurrency:
  group: dashboard-historical-blend-v2-dev-deploy
  cancel-in-progress: false

env:
  DEV_PROJECT_REF: scsirgbuqjcwoaxfacth
  EXPECTED_DEV_SHA: 297900b5d3191f4bd2bd24735e14da6188208b97
  MIGRATION_1: supabase/migrations/20260922151516_historical_actuals_period_certification.sql
  MIGRATION_2: supabase/migrations/20260922151518_dashboard_historical_blend_v2.sql
  MIGRATION_1_BLOB: f98648c6d0c97b688d1cf724607e674d68246110
  MIGRATION_2_BLOB: dbc7d5d1d3cf48e553404647b21b58c69c18a7c7
  VERSION_1: "20260922151516"
  VERSION_2: "20260922151518"

jobs:
  deploy:
    name: Apply exact historical blend migrations to Supabase DEV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: DEV
    env:
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}

    steps:
      - name: Checkout exact ops branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard DEV target and immutable migration blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ramon1415/catalogo-proveedores-flux"
          test "$GITHUB_REF_NAME" = "ops/dashboard-historical-blend-v2-dev-deploy"

          live_dev="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq .object.sha)"
          test "$live_dev" = "$EXPECTED_DEV_SHA"
          git merge-base --is-ancestor "$EXPECTED_DEV_SHA" HEAD

          test "$(git hash-object "$MIGRATION_1")" = "$MIGRATION_1_BLOB"
          test "$(git hash-object "$MIGRATION_2")" = "$MIGRATION_2_BLOB"

          mapfile -t changed < <(git diff --name-only "$EXPECTED_DEV_SHA" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/dashboard-historical-blend-v2-dev-deploy.yml"

      - name: Require secure DEV database route
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DEV_DB_URL"
          echo "::add-mask::$SUPABASE_DEV_DB_URL"
          export PGSSLMODE=require
          export PGCONNECT_TIMEOUT=15

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get -qq update >/dev/null
            sudo apt-get -qq install -y postgresql-client >/dev/null
          fi

          conninfo="$(psql "$SUPABASE_DEV_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --command '\conninfo' 2>&1)"
          grep -Eiq 'SSL connection|TLSv1\.[23]|protocol:[[:space:]]*TLS' <<<"$conninfo"

          binding="$(psql "$SUPABASE_DEV_DB_URL" --no-psqlrc -At --set ON_ERROR_STOP=1             -c "select current_database()||'|'||current_user;")"
          IFS='|' read -r db role <<<"$binding"
          test "$db" = "postgres"
          case "$role" in postgres|supabase_admin) ;; *) echo "::error::unexpected DEV DB role"; exit 1;; esac

      - name: Preflight exact state
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_DEV_DB_URL"
          export PGSSLMODE=require

          psql "$SUPABASE_DEV_DB_URL" --no-psqlrc -At --set ON_ERROR_STOP=1 <<SQL > /tmp/preflight.json
          select jsonb_build_object(
            'target_versions_absent', not exists (
              select 1 from supabase_migrations.schema_migrations
              where version in ('$VERSION_1','$VERSION_2')
            ),
            'periods_absent', to_regclass('public.historical_actuals_periods') is null,
            'historical_view_absent', to_regclass('private.dashboard_historical_spend_v2') is null,
            'public_v2_absent', to_regprocedure('public.dashboard_global_budget_report_v2(uuid,integer)') is null,
            'private_v2_absent', to_regprocedure('private.dashboard_global_budget_report_v2(uuid,integer)') is null,
            'historical_actuals_count', (select count(*) from public.historical_actuals),
            'payment_requests_count', (select count(*) from public.payment_requests),
            'payroll_obligations_count', (select count(*) from public.payroll_obligations),
            'migration_count', (select count(*) from supabase_migrations.schema_migrations)
          );
          SQL

          cat /tmp/preflight.json
          jq -e '
            .target_versions_absent == true
            and .periods_absent == true
            and .historical_view_absent == true
            and .public_v2_absent == true
            and .private_v2_absent == true
          ' /tmp/preflight.json >/dev/null

      - name: Build exact atomic deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/historical-blend-deploy
          python3 - <<'PY'
          from pathlib import Path

          specs = [
              (
                  Path("supabase/migrations/20260922151516_historical_actuals_period_certification.sql"),
                  "20260922151516",
                  "historical_actuals_period_certification",
                  "f98648c6d0c97b688d1cf724607e674d68246110",
              ),
              (
                  Path("supabase/migrations/20260922151518_dashboard_historical_blend_v2.sql"),
                  "20260922151518",
                  "dashboard_historical_blend_v2",
                  "dbc7d5d1d3cf48e553404647b21b58c69c18a7c7",
              ),
          ]

          out = ["\\set ON_ERROR_STOP on", "begin;"]
          for path, version, name, blob in specs:
              text = path.read_text()
              lines = text.splitlines()
              if lines[0].strip().lower() != "begin;" or lines[-1].strip().lower() != "commit;":
                  raise SystemExit(f"unexpected transaction wrapper in {path}")
              inner = "\n".join(lines[1:-1]).strip() + "\n"
              out.append(f"-- exact source: {path}")
              out.append(inner)
              trace = f"source=git;path={path};blob={blob}"
              out.append(
                  "insert into supabase_migrations.schema_migrations"
                  "(version, statements, name, created_by) values ("
                  f"'{version}', ARRAY['{trace}'], '{name}', 'ramon@quantta.mx');"
              )

          out.append("commit;")
          Path("/tmp/historical-blend-deploy/deploy.sql").write_text("\n".join(out) + "\n")
          PY

      - name: Apply exact migrations and ledger rows atomically
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_DEV_DB_URL"
          export PGSSLMODE=require
          export PGCONNECT_TIMEOUT=15
          export PGOPTIONS="-c statement_timeout=90000 -c lock_timeout=5000"

          psql "$SUPABASE_DEV_DB_URL"             --no-psqlrc             --set ON_ERROR_STOP=1             --set VERBOSITY=terse             --file /tmp/historical-blend-deploy/deploy.sql

      - name: Postcheck objects, ledger and zero certifications
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_DEV_DB_URL"
          export PGSSLMODE=require

          psql "$SUPABASE_DEV_DB_URL" --no-psqlrc -At --set ON_ERROR_STOP=1 <<SQL > /tmp/postdeploy.json
          select jsonb_build_object(
            'versions', (
              select jsonb_agg(version order by version)
              from supabase_migrations.schema_migrations
              where version in ('$VERSION_1','$VERSION_2')
            ),
            'names', (
              select jsonb_agg(name order by version)
              from supabase_migrations.schema_migrations
              where version in ('$VERSION_1','$VERSION_2')
            ),
            'periods_rows', (select count(*) from public.historical_actuals_periods),
            'periods_rls_force', (
              select relrowsecurity and relforcerowsecurity
              from pg_class where oid='public.historical_actuals_periods'::regclass
            ),
            'historical_view_security_invoker', (
              select 'security_invoker=true' = any(coalesce(reloptions,array[]::text[]))
              from pg_class where oid='private.dashboard_historical_spend_v2'::regclass
            ),
            'public_v2_present', to_regprocedure('public.dashboard_global_budget_report_v2(uuid,integer)') is not null,
            'private_v2_present', to_regprocedure('private.dashboard_global_budget_report_v2(uuid,integer)') is not null,
            'historical_actuals_count', (select count(*) from public.historical_actuals),
            'payment_requests_count', (select count(*) from public.payment_requests),
            'payroll_obligations_count', (select count(*) from public.payroll_obligations),
            'migration_count', (select count(*) from supabase_migrations.schema_migrations)
          );
          SQL

          cat /tmp/postdeploy.json
          jq -e '
            .versions == ["20260922151516","20260922151518"]
            and .names == ["historical_actuals_period_certification","dashboard_historical_blend_v2"]
            and .periods_rows == 0
            and .periods_rls_force == true
            and .historical_view_security_invoker == true
            and .public_v2_present == true
            and .private_v2_present == true
          ' /tmp/postdeploy.json >/dev/null

          jq -s -e '
            .[0].historical_actuals_count == .[1].historical_actuals_count
            and .[0].payment_requests_count == .[1].payment_requests_count
            and .[0].payroll_obligations_count == .[1].payroll_obligations_count
            and .[1].migration_count == (.[0].migration_count + 2)
          ' /tmp/preflight.json /tmp/postdeploy.json >/dev/null

      - name: Verify v2 equals v1 with zero certifications
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_DEV_DB_URL"
          export PGSSLMODE=require

          cat > /tmp/historical-blend-deploy/equality.sql <<'SQL'
          \set ON_ERROR_STOP on

          select p.auth_user_id::text as auth_user_id
          from public.profiles p
          join public.profile_company_memberships pcm
            on pcm.profile_id=p.id
           and pcm.active
           and pcm.company_id='9680353c-9b86-4730-82e1-fce664f048a2'::uuid
          join public.user_roles ur on ur.profile_id=p.id
          join public.roles r on r.id=ur.role_id
          where p.active and p.auth_user_id is not null
            and r.name in (
              'admin','superadmin','sysadmin','system_admin',
              'finance','finanzas','treasury','tesoreria','administracion',
              'approver_2','aprobador_2','direccion','director'
            )
          order by p.auth_user_id
          limit 1
          \gset

          select set_config(
            'request.jwt.claims',
            jsonb_build_object('sub', :'auth_user_id', 'role', 'authenticated')::text,
            false
          );
          set role authenticated;

          create temp table qa_v1 as
          select *
          from jsonb_to_recordset(
            public.dashboard_global_budget_report('9680353c-9b86-4730-82e1-fce664f048a2'::uuid, 2026)
          ) as x(
            budget_category_id uuid,budget_month date,budgeted numeric,committed numeric,
            executed numeric,available numeric,paid_amount numeric,non_budget_used numeric,
            payroll_used numeric,unconverted_count integer
          );

          create temp table qa_v2 as
          select budget_category_id,budget_month,budgeted,committed,executed,available,
                 paid_amount,non_budget_used,payroll_used,unconverted_count
          from jsonb_to_recordset(
            public.dashboard_global_budget_report_v2('9680353c-9b86-4730-82e1-fce664f048a2'::uuid, 2026)
          ) as x(
            budget_category_id uuid,budget_month date,classification text,data_source text,
            budgeted numeric,committed numeric,executed numeric,available numeric,
            paid_amount numeric,non_budget_used numeric,payroll_used numeric,unconverted_count integer
          );

          do $check$
          begin
            if exists (
              (select * from qa_v1 except all select * from qa_v2)
              union all
              (select * from qa_v2 except all select * from qa_v1)
            ) then
              raise exception 'DEPLOY_FAIL_V2_DIFFERS_WITH_ZERO_CERTIFICATIONS';
            end if;
          end;
          $check$;

          reset role;
          select jsonb_build_object(
            'result','DASHBOARD_HISTORICAL_BLEND_V2_DEV_DEPLOY_PASS',
            'certifications',(select count(*) from public.historical_actuals_periods),
            'v1_v2_equal_without_certifications',true
          );
          SQL

          psql "$SUPABASE_DEV_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1             --set VERBOSITY=terse --file /tmp/historical-blend-deploy/equality.sql             | tee /tmp/historical-blend-deploy/equality-output.txt

          grep -F 'DASHBOARD_HISTORICAL_BLEND_V2_DEV_DEPLOY_PASS' /tmp/historical-blend-deploy/equality-output.txt
