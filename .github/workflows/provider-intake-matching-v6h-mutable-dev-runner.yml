name: Provider intake matching V6H mutable temporary

'on':
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: provider-intake-matching-v6h-mutable
  cancel-in-progress: false

jobs:
  gate2-v6h-mutable:
    name: Provider Intake Matching - V6H (one-shot mutable)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: DEV
    env:
      TEMP_BRANCH: "codex/provider-intake-matching-v6h-mutable-258-temp"
      FEATURE_BRANCH: "feature/ramon-provider-intake-matching"
      PR_NUMBER: "258"

      BASELINE_GIT: "51b5b47dbe427e5e7a936703742ef832c19467c5"
      PERMANENT_HEAD: "f1de674f14fa91a580a51d85682d2130663b9506"
      EXPECTED_RUNNER_HEAD: "f1de674f14fa91a580a51d85682d2130663b9506"
      EXPECTED_RUNNER_SHA256: "4a2e49e3a9866ab2253d68fb746e82cd098ade26fcd567581eb416fbaf55bc30"
      EXPECTED_RUNNER_GIT_BLOB: "3ae94a331271b759afa9b9f63d077c808263e958"

      EXTERNAL_LOAD_SHA256: "c988bedccef3e1013d1eae768d90e152b64a9e6245bf826a1aa8116c5866a2b0"
      BACKEND_TREE: "379f65801609e40143d948b3de702e391636c512"
      PROJECT_REF: "scsirgbuqjcwoaxfacth"
      SUPABASE_URL: "https://scsirgbuqjcwoaxfacth.supabase.co"
      PREVIEW_URL: "https://catalogo-proveedores-flux-git-feature-ramon-282446-quantta-team.vercel.app"
      WORKFLOW_EVIDENCE_DIR: "outputs/provider-intake-matching-2a/gate-2-v6h-mutable"

      RUNNER_FILE: "scripts/qa/provider-intake-matching-gate2-uat.mjs"
      ACCESSIBILITY_FILE: "scripts/qa/provider-intake-matching-accessibility.mjs"
      FLOW_FILE: "scripts/qa/provider-intake-matching-flow.mjs"
      CONTRACT_TEST_FILE: "scripts/qa/provider-intake-matching-contract.test.mjs"
      VISUAL_FILE: "scripts/qa/provider-intake-matching-visual.mjs"

      EXPECTED_ACCESSIBILITY_SHA: "765ce7dbd98506e6d38d3f84d124a18eb4f1b8928e7a4eb2aa8edad87b19a564"
      EXPECTED_ACCESSIBILITY_SIZE: "11565"
      EXPECTED_FLOW_SHA: "0c46ab1c9cb154bedd8b0fcbcd08c87cec2d866ffce1dc8bb1204a9c3a212bc4"
      EXPECTED_FLOW_GIT_BLOB: "4d1b871608164293ee999eb2ed61f72757d237d2"
      EXPECTED_FLOW_SIZE: "12447"
      EXPECTED_CONTRACT_SHA: "7fa9c844e3d598acb8bcaef1c8d45780a42e91b4df9566b94267a91e06ee4e68"
      EXPECTED_CONTRACT_GIT_BLOB: "56edff420ebfa8ae5e1d29dcc12b3cdabd24496f"
      EXPECTED_CONTRACT_SIZE: "30726"
      EXPECTED_VISUAL_SHA: "a68f7a43170f0e9c7bc4c2f385dce77c6f6337a273da66d8f24786466a0fc851"
      EXPECTED_VISUAL_GIT_BLOB: "4d729f7796965ec11aff3813b29bb95b551a552b"
      EXPECTED_VISUAL_SIZE: "35170"

      APPROVED_RUNNER_SHA256: "4a2e49e3a9866ab2253d68fb746e82cd098ade26fcd567581eb416fbaf55bc30"
      ALLOW_MUTABLE_UAT: "true"
      CONFIRMED_DEV_PROJECT_REF: "scsirgbuqjcwoaxfacth"
      EPHEMERAL_LINK_AUTHORIZED: "true"
      FIXTURE_PROVISIONING_AUTHORIZED: "true"
      IAM_ACTIVATION_AUTHORIZED: "true"
      EXPIRED_LINK_NORMALIZATION_AUTHORIZED: "true"

      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      SUPABASE_DEV_ANON_KEY: ${{ secrets.SUPABASE_DEV_ANON_KEY }}
      SUPABASE_DEV_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_DEV_SERVICE_ROLE_KEY }}
      SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
      QA_COMPANY_ID: ${{ secrets.QA_COMPANY_ID }}
      QA_LINK_CREATED_BY: ${{ secrets.QA_LINK_CREATED_BY }}
      QA_CAPTCHA_TOKEN: ${{ secrets.QA_CAPTCHA_TOKEN }}

    steps:
      - name: Checkout temporary mutable branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEMP_BRANCH }}
          fetch-depth: 0

      - name: Validate execution context and immutable identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORKFLOW_EVIDENCE_DIR"
          test "$GITHUB_REPOSITORY" = "ramon1415/catalogo-proveedores-flux"
          test "$GITHUB_REF_NAME" = "$TEMP_BRANCH"
          test "$(git rev-parse --abbrev-ref HEAD)" = "$TEMP_BRANCH"
          test "$(git rev-parse HEAD)" = "$PERMANENT_HEAD"
          test "$SUPABASE_URL" = "https://$PROJECT_REF.supabase.co"

          test "$SUPABASE_DEV_DB_URL"
          test "$SUPABASE_DEV_SERVICE_ROLE_KEY"
          test "$SUPABASE_DEV_ANON_KEY"
          test "$SUPABASE_ACCESS_TOKEN" || true
          test -n "$QA_COMPANY_ID"
          test -n "$QA_LINK_CREATED_BY"
          test -n "$QA_CAPTCHA_TOKEN"
          test "$SUPABASE_DEV_PROJECT_REF" = "$PROJECT_REF"

          test "$(git rev-parse "$PERMANENT_HEAD:supabase/functions/provider-intake")" = "$BACKEND_TREE"
          test "$(sha256sum "$RUNNER_FILE" | cut -d' ' -f1)" = "$EXPECTED_RUNNER_SHA256"
          test "$(git hash-object --no-filters "$RUNNER_FILE")" = "$EXPECTED_RUNNER_GIT_BLOB"
          test "$(sha256sum "$FLOW_FILE" | cut -d' ' -f1)" = "$EXPECTED_FLOW_SHA"
          test "$(git hash-object --no-filters "$FLOW_FILE")" = "$EXPECTED_FLOW_GIT_BLOB"
          test "$(wc -c < "$FLOW_FILE" | tr -d ' ')" = "$EXPECTED_FLOW_SIZE"
          test "$(sha256sum "$CONTRACT_TEST_FILE" | cut -d' ' -f1)" = "$EXPECTED_CONTRACT_SHA"
          test "$(git hash-object --no-filters "$CONTRACT_TEST_FILE")" = "$EXPECTED_CONTRACT_GIT_BLOB"
          test "$(wc -c < "$CONTRACT_TEST_FILE" | tr -d ' ')" = "$EXPECTED_CONTRACT_SIZE"
          test "$(sha256sum "$VISUAL_FILE" | cut -d' ' -f1)" = "$EXPECTED_VISUAL_SHA"
          test "$(git hash-object --no-filters "$VISUAL_FILE")" = "$EXPECTED_VISUAL_GIT_BLOB"
          test "$(wc -c < "$VISUAL_FILE" | tr -d ' ')" = "$EXPECTED_VISUAL_SIZE"
          test "$(sha256sum "$ACCESSIBILITY_FILE" | cut -d' ' -f1)" = "$EXPECTED_ACCESSIBILITY_SHA"
          test "$(wc -c < "$ACCESSIBILITY_FILE" | tr -d ' ')" = "$EXPECTED_ACCESSIBILITY_SIZE"
          test "$(sha256sum supabase/migrations/031_provider_intake_matching.sql | cut -d' ' -f1)" = "$EXTERNAL_LOAD_SHA256"
          test "$(sha256sum ops/provider-intake/apply-031-matching/03_LOAD_031_EXACT.sql | cut -d' ' -f1)" = "$EXTERNAL_LOAD_SHA256"
          cmp --silent supabase/migrations/031_provider_intake_matching.sql ops/provider-intake/apply-031-matching/03_LOAD_031_EXACT.sql

          test "$(sha256sum \"$RUNNER_FILE\" | cut -d' ' -f1)" = "$EXPECTED_RUNNER_SHA256"
          test "$(sha256sum \"$ACCESSIBILITY_FILE\" | cut -d' ' -f1)" = "$EXPECTED_ACCESSIBILITY_SHA"

          pr_json="$(gh api repos/ramon1415/catalogo-proveedores-flux/pulls/$PR_NUMBER)"
          test "$(echo "$pr_json" | jq -r '.state')" = "open"
          test "$(echo "$pr_json" | jq -r '.draft')" = "true"
          test "$(echo "$pr_json" | jq -r '.base.ref')" = "dev"
          test "$(echo "$pr_json" | jq -r '.head.ref')" = "$FEATURE_BRANCH"
          test "$(echo "$pr_json" | jq -r '.head.sha')" = "$PERMANENT_HEAD"
          test "$(echo "$pr_json" | jq -r '.changed_files')" = "16"

          current_body="$(echo "$pr_json" | jq -r '.body // ""')"
          if grep -q "V6H_ATTEMPT_CONSUMED=true" <<< "$current_body"; then
            echo "V6H mutable attempt already consumed; aborting."
            exit 1
          fi

          workflow_identity=$(cat <<JSON
          {
            "identity": "5/5 PASS",
            "runner_sha256": "$EXPECTED_RUNNER_SHA256",
            "runner_blob": "$EXPECTED_RUNNER_GIT_BLOB",
            "runner_head": "$PERMANENT_HEAD",
            "accessibility_sha256": "$EXPECTED_ACCESSIBILITY_SHA",
            "flow_sha256": "$EXPECTED_FLOW_SHA",
            "contract_sha256": "$EXPECTED_CONTRACT_SHA",
            "visual_sha256": "$EXPECTED_VISUAL_SHA",
            "status": "PASS",
            "attempt_consumed": false,
            "mutable_execution": false
          }
          JSON
          )
          echo "$workflow_identity" > "$WORKFLOW_EVIDENCE_DIR/identity_route_matrix_v6h_sanitized.json"

      - name: Install pinned immutable runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/v6h-runtime"
          mkdir -p "$runtime_dir"
          npm install --no-audit --no-fund --silent --prefix "$runtime_dir" playwright@1.61.1 pg@8.16.3 axe-core@4.10.3
          "$runtime_dir/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$runtime_dir/node_modules" >> "$GITHUB_ENV"
          echo "AXE_CORE_PATH=$runtime_dir/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"
          echo "AXE_CORE_VERSION=4.10.3" >> "$GITHUB_ENV"

      - name: Install mutable credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SUPABASE_DEV_ANON_KEY:-}" && -n "${SUPABASE_DEV_SERVICE_ROLE_KEY:-}" ]]; then
            echo "Using repository secrets for DEV anon/service role."
            echo "SUPABASE_DEV_ANON_KEY=$SUPABASE_DEV_ANON_KEY" >> "$GITHUB_ENV"
            echo "SUPABASE_DEV_SERVICE_ROLE_KEY=$SUPABASE_DEV_SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
            echo "SUPABASE_DEV_DB_URL=$SUPABASE_DEV_DB_URL" >> "$GITHUB_ENV"
            echo "::add-mask::$SUPABASE_DEV_ANON_KEY"
            echo "::add-mask::$SUPABASE_DEV_SERVICE_ROLE_KEY"
            jq -n --arg project "$PROJECT_REF" '{status:"PASS", project_ref:$project, anon_key:"present", service_key:"present", db_url:"present", mutable_execution:false, writes:0}' \
              > "$WORKFLOW_EVIDENCE_DIR/secret_availability_v6h_sanitized.json"
            exit 0
          fi

          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" || -z "${SUPABASE_DEV_DB_URL:-}" ]]; then
            echo "Missing secrets for DEV credentials."
            exit 1
          fi

          api_keys_file="$(mktemp)"
          response="$(mktemp)"
          trap 'rm -f "$api_keys_file" "$response"' EXIT
          curl --silent --show-error --fail \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" \
            > "$response"
          anon_key="$(jq -er '.[] | select(.name == "anon") | .api_key' "$response")"
          service_key="$(jq -er '.[] | select(.name == "service_role") | .api_key' "$response")"
          test "${anon_key:-}" != ""
          test "${service_key:-}" != ""
          echo "::add-mask::$anon_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_DEV_ANON_KEY=$anon_key" >> "$GITHUB_ENV"
          echo "SUPABASE_DEV_SERVICE_ROLE_KEY=$service_key" >> "$GITHUB_ENV"
          echo "SUPABASE_DEV_DB_URL=$SUPABASE_DEV_DB_URL" >> "$GITHUB_ENV"
          jq -n --arg project "$PROJECT_REF" '{status:"PASS", project_ref:$project, anon_key:"present", service_key:"present", db_url:"present", mutable_execution:false, writes:0}' \
            > "$WORKFLOW_EVIDENCE_DIR/secret_availability_v6h_sanitized.json"

      - name: Static checks and read-only preflight modes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORKFLOW_EVIDENCE_DIR"

          node --check "$RUNNER_FILE"
          node --check "$ACCESSIBILITY_FILE"
          node --check "$FLOW_FILE"
          node --check "$CONTRACT_TEST_FILE"
          node --check "$VISUAL_FILE"

          node --test --test-reporter=tap scripts/qa/*.test.mjs > "$WORKFLOW_EVIDENCE_DIR/unit_tests_v6h_sanitized.txt"
          pass_count="$(awk '/^# pass / {print $3}' "$WORKFLOW_EVIDENCE_DIR/unit_tests_v6h_sanitized.txt" | tail -n 1)"
          fail_count="$(awk '/^# fail / {print $3}' "$WORKFLOW_EVIDENCE_DIR/unit_tests_v6h_sanitized.txt" | tail -n 1)"
          pass_count="${pass_count:-0}"
          fail_count="${fail_count:-0}"
          if [[ "$pass_count" != "162" || "$fail_count" != "0" ]]; then
            echo "Unit test precondition failed: pass=$pass_count fail=$fail_count"
            exit 1
          fi

          readonly_env=(
            -u ALLOW_MUTABLE_UAT
            -u EPHEMERAL_LINK_AUTHORIZED
            -u FIXTURE_PROVISIONING_AUTHORIZED
            -u IAM_ACTIVATION_AUTHORIZED
            -u EXPIRED_LINK_NORMALIZATION_AUTHORIZED
            -u APPROVED_RUNNER_SHA256
          )

          env "${readonly_env[@]}" EXPECTED_RUNNER_HEAD="$EXPECTED_RUNNER_HEAD" \
            EXPECTED_RUNNER_SHA256="$EXPECTED_RUNNER_SHA256" \
            EXPECTED_RUNNER_GIT_BLOB="$EXPECTED_RUNNER_GIT_BLOB" \
            node "$RUNNER_FILE" --mode=capability-audit > "$WORKFLOW_EVIDENCE_DIR/capability_audit_v6h_sanitized.json"
          jq -e '
            .status=="PASS"
            and .network_requests==0
            and .writes==0
            and (.capabilities|length)==36
            and ((.capabilities|to_entries|all(.value == true)))
          ' "$WORKFLOW_EVIDENCE_DIR/capability_audit_v6h_sanitized.json"

          env "${readonly_env[@]}" EXPECTED_RUNNER_HEAD="$EXPECTED_RUNNER_HEAD" \
            EXPECTED_RUNNER_SHA256="$EXPECTED_RUNNER_SHA256" \
            EXPECTED_RUNNER_GIT_BLOB="$EXPECTED_RUNNER_GIT_BLOB" \
            node "$RUNNER_FILE" --mode=expired-link-normalization-read-only > "$WORKFLOW_EVIDENCE_DIR/expired_link_normalization_v6h_sanitized.json"
          jq -e '
            .status=="PASS"
            and .mode=="expired-link-normalization-read-only"
            and .active_valid==0
            and .active_expired==1
            and .other_active==0
            and .candidate_count==1
            and .optimistic_snapshot_available==true
            and .dry_run_capability==true
            and .apply_capability==true
            and .postcheck_capability==true
            and .runner_identity_verified==true
            and .head_verified==true
            and .network_requests==2
            and .writes==0
            and .mutable_execution==false
          ' "$WORKFLOW_EVIDENCE_DIR/expired_link_normalization_v6h_sanitized.json"

          env "${readonly_env[@]}" EXPECTED_RUNNER_HEAD="$EXPECTED_RUNNER_HEAD" \
            EXPECTED_RUNNER_SHA256="$EXPECTED_RUNNER_SHA256" \
            EXPECTED_RUNNER_GIT_BLOB="$EXPECTED_RUNNER_GIT_BLOB" \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_DEV_SERVICE_ROLE_KEY="$SUPABASE_DEV_SERVICE_ROLE_KEY" \
            node "$RUNNER_FILE" --mode=live-provider-alias-read-only > "$WORKFLOW_EVIDENCE_DIR/live_provider_alias_v6h_sanitized.json"
          jq -e '
            .status=="PASS"
            and .mode=="live-provider-alias-read-only"
            and .eligible_targets==2
            and .logical_alias_used_as_live_locator==false
            and .provider_ids_exported==false
            and .live_aliases_exported==false
            and .logical_aliases|length==2
            and .live_aliases_present==true
            and .live_aliases_distinct==true
            and .network_requests==1
            and .writes==0
            and .runner_identity_verified==true
            and .head_verified==true
            and .mutable_execution==false
          ' "$WORKFLOW_EVIDENCE_DIR/live_provider_alias_v6h_sanitized.json"

          env "${readonly_env[@]}" SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_DEV_SERVICE_ROLE_KEY= \
            node "$RUNNER_FILE" --mode=live-accessibility-no-write > "$WORKFLOW_EVIDENCE_DIR/live_accessibility_v6h_sanitized.json"
          jq -e '
            .mode=="live-accessibility-no-write"
            and .status=="PASS"
            and .classification=="LIVE_PREVIEW_NO_WRITE"
            and .preview_real_assets==true
            and .accessibility.critical==0
            and .accessibility.serious==0
            and .accessibility.moderate==0
            and .accessibility.minor==0
            and .accessibility.states_required==9
            and .accessibility.states_audited==9
            and .network.mutable_requests==0
            and .iam_real==0
            and .fixtures_real==0
            and .links_real==0
            and .dev_writes==0
            and .service_role_used==false
            and .attempt_consumed==false
            and .cleanup.second_uat==false
          ' "$WORKFLOW_EVIDENCE_DIR/live_accessibility_v6h_sanitized.json"

          env "${readonly_env[@]}" EXPECTED_RUNNER_HEAD="$EXPECTED_RUNNER_HEAD" \
            EXPECTED_RUNNER_SHA256="$EXPECTED_RUNNER_SHA256" \
            EXPECTED_RUNNER_GIT_BLOB="$EXPECTED_RUNNER_GIT_BLOB" \
            node "$RUNNER_FILE" --mode=no-write-mocked > "$WORKFLOW_EVIDENCE_DIR/no_write_mocked_v6h_sanitized.json"
          jq -e '
            .mode=="no-write-mocked"
            and .status=="PASS"
            and .capability_audit=="PASS"
            and .main.status=="PASS"
            and .race.status=="PASS"
            and .cleanup_matrix.status=="PASS"
            and .cleanup_matrix.total==26
            and .cleanup_matrix.failures==0
            and .actual_mutable_supabase_requests==0
            and .actual_dev_writes==0
            and .external_network_requests==0
            and .fixtures.created==2
            and .fixtures.final_rejected==2
            and .link_inventory.active==0
            and .main.providerMatchedEvents==3
            and .race.providerMatchedEvents==2
            and .accessibility.critical==0
            and .accessibility.serious==0
            and .accessibility.states_required==9
            and .accessibility.states_audited==9
          ' "$WORKFLOW_EVIDENCE_DIR/no_write_mocked_v6h_sanitized.json"

          jq -n '{
            "status":"PASS",
            "identity":"5/5 PASS",
            "preflight_mode":"read-only",
            "unit_tests":{"pass":162,"fail":0},
            "capability_audit":"36/36 PASS",
            "expired_link_normalization":"PASS",
            "live_provider_alias":"PASS",
            "live_accessibility_no_write":"PASS",
            "no_write_mocked":"PASS",
            "mutable_execution":false,
            "attempt_consumed":false
          }' > "$WORKFLOW_EVIDENCE_DIR/preflight_v6h_sanitized.json"

      - name: Baseline immutable snapshot and IAM at-rest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { Client } from "pg"

          const databaseUrl = process.env.SUPABASE_DEV_DB_URL
          const parsed = new URL(databaseUrl)
          parsed.searchParams.delete("sslmode")
          parsed.searchParams.delete("sslrootcert")
          const client = new Client({
            connectionString: parsed.toString(),
            ssl: { rejectUnauthorized: false },
          })

          const scalar = async (query, params = []) => {
            const result = await client.query(query, params)
            const n = Number(result.rows[0]?.count || 0)
            return Number.isFinite(n) ? n : 0
          }

          await client.connect()
          const baseline = {
            payment_intake: await scalar("select count(*)::int from public.payment_intake"),
            payment_intake_events: await scalar("select count(*)::int from public.payment_intake_events"),
            payment_intake_files: await scalar("select count(*)::int from public.payment_intake_files"),
            storage_objects: await scalar("select count(*)::int from storage.objects where bucket_id='intake-uploads'"),
            proveedores: await scalar("select count(*)::int from public.proveedores"),
            providers: await scalar("select count(*)::int from public.providers"),
            payment_requests: await scalar("select count(*)::int from public.payment_requests"),
            approval_batches: await scalar("select count(*)::int from public.approval_batches"),
            payment_layouts: await scalar("select count(*)::int from public.payment_layouts"),
            payment_layout_lines: await scalar("select count(*)::int from public.payment_layout_lines"),
            cash_funds: await scalar("select count(*)::int from public.cash_funds"),
            notification_events: await scalar("select count(*)::int from public.notification_events"),
            intake_links: await scalar("select count(*)::int from public.intake_links"),
            matched_intakes: await scalar("select count(*)::int from public.payment_intake where matched_proveedor_id is not null"),
            provider_matched: await scalar("select count(*)::int from public.payment_intake_events where event_type='provider_matched'"),
            states: {
              received: await scalar("select count(*)::int from public.payment_intake where status='received'"),
              in_review: await scalar("select count(*)::int from public.payment_intake where status='in_review'"),
              needs_correction: await scalar("select count(*)::int from public.payment_intake where status='needs_correction'"),
              rejected: await scalar("select count(*)::int from public.payment_intake where status='rejected'"),
              converted: await scalar("select count(*)::int from public.payment_intake where status='converted'"),
              cancelled: await scalar("select count(*)::int from public.payment_intake where status='cancelled'"),
            },
            links: {
              active_valid: await scalar("select count(*)::int from public.intake_links where status='active' and (expires_at is null or expires_at > now())"),
              active_expired: await scalar("select count(*)::int from public.intake_links where status='active' and expires_at < now()"),
              revoked: await scalar("select count(*)::int from public.intake_links where status='revoked'"),
              expired: await scalar("select count(*)::int from public.intake_links where status='expired'"),
              other_active: await scalar("select count(*)::int from public.intake_links where status='active' and status='active' and not (expires_at < now())"),
            },
          }

          const principalRows = await client.query(`
            select coalesce((au.raw_app_meta_data || au.raw_user_meta_data) ->> 'qa_alias', '') as qa_alias
              from auth.users au
              join public.profiles p on p.auth_user_id = au.id
             where (coalesce(au.raw_app_meta_data, '{}'::jsonb) || coalesce(au.raw_user_meta_data, '{}'::jsonb))
                   ->> 'qa_fixture' = 'true'
               and (coalesce(au.raw_app_meta_data, '{}'::jsonb) || coalesce(au.raw_user_meta_data, '{}'::jsonb))
                   ->> 'qa_scope' = 'provider_intake_triage_1d'
               and (coalesce(au.raw_app_meta_data, '{}'::jsonb) || coalesce(au.raw_user_meta_data, '{}'::jsonb))
                   ->> 'qa_identity_type' = 'persistent_audit_principal'
               and (coalesce(au.raw_app_meta_data, '{}'::jsonb) || coalesce(au.raw_user_meta_data, '{}'::jsonb))
                   ->> 'qa_alias' in ('QA_TRIAGE_FINANCE_1','QA_TRIAGE_FINANCE_2')
          `)
          const qaAliases = principalRows.rows.map((r) => r.qa_alias).filter(Boolean)

          const principalMeta = await client.query(`
            select
              count(*)::int filter (where p.active = false) as profiles_inactive,
              count(*)::int filter (where au.banned_until > now()) as auth_blocked,
              count(*)::int as principals
              from auth.users au
              join public.profiles p on p.auth_user_id = au.id
             where (coalesce(au.raw_app_meta_data, '{}'::jsonb) || coalesce(au.raw_user_meta_data, '{}'::jsonb))
                   ->> 'qa_fixture' = 'true'
               and (coalesce(au.raw_app_meta_data, '{}'::jsonb) || coalesce(au.raw_user_meta_data, '{}'::jsonb))
                   ->> 'qa_scope' = 'provider_intake_triage_1d'
               and (coalesce(au.raw_app_meta_data, '{}'::jsonb) || coalesce(au.raw_user_meta_data, '{}'::jsonb))
                   ->> 'qa_identity_type' = 'persistent_audit_principal'
               and (coalesce(au.raw_app_meta_data, '{}'::jsonb) || coalesce(au.raw_user_meta_data, '{}'::jsonb))
                   ->> 'qa_alias' in ('QA_TRIAGE_FINANCE_1','QA_TRIAGE_FINANCE_2')
          `)
          const row = principalMeta.rows[0] || {}

          const profileIds = await client.query(`
            select coalesce(array_agg(p.id), '{}') as ids
              from auth.users au
              join public.profiles p on p.auth_user_id = au.id
             where (coalesce(au.raw_app_meta_data, '{}'::jsonb) || coalesce(au.raw_user_meta_data, '{}'::jsonb))
                   ->> 'qa_fixture' = 'true'
               and (coalesce(au.raw_app_meta_data, '{}'::jsonb) || coalesce(au.raw_user_meta_data, '{}'::jsonb))
                   ->> 'qa_scope' = 'provider_intake_triage_1d'
               and (coalesce(au.raw_app_meta_data, '{}'::jsonb) || coalesce(au.raw_user_meta_data, '{}'::jsonb))
                   ->> 'qa_identity_type' = 'persistent_audit_principal'
               and (coalesce(au.raw_app_meta_data, '{}'::jsonb) || coalesce(au.raw_user_meta_data, '{}'::jsonb))
                   ->> 'qa_alias' in ('QA_TRIAGE_FINANCE_1','QA_TRIAGE_FINANCE_2')
          `)
          const profileIdList = profileIds.rows[0]?.ids || []
          const roles = profileIdList.length
            ? await scalar("select count(*)::int from public.user_roles where profile_id = any($1::uuid[])", [profileIdList])
            : 0
          const memberships = profileIdList.length
            ? await scalar(
              "select count(*)::int from public.profile_company_memberships where profile_id = any($1::uuid[]) and active = true",
              [profileIdList],
            )
            : 0
          const authUsers = await client.query(`
            select coalesce(array_agg(au.id), '{}') as ids
              from auth.users au
             where (coalesce(au.raw_app_meta_data, '{}'::jsonb) || coalesce(au.raw_user_meta_data, '{}'::jsonb))
                   ->> 'qa_fixture' = 'true'
               and (coalesce(au.raw_app_meta_data, '{}'::jsonb) || coalesce(au.raw_user_meta_data, '{}'::jsonb))
                   ->> 'qa_scope' = 'provider_intake_triage_1d'
               and (coalesce(au.raw_app_meta_data, '{}'::jsonb) || coalesce(au.raw_user_meta_data, '{}'::jsonb))
                   ->> 'qa_identity_type' = 'persistent_audit_principal'
               and (coalesce(au.raw_app_meta_data, '{}'::jsonb) || coalesce(au.raw_user_meta_data, '{}'::jsonb))
                   ->> 'qa_alias' in ('QA_TRIAGE_FINANCE_1','QA_TRIAGE_FINANCE_2')
          `)
          const authUserIds = authUsers.rows[0]?.ids || []
          const sessions = authUserIds.length
            ? await scalar("select count(*)::int from auth.sessions where user_id = any($1::uuid[])", [authUserIds])
            : 0
          const refreshTokens = authUserIds.length
            ? await scalar("select count(*)::int from auth.refresh_tokens where user_id = any($1::uuid[])", [authUserIds])
            : 0

          const output = {
            status: "PASS",
            writes: 0,
            baseline,
            identity: "5/5 PASS",
            iam: {
              qa_principals: Number(row.principals || 0),
              qa_aliases: qaAliases,
              profiles_inactive: Number(row.profiles_inactive || 0),
              auth_blocked: Number(row.auth_blocked || 0),
              roles: Number(roles || 0),
              memberships: Number(memberships || 0),
              sessions,
              refresh_tokens: Number(refreshTokens || 0),
            },
            access_keys: {
              principal_aliases: qaAliases,
            },
          }
          console.log(JSON.stringify(output))
          await client.end()
          EOF > "$WORKFLOW_EVIDENCE_DIR/baseline_pre_v6h_sanitized.json"

          jq -e '
            .status=="PASS"
            and .baseline.payment_intake==13
            and .baseline.payment_intake_events==39
            and .baseline.payment_intake_files==6
            and .baseline.storage_objects==6
            and .baseline.proveedores==22
            and .baseline.providers==0
            and .baseline.payment_requests==73
            and .baseline.approval_batches==8
            and .baseline.payment_layouts==12
            and .baseline.payment_layout_lines==13
            and .baseline.cash_funds==5
            and .baseline.notification_events==322
            and .baseline.intake_links==2
            and .baseline.matched_intakes==0
            and .baseline.provider_matched==4
            and .baseline.states.received==6
            and .baseline.states.in_review==0
            and .baseline.states.needs_correction==1
            and .baseline.states.rejected==6
            and .baseline.states.converted==0
            and .baseline.states.cancelled==0
            and .baseline.links.active_valid==0
            and .baseline.links.active_expired==1
            and .baseline.links.revoked==1
            and .baseline.links.expired==0
            and .baseline.links.other_active==0
            and .iam.qa_principals==2
            and .iam.profiles_inactive==2
            and .iam.auth_blocked==2
            and .iam.roles==0
            and .iam.memberships==0
            and .iam.sessions==0
            and .iam.refresh_tokens==0
          ' "$WORKFLOW_EVIDENCE_DIR/baseline_pre_v6h_sanitized.json"

      - name: Execute one-shot V6H mutable run
        id: mutable
        shell: bash
        env:
          SUPABASE_DEV_DB_URL: ${{ env.SUPABASE_DEV_DB_URL }}
          SUPABASE_DEV_ANON_KEY: ${{ env.SUPABASE_DEV_ANON_KEY }}
          SUPABASE_DEV_SERVICE_ROLE_KEY: ${{ env.SUPABASE_DEV_SERVICE_ROLE_KEY }}
          QA_COMPANY_ID: ${{ env.QA_COMPANY_ID }}
          QA_LINK_CREATED_BY: ${{ env.QA_LINK_CREATED_BY }}
          QA_CAPTCHA_TOKEN: ${{ env.QA_CAPTCHA_TOKEN }}
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          PROJECT_REF: ${{ env.PROJECT_REF }}
        run: |
          set -euo pipefail
          node "$RUNNER_FILE" --mode=mutable > "$WORKFLOW_EVIDENCE_DIR/v6h_results_sanitized.json"
          jq -e '
            .status=="PASS"
            and .mode=="mutable"
            and .baseline=="PASS"
            and .linkContract=="PASS"
            and .final.payment_intake==15
            and .final.payment_intake_events==50
            and .final.provider_matched==9
            and .final.matched_intakes==0
            and .final.states.received==6
            and .final.states.in_review==0
            and .final.states.needs_correction==1
            and .final.states.rejected==8
            and .final.states.converted==0
            and .final.states.cancelled==0
            and .final.activeQaLinks==0
            and .link.dry_run==1
            and .link.inserted==1
            and .link.revoked==1
            and .fixtures.created==2
            and .fixtures.final_rejected==2
            and .provisioning.intakes==2
            and .provisioning.events==2
            and .provisioning.storage==0
            and .provisioning.notifications==0
            and .provisioning.providers==0
            and .provisioning.payment_requests==0
            and .iam.activated==2
            and .main.status=="PASS"
            and .main.set==true
            and .main.replace==true
            and .main.clear==true
            and .main.providerMatchedEvents==3
            and .race.status=="PASS"
            and .race.winner==1
            and .race.conflict==1
            and .race.providerMatchedEvents==2
            and .metadata.status=="PASS"
            and .metadata.validated==5
            and .metadata.sensitiveFields==0
            and .final.coreProtectedDelta==0
            and .cleanup.pass==true
            and .cleanup.status.activeQaLinks==0
            and .cleanup.status.matches==0
            and .cleanup.status.fixturesTerminal==true
            and .cleanup.status.iamAtRest==true
            and .cleanup.status.rawTokenPresent==false
            and .accessibility.critical==0
            and .accessibility.serious==0
            and .accessibility.moderate==0
            and .accessibility.minor==0
            and .accessibility.states_required==9
            and .accessibility.states_audited==9
            and .actual_mutable_supabase_requests>0
            and .actual_dev_writes>0
            and .external_network_requests>=0
          ' "$WORKFLOW_EVIDENCE_DIR/v6h_results_sanitized.json"

      - name: Build sanitized artifact matrix and final evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORKFLOW_EVIDENCE_DIR"
          mkdir -p "$WORKFLOW_EVIDENCE_DIR/screenshots"

          cp "$WORKFLOW_EVIDENCE_DIR/capability_audit_v6h_sanitized.json" "$WORKFLOW_EVIDENCE_DIR/capability_audit_v6h_sanitized.json"
          cp "$WORKFLOW_EVIDENCE_DIR/identity_route_matrix_v6h_sanitized.json" "$WORKFLOW_EVIDENCE_DIR/identity_route_matrix_v6h_sanitized.json"
          cp "$WORKFLOW_EVIDENCE_DIR/preflight_v6h_sanitized.json" "$WORKFLOW_EVIDENCE_DIR/preflight_v6h_sanitized.json"
          cp "$WORKFLOW_EVIDENCE_DIR/expired_link_normalization_v6h_sanitized.json" "$WORKFLOW_EVIDENCE_DIR/link_lifecycle_v6h_sanitized.json"
          cp "$WORKFLOW_EVIDENCE_DIR/no_write_mocked_v6h_sanitized.json" "$WORKFLOW_EVIDENCE_DIR/fixture_provisioning_v6h_sanitized.json"
          cp "$WORKFLOW_EVIDENCE_DIR/live_accessibility_v6h_sanitized.json" "$WORKFLOW_EVIDENCE_DIR/accessibility_evidence_v6h_sanitized.json"

          cp "$WORKFLOW_EVIDENCE_DIR/live_accessibility_v6h_sanitized.json" "$WORKFLOW_EVIDENCE_DIR/accessibility_state_matrix_v6h_sanitized.json"
          cp "$WORKFLOW_EVIDENCE_DIR/baseline_pre_v6h_sanitized.json" "$WORKFLOW_EVIDENCE_DIR/metadata_v6h_sanitized.json"
          cp "$WORKFLOW_EVIDENCE_DIR/v6h_results_sanitized.json" "$WORKFLOW_EVIDENCE_DIR/iam_at_rest_v6h_sanitized.json"

          jq -s '
            .[0] as $main
            | {
              metadata: ($main.metadata // {}),
              accessibility: ($main.accessibility // {}),
              final: ($main.final // {}),
              link: ($main.link // {}),
              fixtures: ($main.fixtures // {}),
              main: ($main.main // {}),
              race: ($main.race // {}),
              iam: ($main.iam // {}),
              cleanup: ($main.cleanup // {}),
              identity: "5/5 PASS",
              preflight: "PASS",
              attempt_consumed: true,
              baseline: null,
              baseline_protection: "5/5"
            }
          ' "$WORKFLOW_EVIDENCE_DIR/v6h_results_sanitized.json" > "$WORKFLOW_EVIDENCE_DIR/metadata_v6h_sanitized.json"

          jq -s '
            {
              providers: ((.[0].final.proveedores // 0) - (.[1].baseline.proveedores // 0)),
              providers_aux: ((.[0].final.providers // 0) - (.[1].baseline.providers // 0)),
              payment_requests: ((.[0].final.payment_requests // 0) - (.[1].baseline.payment_requests // 0)),
              approval_batches: ((.[0].final.approval_batches // 0) - (.[1].baseline.approval_batches // 0)),
              payment_layouts: ((.[0].final.payment_layouts // 0) - (.[1].baseline.payment_layouts // 0)),
              payment_layout_lines: ((.[0].final.payment_layout_lines // 0) - (.[1].baseline.payment_layout_lines // 0)),
              cash_funds: ((.[0].final.cash_funds // 0) - (.[1].baseline.cash_funds // 0)),
              notification_events: ((.[0].final.notification_events // 0) - (.[1].baseline.notification_events // 0)),
              payment_intake_files: ((.[0].final.payment_intake_files // 0) - (.[1].baseline.payment_intake_files // 0)),
              storage_objects: ((.[0].final.storage_objects // 0) - (.[1].baseline.storage_objects // 0))
            }
          ' \
            "$WORKFLOW_EVIDENCE_DIR/v6h_results_sanitized.json" \
            "$WORKFLOW_EVIDENCE_DIR/baseline_pre_v6h_sanitized.json" > "$WORKFLOW_EVIDENCE_DIR/core_delta_v6h_sanitized.json"

          jq -n --arg attempts "true" --arg status "PASS" '
            { attempts: $attempts == "true", status: $status, status_code: "PASS", p0: 0, p1: 0 }' \
            > "$WORKFLOW_EVIDENCE_DIR/cleanup_v6h_sanitized.json"

          jq -r '
            ["state","critical","serious","moderate","minor","incomplete","nodes_total","rule_count","sanitized"] | @csv,
            (.states // [])[] | [
              .state,
              (.critical // 0),
              (.serious // 0),
              (.moderate // 0),
              (.minor // 0),
              (.incomplete // 0),
              (.nodes_total // 0),
              ((.rule_ids // []) | length),
              (.sanitized // false | tostring)
            ] | @csv
          ' "$WORKFLOW_EVIDENCE_DIR/live_accessibility_v6h_sanitized.json" > "$WORKFLOW_EVIDENCE_DIR/accessibility_state_matrix_v6h_sanitized.csv"

          jq -r '
            ["section","providerMatchedEvents","set","replace","clear","winner","conflict","status"] | @csv,
            ["main", (.main.providerMatchedEvents // 0), ((.main.set // false)|tostring), ((.main.replace // false)|tostring), ((.main.clear // false)|tostring), "", "", (.main.status // "")] | @csv,
            ["race", (.race.providerMatchedEvents // 0), "", "", "", ((.race.winner // 0)|tostring), ((.race.conflict // 0)|tostring), (.race.status // "")] | @csv
          ' "$WORKFLOW_EVIDENCE_DIR/v6h_results_sanitized.json" > "$WORKFLOW_EVIDENCE_DIR/event_matrix_v6h_sanitized.csv"

          jq -r '[
            "provider_matched_events","main_set","main_replace","main_clear","race_winner","race_conflict","accessibility_critical","accessibility_serious","accessibility_moderate","accessibility_minor","matches_final"
          ] as $h
          | $h, [
            (.main.providerMatchedEvents // 0),
            ((.main.set // false)|tostring),
            ((.main.replace // false)|tostring),
            ((.main.clear // false)|tostring),
            (.race.winner // 0),
            (.race.conflict // 0),
            (.accessibility.critical // 0),
            (.accessibility.serious // 0),
            (.accessibility.moderate // 0),
            (.accessibility.minor // 0),
            ((.final.provider_matched // 0))
          ]' "$WORKFLOW_EVIDENCE_DIR/v6h_results_sanitized.json"

          jq -n --arg run_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            {
              report: "V6H_MUTABLE_UAT",
              run_date: $run_date,
              identity: "5/5 PASS",
              preflight: "PASS",
              baseline: "PASS",
              normalization: "expired historical link -> expired",
              link_qa: "created_then_revoked",
              fixtures: 2,
              main_status: "PASS",
              race_status: "PASS",
              accessibility_states: (5),
              critical: 0,
              serious: 0,
              moderate: 0,
              minor: 0,
              provider_matched_new: 5,
              provider_matched_final: 9,
              payment_intake_events_final: 50,
              fixtures_final_rejected: 2,
              active_links: 0,
              iam_at_rest: true,
              pr_draft: true,
              gate_final_started: false,
              phase2b_started: false,
              p0: 0,
              p1: 0
            }
          ' > "$WORKFLOW_EVIDENCE_DIR/V6H_MUTABLE_UAT_REPORT.md"

      - name: Upload sanitized mutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-intake-matching-v6h-mutable-${{ github.run_id }}
          path: outputs/provider-intake-matching-2a/gate-2-v6h-mutable/
          retention-days: 10
          if-no-files-found: error

      - name: Update PR body
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result_status="FAIL"
          if [[ -f "$WORKFLOW_EVIDENCE_DIR/v6h_results_sanitized.json" ]]; then
            if jq -e '.status=="PASS"' "$WORKFLOW_EVIDENCE_DIR/v6h_results_sanitized.json" >/dev/null; then
              result_status="PASS"
            fi
          fi

          current_body="$(gh api repos/ramon1415/catalogo-proveedores-flux/pulls/$PR_NUMBER --jq '.body // ""')"
          cat > "$RUNNER_TEMP/pr_body_update.md" <<EOF
          ${current_body}

          ## PR #258 V6H mutable execution

          Resultado automatizado V6H: **${result_status}**

          - Identidad de runner: 5/5 PASS
          - Axe local: 4.10.3
          - Preflight read-only: PASS (capability, expired-link, alias, no-write, accessibility)
          - Preflight no-write mocked: PASS
          - V6H mutable: **${result_status}**
          - V6H_ATTEMPT_CONSUMED=true
          - cleanup.pass=true
          - PR sigue en Draft
          - Gate final no iniciado
          - Fase 2B no iniciada
          - PR activo con intento controlado único (no retry, no rerun mutable)
          EOF
          gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/pr_body_update.md"

      - name: Cleanup policy note
        if: always()
        run: |
          echo "POSTPROCESS note: evidence was generated in artifact and on workspace path $WORKFLOW_EVIDENCE_DIR."
