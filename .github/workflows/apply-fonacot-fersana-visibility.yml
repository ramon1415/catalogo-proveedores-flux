name: Apply FONACOT visibility in Fersana

on:
  push:
    branches:
      - codex/fonacot-visible-fersana-prod

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply focused visibility fix
        run: python .github/scripts/apply_fonacot_fersana_visibility.py

      - name: Install React dependencies
        run: npm --prefix app ci

      - name: Run focused and regression contracts
        run: >-
          node --test
          scripts/qa/fonacot-no-presupuestal-prod-contract.test.mjs
          scripts/qa/prod-reimbursement-ux-hotfix.test.mjs
          scripts/qa/reimbursement-inline-classification-ux.test.mjs
          scripts/qa/prod-reimbursement-permissions.test.mjs
          scripts/qa/budget-live-own-commitment-contract.test.mjs

      - name: Build production React artifact
        run: npm --prefix app run build

      - name: Commit validated hotfix
        run: |
          git config user.name "ramon1415"
          git config user.email "ramon@quantta.mx"
          git rm \
            .github/workflows/apply-fonacot-fersana-visibility.yml \
            .github/scripts/apply_fonacot_fersana_visibility.py
          git add \
            app/src/features/solicitudes/RequestModal.tsx \
            scripts/qa/fonacot-no-presupuestal-prod-contract.test.mjs
          git commit -m "fix(solicitudes): mostrar FONACOT a usuarios de Fersana"
          git push origin HEAD:codex/fonacot-visible-fersana-prod
