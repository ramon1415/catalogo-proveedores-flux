name: Payment request attachments DEV deploy

on:
  push:
    branches: [dev]
    paths:
      - 'supabase/migrations/20260923233500_payment_request_attachments.sql'
      - '.github/workflows/payment-request-attachments-dev-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payment-request-attachments-dev-deploy
  cancel-in-progress: false

jobs:
  apply-dev-migration:
    name: Apply request attachments migration to Flux DEV
    runs-on: ubuntu-latest
    environment: DEV
    env:
      EXPECTED_DEV_PROJECT_REF: scsirgbuqjcwoaxfacth
      SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      MIGRATION_FILE: supabase/migrations/20260923233500_payment_request_attachments.sql
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4

      - name: Validate immutable DEV target
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/dev"
          test -n "${SUPABASE_DEV_DB_URL:-}"
          test "${SUPABASE_DEV_PROJECT_REF}" = "${EXPECTED_DEV_PROJECT_REF}"
          echo "::add-mask::${SUPABASE_DEV_DB_URL}"
          test -f "${MIGRATION_FILE}"
          grep -Fq "create table if not exists public.payment_request_attachments" "${MIGRATION_FILE}"
          grep -Fq "where id = 'payment-receipts'" "${MIGRATION_FILE}"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -qq update >/dev/null
          sudo apt-get -qq install -y postgresql-client >/dev/null
          psql --version

      - name: DEV precheck
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${SUPABASE_DEV_DB_URL}"
          psql "${SUPABASE_DEV_DB_URL}" -X -v ON_ERROR_STOP=1 -Atq <<'SQL'
          do $$
          begin
            if to_regclass('public.payment_requests') is null then
              raise exception 'payment_requests_missing';
            end if;
            if to_regclass('public.companies') is null then
              raise exception 'companies_missing';
            end if;
            if to_regclass('public.profiles') is null then
              raise exception 'profiles_missing';
            end if;
            if not exists (select 1 from storage.buckets where id = 'payment-receipts') then
              raise exception 'payment_receipts_bucket_missing';
            end if;
          end
          $$;
          SQL

      - name: Apply exact migration
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${SUPABASE_DEV_DB_URL}"
          psql "${SUPABASE_DEV_DB_URL}" -X -v ON_ERROR_STOP=1 -f "${MIGRATION_FILE}"

      - name: DEV postcheck
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${SUPABASE_DEV_DB_URL}"
          psql "${SUPABASE_DEV_DB_URL}" -X -v ON_ERROR_STOP=1 -Atq <<'SQL'
          do $$
          declare
            v_rls boolean;
            v_select_policy boolean;
            v_insert_policy boolean;
          begin
            if to_regclass('public.payment_request_attachments') is null then
              raise exception 'attachments_table_missing';
            end if;

            select relrowsecurity into v_rls
            from pg_class
            where oid = 'public.payment_request_attachments'::regclass;
            if not coalesce(v_rls, false) then
              raise exception 'attachments_rls_not_enabled';
            end if;

            select exists (
              select 1 from pg_policies
              where schemaname = 'public'
                and tablename = 'payment_request_attachments'
                and policyname = 'payment_request_attachments_select'
            ) into v_select_policy;
            select exists (
              select 1 from pg_policies
              where schemaname = 'public'
                and tablename = 'payment_request_attachments'
                and policyname = 'payment_request_attachments_insert'
            ) into v_insert_policy;

            if not v_select_policy or not v_insert_policy then
              raise exception 'attachments_policy_missing';
            end if;

            if not exists (
              select 1
              from information_schema.columns
              where table_schema = 'public'
                and table_name = 'payment_request_attachments'
                and column_name = 'original_filename'
            ) then
              raise exception 'attachments_columns_missing';
            end if;
          end
          $$;

          select json_build_object(
            'table', to_regclass('public.payment_request_attachments')::text,
            'rows', (select count(*) from public.payment_request_attachments),
            'bucket', id,
            'mime_types', allowed_mime_types
          )
          from storage.buckets
          where id = 'payment-receipts';
          SQL
