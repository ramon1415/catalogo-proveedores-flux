name: Apply weekly cuts company scope

on:
  push:
    branches:
      - hotfix/cortes-company-scope-prod

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[cortes-company-scope]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Repair and validate patch preparer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_cortes_company_scope.py')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'state.companies = scopeCompanyRows(companies.data)': 'state.companies = asArray(companies.data)',
              'return !state.companyScopeId || row?.company_id === state.companyScopeId': 'return !state.companyScopeId || row?.company_id === state.companyScopeId || row?.id === state.companyScopeId',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one preparer match, found {text.count(old)}: {old}')
              text = text.replace(old, new, 1)

          lines = text.splitlines()
          repaired = 0
          for index, line in enumerate(lines):
              if 'dom.pageContext.textContent = state.view === "finance"' in line:
                  lines[index] = "    '''  dom.pageContext.textContent = state.view === \"finance\" ? \"Preparacion por Finanzas\" : \"Decision de Direccion\"''',"
                  repaired += 1
          if repaired != 1:
              raise SystemExit(f'expected one page-context source line, found {repaired}')

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python -m py_compile .github/scripts/apply_cortes_company_scope.py

      - name: Apply focused company-scope fix
        run: python .github/scripts/apply_cortes_company_scope.py

      - name: Validate legacy syntax
        run: node --check approval_batches.js

      - name: Install React dependencies
        run: npm --prefix app ci

      - name: Install dispatcher contract dependencies
        run: npm install --no-save --package-lock=false jspdf@2.5.2 jspdf-autotable@3.8.4

      - name: Run focused and regression contracts
        run: >-
          node --test
          scripts/qa/approval-batches-company-scope-contract.test.mjs
          scripts/qa/approval-batch-submitted-email-contract.test.mjs
          scripts/qa/approval-batch-quick-approve-contract.test.mjs
          scripts/qa/prod-reimbursement-permissions.test.mjs
          scripts/qa/uniform-primary-table-scroll-contract.test.mjs

      - name: Build production artifact
        run: npm --prefix app run build

      - name: Commit validated hotfix
        shell: bash
        run: |
          git config user.name "ramon1415"
          git config user.email "ramon@quantta.mx"
          git rm -f \
            .github/workflows/apply-cortes-company-scope.yml \
            .github/scripts/apply_cortes_company_scope.py
          git add \
            approval_batches.js \
            approval_batches.html \
            scripts/qa/approval-batches-company-scope-contract.test.mjs
          git commit -m "fix(cortes): aislar la vista por empresa activa [cortes-company-scope]"
          git push origin HEAD:hotfix/cortes-company-scope-prod
