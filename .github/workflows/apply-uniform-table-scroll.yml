name: Apply uniform primary table scroll

on:
  push:
    branches:
      - codex/uniform-table-scroll-prod

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply uniform scroll contract
        run: python .github/scripts/apply_uniform_table_scroll.py

      - name: Install React dependencies
        run: npm --prefix app ci

      - name: Run focused scroll and regression contracts
        run: >-
          node --test
          scripts/qa/uniform-primary-table-scroll-contract.test.mjs
          scripts/qa/solicitudes-scroll-contract.test.mjs
          scripts/qa/layout-client-uat-hotfix-contract.test.mjs
          scripts/qa/fonacot-no-presupuestal-prod-contract.test.mjs

      - name: Build production React artifact
        run: npm --prefix app run build

      - name: Commit validated hotfix
        run: |
          git config user.name "ramon1415"
          git config user.email "ramon@quantta.mx"
          git rm \
            .github/workflows/apply-uniform-table-scroll.yml \
            .github/scripts/apply_uniform_table_scroll.py
          git add \
            app/src/features/solicitudes/Solicitudes.module.css \
            app/src/features/layouts/Layouts.module.css \
            app/src/features/proveedores/Proveedores.module.css \
            scripts/qa/uniform-primary-table-scroll-contract.test.mjs
          git commit -m "fix(ui): uniformar scroll de tablas principales"
          git push origin HEAD:codex/uniform-table-scroll-prod
