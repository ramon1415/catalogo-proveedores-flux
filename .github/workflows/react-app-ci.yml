name: React app CI

on:
  push:
    branches:
      - 'feature/carlos-*'
    paths:
      - 'app/**'
      - '.github/workflows/react-app-ci.yml'
      - 'scripts/qa/solicitud-desde-factura.test.mjs'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/react-app-ci.yml'
      - 'scripts/qa/solicitud-desde-factura.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Solicitud desde factura — comportamiento y aislamiento
        run: node --test ../scripts/qa/solicitud-desde-factura.test.mjs

      - name: Build
        run: npm run build
      - name: Verify installable app package
        run: npm run check:pwa
