name: Apply CONTPAQ graph loader patch

on:
  push:
    branches:
      - codex/flux-slice-03-contpaq-mapper-clean
    paths:
      - .github/workflows/contpaq-graph-loader-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.repository == 'ramon1415/catalogo-proveedores-flux'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/flux-slice-03-contpaq-mapper-clean
      - name: Patch isolated loaders
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('nav_first_paint_bootstrap.js')
          text = path.read_text(encoding='utf-8')
          old_src = './contpaq_mapper_extension.js?v=20260824-clean-tree'
          new_src = './contpaq_mapper_extension.js?v=20260825-graph-nn'
          if old_src in text:
              text = text.replace(old_src, new_src, 1)
          elif new_src not in text:
              raise SystemExit('CONTPAQ mapper loader source not found')

          needle = '''  loadContpaqMapperExtension()\n  installContpaqRequestedRouteBridge()\n'''
          replacement = '''  function loadAnnualBudgetBucketPatch() {\n    if (!annualPage) return\n    if (document.querySelector('script[data-flux-extension="annual-budget-buckets"]')) return\n    const script = document.createElement("script")\n    script.src = "./dashboard_bucket_patch.js?v=20260825-graph-nn"\n    script.async = false\n    script.dataset.fluxExtension = "annual-budget-buckets"\n    document.head.appendChild(script)\n  }\n\n  loadContpaqMapperExtension()\n  loadAnnualBudgetBucketPatch()\n  installContpaqRequestedRouteBridge()\n'''
          if 'loadAnnualBudgetBucketPatch()' not in text:
              if needle not in text:
                  raise SystemExit('Loader insertion point not found')
              text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
          node --check nav_first_paint_bootstrap.js
          node --check contpaq_mapper_extension.js
          node --check dashboard_bucket_patch.js
      - name: Commit loader patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ramon1415"
          git config user.email "ramon@quantta.mx"
          git add nav_first_paint_bootstrap.js
          if git diff --cached --quiet; then
            echo "Loader already patched."
            exit 0
          fi
          git commit -m "Load N:N CONTPAQ mapper and derived bucket dashboard patch"
          git push origin HEAD:codex/flux-slice-03-contpaq-mapper-clean
