name: Apply BBVA PAGOSINT bank-field hotfix

on:
  push:
    branches:
      - hotfix/bbva-pagosint-bank-field-prod

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ contains(github.event.head_commit.message, '[run-bank-field]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Normalize optional legacy filter in patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/ops/apply_bbva_pagosint_bank_field_hotfix.py')
          text = path.read_text(encoding='utf-8')
          old = '''legacy = replace_many(
              legacy,
              '.filter((item) => item.status !== "bank_rejected")',
              '.filter((item) => item.status === "included")',
              "legacy item filters",
          )'''
          new = '''legacy = legacy.replace(
              '.filter((item) => item.status !== "bank_rejected")',
              '.filter((item) => item.status === "included")',
          )'''
          if text.count(old) != 1:
              raise SystemExit(f'optional legacy filter patch expected once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply focused patch
        run: python scripts/ops/apply_bbva_pagosint_bank_field_hotfix.py

      - name: Install React dependencies
        run: npm --prefix app ci

      - name: Run focused and regression contracts
        run: >-
          node --test
          scripts/qa/bbva-pagosint-bank-field-hotfix.test.mjs
          scripts/qa/bbva-clabe-012-routing-hotfix.test.mjs
          scripts/qa/bbva-cie-layout-contract.test.mjs
          scripts/qa/layout-budget-exception-reference-contract.test.mjs
          scripts/qa/layout-scheduled-date-window-guard.test.mjs
          scripts/qa/prod-reimbursement-permissions.test.mjs
          scripts/qa/uniform-primary-table-scroll-contract.test.mjs

      - name: TypeScript and production build
        run: npm --prefix app run build

      - name: Commit validated hotfix
        shell: bash
        run: |
          git config user.name "ramon1415"
          git config user.email "ramon@quantta.mx"
          git add \
            layouts.js \
            layouts.html \
            app/src/features/layouts/logic.ts \
            app/src/features/layouts/LayoutsPage.tsx \
            app/src/features/layouts/LinesModal.tsx \
            docs/ops/layout-cxc-download-format.md \
            scripts/qa/bbva-cie-layout-contract.test.mjs \
            scripts/qa/bbva-clabe-012-routing-hotfix.test.mjs \
            scripts/qa/layout-budget-exception-reference-contract.test.mjs \
            scripts/qa/bbva-pagosint-bank-field-hotfix.test.mjs
          git commit -m "fix(layouts): serializar banco PAGOSINT y excluir pagados [bbva-bank-field-hotfix]"
          git push origin HEAD:hotfix/bbva-pagosint-bank-field-prod
