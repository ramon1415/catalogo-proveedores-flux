name: Supabase DEV Notification Dispatcher Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_dev:
        description: "Type the DEV Supabase project ref to confirm the target"
        required: true
        type: string
      confirm_mode:
        description: "Type deploy_notification_dispatcher_dev"
        required: true
        default: "deploy_notification_dispatcher_dev"
        type: string
      confirm_function:
        description: "Type notification-dispatcher"
        required: true
        default: "notification-dispatcher"
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-dev-notification-dispatcher-deploy
  cancel-in-progress: false

jobs:
  deploy_notification_dispatcher:
    name: Deploy notification-dispatcher to Supabase DEV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: DEV

    env:
      SUPABASE_PROJECT_ID: scsirgbuqjcwoaxfacth
      EXPECTED_FUNCTION_BLOB: 414b318f05d88f4ee4fbab5daf7ce141010ef774
      CONFIRM_DEV: ${{ inputs.confirm_dev }}
      CONFIRM_MODE: ${{ inputs.confirm_mode }}
      CONFIRM_FUNCTION: ${{ inputs.confirm_function }}
      FUNCTION_NAME: notification-dispatcher
      EVIDENCE_DIR: /tmp/supabase-dev-notification-dispatcher-deploy-evidence

    steps:
      - name: Validate DEV deploy guardrails
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/dev" ]; then
            echo "::error::This workflow is restricted to the dev branch."
            exit 1
          fi

          if [ "${CONFIRM_MODE}" != "deploy_notification_dispatcher_dev" ]; then
            echo "::error::confirm_mode must be exactly deploy_notification_dispatcher_dev."
            exit 1
          fi

          if [ "${CONFIRM_FUNCTION}" != "${FUNCTION_NAME}" ]; then
            echo "::error::confirm_function must be exactly ${FUNCTION_NAME}."
            exit 1
          fi

          if [ "${CONFIRM_DEV}" != "${SUPABASE_PROJECT_ID}" ]; then
            echo "::error::confirm_dev does not match the configured DEV project ref."
            exit 1
          fi

          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not configured for this workflow."
            exit 1
          fi
          echo "::add-mask::${SUPABASE_ACCESS_TOKEN}"

          current_dev="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq .object.sha)"
          if [ "${current_dev}" != "${GITHUB_SHA}" ]; then
            echo "::error::The dispatched SHA is no longer the current dev head."
            exit 1
          fi

          echo "DEV deploy guardrails passed."

      - name: Check out immutable dev target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${EVIDENCE_DIR}"
          mkdir -p "${EVIDENCE_DIR}"
          {
            echo "# Supabase DEV notification-dispatcher deploy evidence"
            echo ""
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Git SHA: ${GITHUB_SHA}"
            echo "- Certified function blob: ${EXPECTED_FUNCTION_BLOB}"
            echo "- Mode: ${CONFIRM_MODE}"
            echo "- Function: ${FUNCTION_NAME}"
            echo "- Project ref: ${SUPABASE_PROJECT_ID}"
            echo "- PROD: not touched by this workflow"
            echo "- n8n: not touched by this workflow"
            echo "- Cron/webhook: not touched by this workflow"
            echo "- Secrets: values are not printed by this workflow"
            echo ""
          } > "${EVIDENCE_DIR}/summary.md"

          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain | tee "${EVIDENCE_DIR}/git-status.txt"
            echo "::error::Repository checkout is not clean."
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]; then
            echo "::error::Checkout does not match the immutable dispatched SHA."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.113.0

      - name: Verify deploy inputs
        shell: bash
        run: |
          set -euo pipefail
          supabase --version | tee "${EVIDENCE_DIR}/supabase-version.txt"

          if [ ! -f "supabase/functions/${FUNCTION_NAME}/index.ts" ]; then
            echo "::error::Missing Edge Function source: supabase/functions/${FUNCTION_NAME}/index.ts"
            exit 1
          fi

          if [ ! -f "supabase/config.toml" ]; then
            echo "::error::Missing supabase/config.toml function configuration."
            exit 1
          fi

          FUNCTION_NAME="${FUNCTION_NAME}" python3 - <<'PY'
          import os
          import tomllib

          with open("supabase/config.toml", "rb") as handle:
              config = tomllib.load(handle)
          actual = config.get("functions", {}).get(os.environ["FUNCTION_NAME"])
          if actual != {"verify_jwt": False}:
              raise SystemExit(f"unexpected function config keys or values: {actual!r}")
          PY

          mapfile -t function_files < <(find "supabase/functions/${FUNCTION_NAME}" -type f -print | sort)
          if [ "${#function_files[@]}" != "1" ] || [ "${function_files[0]}" != "supabase/functions/${FUNCTION_NAME}/index.ts" ]; then
            echo "::error::The dispatcher bundle must contain only its certified index.ts."
            exit 1
          fi

          actual_blob="$(git hash-object "supabase/functions/${FUNCTION_NAME}/index.ts")"
          if [ "${actual_blob}" != "${EXPECTED_FUNCTION_BLOB}" ]; then
            echo "::error::Function source does not match the certified branded renderer."
            exit 1
          fi
          printf '%s\n' "${actual_blob}" | tee "${EVIDENCE_DIR}/function-source-git-blob.txt"

          printf '%s\n' "${function_files[@]}" | tee "${EVIDENCE_DIR}/function-files.txt"
          cp supabase/config.toml "${EVIDENCE_DIR}/config.toml"

      - name: Deploy notification-dispatcher to Supabase DEV
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          current_dev="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq .object.sha)"
          if [ "${current_dev}" != "${GITHUB_SHA}" ]; then
            echo "::error::The dev head changed before deployment."
            exit 1
          fi

          set +e
          supabase functions deploy "${FUNCTION_NAME}" --project-ref "${SUPABASE_PROJECT_ID}" > "${EVIDENCE_DIR}/deploy-stdout.txt" 2> "${EVIDENCE_DIR}/deploy-stderr.txt"
          deploy_status=$?
          set -e

          {
            echo "# Deploy result"
            echo ""
            echo "- Exit code: ${deploy_status}"
            echo "- Function: ${FUNCTION_NAME}"
            echo "- Project ref: ${SUPABASE_PROJECT_ID}"
            echo ""
            echo "## stdout"
            cat "${EVIDENCE_DIR}/deploy-stdout.txt"
            echo ""
            echo "## stderr"
            cat "${EVIDENCE_DIR}/deploy-stderr.txt"
          } | tee "${EVIDENCE_DIR}/deploy-result.md"

          exit "${deploy_status}"

      - name: Upload deploy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supabase-dev-notification-dispatcher-deploy-evidence
          path: /tmp/supabase-dev-notification-dispatcher-deploy-evidence
          if-no-files-found: warn
          retention-days: 14
