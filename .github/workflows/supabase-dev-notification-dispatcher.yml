name: Supabase DEV Notification Dispatcher Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_dev:
        description: "Type the DEV Supabase project ref to confirm the target"
        required: true
        type: string
      confirm_mode:
        description: "Type deploy_notification_dispatcher_dev"
        required: true
        default: "deploy_notification_dispatcher_dev"
        type: string
      confirm_function:
        description: "Type notification-dispatcher"
        required: true
        default: "notification-dispatcher"
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-dev-notification-dispatcher-deploy
  cancel-in-progress: false

jobs:
  deploy_notification_dispatcher:
    name: Deploy notification-dispatcher to Supabase DEV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: DEV

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: scsirgbuqjcwoaxfacth
      CONFIRM_DEV: ${{ inputs.confirm_dev }}
      CONFIRM_MODE: ${{ inputs.confirm_mode }}
      CONFIRM_FUNCTION: ${{ inputs.confirm_function }}
      FUNCTION_NAME: notification-dispatcher
      EVIDENCE_DIR: /tmp/supabase-dev-notification-dispatcher-deploy-evidence

    steps:
      - name: Validate DEV deploy guardrails
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" != "dev" ]; then
            echo "::error::This workflow is restricted to the dev branch."
            exit 1
          fi

          if [ "${CONFIRM_MODE}" != "deploy_notification_dispatcher_dev" ]; then
            echo "::error::confirm_mode must be exactly deploy_notification_dispatcher_dev."
            exit 1
          fi

          if [ "${CONFIRM_FUNCTION}" != "${FUNCTION_NAME}" ]; then
            echo "::error::confirm_function must be exactly ${FUNCTION_NAME}."
            exit 1
          fi

          if [ "${CONFIRM_DEV}" != "${SUPABASE_PROJECT_ID}" ]; then
            echo "::error::confirm_dev does not match the configured DEV project ref."
            exit 1
          fi

          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not configured for this workflow."
            exit 1
          fi

          echo "DEV deploy guardrails passed."

      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false

      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${EVIDENCE_DIR}"
          mkdir -p "${EVIDENCE_DIR}"
          {
            echo "# Supabase DEV notification-dispatcher deploy evidence"
            echo ""
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Mode: ${CONFIRM_MODE}"
            echo "- Function: ${FUNCTION_NAME}"
            echo "- Project ref: ${SUPABASE_PROJECT_ID}"
            echo "- PROD: not touched by this workflow"
            echo "- n8n: not touched by this workflow"
            echo "- Cron/webhook: not touched by this workflow"
            echo "- Secrets: values are not printed by this workflow"
            echo ""
          } > "${EVIDENCE_DIR}/summary.md"

          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain | tee "${EVIDENCE_DIR}/git-status.txt"
            echo "::error::Repository checkout is not clean."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2

      - name: Verify deploy inputs
        shell: bash
        run: |
          set -euo pipefail
          supabase --version | tee "${EVIDENCE_DIR}/supabase-version.txt"

          if [ ! -f "supabase/functions/${FUNCTION_NAME}/index.ts" ]; then
            echo "::error::Missing Edge Function source: supabase/functions/${FUNCTION_NAME}/index.ts"
            exit 1
          fi

          if [ ! -f "supabase/config.toml" ]; then
            echo "::error::Missing supabase/config.toml function configuration."
            exit 1
          fi

          grep -q "\[functions.${FUNCTION_NAME}\]" supabase/config.toml
          grep -q "verify_jwt = false" supabase/config.toml

          find "supabase/functions/${FUNCTION_NAME}" -maxdepth 2 -type f | sort | tee "${EVIDENCE_DIR}/function-files.txt"
          cp supabase/config.toml "${EVIDENCE_DIR}/config.toml"

      - name: Deploy notification-dispatcher to Supabase DEV
        shell: bash
        run: |
          set -euo pipefail
          set +e
          supabase functions deploy "${FUNCTION_NAME}" --project-ref "${SUPABASE_PROJECT_ID}" > "${EVIDENCE_DIR}/deploy-stdout.txt" 2> "${EVIDENCE_DIR}/deploy-stderr.txt"
          deploy_status=$?
          set -e

          {
            echo "# Deploy result"
            echo ""
            echo "- Exit code: ${deploy_status}"
            echo "- Function: ${FUNCTION_NAME}"
            echo "- Project ref: ${SUPABASE_PROJECT_ID}"
            echo ""
            echo "## stdout"
            cat "${EVIDENCE_DIR}/deploy-stdout.txt"
            echo ""
            echo "## stderr"
            cat "${EVIDENCE_DIR}/deploy-stderr.txt"
          } | tee "${EVIDENCE_DIR}/deploy-result.md"

          exit "${deploy_status}"

      - name: Upload deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-dev-notification-dispatcher-deploy-evidence
          path: /tmp/supabase-dev-notification-dispatcher-deploy-evidence
          if-no-files-found: warn
          retention-days: 14
