name: Temporary build batch product release

on:
  push:
    branches:
      - release/flux-prod-batch-product-2026-08-04
    paths:
      - .github/workflows/_tmp_build_batch_product.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact release branch
        uses: actions/checkout@v4
        with:
          ref: release/flux-prod-batch-product-2026-08-04
          fetch-depth: 0

      - name: Reconstruct validated batch product slice
        shell: bash
        env:
          EXPECTED_BASE: b57995ba3068018ccd9ea8649a18a354612ed680
          EXPECTED_SOURCE: f0902b493803bb96e09eed9d92f43fcb0787004a
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          git fetch origin candidate/slice-batch-comprobantes
          test "$(git rev-parse origin/candidate/slice-batch-comprobantes)" = "$EXPECTED_SOURCE"

          product_files=(
            comprobantes_batch.css
            comprobantes_batch.html
            comprobantes_batch.js
            pagos_comprobaciones_receipt_fix.css
            pagos_comprobaciones_receipt_fix.js
            payment_batch_final_reconciliation.css
            payment_batch_parser.js
            payment_batch_single_page_pdf.js
            payment_request_reconciliation_evidence.js
            pdf-lib-1.17.1.min.js
            pdfjs-3.11.174.min.js
            pdfjs-worker-3.11.174.min.js
          )
          git checkout origin/candidate/slice-batch-comprobantes -- "${product_files[@]}"

          python - <<'PY'
          from pathlib import Path
          import re

          receipt_module = '    { key: "receipt-batches", section: "Operacion", file: "comprobantes_batch.html", href: "./comprobantes_batch.html", icon: "B", label: "Comprobantes batch", groups: [ROLE_GROUPS.SYSADMIN, ROLE_GROUPS.ADMIN], sensitive: true },\n'

          for path in ("config.js", "nav_first_paint_bootstrap.js"):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if 'key: "receipt-batches"' not in text:
                  anchor = '    { key: "layouts", section: "Operacion", file: "layouts.html", href: "./layouts.html", icon: "L", label: "Layouts de pago", groups: [ROLE_GROUPS.SYSADMIN, ROLE_GROUPS.ADMIN, ROLE_GROUPS.DIRECTION] },\n'
                  if text.count(anchor) != 1:
                      raise SystemExit(f"{path}: layouts anchor missing or ambiguous")
                  text = text.replace(anchor, anchor + receipt_module, 1)
              text, count = re.subn(
                  r'const NAV_RENDER_VERSION = "[^"]+"',
                  'const NAV_RENDER_VERSION = "20260804-receipt-batches"',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"{path}: NAV_RENDER_VERSION not found")
              text = text.replace(
                  'return modules.filter((item) => !item.hidden)',
                  'return modules.filter((item) => !item.hidden && !item.sensitive)',
                  1,
              )
              if '!item.hidden && !item.sensitive' not in text:
                  raise SystemExit(f"{path}: sensitive fallback guard missing")
              p.write_text(text, encoding="utf-8")

          solicitudes = Path("solicitudes.html")
          text = solicitudes.read_text(encoding="utf-8")
          if 'payment_batch_final_reconciliation.css' not in text:
              text, count = re.subn(
                  r'(^\s*<link rel="stylesheet" href="\./ux2_nav_skeleton\.css\?v=[^"]+">\n)',
                  r'\1  <link rel="stylesheet" href="./payment_batch_final_reconciliation.css?v=20260723-v1">\n',
                  text,
                  count=1,
                  flags=re.M,
              )
              if count != 1:
                  raise SystemExit("solicitudes.html: nav stylesheet anchor missing")
          if 'payment_request_reconciliation_evidence.js' not in text:
              match = re.search(r'^(\s*<script src="\./solicitudes\.js\?v=[^"]+"></script>\n)', text, flags=re.M)
              if not match:
                  raise SystemExit("solicitudes.html: solicitudes.js anchor missing")
              addition = (
                  match.group(1)
                  + '  <script src="./pdf-lib-1.17.1.min.js?v=20260723-vendored-root"></script>\n'
                  + '  <script src="./payment_batch_single_page_pdf.js?v=20260723-one-to-one"></script>\n'
                  + '  <script src="./payment_request_reconciliation_evidence.js?v=20260723-one-to-one"></script>\n'
              )
              text = text[:match.start()] + addition + text[match.end():]
          solicitudes.write_text(text, encoding="utf-8")

          pagos = Path("pagos_comprobaciones.html")
          text = pagos.read_text(encoding="utf-8")
          if 'pagos_comprobaciones_receipt_fix.css' not in text:
              text, count = re.subn(
                  r'(^\s*<link rel="stylesheet" href="\./ux2_shared\.css\?v=[^"]+">\n)',
                  r'\1  <link rel="stylesheet" href="./pagos_comprobaciones_receipt_fix.css?v=20260701-sysadmin-receipt">\n',
                  text,
                  count=1,
                  flags=re.M,
              )
              if count != 1:
                  raise SystemExit("pagos_comprobaciones.html: shared stylesheet anchor missing")
          if 'pagos_comprobaciones_receipt_fix.js' not in text:
              match = re.search(r'^(\s*<script src="\./pagos_comprobaciones_cash_ux\.js\?v=[^"]+"></script>\n)', text, flags=re.M)
              if not match:
                  raise SystemExit("pagos_comprobaciones.html: cash UX footer anchor missing")
              addition = match.group(1) + '  <script src="./pagos_comprobaciones_receipt_fix.js?v=20260701-sysadmin-receipt"></script>\n'
              text = text[:match.start()] + addition + text[match.end():]
          pagos.write_text(text, encoding="utf-8")
          PY

          node --check comprobantes_batch.js
          node --check config.js
          node --check nav_first_paint_bootstrap.js
          node --check pagos_comprobaciones_receipt_fix.js
          node --check payment_batch_parser.js
          node --check payment_batch_single_page_pdf.js
          node --check payment_request_reconciliation_evidence.js

          test ! -e CANDIDATE_SLICE_BATCH.md
          test ! -e supabase/migrations/032_payment_batch_reconciliation.sql
          test ! -e supabase/migrations/033_payment_batch_final_reconciliation.sql
          test ! -e supabase/migrations/034_payment_receipt_evidence_storage_policy_fix.sql
          test ! -e supabase/migrations/038_materialize_only_released_batch_items.sql

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/_tmp_build_batch_product.yml
          git add "${product_files[@]}" config.js nav_first_paint_bootstrap.js solicitudes.html pagos_comprobaciones.html
          git commit -m "release: prepare payment receipt batch product slice [skip ci]"
          git push origin HEAD:release/flux-prod-batch-product-2026-08-04
