name: Temporary DEV provider public portal complete UAT

on:
  push:
    branches:
      - feature/ramon-provider-public-portal-ui
    paths:
      - ops/provider-intake/public-ui-uat-complete.authorization.json

permissions:
  contents: read

concurrency:
  group: provider-intake-public-ui-dev-complete-uat
  cancel-in-progress: false

jobs:
  uat:
    name: Playwright DEV complete UAT
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: DEV
    env:
      AUTHORIZATION_FILE: ops/provider-intake/public-ui-uat-complete.authorization.json
      PRODUCT_HEAD: d701e0071cf0a93d3055b981c5daf91b300c68fe
      EXPECTED_BACKEND_TREE: 379f65801609e40143d948b3de702e391636c512
      PREVIEW_URL: https://catalogo-proveedores-flux-git-feature-ramon-69af24-quantta-team.vercel.app/solicitar.html
      PREVIEW_ORIGIN: https://catalogo-proveedores-flux-git-feature-ramon-69af24-quantta-team.vercel.app
      FUNCTION_BASE_URL: https://scsirgbuqjcwoaxfacth.functions.supabase.co/provider-intake
      PROJECT_REF: scsirgbuqjcwoaxfacth
      QA_LINK_ID: 9f9ffd31-926a-4d43-be53-f5090d401c9c
      PROVIDER_INTAKE_QA_TOKEN: ${{ secrets.PROVIDER_INTAKE_QA_TOKEN }}
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}

    steps:
      - name: Checkout authorized commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize runner-only paths
        shell: bash
        run: |
          set -euo pipefail
          echo "UAT_WORK_DIR=$RUNNER_TEMP/provider-intake-public-ui-complete-uat" >> "$GITHUB_ENV"
          echo "UAT_OUTPUT_DIR=$RUNNER_TEMP/provider-intake-public-ui-complete-uat/evidence" >> "$GITHUB_ENV"

      - name: Validate authorization and immutable scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feature/ramon-provider-public-portal-ui"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$PRODUCT_HEAD" HEAD

          node <<'NODE'
          const fs = require("fs");
          const marker = JSON.parse(fs.readFileSync(process.env.AUTHORIZATION_FILE, "utf8"));
          const expected = {
            confirm: "RUN_PROVIDER_PUBLIC_UI_COMPLETE_UAT_DEV_ONLY",
            project_ref: "scsirgbuqjcwoaxfacth",
            pr: 256,
            product_head: "d701e0071cf0a93d3055b981c5daf91b300c68fe",
            expected_backend_tree: "379f65801609e40143d948b3de702e391636c512",
            preview_origin: "https://catalogo-proveedores-flux-git-feature-ramon-69af24-quantta-team.vercel.app",
            max_positive_submits: 2,
          };
          if (JSON.stringify(marker) !== JSON.stringify(expected)) {
            throw new Error("authorization_marker_mismatch");
          }
          NODE

          mapfile -t changed < <(git diff --name-only "$PRODUCT_HEAD"..HEAD | sort)
          expected_changed=(
            ".github/workflows/provider-intake-public-ui-uat-complete-temporary.yml"
            "ops/provider-intake/public-ui-uat-complete.authorization.json"
            "scripts/qa/provider-intake-public-ui-uat-complete.playwright.mjs"
          )
          test "${changed[*]}" = "${expected_changed[*]}"

          test "$(git ls-tree HEAD supabase/functions/provider-intake | awk '{print $3}')" = "$EXPECTED_BACKEND_TREE"
          test -n "$PROVIDER_INTAKE_QA_TOKEN"
          test -n "$SUPABASE_DEV_DB_URL"
          echo "authorization | validated=true"
          echo "provider-intake tree | unchanged=true"

      - name: Run contractual checks
        shell: bash
        run: |
          set -euo pipefail
          node --check solicitar-config.js
          node --check solicitar-core.js
          node --check solicitar.js
          node --check scripts/qa/provider-intake-public-ui-contract.test.mjs
          node --check scripts/qa/provider-intake-public-ui-uat-complete.playwright.mjs
          node --test scripts/qa/provider-intake-public-ui-contract.test.mjs
          git diff --check "$PRODUCT_HEAD"..HEAD

      - name: Install pinned cloud-only UAT dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$UAT_WORK_DIR"
          npm install --prefix "$UAT_WORK_DIR" --no-audit --no-fund \
            playwright@1.55.0 \
            @axe-core/playwright@4.10.2 \
            pg@8.16.3
          cp scripts/qa/provider-intake-public-ui-uat-complete.playwright.mjs "$UAT_WORK_DIR/uat.mjs"
          "$UAT_WORK_DIR/node_modules/.bin/playwright" install --with-deps chromium

      - name: Prepare fixtures, baseline and protected link
        shell: bash
        run: |
          set -euo pipefail
          node "$UAT_WORK_DIR/uat.mjs" prepare

      - name: Run complete Playwright UAT and postcheck
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node "$UAT_WORK_DIR/uat.mjs" uat

      - name: Restore temporary link values when applicable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node "$UAT_WORK_DIR/uat.mjs" restore

      - name: Upload sanitized complete UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-intake-public-ui-complete-uat
          path: ${{ runner.temp }}/provider-intake-public-ui-complete-uat/evidence
          if-no-files-found: error
          retention-days: 3
