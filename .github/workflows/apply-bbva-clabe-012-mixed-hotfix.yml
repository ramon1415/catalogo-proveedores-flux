name: Apply BBVA CLABE 012 mixed-format hotfix

on:
  push:
    branches:
      - hotfix/bbva-clabe-012-mixed-prod

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[bbva-clabe-mixed-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply recovered VBA mixed-format contract
        run: python scripts/ops/apply_bbva_clabe_012_mixed_hotfix.py

      - name: Normalize generated PTC test expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/qa/bbva-mixed-clabe-macro-contract.test.mjs')
          lines = path.read_text(encoding='utf-8').splitlines()
          matches = 0
          for index, line in enumerate(lines):
              if line.startswith('const expected = "PTC012914000000000007'):
                  lines[index] = 'const expected = "PTC012914000000000007000000000191134094MXP0000000003527.90" + "PRUEBA CLABE BBVA".padEnd(30, " ")'
                  matches += 1
          if matches != 1:
              raise SystemExit(f'expected one PTC test constant, found {matches}')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Install React dependencies
        run: npm --prefix app ci

      - name: Run focused and regression contracts
        run: |
          node --check layouts.js
          node --test \
            scripts/qa/bbva-mixed-clabe-macro-contract.test.mjs \
            scripts/qa/bbva-clabe-012-routing-hotfix.test.mjs \
            scripts/qa/bbva-pagosint-bank-field-hotfix.test.mjs \
            scripts/qa/bbva-cie-layout-contract.test.mjs \
            scripts/qa/layout-budget-exception-reference-contract.test.mjs \
            scripts/qa/layout-scheduled-date-window-guard.test.mjs \
            scripts/qa/prod-reimbursement-permissions.test.mjs \
            scripts/qa/approval-batches-company-scope-contract.test.mjs \
            scripts/qa/uniform-primary-table-scroll-contract.test.mjs

      - name: Build production artifact
        run: npm --prefix app run build

      - name: Commit validated hotfix
        shell: bash
        run: |
          git config user.name "ramon1415"
          git config user.email "ramon@quantta.mx"
          git rm \
            .github/workflows/apply-bbva-clabe-012-mixed-hotfix.yml \
            scripts/ops/apply_bbva_clabe_012_mixed_hotfix.py \
            scripts/ops/run_bbva_clabe_012_mixed_hotfix.txt
          git add \
            layouts.js \
            layouts.html \
            app/src/features/layouts/types.ts \
            app/src/features/layouts/logic.ts \
            app/src/features/layouts/LayoutsPage.tsx \
            app/src/features/layouts/LinesModal.tsx \
            docs/ops/layout-cxc-download-format.md \
            docs/ops/bbva-mixed-clabe-format.md \
            scripts/qa/bbva-mixed-clabe-macro-contract.test.mjs \
            scripts/qa/bbva-clabe-012-routing-hotfix.test.mjs \
            scripts/qa/bbva-pagosint-bank-field-hotfix.test.mjs \
            scripts/qa/layout-budget-exception-reference-contract.test.mjs
          git commit -m "fix(layouts): generar PAGOSMIX PTC para CLABE BBVA 012 [bbva-clabe-mixed-applied]"
          git push origin HEAD:hotfix/bbva-clabe-012-mixed-prod
