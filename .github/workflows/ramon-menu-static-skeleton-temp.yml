name: Temporary menu static skeleton patch

on:
  push:
    branches:
      - fix/ramon-menu-static-skeleton-dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-menu-skeleton:
    if: github.ref == 'refs/heads/fix/ramon-menu-static-skeleton-dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/ramon-menu-static-skeleton-dev
          token: ${{ github.token }}

      - name: Apply static skeleton patch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const version = 'ux2_shared.css?v=20260618-nav-static-skeleton';
          const htmlFiles = [
            'aprobaciones.html',
            'configuracion.html',
            'dashboard.html',
            'efectivo.html',
            'ingresos.html',
            'layouts.html',
            'pagos_comprobaciones.html',
            'proveedores.html',
            'socios.html',
            'solicitudes.html',
          ];

          const skeletonMarker = 'Static first-paint sidebar skeleton';
          const skeletonCss = `

/* ${skeletonMarker}: keeps the UX2 menu occupied before config.js resolves roles. */
.sidebar .nav,
body:not(.flux-shell-ready) .sidebar .nav,
html:not(.flux-shell-ready) body:not(.flux-shell-ready) .sidebar .nav{
  min-height:420px;
}
.sidebar .nav:empty,
body:not(.flux-shell-ready) .sidebar .nav:empty,
html:not(.flux-shell-ready) body:not(.flux-shell-ready) .sidebar .nav:empty{
  position:relative;
  display:block;
  overflow:hidden;
  border-radius:8px;
  pointer-events:none;
}
.sidebar .nav:empty::before,
body:not(.flux-shell-ready) .sidebar .nav:empty::before,
html:not(.flux-shell-ready) body:not(.flux-shell-ready) .sidebar .nav:empty::before{
  content:"";
  display:block;
  min-height:420px;
  border-radius:8px;
  opacity:.9;
  background:
    linear-gradient(var(--text-3),var(--text-3)) 10px 8px/72px 9px no-repeat,
    linear-gradient(var(--bg-hover),var(--bg-hover)) 10px 30px/188px 30px no-repeat,
    linear-gradient(var(--bg-hover),var(--bg-hover)) 10px 68px/176px 30px no-repeat,
    linear-gradient(var(--bg-hover),var(--bg-hover)) 10px 106px/196px 30px no-repeat,
    linear-gradient(var(--bg-hover),var(--bg-hover)) 10px 144px/168px 30px no-repeat,
    linear-gradient(var(--text-3),var(--text-3)) 10px 190px/54px 9px no-repeat,
    linear-gradient(var(--bg-hover),var(--bg-hover)) 10px 212px/184px 30px no-repeat,
    linear-gradient(var(--bg-hover),var(--bg-hover)) 10px 250px/170px 30px no-repeat,
    linear-gradient(var(--bg-hover),var(--bg-hover)) 10px 288px/190px 30px no-repeat,
    linear-gradient(var(--text-3),var(--text-3)) 10px 334px/92px 9px no-repeat,
    linear-gradient(var(--bg-hover),var(--bg-hover)) 10px 356px/182px 30px no-repeat,
    linear-gradient(var(--bg-hover),var(--bg-hover)) 10px 394px/156px 30px no-repeat;
  animation:fluxStaticNavSkeleton 1.15s ease-in-out infinite;
}
.sidebar .nav:empty::after,
body:not(.flux-shell-ready) .sidebar .nav:empty::after,
html:not(.flux-shell-ready) body:not(.flux-shell-ready) .sidebar .nav:empty::after{
  content:"";
  position:absolute;
  inset:0;
  transform:translateX(-82%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.055),transparent);
  animation:fluxStaticNavSweep 1.25s ease-in-out infinite;
}
body.flux-shell-ready .sidebar .nav,
html.flux-shell-ready body.flux-shell-ready .sidebar .nav{
  pointer-events:auto;
}
body.flux-shell-ready .sidebar .nav:not(:empty)::before,
body.flux-shell-ready .sidebar .nav:not(:empty)::after,
html.flux-shell-ready body.flux-shell-ready .sidebar .nav:not(:empty)::before,
html.flux-shell-ready body.flux-shell-ready .sidebar .nav:not(:empty)::after{
  content:none;
  display:none;
}
@keyframes fluxStaticNavSkeleton{0%,100%{opacity:.72}50%{opacity:1}}
@keyframes fluxStaticNavSweep{0%{transform:translateX(-82%)}100%{transform:translateX(88%)}}
@media(max-width:1040px){
  .sidebar .nav,
  body:not(.flux-shell-ready) .sidebar .nav,
  html:not(.flux-shell-ready) body:not(.flux-shell-ready) .sidebar .nav{min-height:96px}
  .sidebar .nav:empty::before,
  body:not(.flux-shell-ready) .sidebar .nav:empty::before,
  html:not(.flux-shell-ready) body:not(.flux-shell-ready) .sidebar .nav:empty::before{
    min-height:96px;
    background:
      linear-gradient(var(--text-3),var(--text-3)) 8px 8px/70px 9px no-repeat,
      linear-gradient(var(--bg-hover),var(--bg-hover)) 8px 30px/184px 28px no-repeat,
      linear-gradient(var(--bg-hover),var(--bg-hover)) 8px 64px/160px 28px no-repeat;
  }
}
`;

          for (const file of htmlFiles) {
            const original = fs.readFileSync(file, 'utf8');
            const matches = original.match(/ux2_shared\.css\?v=[^"']+/g) || [];
            if (matches.length !== 1) {
              throw new Error(`${file}: expected exactly one ux2_shared.css cache-bust reference, found ${matches.length}`);
            }
            const updated = original.replace(matches[0], version);
            if (updated === original) throw new Error(`${file}: cache-bust replacement did not change content`);
            fs.writeFileSync(file, updated);
          }

          const cssPath = 'ux2_shared.css';
          const cssOriginal = fs.readFileSync(cssPath, 'utf8');
          if (cssOriginal.includes(skeletonMarker)) {
            throw new Error('ux2_shared.css already contains the static skeleton marker; refusing duplicate patch');
          }
          fs.writeFileSync(cssPath, `${cssOriginal.trimEnd()}${skeletonCss}`);

          for (const forbidden of ['index.html', 'pending.html']) {
            if (fs.existsSync(forbidden)) {
              const content = fs.readFileSync(forbidden, 'utf8');
              if (content.includes(version)) {
                throw new Error(`${forbidden}: should not be touched by this patch`);
              }
            }
          }
          NODE

      - name: Remove temporary workflow from final tree
        shell: bash
        run: rm -f .github/workflows/ramon-menu-static-skeleton-temp.yml

      - name: Validate expected diff
        shell: bash
        run: |
          set -euo pipefail
          expected=$(cat <<'EOF' | sort
          .github/workflows/ramon-menu-static-skeleton-temp.yml
          aprobaciones.html
          configuracion.html
          dashboard.html
          efectivo.html
          ingresos.html
          layouts.html
          pagos_comprobaciones.html
          proveedores.html
          socios.html
          solicitudes.html
          ux2_shared.css
          EOF
          )
          actual=$(git diff --name-only | sort)
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected diff:"
            git diff --name-only
            exit 1
          fi
          for file in aprobaciones.html configuracion.html dashboard.html efectivo.html ingresos.html layouts.html pagos_comprobaciones.html proveedores.html socios.html solicitudes.html; do
            count=$(grep -o 'ux2_shared.css?v=20260618-nav-static-skeleton' "$file" | wc -l | tr -d ' ')
            if [ "$count" != "1" ]; then
              echo "$file has $count cache-bust references"
              exit 1
            fi
          done
          grep -q 'Static first-paint sidebar skeleton' ux2_shared.css
          if git diff --cached --name-only | grep -q .; then
            echo "Unexpected staged files before validation"
            exit 1
          fi
          if git diff | grep -E 'service_role|SUPABASE_SERVICE'; then
            echo "Forbidden sensitive token found in diff"
            exit 1
          fi
          if git diff --name-only | grep -E '(^|/)supabase/|\.sql$|n8n|migration'; then
            echo "Forbidden SQL/Supabase/n8n/migration path in diff"
            exit 1
          fi

      - name: Commit and push final patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ux2_shared.css aprobaciones.html configuracion.html dashboard.html efectivo.html ingresos.html layouts.html pagos_comprobaciones.html proveedores.html socios.html solicitudes.html .github/workflows/ramon-menu-static-skeleton-temp.yml
          git commit -m "fix: add static sidebar skeleton"
          git push origin HEAD:fix/ramon-menu-static-skeleton-dev
