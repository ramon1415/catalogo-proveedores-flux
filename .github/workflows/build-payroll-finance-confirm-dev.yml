name: Build payroll finance confirm DEV

on:
  push:
    branches:
      - feature/payroll-finance-confirm-nonbudget-dev

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build payroll finance confirm candidate
        run: python .github/scripts/build_payroll_finance_confirm.py

      - name: Validate non-budget finance-confirm contract
        run: |
          grep -q "confirm_payroll_finance_review" app/src/features/nomina/api.ts
          grep -q "Confirmar montos correctos" app/src/features/nomina/CaptureModal.tsx
          ! grep -q "Configurar presupuesto" app/src/features/nomina/CaptureModal.tsx
          ! grep -q "Continuar y enviar a aprobación" app/src/features/nomina/CaptureModal.tsx
          grep -q "PAYROLL_NON_BUDGET" supabase/migrations/20260907164000_payroll_nonbudget_finance_confirm.sql
          grep -q "app.payroll_finance_confirm" supabase/migrations/20260907164000_payroll_nonbudget_finance_confirm.sql
          npm --prefix app ci
          npm --prefix app run typecheck
          npm --prefix app run build
          git diff --check

      - name: Commit validated candidate
        shell: bash
        run: |
          git config user.name 'ramon1415'
          git config user.email 'ramon@quantta.mx'
          git rm .github/workflows/build-payroll-finance-confirm-dev.yml .github/scripts/build_payroll_finance_confirm.py
          git add app/src/features/nomina/api.ts app/src/features/nomina/CaptureModal.tsx app/src/features/nomina/logic.ts
          git commit -m 'feat(payroll): nómina no presupuestal + confirmación Finanzas DEV [payroll-finance-confirm-built]'
          git push origin HEAD:feature/payroll-finance-confirm-nonbudget-dev
