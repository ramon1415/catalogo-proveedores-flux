name: BBVA CIE production release contracts

'on':
  pull_request:
    branches:
      - main
    paths:
      - layouts.js
      - proveedores.js
      - scripts/qa/bbva-cie-layout-contract.test.mjs
      - scripts/qa/provider-catalog-rpc-persistence-contract.test.mjs
      - scripts/qa/provider-canonical-rpc-prod-migration-contract.test.mjs
      - supabase/migrations/20260813011425_049_snapshot_bbva_cie_convenio_number.sql
      - supabase/migrations/20260814004000_provider_catalog_canonical_rpc_prod.sql
      - docs/ops/bbva-cie-layout-format.md
      - .github/workflows/bbva-cie-contract-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: CIE, provider RPC, and MAIN regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend syntax
        run: |
          node --check layouts.js
          node --check proveedores.js

      - name: Run CIE and provider contracts
        run: |
          node --test scripts/qa/bbva-cie-layout-contract.test.mjs
          node --test scripts/qa/provider-catalog-rpc-persistence-contract.test.mjs
          node --test scripts/qa/provider-canonical-rpc-prod-migration-contract.test.mjs

      - name: Run MAIN layout regressions
        run: |
          node --test scripts/qa/layout-client-uat-hotfix-contract.test.mjs
          node --test scripts/qa/layout-concept-no-reauth-contract.test.mjs
          node --test scripts/qa/layout-operational-materiality-reconcile-contract.test.mjs
          node --test scripts/qa/layout-review-click-hotfix.test.mjs
          node --test scripts/qa/layout-source-account-approval-contract.test.mjs
          node --test scripts/qa/paid-layout-receipt-match-contract.test.mjs

  prod-migration-dry-run:
    name: PROD migration dry-run (exactly two)
    if: github.event_name == 'pull_request' && github.head_ref == 'release/ramon-bbva-cie-prod'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-production
    env:
      EXPECTED_PROJECT_REF: ucantptjhwttexzmslvm
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF_PROD }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
    steps:
      - name: Validate immutable PROD dry-run target
        shell: bash
        run: |
          set -euo pipefail
          test "${PROJECT_REF}" = "${EXPECTED_PROJECT_REF}"
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_DB_PASSWORD}"
          test "${GITHUB_BASE_REF}" = "main"
          test "${GITHUB_HEAD_REF}" = "release/ramon-bbva-cie-prod"

      - name: Checkout release
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2

      - name: Link PROD
        run: supabase link --project-ref "${EXPECTED_PROJECT_REF}"

      - name: Dry-run exactly the release migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked
          supabase db push --linked --dry-run 2>&1 | tee "${RUNNER_TEMP}/dry-run.txt"
          python3 - "${RUNNER_TEMP}/dry-run.txt" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          expected = [
              "20260813011425_049_snapshot_bbva_cie_convenio_number.sql",
              "20260814004000_provider_catalog_canonical_rpc_prod.sql",
          ]
          for item in expected:
              if item not in text:
                  raise SystemExit(f"missing expected migration in dry-run: {item}")
          forbidden = [
              "_043_", "_044_", "_045_", "_046_", "_047_", "_048_",
              "20260809214308_", "20260810165344_", "20260810175316_",
              "20260810185817_",
          ]
          for item in forbidden:
              if item in text:
                  raise SystemExit(f"unexpected migration in dry-run: {item}")
          print("PASS / PROD_MIGRATION_SET_EXACTLY_TWO")
          PY
