name: BBVA CIE contract tests

on:
  push:
    branches:
      - feature/ramon-bbva-cie-layout
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run CIE and layout regression contracts
        run: >-
          node --test
          scripts/qa/bbva-cie-layout-contract.test.mjs
          scripts/qa/layout-client-uat-hotfix-contract.test.mjs
          scripts/qa/layout-concept-no-reauth-contract.test.mjs
          scripts/qa/layout-operational-materiality-reconcile-contract.test.mjs
