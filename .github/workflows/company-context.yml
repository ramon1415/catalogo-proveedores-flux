name: Company context UI
on:
  pull_request:
    paths:
      - 'app/src/components/ui/AppShell*'
      - 'app/src/components/ui/Nav/**'
      - 'app/src/lib/company.tsx'
      - 'scripts/qa/company-context.test.mjs'
      - '.github/workflows/company-context.yml'
  push:
    branches: [dev, main]
    paths:
      - 'app/src/components/ui/AppShell*'
      - 'app/src/components/ui/Nav/**'
      - 'app/src/lib/company.tsx'
      - 'scripts/qa/company-context.test.mjs'
      - '.github/workflows/company-context.yml'
permissions:
  contents: read
jobs:
  company-switching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm run qa:setup
      - run: node --test scripts/qa/company-context.test.mjs
