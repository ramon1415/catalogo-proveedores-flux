          ('AUTO-RSJT-2026-ROW-107','60207004000',false,'judgment',NULL),
          ('AUTO-RSJT-2026-ROW-110','60205001000',false,'exact_name',NULL),
          ('AUTO-RSJT-2026-ROW-111','60277000000',false,'judgment',NULL),
          ('AUTO-RSJT-2026-ROW-112','60205002000',false,'exact_name',NULL),
          ('AUTO-RSJT-2026-ROW-113','60202010000',false,'judgment',NULL),
          ('AUTO-RSJT-2026-ROW-116','60204004000',false,'exact_name',NULL),
          ('AUTO-RSJT-2026-ROW-119','60208020000',false,'judgment',NULL),
          ('OP-001','60256000000',false,'judgment',NULL),
