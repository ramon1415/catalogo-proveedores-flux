name: Build isolated CONTPAQ dark launch candidate

on:
  push:
    branches:
      - release/contpaq-dark-launch-prod-r1

permissions:
  contents: write

jobs:
  build-candidate:
    if: ${{ !contains(github.event.head_commit.message, '[contpaq-dark-launch-built]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch certified source commits
        run: |
          git fetch origin 865f37e4e3a4c75c35a3871d6843030e5d635504
          git fetch origin 036f4a285c9ec3306dcf9c8b1f255c656b8c83d6
          git fetch origin 44fb20a20daf59032d3fcc4187607c783dac9fd3
          git fetch origin 992f9bf1b09f47dfc3092050afb7fc4751fb7855

      - name: Port only CONTPAQ frontend and serializer from PR 498
        shell: bash
        run: |
          git diff --binary \
            865f37e4e3a4c75c35a3871d6843030e5d635504 \
            036f4a285c9ec3306dcf9c8b1f255c656b8c83d6 -- \
            app/package.json \
            app/package-lock.json \
            app/src/features/configuracion/ExportarSection.tsx \
            app/src/features/configuracion/api.ts \
            app/src/features/configuracion/exportarPolizas.ts \
            app/src/features/configuracion/tabs/ContpaqTab.tsx \
            app/src/features/configuracion/types.ts \
            app/src/lib/contpaq \
          | git apply --3way

      - name: Overlay account-review changes from PR 543-B only
        shell: bash
        run: |
          git diff --binary \
            44fb20a20daf59032d3fcc4187607c783dac9fd3 \
            992f9bf1b09f47dfc3092050afb7fc4751fb7855 -- \
            app/src/features/configuracion/ExportarSection.tsx \
            app/src/features/configuracion/api.ts \
            app/src/features/configuracion/cuentaReview.ts \
            app/src/features/configuracion/exportarPolizas.ts \
            app/src/features/configuracion/tabs/ContpaqTab.tsx \
            app/src/features/configuracion/types.ts \
          | git apply --3way

      - name: Gate CONTPAQ UI to SysAdmin only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/features/configuracion/logic.ts')
          s = p.read_text(encoding='utf-8')
          old = "contpaq: [ROLE_GROUPS.SYSADMIN, ROLE_GROUPS.ADMIN, ROLE_GROUPS.DIRECTION]"
          if old not in s:
              raise SystemExit('Expected current PROD CONTPAQ access line not found')
          s = s.replace(old, "contpaq: [ROLE_GROUPS.SYSADMIN]", 1)
          s = s.replace("contpaq: 'Adm/Dir'", "contpaq: 'SysAdmin'", 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Bring deterministic seed sources without DEV migrations
        shell: bash
        run: |
          mkdir -p supabase/seed/contpaq
          for f in \
            10_catalogo_operadora.sql \
            11_catalogo_soporte_fersana.sql \
            20_renglones_operadora.sql \
            21_renglones_soporte_fersana.sql \
            30_terceros_operadora.sql \
            40_mapeos_soporte_fersana.sql \
            MANIFEST.txt README.md; do
            git show 036f4a285c9ec3306dcf9c8b1f255c656b8c83d6:supabase/seed/contpaq/$f > supabase/seed/contpaq/$f
          done

