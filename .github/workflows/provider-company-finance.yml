name: Provider company Finance permissions

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'supabase/migrations/*provider_catalog_company_finance.sql'
      - 'ops/provider-company-finance-hotfix.sql'
      - 'ops/provider-current-roles.sql'
      - 'supabase/migrations/*provider_catalog_current_roles.sql'
      - 'scripts/qa/provider-company-finance-db.test.mjs'
      - 'scripts/qa/fixtures/provider-catalog-before-finance.sql'
      - '.github/workflows/provider-company-finance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-finance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/qa/provider-company-finance-db.test.mjs scripts/qa/provider-catalog-rpc-persistence-contract.test.mjs
      - name: Verify applied migration and tested patch match
        run: cmp ops/provider-company-finance-hotfix.sql supabase/migrations/*provider_catalog_company_finance.sql

      - name: Verify current role migration matches the tested patch
        run: cmp ops/provider-current-roles.sql supabase/migrations/*provider_catalog_current_roles.sql
