name: Payroll company scope init race tests

on:
  pull_request:
    paths:
      - 'payroll_company_scope_fix.js'
      - 'scripts/qa/payroll-company-scope-init-race.test.mjs'
      - '.github/workflows/payroll-company-scope-init-race-tests.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check payroll_company_scope_fix.js
      - name: Init-race contract
        run: node --test scripts/qa/payroll-company-scope-init-race.test.mjs
