name: One-shot PROD activate submitted-batch Director email from main

'on':
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-activate-approval-batch-submitted-email-prod-main.yml'

permissions:
  contents: read

concurrency:
  group: one-shot-prod-approval-batch-submitted-email-main
  cancel-in-progress: false

jobs:
  release:
    name: Deploy, migrate, zero-replay smoke, activate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: supabase-production
    env:
      SOURCE_MAIN_SHA: 0d81ebc27bbd95c5f5fdcb8cd9250f87f1e84ccc
      WORKFLOW_PATH: .github/workflows/one-shot-activate-approval-batch-submitted-email-prod-main.yml
      EXPECTED_PROJECT_REF: ucantptjhwttexzmslvm
      FUNCTION_NAME: approval-batch-submitted-dispatcher
      FUNCTION_URL: https://ucantptjhwttexzmslvm.supabase.co/functions/v1/approval-batch-submitted-dispatcher
      EXPECTED_FUNCTION_BLOB: 212cc8d2bd862757bbd7f48ded3b9ff3ef0839f2
      TARGET_VERSION: '20260824191500'
      TARGET_PATH: supabase/migrations/20260824191500_approval_batch_submitted_email_pdf_prod.sql
      TARGET_MIGRATION_SHA256: 30b85256156c35b55c117b2d74670c35d88c85b0c40822b635859f69c1a12c55
      SUPABASE_CLI_VERSION: 2.114.0

    steps:
      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/submitted-batch-prod-release"
          mkdir -p "$evidence"
          echo "EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"
          echo 'NOT_RUN' > "$evidence/result.txt"

      - name: Check out exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 5
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.16.0'
          cache: ''

      - name: Validate immutable scope and product sources
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "STOP / $1" > "$EVIDENCE_DIR/result.txt"; exit 1; }
          [[ "$GITHUB_EVENT_NAME" = push ]] || fail PUSH_REQUIRED
          [[ "$GITHUB_REF" = refs/heads/main ]] || fail MAIN_REQUIRED
          [[ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]] || fail CHECKOUT_DRIFT
          git cat-file -e "$SOURCE_MAIN_SHA^{commit}" || fail SOURCE_SHA_MISSING
          mapfile -t changed < <(git diff --name-only "$SOURCE_MAIN_SHA"..HEAD | sort)
          [[ "${#changed[@]}" = 1 && "${changed[0]}" = "$WORKFLOW_PATH" ]] || fail MAIN_SCOPE_DRIFT
          [[ "$(git hash-object "supabase/functions/$FUNCTION_NAME/index.ts")" = "$EXPECTED_FUNCTION_BLOB" ]] || fail FUNCTION_BLOB_DRIFT
          [[ "$(sha256sum "$TARGET_PATH" | awk '{print $1}')" = "$TARGET_MIGRATION_SHA256" ]] || fail MIGRATION_SHA_DRIFT
          node --experimental-strip-types --test scripts/qa/approval-batch-submitted-email-contract.test.mjs | tee "$EVIDENCE_DIR/contracts.txt"
          git diff --check

      - name: Install pinned tooling
        shell: bash
        run: |
          set -euo pipefail
          node --version | tee "$EVIDENCE_DIR/node-version.txt"
          npx --yes "supabase@$SUPABASE_CLI_VERSION" --version | tee "$EVIDENCE_DIR/supabase-version.txt"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Precheck fixed production and historical queue
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF_PROD: ${{ vars.SUPABASE_PROJECT_REF_PROD }}
          SUPABASE_PROD_SESSION_POOLER_DB_URL: ${{ secrets.SUPABASE_PROD_SESSION_POOLER_DB_URL }}
        run: |
          set -euo pipefail
          fail() { echo "STOP / $1" > "$EVIDENCE_DIR/result.txt"; exit 1; }
          [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_PROD_SESSION_POOLER_DB_URL" ]] || fail PROD_SECRETS_MISSING
          [[ "$SUPABASE_PROJECT_REF_PROD" = "$EXPECTED_PROJECT_REF" ]] || fail PROD_REF_MISMATCH
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          echo "::add-mask::$SUPABASE_PROD_SESSION_POOLER_DB_URL"
          export PGSSLMODE=require PGCONNECT_TIMEOUT=20
          curl --silent --show-error --fail \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PROJECT_REF" > "$RUNNER_TEMP/project.json"
          PROJECT_JSON="$RUNNER_TEMP/project.json" python3 - <<'PY'
          import json, os
          p=json.load(open(os.environ['PROJECT_JSON']))
          assert (p.get('id') or p.get('ref')) == 'ucantptjhwttexzmslvm'
          assert p.get('name') == 'financieraflux'
          assert p.get('status') == 'ACTIVE_HEALTHY'
          PY
          psql "$SUPABASE_PROD_SESSION_POOLER_DB_URL" -X -Atq -v ON_ERROR_STOP=1 <<'SQL' > "$EVIDENCE_DIR/precheck.json"
          begin transaction read only;
          select json_build_object(
            'ledger',(select count(*) from supabase_migrations.schema_migrations where version='20260824191500'),
            'claim',to_regprocedure('public.claim_approval_batch_submitted_events_for_dispatcher(integer,text,timestamptz)') is not null,
            'document',to_regprocedure('public.get_approval_batch_submitted_notification_document(uuid,text)') is not null,
            'cancel',to_regprocedure('public.cancel_approval_batch_submitted_event_for_dispatcher(uuid,text,text)') is not null,
            'wakeup',to_regprocedure('public.notification_approval_batch_submitted_dispatch_wakeup_internal()') is not null,
            'target_trigger',(select count(*) from pg_trigger where tgrelid='public.notification_events'::regclass and tgname='notification_approval_batch_submitted_dispatch_after_insert' and not tgisinternal),
            'vault',(select count(*) from vault.decrypted_secrets where name like 'notification_approval_batch_submitted_%'),
            'historical_total',(select count(*) from public.notification_events where event_type='approval_batch.submitted'),
            'historical_pending',(select count(*) from public.notification_events where event_type='approval_batch.submitted' and status='pending'),
            'historical_attempts',(select count(*) from public.notification_delivery_attempts a join public.notification_events e on e.id=a.notification_event_id where e.event_type='approval_batch.submitted'),
            'historical_digest',(select md5(coalesce(string_agg(concat_ws('|',id::text,status,attempt_count::text,coalesce(processed_at::text,''),coalesce(last_error,''),updated_at::text),'|' order by id),'')) from public.notification_events where event_type='approval_batch.submitted'),
            'submitted_batches',(select count(*) from public.approval_batches where status='submitted'),
            'receipt_wakeup_hash',md5(pg_get_functiondef('public.notification_receipt_linked_dispatch_wakeup_internal()'::regprocedure)),
            'created_wakeup_hash',md5(pg_get_functiondef('public.notification_payment_request_created_dispatch_wakeup_internal()'::regprocedure))
          );
          rollback;
          SQL
          python3 - <<'PY'
          import json, os
          p=json.load(open(os.path.join(os.environ['EVIDENCE_DIR'],'precheck.json')))
          assert p['ledger']==0 and not any(p[k] for k in ('claim','document','cancel','wakeup'))
          assert p['target_trigger']==0 and p['vault']==0
          assert p['historical_total']==7 and p['historical_pending']==7 and p['historical_attempts']==0
          assert p['submitted_batches']==0
          PY

      - name: Rehearse exact migration and roll back
        shell: bash
        env:
          SUPABASE_PROD_SESSION_POOLER_DB_URL: ${{ secrets.SUPABASE_PROD_SESSION_POOLER_DB_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_PROD_SESSION_POOLER_DB_URL"
          export PGSSLMODE=require PGCONNECT_TIMEOUT=20
          python3 - <<'PY'
          import os, pathlib
          s=pathlib.Path(os.environ['TARGET_PATH']).read_text().strip()
          assert s.lower().startswith('begin;') and s.lower().endswith('commit;')
          body=s[len('begin;'):]
          i=body.lower().rfind('commit;')
          assert i>=0 and not body[i+len('commit;'):].strip()
          pathlib.Path(os.environ['RUNNER_TEMP']+'/rehearsal.sql').write_text('begin;\n'+body[:i]+'\nrollback;\n')
          PY
          psql "$SUPABASE_PROD_SESSION_POOLER_DB_URL" -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/rehearsal.sql" > "$EVIDENCE_DIR/rehearsal.txt"
          psql "$SUPABASE_PROD_SESSION_POOLER_DB_URL" -X -Atq -v ON_ERROR_STOP=1 \
            -c "begin transaction read only; select count(*) from supabase_migrations.schema_migrations where version='20260824191500'; rollback;" \
            | grep -qx '0'

      - name: Deploy only the dedicated Edge Function
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          npx --yes "supabase@$SUPABASE_CLI_VERSION" functions deploy "$FUNCTION_NAME" \
            --project-ref "$EXPECTED_PROJECT_REF" --no-verify-jwt --use-api \
            | tee "$EVIDENCE_DIR/function-deploy.txt"

      - name: Dry-run and apply only migration 20260824191500
        shell: bash
        env:
          SUPABASE_PROD_SESSION_POOLER_DB_URL: ${{ secrets.SUPABASE_PROD_SESSION_POOLER_DB_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_PROD_SESSION_POOLER_DB_URL"
          export PGSSLMODE=require PGCONNECT_TIMEOUT=20
          release="$RUNNER_TEMP/release"
          mkdir -p "$release/supabase/migrations"
          echo 'project_id = "submitted-batch-prod-release"' > "$release/supabase/config.toml"
          psql "$SUPABASE_PROD_SESSION_POOLER_DB_URL" -X -Atq -v ON_ERROR_STOP=1 \
            -c "begin transaction read only; select version from supabase_migrations.schema_migrations order by version; rollback;" \
            > "$RUNNER_TEMP/history-before.txt"
          while IFS= read -r version; do
            [[ "$version" =~ ^[0-9]+$ ]]
            [[ "$version" != "$TARGET_VERSION" ]]
            : > "$release/supabase/migrations/${version}_remote_history.sql"
          done < "$RUNNER_TEMP/history-before.txt"
          cp "$TARGET_PATH" "$release/$TARGET_PATH"
          (cd "$release" && npx --yes "supabase@$SUPABASE_CLI_VERSION" db push \
            --db-url "$SUPABASE_PROD_SESSION_POOLER_DB_URL" --dry-run --include-all) \
            | tee "$EVIDENCE_DIR/dry-run.txt"
          grep -q "$TARGET_VERSION" "$EVIDENCE_DIR/dry-run.txt"
          (cd "$release" && npx --yes "supabase@$SUPABASE_CLI_VERSION" db push \
            --db-url "$SUPABASE_PROD_SESSION_POOLER_DB_URL" --include-all --yes) \
            | tee "$EVIDENCE_DIR/apply.txt"
          psql "$SUPABASE_PROD_SESSION_POOLER_DB_URL" -X -Atq -v ON_ERROR_STOP=1 \
            -c "begin transaction read only; select version from supabase_migrations.schema_migrations order by version; rollback;" \
            > "$RUNNER_TEMP/history-after.txt"
          TARGET_VERSION="$TARGET_VERSION" python3 - <<'PY'
          import os
          b=set(open(os.environ['RUNNER_TEMP']+'/history-before.txt').read().split())
          a=set(open(os.environ['RUNNER_TEMP']+'/history-after.txt').read().split())
          assert sorted(a-b)==[os.environ['TARGET_VERSION']]
          PY

      - name: Verify post-apply isolation
        shell: bash
        env:
          SUPABASE_PROD_SESSION_POOLER_DB_URL: ${{ secrets.SUPABASE_PROD_SESSION_POOLER_DB_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_PROD_SESSION_POOLER_DB_URL"
          export PGSSLMODE=require PGCONNECT_TIMEOUT=20
          psql "$SUPABASE_PROD_SESSION_POOLER_DB_URL" -X -Atq -v ON_ERROR_STOP=1 <<'SQL' > "$EVIDENCE_DIR/postapply.json"
          begin transaction read only;
          select json_build_object(
            'ledger',(select count(*) from supabase_migrations.schema_migrations where version='20260824191500' and name='approval_batch_submitted_email_pdf_prod'),
            'claim',to_regprocedure('public.claim_approval_batch_submitted_events_for_dispatcher(integer,text,timestamptz)') is not null,
            'document',to_regprocedure('public.get_approval_batch_submitted_notification_document(uuid,text)') is not null,
            'cancel',to_regprocedure('public.cancel_approval_batch_submitted_event_for_dispatcher(uuid,text,text)') is not null,
            'wakeup',to_regprocedure('public.notification_approval_batch_submitted_dispatch_wakeup_internal()') is not null,
            'target_trigger',(select count(*) from pg_trigger where tgrelid='public.notification_events'::regclass and tgname='notification_approval_batch_submitted_dispatch_after_insert' and not tgisinternal),
            'anon_execute',has_function_privilege('anon','public.claim_approval_batch_submitted_events_for_dispatcher(integer,text,timestamptz)','EXECUTE'),
            'authenticated_execute',has_function_privilege('authenticated','public.claim_approval_batch_submitted_events_for_dispatcher(integer,text,timestamptz)','EXECUTE'),
            'service_execute',has_function_privilege('service_role','public.claim_approval_batch_submitted_events_for_dispatcher(integer,text,timestamptz)','EXECUTE'),
            'historical_total',(select count(*) from public.notification_events where event_type='approval_batch.submitted'),
            'historical_pending',(select count(*) from public.notification_events where event_type='approval_batch.submitted' and status='pending'),
            'historical_attempts',(select count(*) from public.notification_delivery_attempts a join public.notification_events e on e.id=a.notification_event_id where e.event_type='approval_batch.submitted'),
            'historical_digest',(select md5(coalesce(string_agg(concat_ws('|',id::text,status,attempt_count::text,coalesce(processed_at::text,''),coalesce(last_error,''),updated_at::text),'|' order by id),'')) from public.notification_events where event_type='approval_batch.submitted'),
            'submitted_batches',(select count(*) from public.approval_batches where status='submitted'),
            'receipt_wakeup_hash',md5(pg_get_functiondef('public.notification_receipt_linked_dispatch_wakeup_internal()'::regprocedure)),
            'created_wakeup_hash',md5(pg_get_functiondef('public.notification_payment_request_created_dispatch_wakeup_internal()'::regprocedure))
          );
          rollback;
          SQL
          python3 - <<'PY'
          import json, os
          pre=json.load(open(os.path.join(os.environ['EVIDENCE_DIR'],'precheck.json')))
          post=json.load(open(os.path.join(os.environ['EVIDENCE_DIR'],'postapply.json')))
          assert post['ledger']==1 and all(post[k] for k in ('claim','document','cancel','wakeup')) and post['target_trigger']==1
          assert not post['anon_execute'] and not post['authenticated_execute'] and post['service_execute']
          assert post['historical_total']==7 and post['historical_pending']==7 and post['historical_attempts']==0
          assert post['historical_digest']==pre['historical_digest'] and post['submitted_batches']==0
          assert post['receipt_wakeup_hash']==pre['receipt_wakeup_hash'] and post['created_wakeup_hash']==pre['created_wakeup_hash']
          PY

      - name: Create fresh cutoff with both gates disabled
        shell: bash
        env:
          SUPABASE_PROD_SESSION_POOLER_DB_URL: ${{ secrets.SUPABASE_PROD_SESSION_POOLER_DB_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_PROD_SESSION_POOLER_DB_URL"
          cutoff="$(date -u +'%Y-%m-%dT%H:%M:%S.%6NZ')"
          echo "ACTIVATION_CUTOFF=$cutoff" >> "$GITHUB_ENV"
          echo "$cutoff" > "$EVIDENCE_DIR/cutoff.txt"
          psql "$SUPABASE_PROD_SESSION_POOLER_DB_URL" -X -Atq -v ON_ERROR_STOP=1 \
            -v url="$FUNCTION_URL" -v cutoff="$cutoff" <<'SQL'
          begin;
          select vault.create_secret(:'url','notification_approval_batch_submitted_dispatcher_url','Submitted-batch dispatcher URL');
          select vault.create_secret(:'cutoff','notification_approval_batch_submitted_cutoff_at','Submitted-batch exclusive cutoff');
          select vault.create_secret('false','notification_approval_batch_submitted_immediate_enabled','Submitted-batch immediate gate');
          select vault.create_secret('false','notification_approval_batch_submitted_recovery_enabled','Submitted-batch recovery gate');
          commit;
          SQL

      - name: Authenticated zero-pending smoke
        shell: bash
        env:
          NOTIFICATION_DISPATCHER_SECRET: ${{ secrets.NOTIFICATION_DISPATCHER_SECRET }}
        run: |
          set -euo pipefail
          echo "::add-mask::$NOTIFICATION_DISPATCHER_SECRET"
          code="$(curl --silent --show-error --output "$EVIDENCE_DIR/smoke.json" --write-out '%{http_code}' \
            --request POST "$FUNCTION_URL" --header 'Content-Type: application/json' \
            --header "x-notification-dispatcher-secret: $NOTIFICATION_DISPATCHER_SECRET" \
            --data "{\"created_at_after\":\"$ACTIVATION_CUTOFF\",\"limit\":1}")"
          [[ "$code" -ge 200 && "$code" -lt 300 ]]
          python3 - <<'PY'
          import json, os
          x=json.load(open(os.path.join(os.environ['EVIDENCE_DIR'],'smoke.json')))
          assert x.get('mode')=='real' and x.get('event_type')=='approval_batch.submitted'
          assert all(x.get(k)==0 for k in ('processed','sent','failed','cancelled'))
          PY

      - name: Activate immediate and recovery gates
        shell: bash
        env:
          SUPABASE_PROD_SESSION_POOLER_DB_URL: ${{ secrets.SUPABASE_PROD_SESSION_POOLER_DB_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_PROD_SESSION_POOLER_DB_URL"
          psql "$SUPABASE_PROD_SESSION_POOLER_DB_URL" -X -Atq -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select vault.update_secret((select id from vault.decrypted_secrets where name='notification_approval_batch_submitted_immediate_enabled'),'true',null,'Submitted-batch immediate gate enabled');
          select vault.update_secret((select id from vault.decrypted_secrets where name='notification_approval_batch_submitted_recovery_enabled'),'true',null,'Submitted-batch recovery gate enabled');
          commit;
          SQL

      - name: Final certification
        shell: bash
        env:
          SUPABASE_PROD_SESSION_POOLER_DB_URL: ${{ secrets.SUPABASE_PROD_SESSION_POOLER_DB_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_PROD_SESSION_POOLER_DB_URL"
          psql "$SUPABASE_PROD_SESSION_POOLER_DB_URL" -X -Atq -v ON_ERROR_STOP=1 \
            -v cutoff="$ACTIVATION_CUTOFF" -v url="$FUNCTION_URL" <<'SQL' > "$EVIDENCE_DIR/final.json"
          begin transaction read only;
          select json_build_object(
            'ledger',(select count(*) from supabase_migrations.schema_migrations where version='20260824191500' and name='approval_batch_submitted_email_pdf_prod'),
            'vault_count',(select count(*) from vault.decrypted_secrets where name like 'notification_approval_batch_submitted_%'),
            'url_ok',(select decrypted_secret=:'url' from vault.decrypted_secrets where name='notification_approval_batch_submitted_dispatcher_url'),
            'cutoff_ok',(select decrypted_secret=:'cutoff' from vault.decrypted_secrets where name='notification_approval_batch_submitted_cutoff_at'),
            'immediate',(select decrypted_secret from vault.decrypted_secrets where name='notification_approval_batch_submitted_immediate_enabled'),
            'recovery',(select decrypted_secret from vault.decrypted_secrets where name='notification_approval_batch_submitted_recovery_enabled'),
            'historical_total',(select count(*) from public.notification_events where event_type='approval_batch.submitted'),
            'historical_pending',(select count(*) from public.notification_events where event_type='approval_batch.submitted' and status='pending'),
            'historical_attempts',(select count(*) from public.notification_delivery_attempts a join public.notification_events e on e.id=a.notification_event_id where e.event_type='approval_batch.submitted'),
            'after_cutoff',(select count(*) from public.notification_events where event_type='approval_batch.submitted' and created_at>:'cutoff'::timestamptz),
            'submitted_batches',(select count(*) from public.approval_batches where status='submitted')
          );
          rollback;
          SQL
          python3 - <<'PY'
          import json, os
          x=json.load(open(os.path.join(os.environ['EVIDENCE_DIR'],'final.json')))
          assert x['ledger']==1 and x['vault_count']==4 and x['url_ok'] and x['cutoff_ok']
          assert x['immediate']=='true' and x['recovery']=='true'
          assert x['historical_total']==7 and x['historical_pending']==7 and x['historical_attempts']==0
          assert x['after_cutoff']==0 and x['submitted_batches']==0
          open(os.path.join(os.environ['EVIDENCE_DIR'],'result.txt'),'w').write('PASS / APPROVAL_BATCH_SUBMITTED_EMAIL_PDF_PROD_ACTIVE / ZERO_HISTORICAL_REPLAY\n')
          PY

      - name: Emergency-disable gates on failure
        if: failure()
        shell: bash
        env:
          SUPABASE_PROD_SESSION_POOLER_DB_URL: ${{ secrets.SUPABASE_PROD_SESSION_POOLER_DB_URL }}
        run: |
          set +e
          [[ -n "$SUPABASE_PROD_SESSION_POOLER_DB_URL" ]] || exit 0
          echo "::add-mask::$SUPABASE_PROD_SESSION_POOLER_DB_URL"
          psql "$SUPABASE_PROD_SESSION_POOLER_DB_URL" -X -Atq <<'SQL'
          do $block$
          declare v uuid;
          begin
            select id into v from vault.decrypted_secrets where name='notification_approval_batch_submitted_immediate_enabled';
            if v is not null then perform vault.update_secret(v,'false',null,'Emergency disabled'); end if;
            select id into v from vault.decrypted_secrets where name='notification_approval_batch_submitted_recovery_enabled';
            if v is not null then perform vault.update_secret(v,'false',null,'Emergency disabled'); end if;
          end $block$;
          SQL
          echo 'STOP / RELEASE_FAILED / GATES_DISABLED' > "$EVIDENCE_DIR/result.txt"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: submitted-batch-prod-release-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
