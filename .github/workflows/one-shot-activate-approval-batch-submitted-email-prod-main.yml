name: Cancel superseded submitted-batch PROD activation

'on':
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-activate-approval-batch-submitted-email-prod-main.yml'

permissions:
  contents: read

concurrency:
  group: one-shot-prod-approval-batch-submitted-email-main
  cancel-in-progress: true

jobs:
  cancel_superseded_release:
    name: Cancel prior guarded one-shot before native Supabase release
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record safe cancellation
        shell: bash
        run: |
          set -euo pipefail
          echo 'PASS / SUPERSEDED_PROD_ACTIVATION_WORKFLOW_CANCELLED'
          echo 'prod_mutations_from_this_workflow=0'
