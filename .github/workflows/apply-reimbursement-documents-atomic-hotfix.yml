name: Apply reimbursement documents atomic hotfix

on:
  push:
    branches:
      - hotfix/reimbursement-documents-atomic-prod

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[reimbursement-docs-atomic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply frontend and contract changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_between(path: Path, start_marker: str, end_marker: str, replacement: str) -> None:
              text = path.read_text(encoding='utf-8')
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{path}: start marker not found')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{path}: end marker not found')
              path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          request = Path('app/src/features/solicitudes/RequestModal.tsx')
          replace_once(
              request,
              """  loadBudgetAvailability, listApproverOptions, createPaymentRequest,
            createPaymentRequestWithDocument, updateFase2Metadata, uploadReceipt, removeReceipt, loadIncidencias,
            loadActiveProfiles, loadEmployeeBankAccount, setBeneficiaryProfile,
            insertReimbursementItems,
          } from './api'""",
              """  loadBudgetAvailability, listApproverOptions,
            createPaymentRequestWithDocument, createReimbursementRequestWithDocuments,
            updateFase2Metadata, uploadReceipt, removeReceipt, loadIncidencias,
            loadActiveProfiles, loadEmployeeBankAccount,
          } from './api'""",
          )
          replace_once(
              request,
              '  EmployeeBankAccount, ReimbursementDraftItem, ReimbursementItemInsert,\n',
              '  EmployeeBankAccount, ReimbursementDraftItem, ReimbursementUpdateItem,\n',
          )
          replace_once(
              request,
              '    let stagedDocumentPath: string | null = null\n',
              '    const stagedDocumentPaths: string[] = []\n',
          )
          replace_between(
              request,
              """      let data: any
                if (isReembolso) {
                  data = await createPaymentRequest(payload)
                } else {""",
              """      const result = normalizeRpcResult<any>(data)""",
              """      let data: any
                if (isReembolso) {
                  if (!profile?.id) throw new Error('requester_profile_required')
                  const stagedItems: ReimbursementUpdateItem[] = []
                  for (const item of items) {
                    let storagePath: string | null = null
                    if (item.file) {
                      storagePath = await uploadReceipt(item.file, `solicitudes/drafts/${profile.id}`)
                      stagedDocumentPaths.push(storagePath)
                    }
                    stagedItems.push({
                      budget_category_id: item.budgetCategoryId,
                      descripcion: item.descripcion.trim(),
                      amount: numberValue(item.amount),
                      subtotal_amount: item.subtotalAmount,
                      tax_amount: item.taxAmount,
                      deducible: item.deducible,
                      invoice_uuid: item.invoiceUuid,
                      cfdi_data: item.cfdiData,
                      storage_path: storagePath,
                    })
                  }
                  data = await createReimbursementRequestWithDocuments(payload, stagedItems)
                  // El RPC ya enlazó todos los paths en la misma transacción que la
                  // solicitud y sus renglones; desde aquí dejan de ser temporales.
                  stagedDocumentPaths.length = 0
                } else {
                  if (!file || !profile?.id) throw new Error('request_document_required')
                  const stagedDocumentPath = await uploadReceipt(file, `solicitudes/drafts/${profile.id}`)
                  stagedDocumentPaths.push(stagedDocumentPath)
                  data = await createPaymentRequestWithDocument(payload, stagedDocumentPath)
                  // Desde aquí el archivo ya quedó enlazado dentro de la misma transacción
                  // que creó la solicitud; no debe eliminarse aunque falle un paso posterior.
                  stagedDocumentPaths.length = 0
                }
          """,
          )
          replace_between(
              request,
              """      // Reembolso: beneficiario + desglose. Todo posterior a la creación y no
                // bloqueante — la solicitud ya existe, así que los fallos solo se avisan.
                if (isReembolso) {""",
              """      const folio = result.request_number || result.payment_request_number || 'Solicitud'""",
              """      // En reembolso, beneficiario, renglones y comprobantes ya quedaron
                // persistidos atómicamente por create_reimbursement_request_with_documents.

          """,
          )
          replace_once(
              request,
              """      if (stagedDocumentPath) {
                try { await removeReceipt(stagedDocumentPath) } catch { /* limpieza best-effort */ }
              }""",
              """      for (const path of stagedDocumentPaths) {
                try { await removeReceipt(path) } catch { /* limpieza best-effort */ }
              }""",
          )

          api = Path('app/src/features/solicitudes/api.ts')
          replace_once(
              api,
              '  ReimbursementItemInsert, ReimbursementUpdatePayload,\n',
              '  ReimbursementItemInsert, ReimbursementUpdateItem, ReimbursementUpdatePayload,\n',
          )
          marker = """// Guarda metadata Fase 2 (request_type/payment_method). Devuelve un warning si
          """
          insert = """export async function createReimbursementRequestWithDocuments(
            payload: RequestPayload,
            items: ReimbursementUpdateItem[],
          ): Promise<any> {
            const { data, error } = await supabase.rpc('create_reimbursement_request_with_documents', {
              p_company_id: payload.company_id,
              p_cost_center_id: payload.cost_center_id,
              p_budget_month: payload.budget_month,
              p_currency: payload.currency,
              p_exchange_rate: payload.exchange_rate,
              p_description: payload.description,
              p_notes: payload.notes,
              p_requested_by: payload.requested_by,
              p_is_extraordinary_adjustment: payload.is_extraordinary_adjustment,
              p_approver_id: payload.approver_id,
              p_approver_assignment_id: payload.approver_assignment_id,
              p_beneficiary_profile_id: payload.beneficiary_profile_id,
              p_payment_method: payload.payment_method,
              p_items: items,
            })
            if (error) throw error
            return data
          }

          """
          replace_once(api, marker, insert + marker)

          types = Path('app/src/features/solicitudes/types.ts')
          replace_once(
              types,
              """// Renglón en captura (cliente). El adjunto todavía no está en Storage, así que
          // se guarda el File y se sube después de crear la solicitud.""",
              """// Renglón en captura (cliente). El File se conserva localmente hasta que todos
          // los comprobantes se suben a staging antes de crear el reembolso.""",
          )

          logic = Path('app/src/features/solicitudes/logic.ts')
          replace_once(
              logic,
              """  reimbursement_item_receipt_required: 'Cada gasto deducible debe conservar o adjuntar su comprobante.',
            reimbursement_item_invoice_uuid_duplicate: 'El desglose contiene un folio fiscal repetido.',""",
              """  reimbursement_item_receipt_required: 'Cada gasto deducible debe conservar o adjuntar su comprobante.',
            reimbursement_document_path_invalid: 'La ruta temporal del comprobante de reembolso no es válida.',
            reimbursement_document_path_duplicate: 'El mismo comprobante no puede usarse en dos renglones.',
            reimbursement_document_not_found_or_not_owned: 'El comprobante no llegó a Storage o no pertenece a tu sesión. Vuelve a seleccionarlo.',
            reimbursement_document_already_linked: 'El comprobante ya está vinculado a otra solicitud.',
            reimbursement_item_payload_invalid: 'Uno de los gastos contiene datos inválidos.',
            requester_profile_must_match_current_profile: 'La sesión no coincide con el solicitante del reembolso.',
            reimbursement_item_invoice_uuid_duplicate: 'El desglose contiene un folio fiscal repetido.',""",
          )

          test = Path('scripts/qa/reimbursement-supporting-documents-atomic.test.mjs')
          test.write_text(r'''import test from 'node:test'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'

          const requestModal = readFileSync('app/src/features/solicitudes/RequestModal.tsx', 'utf8')
          const api = readFileSync('app/src/features/solicitudes/api.ts', 'utf8')
          const types = readFileSync('app/src/features/solicitudes/types.ts', 'utf8')
          const migration = readFileSync('supabase/migrations/20260903203000_reimbursement_supporting_documents_atomic.sql', 'utf8')

          test('reimbursement uploads every selected receipt before creating the request', () => {
            assert.match(requestModal, /createReimbursementRequestWithDocuments/)
            assert.match(requestModal, /uploadReceipt\(item\.file, `solicitudes\/drafts\/\$\{profile\.id\}`\)/)
            assert.match(requestModal, /stagedDocumentPaths\.push\(storagePath\)/)
            assert.match(requestModal, /data = await createReimbursementRequestWithDocuments\(payload, stagedItems\)/)
            assert.doesNotMatch(requestModal, /data = await createPaymentRequest\(payload\)/)
            assert.doesNotMatch(requestModal, /insertReimbursementItems\(inserts\)/)
            assert.doesNotMatch(requestModal, /Comprobantes no subidos/)
          })

          test('failed staging or RPC removes every unlinked temporary object', () => {
            assert.match(requestModal, /const stagedDocumentPaths: string\[\] = \[\]/)
            assert.match(requestModal, /for \(const path of stagedDocumentPaths\)/)
            assert.match(requestModal, /await removeReceipt\(path\)/)
            assert.match(requestModal, /stagedDocumentPaths\.length = 0/)
          })

          test('api calls the dedicated atomic reimbursement RPC', () => {
            assert.match(api, /export async function createReimbursementRequestWithDocuments/)
            assert.match(api, /supabase\.rpc\('create_reimbursement_request_with_documents'/)
            assert.match(api, /p_items: items/)
            assert.match(types, /se suben a staging antes de crear el reembolso/)
          })

          test('database wrapper validates ownership and inserts request plus items in one transaction', () => {
            for (const expected of [
              'security definer',
              'reimbursement_document_not_found_or_not_owned',
              'object.owner = v_auth_user_id',
              'public.create_payment_request(',
              'insert into public.reimbursement_items',
              "p_request_type => 'reimbursement'",
              'grant execute on function public.create_reimbursement_request_with_documents',
              'to authenticated, service_role',
            ]) assert.ok(migration.toLowerCase().includes(expected.toLowerCase()), `missing ${expected}`)
            assert.match(migration, /revoke all on function[\s\S]*from public, anon/i)
          })
          '''.replace(/^          /gm, ''), encoding='utf-8')
          PY

      - name: Install React dependencies
        run: npm --prefix app ci

      - name: Run focused and regression contracts
        run: |
          node --test \
            scripts/qa/reimbursement-supporting-documents-atomic.test.mjs \
            scripts/qa/fersana-request-document-hotfix.test.mjs \
            scripts/qa/prod-reimbursement-permissions.test.mjs \
            scripts/qa/reimbursement-inline-classification-ux.test.mjs \
            scripts/qa/fonacot-no-presupuestal-prod-contract.test.mjs \
            scripts/qa/approval-batches-company-scope-contract.test.mjs \
            scripts/qa/bbva-clabe-012-routing-hotfix.test.mjs

      - name: Build production artifact
        run: npm --prefix app run build

      - name: Commit validated hotfix
        shell: bash
        run: |
          git config user.name "ramon1415"
          git config user.email "ramon@quantta.mx"
          git rm .github/workflows/apply-reimbursement-documents-atomic-hotfix.yml
          git add \
            app/src/features/solicitudes/RequestModal.tsx \
            app/src/features/solicitudes/api.ts \
            app/src/features/solicitudes/logic.ts \
            app/src/features/solicitudes/types.ts \
            scripts/qa/reimbursement-supporting-documents-atomic.test.mjs \
            supabase/migrations/20260903203000_reimbursement_supporting_documents_atomic.sql
          git commit -m "fix(reembolsos): crear solicitud y comprobantes atómicamente [reimbursement-docs-atomic]"
          git push origin HEAD:hotfix/reimbursement-documents-atomic-prod
