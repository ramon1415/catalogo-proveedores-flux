name: Temporary finish 01C PROD migrations from main

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_tmp_finish_01c_prod_migrations_main.yml

permissions:
  contents: read

env:
  AUTHORIZED_BASE: 783ea021a2b41bec86ee0d07fcee14e075cf2468
  EXPECTED_PROD_REF: ucantptjhwttexzmslvm
  FORBIDDEN_DEV_REF: scsirgbuqjcwoaxfacth
  CLI_VERSION: 2.45.4

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: supabase-production
    timeout-minutes: 25
    env:
      SUPABASE_PROD_SESSION_POOLER_DB_URL: ${{ secrets.SUPABASE_PROD_SESSION_POOLER_DB_URL }}
      SUPABASE_PROJECT_REF_PROD: ${{ vars.SUPABASE_PROJECT_REF_PROD }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard source and PROD endpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          git merge-base --is-ancestor "$AUTHORIZED_BASE" HEAD
          test -n "${SUPABASE_PROD_SESSION_POOLER_DB_URL:-}"
          if [[ -n "${SUPABASE_PROJECT_REF_PROD:-}" ]]; then
            test "$SUPABASE_PROJECT_REF_PROD" = "$EXPECTED_PROD_REF"
          fi
          echo "::add-mask::$SUPABASE_PROD_SESSION_POOLER_DB_URL"
          python3 - <<'PY'
          import os, urllib.parse
          raw=os.environ['SUPABASE_PROD_SESSION_POOLER_DB_URL']
          p=urllib.parse.urlsplit(raw)
          valid=(p.scheme in ('postgres','postgresql')
                 and (p.hostname or '').lower().endswith('.pooler.supabase.com')
                 and p.port==5432
                 and urllib.parse.unquote(p.username or '')==f"postgres.{os.environ['EXPECTED_PROD_REF']}"
                 and bool(urllib.parse.unquote(p.password or ''))
                 and os.environ['FORBIDDEN_DEV_REF'] not in urllib.parse.unquote(raw))
          if not valid: raise SystemExit('PROD_SESSION_POOLER_IDENTITY_INVALID')
          PY
          test "$(find supabase/migrations -maxdepth 1 -type f -name '2026080503000[1-4]_*.sql' | wc -l)" -eq 4

      - name: Install clients
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          npx --yes "supabase@$CLI_VERSION" --version | tee "$RUNNER_TEMP/supabase-version.txt"

      - name: Strict PROD precheck
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/01c-prod-evidence"; mkdir -p "$E"
          cp "$RUNNER_TEMP/supabase-version.txt" "$E/"
          PGSSLMODE=require PGCONNECT_TIMEOUT=20 psql "$SUPABASE_PROD_SESSION_POOLER_DB_URL" -X -Atq -v ON_ERROR_STOP=1 <<'SQL' > "$E/precheck.txt"
          begin transaction read only;
          select 'm036='||count(*) from supabase_migrations.schema_migrations where version='20260805030000';
          select 'm037_040='||count(*) from supabase_migrations.schema_migrations where version between '20260805030001' and '20260805030004';
          select 'authorizations='||count(*) from public.payment_request_extraordinary_authorizations;
          select 'domain_events='||count(*) from public.payment_request_extraordinary_events;
          select 'policies_absent='||(to_regclass('public.extraordinary_payment_policies') is null)::text;
          select 'faculties_absent='||(to_regclass('public.extraordinary_profile_faculties') is null)::text;
          select 'bucket_absent='||(not exists(select 1 from storage.buckets where id='extraordinary-authorizations'))::text;
          select 'requests='||count(*) from public.payment_requests;
          select 'layouts='||count(*) from public.payment_layouts;
          select 'layout_lines='||count(*) from public.payment_layout_lines;
          select 'receipts='||count(*) from public.payment_receipts;
          select 'notification_events='||count(*) from public.notification_events;
          select 'notification_attempts='||count(*) from public.notification_delivery_attempts;
          rollback;
          SQL
          for expected in m036=1 m037_040=0 authorizations=0 domain_events=1 policies_absent=true faculties_absent=true bucket_absent=true requests=2 layouts=1 layout_lines=1 receipts=0 notification_events=0 notification_attempts=0; do grep -qx "$expected" "$E/precheck.txt"; done

      - name: Build isolated migration workspace
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/01c-workdir"; mkdir -p "$W/supabase/migrations"
          printf 'project_id = "%s"\n' "$EXPECTED_PROD_REF" > "$W/supabase/config.toml"
          for version in 20260805030001 20260805030002 20260805030003 20260805030004; do
            file="$(find supabase/migrations -maxdepth 1 -type f -name "${version}_*.sql" -print -quit)"
            test -n "$file"; cp "$file" "$W/supabase/migrations/"
          done
          find "$W/supabase/migrations" -type f -name '*.sql' -printf '%f\n' | sort > "$RUNNER_TEMP/01c-prod-evidence/local-migrations.txt"
          test "$(wc -l < "$RUNNER_TEMP/01c-prod-evidence/local-migrations.txt")" -eq 4

      - name: Official Supabase CLI dry-run
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/01c-workdir"; O="$RUNNER_TEMP/01c-prod-evidence/dry-run.txt"
          npx --yes "supabase@$CLI_VERSION" --workdir "$W" --yes db push --db-url "$SUPABASE_PROD_SESSION_POOLER_DB_URL" --include-all --dry-run 2>&1 | tee "$O"
          for version in 20260805030001 20260805030002 20260805030003 20260805030004; do grep -q "$version" "$O"; done
          ! grep -q '20260805030000' "$O"

      - name: Apply official migrations 037 through 040
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/01c-workdir"; O="$RUNNER_TEMP/01c-prod-evidence/apply.txt"
          npx --yes "supabase@$CLI_VERSION" --workdir "$W" --yes db push --db-url "$SUPABASE_PROD_SESSION_POOLER_DB_URL" --include-all 2>&1 | tee "$O"

      - name: Final certification
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/01c-prod-evidence"
          PGSSLMODE=require PGCONNECT_TIMEOUT=20 psql "$SUPABASE_PROD_SESSION_POOLER_DB_URL" -X -Atq -v ON_ERROR_STOP=1 <<'SQL' > "$E/postcheck.txt"
          begin transaction read only;
          select 'migration='||version||':'||name from supabase_migrations.schema_migrations where version between '20260805030000' and '20260805030004' order by version;
          select 'migration_count='||count(*) from supabase_migrations.schema_migrations where version between '20260805030000' and '20260805030004';
          select 'authorizations='||count(*) from public.payment_request_extraordinary_authorizations;
          select 'policies='||count(*) from public.extraordinary_payment_policies;
          select 'faculties='||count(*) from public.extraordinary_profile_faculties;
          select 'faculty_events='||count(*) from public.extraordinary_profile_faculty_events;
          select 'bucket='||count(*) from storage.buckets where id='extraordinary-authorizations' and public=false and file_size_limit=5242880;
          select 'bucket_objects='||count(*) from storage.objects where bucket_id='extraordinary-authorizations';
          select 'finance_release_columns='||count(*) from information_schema.columns where table_schema='public' and table_name='approval_batch_items' and column_name like 'finance_release%';
          select 'faculty_rpc='||(to_regprocedure('public.set_extraordinary_profile_faculty(uuid,uuid,boolean,text)') is not null)::text;
          select 'current_faculty_rpc='||(to_regprocedure('public.current_extraordinary_faculty_company_ids()') is not null)::text;
          select 'requests='||count(*) from public.payment_requests;
          select 'layouts='||count(*) from public.payment_layouts;
          select 'layout_lines='||count(*) from public.payment_layout_lines;
          select 'receipts='||count(*) from public.payment_receipts;
          select 'notification_events='||count(*) from public.notification_events;
          select 'notification_attempts='||count(*) from public.notification_delivery_attempts;
          rollback;
          SQL
          for expected in migration_count=5 authorizations=0 policies=0 faculties=0 faculty_events=0 bucket=1 bucket_objects=0 finance_release_columns=4 faculty_rpc=true current_faculty_rpc=true requests=2 layouts=1 layout_lines=1 receipts=0 notification_events=0 notification_attempts=0; do grep -qx "$expected" "$E/postcheck.txt"; done
          printf '%s\n' 'PASS / M037_M038_M039_M040_APPLIED / OFFICIAL_LEDGER_REGISTERED / NOTIFICATION_DELTA_ZERO' > "$E/result.txt"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraordinary-01c-prod-migrations
          path: ${{ runner.temp }}/01c-prod-evidence
          if-no-files-found: error
          retention-days: 14
