name: Supabase PROD Read-only Schema Audit

on:
  workflow_dispatch:
    inputs:
      confirm_prod:
        description: "Type the PROD Supabase project ref to confirm the target"
        required: true
        type: string
      confirm_mode:
        description: "Type audit to confirm this workflow only runs read-only metadata checks"
        required: true
        default: "audit"
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-prod-readonly-schema-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Supabase PROD read-only schema audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-production

    env:
      SUPABASE_AUDIT_DB_URL: ${{ secrets.SUPABASE_PROD_AUDIT_DB_URL }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_REF_PROD }}
      CONFIRM_PROD: ${{ inputs.confirm_prod }}
      CONFIRM_MODE: ${{ inputs.confirm_mode }}

    steps:
      - name: Validate audit guardrails
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p audit-output
          GUARDRAILS_REPORT="audit-output/guardrails.md"
          {
            echo "# Supabase PROD read-only schema audit guardrails"
            echo ""
            echo "- Environment: supabase-production"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Mode requested: ${CONFIRM_MODE}"
            echo "- Connection mode: audit_db_url/pooler secret"
            echo "- Writes: not executed by this workflow"
            echo "- db push: not executed by this workflow"
            echo "- migration repair: not executed by this workflow"
            echo "- n8n: not touched by this workflow"
            echo ""
          } > "${GUARDRAILS_REPORT}"

          fail_guardrail() {
            local message="$1"
            echo "::error::${message}"
            echo "- Result: FAILED - ${message}" >> "${GUARDRAILS_REPORT}"
            exit 1
          }

          if [ "${GITHUB_REF_NAME}" != "dev" ]; then
            fail_guardrail "This workflow is restricted to the dev branch."
          fi

          if [ "${CONFIRM_MODE}" != "audit" ]; then
            fail_guardrail "confirm_mode must be exactly: audit"
          fi

          if [ -z "${SUPABASE_PROJECT_ID}" ]; then
            fail_guardrail "SUPABASE_PROJECT_REF_PROD environment variable is not configured."
          fi

          if [ "${CONFIRM_PROD}" != "${SUPABASE_PROJECT_ID}" ]; then
            fail_guardrail "confirm_prod does not match the configured PROD project ref."
          fi

          if [ -z "${SUPABASE_AUDIT_DB_URL}" ]; then
            fail_guardrail "Missing SUPABASE_PROD_AUDIT_DB_URL in environment supabase-production."
          fi

          echo "Guardrails passed. Running read-only metadata audit only."
          echo "- Result: PASSED" >> "${GUARDRAILS_REPORT}"

      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Record audit guardrails evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          {
            echo "# Supabase PROD read-only schema audit guardrails"
            echo ""
            echo "- Environment: supabase-production"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Mode requested: ${CONFIRM_MODE}"
            echo "- Result: PASSED"
            echo "- Connection mode: audit_db_url/pooler secret"
            echo "- Writes: not executed by this workflow"
            echo "- db push: not executed by this workflow"
            echo "- migration repair: not executed by this workflow"
            echo "- n8n: not touched by this workflow"
          } > audit-output/guardrails.md

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Run read-only metadata audit
        shell: bash
        env:
          PGCONNECT_TIMEOUT: "15"
          PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=15000"
        run: |
          set -uo pipefail

          mkdir -p audit-output
          REPORT="audit-output/supabase-prod-readonly-schema-audit.md"
          NETWORK_REPORT="audit-output/network-diagnostics.md"
          QUERY_LOG="audit-output/query-execution-log.md"
          PSQL_URI="${SUPABASE_AUDIT_DB_URL}"
          AUDIT_FAILED=0
          QUERY_INDEX=0

          sanitize_file() {
            local file="$1"
            sed -E \
              -e 's#postgres(ql)?://[^[:space:]]+#postgres://[redacted]#g' \
              -e 's#://[^:/[:space:]]+:[^@[:space:]]+@#://[redacted-user]:[redacted-password]@#g' \
              -e 's#(password=)[^[:space:]]+#\1[redacted]#Ig' \
              -e 's#(apikey=)[^[:space:]]+#\1[redacted]#Ig' \
              -e 's#(access_token=)[^[:space:]]+#\1[redacted]#Ig' \
              -e 's#(SUPABASE_PROD_AUDIT_DB_URL=)[^[:space:]]+#\1[redacted]#Ig' \
              "${file}" || true
          }

          mapfile -t AUDIT_CONN_INFO < <(python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ.get("SUPABASE_AUDIT_DB_URL", "")
          host = ""
          port = "5432"
          mode = "audit_db_url"

          try:
              parsed = urlparse(url)
              host = parsed.hostname or ""
              port = str(parsed.port or 5432)
              if "pooler" in host:
                  mode = "pooler/session"
          except Exception:
              host = ""
              port = "5432"
              mode = "invalid"

          def mask_host(value):
              if not value:
                  return "not parsed"
              if len(value) <= 12:
                  return "[redacted-host]"
              return f"{value[:4]}...{value[-12:]}"

          print(host)
          print(mask_host(host))
          print(port)
          print(mode)
          PY
          )

          AUDIT_HOST="${AUDIT_CONN_INFO[0]:-}"
          AUDIT_HOST_MASKED="${AUDIT_CONN_INFO[1]:-not parsed}"
          AUDIT_PORT="${AUDIT_CONN_INFO[2]:-5432}"
          AUDIT_MODE="${AUDIT_CONN_INFO[3]:-audit_db_url}"

          {
            echo "# Supabase PROD read-only schema audit"
            echo ""
            echo "- Environment: supabase-production"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Mode: audit only"
            echo "- Project ref: ${SUPABASE_PROJECT_ID}"
            echo "- Connection mode: ${AUDIT_MODE}"
            echo "- Host: ${AUDIT_HOST_MASKED}"
            echo "- Port: ${AUDIT_PORT}"
            echo "- DB user: configured in audit URL and not printed"
            echo "- Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Writes: not executed by this workflow"
            echo "- db push: not executed by this workflow"
            echo "- migration repair: not executed by this workflow"
            echo "- n8n: not touched by this workflow"
            echo ""
          } > "${REPORT}"

          {
            echo "# Supabase PROD network diagnostics"
            echo ""
            echo "- Connection mode: ${AUDIT_MODE}"
            echo "- Host: ${AUDIT_HOST_MASKED}"
            echo "- Port: ${AUDIT_PORT}"
            echo "- Project ref: ${SUPABASE_PROJECT_ID}"
            echo "- Connection string: redacted; password is never written"
            echo "- Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
          } > "${NETWORK_REPORT}"

          if [ -z "${AUDIT_HOST}" ]; then
            echo "::error::Could not parse a host from SUPABASE_PROD_AUDIT_DB_URL."
            {
              echo "## Audit failed before psql"
              echo ""
              echo "- Last logical command: audit DB URL host parsing"
              echo "- Error: Could not parse a host from SUPABASE_PROD_AUDIT_DB_URL."
            } >> "${REPORT}"
            AUDIT_FAILED=1
          else
            if timeout 5 bash -c "cat < /dev/null > /dev/tcp/${AUDIT_HOST}/${AUDIT_PORT}" 2> audit-output/tcp-check.err; then
              echo "- TCP check: reachable" >> "${NETWORK_REPORT}"
            else
              echo "- TCP check: failed" >> "${NETWORK_REPORT}"
              {
                echo "## TCP check stderr"
                echo '```'
                sanitize_file audit-output/tcp-check.err
                echo '```'
              } >> "${NETWORK_REPORT}"
            fi
          fi

          {
            echo "# Supabase PROD query execution log"
            echo ""
            echo "Every query in this log is metadata/read-only."
            echo ""
          } > "${QUERY_LOG}"

          run_query() {
            local title="$1"
            local query="$2"
            QUERY_INDEX=$((QUERY_INDEX + 1))
            local stdout_file="audit-output/query-${QUERY_INDEX}-stdout.txt"
            local stderr_file="audit-output/query-${QUERY_INDEX}-stderr.txt"

            {
              echo "## ${title}"
              echo ""
              echo "- Query index: ${QUERY_INDEX}"
              echo '```'
            } >> "${REPORT}"

            {
              echo "## ${QUERY_INDEX}. ${title}"
              echo ""
              echo "Logical query:"
              echo '```sql'
              echo "${query}"
              echo '```'
              echo ""
            } >> "${QUERY_LOG}"

            if psql --no-psqlrc "${PSQL_URI}" -v ON_ERROR_STOP=1 -v VERBOSITY=verbose --echo-errors -P pager=off -c "${query}" > "${stdout_file}" 2> "${stderr_file}"; then
              sanitize_file "${stdout_file}" >> "${REPORT}"
              {
                echo '```'
                echo ""
                echo "- Result: success"
                echo ""
              } >> "${REPORT}"
              echo "- Result: success" >> "${QUERY_LOG}"
            else
              local exit_code="$?"
              AUDIT_FAILED=1
              sanitize_file "${stdout_file}" >> "${REPORT}"
              {
                echo '```'
                echo ""
                echo "- Result: failed"
                echo "- Exit code: ${exit_code}"
                echo "- Last logical query: ${title}"
                echo ""
                echo "stderr:"
                echo '```'
                sanitize_file "${stderr_file}"
                echo '```'
                echo ""
              } >> "${REPORT}"
              {
                echo "- Result: failed"
                echo "- Exit code: ${exit_code}"
                echo ""
                echo "stderr:"
                echo '```'
                sanitize_file "${stderr_file}"
                echo '```'
                echo ""
              } >> "${QUERY_LOG}"
              echo "::error::Read-only metadata query failed: ${title}"
            fi
          }

          if [ "${AUDIT_FAILED}" -eq 0 ]; then
            run_query "Connection identity" "select current_database() as current_database, current_user as current_user, now() as checked_at;"
          fi

          if [ "${AUDIT_FAILED}" -eq 0 ]; then
            run_query "Schema migrations table status" "select case when to_regclass('supabase_migrations.schema_migrations') is null then 'missing' else 'present' end as schema_migrations_table_status;"
          fi

          if [ "${AUDIT_FAILED}" -eq 0 ]; then
            migrations_status="$(psql --no-psqlrc "${PSQL_URI}" -v ON_ERROR_STOP=1 -v VERBOSITY=verbose --echo-errors -Atq -c "select case when to_regclass('supabase_migrations.schema_migrations') is null then 'missing' else 'present' end;" 2> audit-output/schema-migrations-status-stderr.txt)"
            status_exit_code="$?"
            if [ "${status_exit_code}" -ne 0 ]; then
              AUDIT_FAILED=1
              {
                echo "## Supabase migration history status failed"
                echo ""
                echo "- Exit code: ${status_exit_code}"
                echo "- Last logical query: schema_migrations table status"
                echo ""
                echo "stderr:"
                echo '```'
                sanitize_file audit-output/schema-migrations-status-stderr.txt
                echo '```'
                echo ""
              } >> "${REPORT}"
              echo "::error::Could not determine schema_migrations status."
            else
              {
                echo "## Supabase migration history"
                echo '```'
              } >> "${REPORT}"
              if [ "${migrations_status}" = "present" ]; then
                history_stdout="audit-output/schema-migrations-history-stdout.txt"
                history_stderr="audit-output/schema-migrations-history-stderr.txt"
                if psql --no-psqlrc "${PSQL_URI}" -v ON_ERROR_STOP=1 -v VERBOSITY=verbose --echo-errors -P pager=off -c "select * from supabase_migrations.schema_migrations order by version;" > "${history_stdout}" 2> "${history_stderr}"; then
                  sanitize_file "${history_stdout}" >> "${REPORT}"
                else
                  history_exit_code="$?"
                  AUDIT_FAILED=1
                  sanitize_file "${history_stdout}" >> "${REPORT}"
                  {
                    echo '```'
                    echo ""
                    echo "- Result: failed"
                    echo "- Exit code: ${history_exit_code}"
                    echo "- Last logical query: schema_migrations history"
                    echo ""
                    echo "stderr:"
                    echo '```'
                    sanitize_file "${history_stderr}"
                    echo '```'
                    echo ""
                  } >> "${REPORT}"
                  echo "::error::Could not read schema_migrations history."
                fi
              else
                echo "supabase_migrations.schema_migrations is missing" >> "${REPORT}"
              fi
              {
                echo '```'
                echo ""
              } >> "${REPORT}"
            fi
          else
            {
              echo "## Supabase migration history"
              echo ""
              echo "Skipped because an earlier read-only connection/query failed."
              echo ""
            } >> "${REPORT}"
          fi

          if [ "${AUDIT_FAILED}" -eq 0 ]; then
            run_query "Public tables" "select table_schema, table_name from information_schema.tables where table_schema = 'public' order by table_name;"
            run_query "Public views" "select table_schema, table_name from information_schema.views where table_schema = 'public' order by table_name;"
            run_query "Public functions" "select p.oid::regprocedure::text as function_signature from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' order by function_signature;"
            run_query "Public table RLS flags" "select c.relname as table_name, c.relrowsecurity as rls_enabled from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'r' order by c.relname;"
            run_query "Public policies" "select schemaname, tablename, policyname, roles, cmd from pg_policies where schemaname = 'public' order by tablename, policyname;"
          else
            {
              echo "## Public schema metadata"
              echo ""
              echo "Skipped because an earlier read-only connection/query failed."
              echo ""
            } >> "${REPORT}"
          fi

          if [ "${AUDIT_FAILED}" -eq 0 ]; then
            storage_status="$(psql --no-psqlrc "${PSQL_URI}" -v ON_ERROR_STOP=1 -v VERBOSITY=verbose --echo-errors -Atq -c "select case when to_regclass('storage.buckets') is null then 'missing' else 'present' end;" 2> audit-output/storage-status-stderr.txt)"
            storage_exit_code="$?"
            {
              echo "## Storage buckets"
              echo '```'
            } >> "${REPORT}"
            if [ "${storage_exit_code}" -ne 0 ]; then
              AUDIT_FAILED=1
              {
                echo '```'
                echo ""
                echo "- Result: failed"
                echo "- Exit code: ${storage_exit_code}"
                echo "- Last logical query: storage.buckets status"
                echo ""
                echo "stderr:"
                echo '```'
                sanitize_file audit-output/storage-status-stderr.txt
                echo '```'
                echo ""
              } >> "${REPORT}"
              echo "::error::Could not determine storage.buckets status."
            elif [ "${storage_status}" = "present" ]; then
              buckets_stdout="audit-output/storage-buckets-stdout.txt"
              buckets_stderr="audit-output/storage-buckets-stderr.txt"
              if psql --no-psqlrc "${PSQL_URI}" -v ON_ERROR_STOP=1 -v VERBOSITY=verbose --echo-errors -P pager=off -c "select id, name, public from storage.buckets order by name;" > "${buckets_stdout}" 2> "${buckets_stderr}"; then
                sanitize_file "${buckets_stdout}" >> "${REPORT}"
                {
                  echo '```'
                  echo ""
                } >> "${REPORT}"
              else
                buckets_exit_code="$?"
                AUDIT_FAILED=1
                sanitize_file "${buckets_stdout}" >> "${REPORT}"
                {
                  echo '```'
                  echo ""
                  echo "- Result: failed"
                  echo "- Exit code: ${buckets_exit_code}"
                  echo "- Last logical query: storage buckets"
                  echo ""
                  echo "stderr:"
                  echo '```'
                  sanitize_file "${buckets_stderr}"
                  echo '```'
                  echo ""
                } >> "${REPORT}"
                echo "::error::Could not read storage buckets."
              fi
            else
              echo "storage.buckets is missing" >> "${REPORT}"
              {
                echo '```'
                echo ""
              } >> "${REPORT}"
            fi
          else
            {
              echo "## Storage buckets"
              echo ""
              echo "Skipped because an earlier read-only connection/query failed."
              echo ""
            } >> "${REPORT}"
          fi

          if [ "${AUDIT_FAILED}" -eq 0 ]; then
            run_query "Critical object presence" "select object_name, to_regclass(object_name) is not null as exists from (values ('public.profiles'), ('public.roles'), ('public.user_roles'), ('public.suppliers'), ('public.payment_requests'), ('public.payment_layouts'), ('public.payment_layout_lines'), ('public.payment_receipts'), ('public.historical_actuals'), ('public.notification_events'), ('public.notification_delivery_attempts')) as critical_objects(object_name) order by object_name;"
          else
            {
              echo "## Critical object presence"
              echo ""
              echo "Skipped because an earlier read-only connection/query failed."
              echo ""
            } >> "${REPORT}"
          fi

          unset PSQL_URI SUPABASE_AUDIT_DB_URL
          {
            echo ""
            echo "## Final audit result"
            echo ""
            if [ "${AUDIT_FAILED}" -eq 0 ]; then
              echo "- Result: success"
            else
              echo "- Result: failed"
              echo "- Evidence: see artifact files for sanitized stdout/stderr and network diagnostics."
            fi
          } >> "${REPORT}"

          cat "${REPORT}" >> "${GITHUB_STEP_SUMMARY}"

          if [ "${AUDIT_FAILED}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-prod-readonly-audit-evidence
          path: audit-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize audit controls
        if: always()
        shell: bash
        run: |
          {
            echo "## Audit controls"
            echo ""
            echo "- Environment: supabase-production"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Mode: audit only"
            echo "- Connection mode: audit_db_url/pooler secret"
            echo "- Real db push: not executed by this workflow"
            echo "- Migration repair: not executed by this workflow"
            echo "- Writes/destructive SQL: not executed by this workflow"
            echo "- n8n: not touched by this workflow"
          } >> "${GITHUB_STEP_SUMMARY}"
