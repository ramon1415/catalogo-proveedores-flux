<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso pendiente | Flux</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#07071a;color:#eeeef6;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:#111128;border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:40px 36px;max-width:440px;width:100%;text-align:center}
    .icon{width:52px;height:52px;border-radius:14px;background:rgba(245,158,11,.13);border:1px solid rgba(245,158,11,.28);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 20px}
    h1{font-size:18px;font-weight:700;margin-bottom:8px}
    p{font-size:13px;color:#aaaac3;line-height:1.6;margin-bottom:24px}
    .email{display:inline-block;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;color:#eeeef6;margin-bottom:24px}
    .btn{display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 18px;border-radius:9px;border:1px solid rgba(255,255,255,.13);background:transparent;color:#aaaac3;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .btn:hover{background:rgba(255,255,255,.04);color:#eeeef6}
    .brand-logo{width:200px;max-width:70%;height:auto;display:block;margin:0 auto 26px}
    .powered{font-size:11px;color:#50506a;text-align:center;margin-top:26px;letter-spacing:.3px}
    .powered span{color:#8888aa;font-weight:600}
  </style>
</head>
<body>
  <div class="card">
    <img class="brand-logo" src="./assets/logo-flux-blanco.webp" alt="Flux">
    <h1>Acceso pendiente de aprobación</h1>
    <p>Tu cuenta fue registrada pero aún no tiene un rol asignado. Un administrador debe aprobar tu acceso antes de que puedas usar la Plataforma de Gestión.</p>
    <div class="email" id="pendingEmail">—</div>
    <br>
    <button class="btn" id="logoutBtn">Cerrar sesión y volver</button>
    <p class="powered">Powered by <span>Quantta</span></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js?v=20260617-shell-skeleton"></script>
  <script>
    (async () => {
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      const { data: { session } } = await client.auth.getSession()
      if (!session) { window.location.href = "./index.html"; return }

      // Si ya tiene rol, redirigir al destino correcto
      if (window.FluxAuth?.ready) await window.FluxAuth.ready()
      if (!window.FluxAuth?.isPending()) {
        window.location.href = window.FluxAuth?.defaultRedirect?.() || "./solicitudes.html"
        return
      }

      document.getElementById("pendingEmail").textContent = session.user.email || ""
      document.getElementById("logoutBtn").addEventListener("click", async () => {
        await client.auth.signOut()
        window.location.href = "./index.html"
      })
    })()
  </script>
</body>
</html>
