<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forms Preview</title>
<style>
  :root {
    --bg:#07071a;--bg-surface:#0d0d22;--bg-card:#111128;--bg-hover:rgba(255,255,255,.035);
    --border:rgba(255,255,255,.07);--border-strong:rgba(255,255,255,.13);
    --accent:#0f766e;--accent-dim:rgba(15,118,110,.14);--accent-text:#5eead4;
    --emerald:#12b76a;--emerald-dim:rgba(18,183,106,.12);
    --ruby:#e03e52;--ruby-dim:rgba(224,62,82,.11);
    --sky:#2e90fa;--sky-dim:rgba(46,144,250,.11);
    --amber:#f59e0b;--amber-dim:rgba(245,158,11,.13);
    --text-1:#eeeef6;--text-2:#aaaac3;--text-3:#666680;
    --shadow-lg:0 18px 60px rgba(0,0,0,.68);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text-1);font-family:'Plus Jakarta Sans','Inter',sans-serif;font-size:13.5px;padding:40px 48px;display:flex;gap:48px;align-items:flex-start}
  h2.col-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--text-3);margin-bottom:16px}

  .modal-wrap{width:520px;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden}
  .modal-top{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start}
  .modal-top h1{font-size:15px;font-weight:700}
  .modal-top p{font-size:11.5px;color:var(--text-3);margin-top:3px}
  .close-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--text-3);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
  .modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
  .primary-btn{min-height:32px;padding:6px 16px;border:none;border-radius:7px;background:linear-gradient(135deg,var(--accent),#0d9488);color:#fff;font-size:12px;font-weight:700;cursor:pointer}
  .secondary-btn{min-height:32px;padding:6px 12px;border:1px solid var(--border-strong);border-radius:7px;background:transparent;color:var(--text-2);font-size:12px;font-weight:700;cursor:pointer}

  /* ══ ANTES ══ */
  .old-body{padding:20px 24px;display:flex;flex-direction:column;gap:16px}
  .old-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .old-grid label{display:flex;flex-direction:column;gap:5px;font-size:10.5px;font-weight:700;color:var(--text-3);letter-spacing:.35px;text-transform:uppercase}
  .old-grid label.full{grid-column:1/-1}
  .old-ctrl{min-height:36px;padding:0 11px;background:var(--bg-surface);border:1px solid var(--border);border-radius:7px;color:var(--text-2);font-size:12.5px;outline:none;width:100%}
  .old-ctrl:focus{border-color:var(--accent)}
  textarea.old-ctrl{padding:9px 11px;resize:vertical;min-height:72px}
  .old-ctrl.error{border-color:var(--ruby)}

  /* ══ NUEVO ══ */
  .form-body{padding:20px 24px;display:flex;flex-direction:column;gap:20px}

  /* sección dentro del form */
  .form-section{display:flex;flex-direction:column;gap:12px}
  .form-section-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.65px;color:var(--text-3);padding-bottom:8px;border-bottom:1px solid var(--border)}

  /* grid de campos */
  .fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fg.cols-1{grid-template-columns:1fr}
  .fg label{display:flex;flex-direction:column;gap:5px}
  .fg label.full{grid-column:1/-1}

  /* label text */
  .f-label{font-size:10.5px;font-weight:700;color:var(--text-3);letter-spacing:.3px;display:flex;align-items:center;gap:4px}
  .f-req{color:var(--accent-text);font-size:10px}

  /* inputs */
  .f-ctrl{min-height:34px;padding:0 10px;background:var(--bg-surface);border:1px solid var(--border);border-radius:7px;color:var(--text-1);font-size:12.5px;outline:none;width:100%;transition:border-color 120ms}
  .f-ctrl::placeholder{color:var(--text-3)}
  .f-ctrl:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
  .f-ctrl.error{border-color:var(--ruby)}
  .f-ctrl.error:focus{box-shadow:0 0 0 2px var(--ruby-dim)}
  textarea.f-ctrl{padding:8px 10px;resize:vertical;min-height:68px}

  /* hint bajo el campo */
  .f-hint{font-size:10.5px;color:var(--text-3);margin-top:2px}
  .f-hint.error{color:var(--ruby)}

  /* checkbox card */
  .check-card{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--bg-surface)}
  .check-card:hover{border-color:var(--border-strong)}
  .check-card input{width:14px;height:14px;accent-color:var(--accent);flex-shrink:0}
  .check-card-text{display:flex;flex-direction:column;gap:1px}
  .check-card-label{font-size:12px;font-weight:700;color:var(--text-1)}
  .check-card-desc{font-size:10.5px;color:var(--text-3)}

  /* campo con búsqueda + select dependiente */
  .f-search-group{display:flex;flex-direction:column;gap:6px}
</style>
</head>
<body>

<!-- ══ ANTES ══ -->
<div>
  <h2 class="col-label">Antes — labels en caps, sin secciones, sin hints</h2>
  <div class="modal-wrap">
    <div class="modal-top">
      <div><h1>Nueva solicitud de pago</h1><p>Completa los campos requeridos.</p></div>
      <button class="close-btn">✕</button>
    </div>
    <div class="old-body">
      <div class="old-grid">
        <label>Empresa *<select class="old-ctrl"><option>Operadora Tlacatecpan</option></select></label>
        <label>Centro de costo *<select class="old-ctrl"><option>Rancho San Juan</option></select></label>
        <label class="full">Partida presupuestal *<select class="old-ctrl"><option>602-08-011-000 – Arrendamiento Pick Up JAC</option></select></label>
        <label>Mes presupuestal *<input class="old-ctrl" type="month" value="2026-06"></label>
        <label>Buscar proveedor<input class="old-ctrl" type="search" placeholder="Alias, razon social o RFC"></label>
        <label class="full">Proveedor *<select class="old-ctrl"><option>Carlos Arceo</option></select></label>
      </div>
      <div class="old-grid">
        <label>Monto solicitado *<input class="old-ctrl error" type="number" placeholder="0.00"></label>
        <label>Moneda *<select class="old-ctrl"><option>MXN</option></select></label>
        <label>Tipo de cambio *<input class="old-ctrl" type="number" value="1"></label>
      </div>
      <div class="old-grid">
        <label class="full">Descripcion *<textarea class="old-ctrl">solicitud</textarea></label>
        <label class="full">Notas<textarea class="old-ctrl" placeholder="Notas internas opcionales..."></textarea></label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="secondary-btn">Cancelar</button>
      <button class="primary-btn">Guardar solicitud</button>
    </div>
  </div>
</div>

<!-- ══ NUEVO ══ -->
<div>
  <h2 class="col-label">Propuesta — secciones, hints, estados de error, checkbox card</h2>
  <div class="modal-wrap">
    <div class="modal-top">
      <div><h1>Nueva solicitud de pago</h1><p>Completa los campos requeridos.</p></div>
      <button class="close-btn">✕</button>
    </div>
    <div class="form-body">

      <!-- Sección 1 -->
      <div class="form-section">
        <div class="form-section-title">Presupuesto</div>
        <div class="fg">
          <label>
            <span class="f-label">Empresa <span class="f-req">*</span></span>
            <select class="f-ctrl"><option>Operadora Tlacatecpan</option></select>
          </label>
          <label>
            <span class="f-label">Centro de costo <span class="f-req">*</span></span>
            <select class="f-ctrl"><option>Rancho San Juan</option></select>
          </label>
          <label class="full">
            <span class="f-label">Partida presupuestal <span class="f-req">*</span></span>
            <select class="f-ctrl"><option>602-08-011-000 – Arrendamiento Pick Up JAC</option></select>
          </label>
          <label>
            <span class="f-label">Mes presupuestal <span class="f-req">*</span></span>
            <input class="f-ctrl" type="month" value="2026-06">
          </label>
        </div>
      </div>

      <!-- Sección 2 -->
      <div class="form-section">
        <div class="form-section-title">Proveedor</div>
        <div class="fg">
          <label class="full">
            <span class="f-label">Buscar proveedor</span>
            <input class="f-ctrl" type="search" placeholder="Nombre, RFC o alias...">
            <span class="f-hint">Filtra la lista de abajo</span>
          </label>
          <label class="full">
            <span class="f-label">Proveedor <span class="f-req">*</span></span>
            <select class="f-ctrl"><option>Carlos Arceo — KLKLKL — BBVA</option></select>
          </label>
        </div>
      </div>

      <!-- Sección 3 -->
      <div class="form-section">
        <div class="form-section-title">Monto</div>
        <div class="fg">
          <label>
            <span class="f-label">Monto solicitado <span class="f-req">*</span></span>
            <input class="f-ctrl error" type="number" placeholder="0.00">
            <span class="f-hint error">Ingresa un monto mayor a $0</span>
          </label>
          <label>
            <span class="f-label">Moneda</span>
            <select class="f-ctrl"><option>MXN</option><option>USD</option></select>
          </label>
          <label class="full">
            <span class="f-label"></span>
            <label class="check-card">
              <input type="checkbox">
              <div class="check-card-text">
                <span class="check-card-label">Ajuste extraordinario</span>
                <span class="check-card-desc">Marca si este pago está fuera del presupuesto regular</span>
              </div>
            </label>
          </label>
        </div>
      </div>

      <!-- Sección 4 -->
      <div class="form-section">
        <div class="form-section-title">Detalle</div>
        <div class="fg cols-1">
          <label>
            <span class="f-label">Descripción <span class="f-req">*</span></span>
            <textarea class="f-ctrl" placeholder="Concepto del pago..."></textarea>
          </label>
          <label>
            <span class="f-label">Notas internas</span>
            <textarea class="f-ctrl" placeholder="Opcional — visible solo para finanzas"></textarea>
          </label>
        </div>
      </div>

    </div>
    <div class="modal-footer">
      <button class="secondary-btn">Cancelar</button>
      <button class="primary-btn">Guardar solicitud</button>
    </div>
  </div>
</div>

</body>
</html>
